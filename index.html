<!doctype html>
<html lang="vi">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<meta name="theme-color" content="#f97316"/>
<link rel="manifest" href="manifest.json"/>
<title>Hương Diện · Quản lý công việc</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E📋%3C/text%3E%3C/svg%3E"/>
<link rel="manifest" href="manifest.json"/>
<link rel="apple-touch-icon" href="icon.svg"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-title" content="Hương Diện"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700&family=Baloo+2:wght@600;700;800&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css"/>
<style>
*,::after,::before{box-sizing:border-box;margin:0;padding:0}
:root{
  --o:#f97316;--o2:#ea580c;--o-dk:#c2410c;--o-lt:#fff7ed;--o-mid:#fed7aa;
  --bg:#f5f3ef;--card:#fff;--ink:#1a1a1a;--muted:#6b7280;--muted2:#9ca3af;
  --border:#e9e5df;--border2:#e5e7eb;
  --grn:#16a34a;--grn-lt:#dcfce7;--red:#dc2626;--red-lt:#fee2e2;--amber:#d97706;--amber-lt:#fef3c7;--blue:#2563eb;--blue-lt:#dbeafe;
  --sh:0 2px 12px rgba(124,45,18,.06);--sh2:0 8px 30px rgba(124,45,18,.12);
  --r:12px;--r2:16px;
}
body.dark{
  --bg:#15120e;--card:#211c16;--ink:#f3efe9;--muted:#a89f93;--muted2:#7c7367;
  --border:#33291f;--border2:#33291f;--o-lt:#2a2014;--o-mid:#5a3a1a;
  --grn-lt:#14331f;--red-lt:#3a1818;--amber-lt:#33270f;--blue-lt:#16243f;
  --sh:0 2px 12px rgba(0,0,0,.4);--sh2:0 10px 34px rgba(0,0,0,.5);
}
body{font-family:"Be Vietnam Pro",sans-serif;background:var(--bg);color:var(--ink);font-size:14px;-webkit-font-smoothing:antialiased;transition:background .2s,color .2s}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}
input,textarea,select{font-family:inherit;font-size:14px}
::-webkit-scrollbar{height:8px;width:8px}::-webkit-scrollbar-thumb{background:var(--o-mid);border-radius:8px}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
.app{display:flex;min-height:100vh}

/* Sidebar (desktop) */
.side{width:230px;flex-shrink:0;background:var(--card);border-right:1px solid var(--border);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:18px 14px}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 18px}
.brand .lic{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,var(--o),var(--o-dk));display:flex;align-items:center;justify-content:center;color:#fff;font-size:22px;flex-shrink:0;box-shadow:0 4px 12px rgba(249,115,22,.35)}
.brand b{font-family:"Baloo 2";font-size:17px;line-height:1.05;color:var(--ink)}
.brand small{font-size:11px;color:var(--muted);font-weight:500}
.nav{display:flex;flex-direction:column;gap:3px;margin-top:6px}
.nav button{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:11px;color:var(--muted);font-weight:500;font-size:13.5px;transition:all .14s;text-align:left;width:100%}
.nav button i{font-size:20px}
.nav button:hover{background:var(--o-lt);color:var(--o-dk)}
.nav button.on{background:linear-gradient(135deg,var(--o),var(--o-dk));color:#fff;box-shadow:0 4px 12px rgba(249,115,22,.3)}
.nav button .badge{margin-left:auto;background:var(--red);color:#fff;font-size:11px;font-weight:700;min-width:20px;height:20px;border-radius:10px;display:flex;align-items:center;justify-content:center;padding:0 6px}
.nav button.on .badge{background:rgba(255,255,255,.25)}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:8px;padding-top:14px;border-top:1px solid var(--border)}
.tgl{display:flex;align-items:center;gap:9px;padding:9px 12px;border-radius:11px;color:var(--muted);font-size:13px;font-weight:500}
.tgl:hover{background:var(--o-lt);color:var(--o-dk)}
.tgl i{font-size:18px}

/* Main */
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:40;background:var(--bg);padding:16px 26px 10px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.topbar h1{font-family:"Baloo 2";font-size:23px;font-weight:700}
.topbar .sub{font-size:12.5px;color:var(--muted);margin-top:1px}
.spacer{flex:1}
.srch{display:flex;align-items:center;gap:7px;background:var(--card);border:1px solid var(--border);border-radius:11px;padding:8px 13px;min-width:180px}
.srch i{font-size:18px;color:var(--muted2)}
.srch input{border:0;outline:0;background:none;color:var(--ink);width:100%}

.bellwrap{position:relative}
.bellbtn{position:relative;padding:9px;border-radius:11px;color:var(--muted);display:flex}
.bellbtn:hover{background:var(--o-lt);color:var(--o-dk)}
.bellbtn i{font-size:20px}
.bell-dot{position:absolute;top:1px;right:1px;background:var(--red);color:#fff;font-size:10px;font-weight:700;min-width:16px;height:16px;border-radius:8px;display:flex;align-items:center;justify-content:center;padding:0 4px;border:2px solid var(--bg)}
.bell-ov{position:fixed;inset:0;z-index:199}
.bell-panel{position:absolute;top:calc(100% + 8px);right:0;width:320px;max-width:88vw;max-height:420px;overflow-y:auto;background:var(--card);border:1px solid var(--border);border-radius:var(--r2);box-shadow:var(--sh2);z-index:200;animation:pop .15s ease}
.bell-panel-h{padding:12px 16px;border-bottom:1px solid var(--border);font-weight:700;font-family:"Baloo 2";font-size:14px;position:sticky;top:0;background:var(--card)}
.bell-item{display:flex;gap:10px;align-items:flex-start;padding:10px 16px;border-bottom:1px solid var(--border);cursor:pointer}
.bell-item:last-child{border-bottom:0}
.bell-item:hover{background:var(--o-lt)}
.bell-item .ic{font-size:15px;flex-shrink:0;line-height:1.4}
.bell-item .tt{font-size:13px;font-weight:600;color:var(--ink)}
.bell-item .dd{font-size:11.5px;color:var(--muted);margin-top:1px}
.bell-empty{padding:26px 16px;text-align:center;color:var(--muted);font-size:13px}
.btn{display:inline-flex;align-items:center;gap:7px;background:linear-gradient(135deg,var(--o),var(--o-dk));color:#fff;padding:9px 16px;border-radius:11px;font-weight:600;font-size:13.5px;box-shadow:0 4px 12px rgba(249,115,22,.3);transition:transform .12s,box-shadow .12s}
.btn:hover{transform:translateY(-1px);box-shadow:0 6px 18px rgba(249,115,22,.4)}
.btn:active{transform:translateY(0)}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--border);box-shadow:none}
.btn.ghost:hover{background:var(--o-lt);color:var(--o-dk);border-color:var(--o-mid)}
.btn.sm{padding:6px 11px;font-size:12.5px}
.content{padding:6px 26px 90px;animation:fade .3s ease}
@media(min-width:1024px){.content{padding-bottom:34px}}

/* Cards & stats */
.grid-stat{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:22px}
.stat{background:var(--card);border:1px solid var(--border);border-radius:var(--r2);padding:16px 18px;box-shadow:var(--sh);position:relative;overflow:hidden}
.stat .ic{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:21px;margin-bottom:10px}
.stat .n{font-family:"Baloo 2";font-size:30px;line-height:1;font-weight:700}
.stat .l{font-size:12.5px;color:var(--muted);margin-top:3px;font-weight:500}
.ic.o{background:var(--o-lt);color:var(--o)}.ic.b{background:var(--blue-lt);color:var(--blue)}
.ic.g{background:var(--grn-lt);color:var(--grn)}.ic.r{background:var(--red-lt);color:var(--red)}.ic.a{background:var(--amber-lt);color:var(--amber)}

.panel{background:var(--card);border:1px solid var(--border);border-radius:var(--r2);box-shadow:var(--sh);margin-bottom:18px}
.panel-h{display:flex;align-items:center;gap:9px;padding:15px 18px;border-bottom:1px solid var(--border)}
.panel-h b{font-size:15px;font-family:"Baloo 2";font-weight:700}
.panel-h i.lead{font-size:20px;color:var(--o)}
.panel-b{padding:8px 18px 16px}

/* Kanban */
.board{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;align-items:start}
@media(max-width:860px){.board{grid-template-columns:1fr}}
.col{background:var(--card);border:1px solid var(--border);border-radius:var(--r2);padding:12px;min-height:120px;transition:background .15s,outline .15s}
.col.drop{outline:2px dashed var(--o);outline-offset:-4px;background:var(--o-lt)}
.col-h{display:flex;align-items:center;gap:8px;padding:4px 6px 12px;font-weight:700;font-size:13.5px}
.col-h .dot{width:9px;height:9px;border-radius:50%}
.col-h .cnt{margin-left:auto;background:var(--bg);color:var(--muted);font-size:12px;font-weight:600;padding:2px 9px;border-radius:9px}
.tcard{background:var(--bg);border:1px solid var(--border);border-radius:var(--r);padding:12px;margin-bottom:10px;cursor:grab;animation:pop .2s ease;transition:box-shadow .14s,transform .1s,border-color .14s}
.tcard:hover{box-shadow:var(--sh);border-color:var(--o-mid)}
.tcard:active{cursor:grabbing}
.tcard.drag{opacity:.4}
.tcard.over{outline:1px solid var(--o-dk)}
.tcard .top{display:flex;align-items:flex-start;gap:8px}
.tcard .tt{font-weight:600;font-size:13.5px;line-height:1.35;flex:1;word-break:break-word}
.tcard.done .tt{text-decoration:line-through;color:var(--muted)}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;padding:3px 8px;border-radius:7px;white-space:nowrap}
.metarow{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:9px}
.pri{width:5px;border-radius:6px;align-self:stretch;flex-shrink:0}
.pri.high{background:var(--red)}.pri.med{background:var(--amber)}.pri.low{background:var(--grn)}
.due{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;padding:3px 8px;border-radius:7px;background:var(--bg);color:var(--muted);border:1px solid var(--border)}
.due.over{background:var(--red-lt);color:var(--red);border-color:transparent}
.due.soon{background:var(--amber-lt);color:var(--amber);border-color:transparent}
.prog{height:7px;background:var(--border2);border-radius:6px;overflow:hidden;margin-top:10px}
.prog>i{display:block;height:100%;background:linear-gradient(90deg,var(--o),var(--o-dk));border-radius:6px;transition:width .3s}
.prog.full>i{background:linear-gradient(90deg,#22c55e,#16a34a)}
.cklist{margin-top:9px;display:flex;flex-direction:column;gap:4px}
.ckitem{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--muted)}
.ckitem i{font-size:16px;cursor:pointer}
.ckitem.done span{text-decoration:line-through;opacity:.7}
.cardacts{display:flex;gap:4px;margin-top:10px;opacity:.65}
.cardacts button{padding:5px;border-radius:8px;color:var(--muted);font-size:16px;display:flex}
.cardacts button:hover{background:var(--card);color:var(--o-dk)}
.cardacts .mv{margin-left:auto}

/* Projects */
.projgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.projcard{background:var(--card);border:1px solid var(--border);border-radius:var(--r2);padding:16px;box-shadow:var(--sh);cursor:pointer;transition:transform .12s,box-shadow .14s}
.projcard:hover{transform:translateY(-2px);box-shadow:var(--sh2)}
.projcard .ph{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.projcard .pic{width:40px;height:40px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:21px}
.projcard .pn{font-weight:700;font-size:14.5px}
.projcard .pmeta{font-size:12px;color:var(--muted)}
.ring{position:relative;width:46px;height:46px;flex-shrink:0;margin-left:auto}

/* list rows (calendar/deadlines) */
.row{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--border);transition:background .12s}
.row:last-child{border-bottom:0}
.row:hover{background:var(--o-lt)}
.row .chk{width:22px;height:22px;border-radius:7px;border:2px solid var(--muted2);flex-shrink:0;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .14s}
.row .chk.done{background:var(--grn);border-color:var(--grn);color:#fff}
.row .chk i{font-size:15px}
.row .rt{flex:1;min-width:0}
.row .rt b{font-weight:600;font-size:13.5px;display:block}
.row.done .rt b{text-decoration:line-through;color:var(--muted)}
.row .rt small{color:var(--muted);font-size:12px}

/* daily */
.grid3{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.subnav{padding:0 26px 14px;align-items:center}
@media(max-width:768px){.subnav{padding:0 16px 12px;overflow-x:auto;flex-wrap:nowrap}.subnav::-webkit-scrollbar{display:none}}
.dailywrap{display:grid;grid-template-columns:1.4fr 1fr;gap:18px}
@media(max-width:860px){.dailywrap{grid-template-columns:1fr}}
.streak{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:600;color:var(--amber)}

/* empty */
.empty{text-align:center;padding:40px 20px;color:var(--muted2)}
.empty i{font-size:44px;opacity:.5}
.empty p{margin-top:10px;font-size:13.5px}

/* modal */
.ov{position:fixed;inset:0;background:rgba(20,14,8,.55);backdrop-filter:blur(3px);z-index:100;display:flex;align-items:flex-end;justify-content:center;padding:0;animation:fade .2s}
@media(min-width:640px){.ov{align-items:center;padding:20px}}
.modal{background:var(--card);width:100%;max-width:520px;max-height:92vh;overflow-y:auto;border-radius:20px 20px 0 0;animation:pop .25s ease;box-shadow:var(--sh2)}
@media(min-width:640px){.modal{border-radius:20px}}
.modal-h{display:flex;align-items:center;gap:10px;padding:18px 20px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--card);z-index:2}
.modal-h b{font-family:"Baloo 2";font-size:17px;flex:1}
.modal-h .x{font-size:22px;color:var(--muted);padding:4px;display:flex;border-radius:8px}
.modal-h .x:hover{background:var(--bg);color:var(--red)}
.modal-b{padding:18px 20px}
.fld{margin-bottom:15px}
.fld label{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin-bottom:6px}
.fld input,.fld textarea,.fld select{width:100%;background:var(--bg);border:1.5px solid var(--border);border-radius:10px;padding:10px 12px;color:var(--ink);outline:none;transition:border-color .14s}
.fld input:focus,.fld textarea:focus,.fld select:focus{border-color:var(--o)}
.fld textarea{resize:vertical;min-height:64px}
.frow{display:flex;gap:12px}.frow>*{flex:1}
.chips{display:flex;gap:7px;flex-wrap:wrap}
.chip{padding:7px 12px;border-radius:9px;background:var(--bg);border:1.5px solid var(--border);font-size:12.5px;font-weight:600;color:var(--muted);transition:all .12s}
.chip.on{background:var(--o-lt);border-color:var(--o);color:var(--o-dk)}
.prichip.on.high{background:var(--red-lt);border-color:var(--red);color:var(--red)}
.prichip.on.med{background:var(--amber-lt);border-color:var(--amber);color:var(--amber)}
.prichip.on.low{background:var(--grn-lt);border-color:var(--grn);color:var(--grn)}
.rng{display:flex;align-items:center;gap:12px}
.rng input[type=range]{flex:1;accent-color:var(--o)}
.rng b{font-family:"Baloo 2";font-size:16px;min-width:46px;text-align:right;color:var(--o-dk)}
.ckedit{display:flex;align-items:center;gap:8px;margin-bottom:7px}
.ckedit input{flex:1}
.ckedit button{color:var(--red);font-size:18px;padding:6px;display:flex}
.modal-f{display:flex;gap:10px;padding:16px 20px;border-top:1px solid var(--border);position:sticky;bottom:0;background:var(--card)}
.modal-f .btn{flex:1;justify-content:center;padding:12px}
.del{color:var(--red);font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:5px}

/* filter bar */
.filterbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;align-items:center}
.fpill{padding:7px 13px;border-radius:20px;background:var(--card);border:1px solid var(--border);font-size:12.5px;font-weight:600;color:var(--muted);display:inline-flex;align-items:center;gap:6px;transition:all .12s}
.fpill.on{background:var(--o);border-color:var(--o);color:#fff}
.fpill:hover:not(.on){border-color:var(--o-mid);color:var(--o-dk)}

/* mobile nav */
.mtop{display:none;align-items:center;gap:10px;padding:12px 16px;background:var(--card);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:50}
.mtop .lic{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--o),var(--o-dk));display:flex;align-items:center;justify-content:center;color:#fff;font-size:18px}
.mtop b{font-family:"Baloo 2";font-size:16px}
.botnav{display:none;position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--border);z-index:50;padding:6px 4px calc(8px + env(safe-area-inset-bottom))}
/* Gom menu còn 7 nhóm nên bỏ được nút "Thêm": 7 mục co giãn đều, vừa màn 375px mà vẫn đọc được cả chữ */
.botnav button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;font-weight:600;color:var(--muted2);padding:5px 2px;border-radius:10px;flex:1 1 0;min-width:0;white-space:nowrap;position:relative}
.botnav button i{font-size:22px}
.botnav button.on{color:var(--o)}
.botnav .badge{position:absolute;top:2px;right:50%;transform:translateX(16px);background:var(--red);color:#fff;font-size:9px;font-weight:700;min-width:16px;height:16px;border-radius:8px;display:flex;align-items:center;justify-content:center;padding:0 4px}
.fab{display:none;position:fixed;right:18px;bottom:calc(78px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,var(--o),var(--o-dk));color:#fff;font-size:28px;align-items:center;justify-content:center;box-shadow:0 8px 24px rgba(249,115,22,.45);z-index:49}
@media(max-width:768px){
  .side{display:none}.mtop{display:flex}.botnav{display:flex}.fab{display:flex}
  .topbar{display:none}.content{padding:14px 14px 96px}
  .topbar.mob{display:flex;padding:12px 14px 6px}.topbar.mob h1{font-size:19px}.topbar.mob .btn{display:none}
}
.hr{height:1px;background:var(--border);margin:18px 0}
.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:linear-gradient(135deg,var(--o),var(--o-dk));color:#fff;padding:12px 22px;border-radius:30px;font-size:14px;z-index:350;display:flex;align-items:center;gap:10px;box-shadow:var(--sh2);animation:pop .25s}
.toast i{font-size:22px}
@media(min-width:768px){.toast{bottom:28px}}
.badgechip{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:64px;padding:10px 6px;border-radius:12px;background:var(--bg);border:1px solid var(--border);text-align:center}
.badgechip.off{opacity:.4;filter:grayscale(1)}
.badgechip .be{font-size:24px}
.badgechip small{font-size:10px;font-weight:600;line-height:1.1;color:var(--muted)}
.bar{height:24px;border-radius:6px;background:var(--o);min-width:3px;transition:width .4s}
/* dark: tắt glow cam trên các nút màu */
body.dark .btn{box-shadow:none}
body.dark .btn:hover{box-shadow:none;transform:translateY(-1px);filter:brightness(1.06)}
body.dark .nav button.on{box-shadow:none}
body.dark .brand .lic{box-shadow:none}
body.dark .fab{box-shadow:0 6px 18px rgba(0,0,0,.5)}
body.dark .botnav button.on,body.dark .mtop .lic{box-shadow:none}
</style>
</head>
<body>
<div id="root"></div>
<script>
  // chống nháy theme
  try{ if(localStorage.getItem('hdw.dark')==='1') document.body.classList.add('dark'); }catch(e){}

function startOfWeek(){ const d=new Date(today()+'T00:00:00'); const wd=(d.getDay()+6)%7; d.setDate(d.getDate()-wd); return d; }
function genRecurring(rules,tasks){
  const add=[]; const ids=new Set(tasks.map(t=>t.id));
  rules.forEach(rule=>{
    let period,due,title=rule.title;
    if(rule.every==='week'){
      const mon=startOfWeek(); period=dstr(mon);
      const dd=new Date(mon); dd.setDate(mon.getDate()+((rule.day||1)-1)); due=dstr(dd);
    } else if(rule.every==='quarter'){
      /* Kỳ khai thuế quý: chỉ sinh việc trong tháng 1/4/7/10 — tháng nộp tờ khai của quý vừa kết thúc.
         Q1→hạn 30/4 · Q2→31/7 · Q3→31/10 · Q4→31/1 năm sau. */
      const d=new Date(today()+'T00:00:00'), y=d.getFullYear(), m=d.getMonth()+1;
      if([1,4,7,10].indexOf(m)<0) return;
      const q = m===1?4:(m-1)/3, qy = m===1?y-1:y;
      period=`${qy}-Q${q}`; title=rule.title+' — Q'+q+'/'+qy;
      const last=new Date(y,m,0).getDate();
      due=`${y}-${pad(m)}-${pad(Math.min(rule.day||last,last))}`;
    } else {
      const d=new Date(today()+'T00:00:00'), y=d.getFullYear(), m=d.getMonth();
      period=`${y}-${pad(m+1)}`; const last=new Date(y,m+1,0).getDate();
      due=`${y}-${pad(m+1)}-${pad(Math.min(rule.day||1,last))}`;
    }
    const id='r'+rule.id+'-'+period;
    if(!ids.has(id)) add.push({id,title,proj:rule.proj,status:'todo',pri:rule.pri||'med',progress:0,due,note:'🔁 Việc lặp lại tự sinh',checklist:(rule.ck||[]).map(t=>({t,done:false})),created:today(),recur:rule.id,est:rule.est});
  });
  return add;
}

  if(rule.every==='quarter') return 'Mỗi quý · hạn cuối tháng khai (1/4/7/10)';

/* ---------- Âm thanh nền tập trung (Web Audio, không cần file) ---------- */
const Noise=(()=>{
  let ctx,src,filter,gain,cur=null;
  function ensure(){
    if(ctx) return;
    const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return;
    ctx=new AC();
    const n=2*ctx.sampleRate, buf=ctx.createBuffer(1,n,ctx.sampleRate), d=buf.getChannelData(0);
    let last=0;
    for(let i=0;i<n;i++){ const w=Math.random()*2-1; last=(last+0.02*w)/1.02; d[i]=last*3.5; } // brown-ish base
    src=ctx.createBufferSource(); src.buffer=buf; src.loop=true;
    filter=ctx.createBiquadFilter(); gain=ctx.createGain(); gain.gain.value=0;
    src.connect(filter); filter.connect(gain); gain.connect(ctx.destination); src.start();
  }
  function start(type,vol){
    ensure(); if(!ctx) return; if(ctx.state==='suspended') ctx.resume(); cur=type;
    if(type==='white'){ filter.type='highpass'; filter.frequency.value=1000; }
    else if(type==='brown'){ filter.type='lowpass'; filter.frequency.value=420; }
    else if(type==='rain'){ filter.type='bandpass'; filter.frequency.value=1400; filter.Q.value=0.6; }
    gain.gain.setTargetAtTime(vol==null?0.5:vol,ctx.currentTime,0.1);
  }
  function stop(){ if(gain&&ctx) gain.gain.setTargetAtTime(0,ctx.currentTime,0.1); cur=null; }
  function setVol(v){ if(gain&&ctx) gain.gain.setTargetAtTime(v,ctx.currentTime,0.1); }
  return {start,stop,setVol,current:()=>cur};
})();
const SOUNDS=[['off','Tắt','ti-volume-3'],['brown','Tiếng trầm','ti-wave-sine'],['white','Tiếng trắng','ti-wave-square'],['rain','Tiếng mưa','ti-cloud-rain']];
function SoundBar(){
  const [cur,setCur]=useState(Noise.current());
  const pick=(t)=>{ if(t==='off'){Noise.stop();setCur(null);} else {Noise.start(t);setCur(t);} };
  return (
    <div style={{display:'flex',gap:6,justifyContent:'center',flexWrap:'wrap'}}>
      {SOUNDS.map(([k,n,ic])=>{
        const on=(k==='off'&&!cur)||cur===k;
        return <button key={k} onClick={()=>pick(k)} style={{display:'flex',alignItems:'center',gap:5,padding:'7px 12px',borderRadius:20,fontSize:12,fontWeight:600,cursor:'pointer',border:'1px solid rgba(255,255,255,.25)',background:on?'rgba(255,255,255,.9)':'rgba(255,255,255,.1)',color:on?'#1a1410':'#fff'}}><i className={'ti '+ic}></i>{n}</button>;

}

function mergeInbox(existing){
  try{
    const seen=store.get('hdw.inboxSeen',[]);
    const have=new Set(existing.map(t=>t.id));
    const seenSet=new Set(seen);
    const add=INBOX_TASKS.filter(t=>t&&t.id&&!have.has(t.id)&&!seenSet.has(t.id));
    if(!add.length) return existing;
    store.set('hdw.inboxSeen',seen.concat(add.map(t=>t.id)));
    return existing.concat(add.map(t=>({status:'todo',pri:'med',progress:0,note:'',checklist:[],created:today(),src:'hd-chat',...t})));
  }catch(e){ return existing; }
}

/* Gộp một-lần các mục seed mới (việc lặp lại, quy trình) vào dữ liệu người dùng đã lưu,
   theo dõi qua key `seen` để người dùng xoá rồi thì không bị bơm lại. */
function mergeSeed(existing,seedArr,seenKey){
  try{
    const seen=store.get(seenKey,[]), seenSet=new Set(seen);
    const have=new Set((existing||[]).map(x=>x.id));
    const add=seedArr.filter(x=>!have.has(x.id)&&!seenSet.has(x.id));
    if(!add.length) return existing;
    store.set(seenKey,seen.concat(add.map(x=>x.id)));
    return (existing||[]).concat(add);
  }catch(e){ return existing; }
}

/* ---------- progress ring ---------- */
function Ring({pct,size=46,color='#f97316'}){
  const r=(size-6)/2, c=2*Math.PI*r, off=c*(1-pct/100);
  return (
    <svg width={size} height={size} className="ring">
      <circle cx={size/2} cy={size/2} r={r} fill="none" stroke="var(--border2)" strokeWidth="5"/>
      <circle cx={size/2} cy={size/2} r={r} fill="none" stroke={color} strokeWidth="5" strokeLinecap="round"
        strokeDasharray={c} strokeDashoffset={off} transform={`rotate(-90 ${size/2} ${size/2})`} style={{transition:'stroke-dashoffset .4s'}}/>
      <text x="50%" y="52%" dominantBaseline="middle" textAnchor="middle" fontSize={size*0.28} fontWeight="700" fill="var(--ink)" fontFamily="Baloo 2">{pct}</text>
    </svg>
  );
}

/* ================= TÀI KHOẢN & PHÂN QUYỀN =================
   GIỚI HẠN CẦN BIẾT: app chạy hoàn toàn trên trình duyệt, không có máy chủ kiểm tra
   đăng nhập. Màn khoá này chặn được: người lạ mở link (không có tài khoản, không có
   dữ liệu), và người không phận sự cầm máy. Nó KHÔNG chặn được người rành kỹ thuật
   ngồi trước máy đã đăng nhập — họ mở DevTools là đọc được localStorage.
   Muốn chặn cả trường hợp đó phải chuyển sang tài khoản trên máy chủ (Supabase Auth + RLS).
   Mật khẩu chỉ lưu dạng BĂM SHA-256 kèm muối riêng từng người, không lưu chữ thật. */
const SESSION_KEY='hdwork.session';   // cố ý KHÔNG có tiền tố 'hdw.' → phiên đăng nhập không đồng bộ sang máy khác
const ROLE_SEED=[
 {id:'owner',  n:'Chủ cửa hàng',             ic:'👑',admin:true,               projs:[]},
 {id:'manager',n:'Quản lý cửa hàng',         ic:'🗂️',admin:true,               projs:[]},

 {id:'dq',     n:'NV chi nhánh ĐQ',          ic:'🏬',admin:false,projs:['don','cs','kho']},
 {id:'nk',     n:'NV bán hàng NK',           ic:'🛍️',admin:false,projs:['don','cs']},
 {id:'kho',    n:'NV kho & bắn đơn tỉnh',    ic:'📦',admin:false,projs:['kho','don']},
];
function randHex(n){
  try{ const a=new Uint8Array(n); crypto.getRandomValues(a); return Array.from(a).map(b=>b.toString(16).padStart(2,'0')).join(''); }
  catch(e){ let s=''; for(let i=0;i<n*2;i++) s+='0123456789abcdef'[Math.floor(Math.random()*16)]; return s; }
}
async function hashPw(pw,salt){
  const data=new TextEncoder().encode(salt+'|'+pw);
  try{
    const buf=await crypto.subtle.digest('SHA-256',data);
    return 'sha256:'+Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
  }catch(e){
    /* dự phòng khi trình duyệt không cho dùng Web Crypto (vd mở thẳng bằng file://).
       Yếu hơn SHA-256 nhiều — chỉ để app không chết, nên dùng qua https. */
    let h=0x811c9dc5, g=0x9e3779b9;
    for(let i=0;i<data.length;i++){ h=((h^data[i])>>>0)*0x01000193>>>0; g=(g+data[i]*(i+31))>>>0; }
    return 'weak:'+h.toString(16).padStart(8,'0')+g.toString(16).padStart(8,'0');
  }
}

/* Màn khoá: chọn người → nhập mật khẩu. Máy mới thì nhập mã đồng bộ để kéo tài khoản về. */
function Login({users,roles,onIn}){
  const [mode,setMode]=useState(users.length?'pick':'start');
  const [pick,setPick]=useState(null);
  const [pw,setPw]=useState(''); const [pw2,setPw2]=useState(''); const [nm,setNm]=useState('');
  const [code,setCode]=useState(''); const [err,setErr]=useState(''); const [busy,setBusy]=useState(false);
  const active=users.filter(u=>u.active!==false);

  const doLogin=async()=>{
    if(!pw){ setErr('Chưa nhập mật khẩu.'); return; }
    setBusy(true);
    const h=await hashPw(pw,pick.salt);
    setBusy(false);
    if(h===pick.hash){ setErr(''); onIn(pick.id); }
    else setErr('Mật khẩu không đúng.');
  };
  const doCreateOwner=async()=>{
    if(nm.trim().length<2){ setErr('Nhập tên của bạn.'); return; }
    if(pw.length<6){ setErr('Mật khẩu tối thiểu 6 ký tự.'); return; }
    if(pw!==pw2){ setErr('Hai ô mật khẩu chưa khớp.'); return; }
    setBusy(true);
    const salt=randHex(8), hash=await hashPw(pw,salt);
    const u={id:'u'+Date.now(),name:nm.trim(),role:'owner',salt,hash,active:true,createdAt:today()};
    Auth.saveUsers([u]); setBusy(false); onIn(u.id);
  };
  const doSync=async()=>{
    const c=code.trim(); if(c.length<4){ setErr('Mã đồng bộ chưa đúng.'); return; }
    setBusy(true); setErr('');
    try{
      localStorage.setItem('hdw.synccode',c);
      const r=await Sync.pull();
      if(r&&r.ok&&!r.empty){ location.reload(); return; }
      localStorage.removeItem('hdw.synccode');
      setErr('Mã này chưa có dữ liệu nào. Kiểm tra lại mã trong Sổ tay → Đồng bộ trên máy cũ.');
    }catch(e){ localStorage.removeItem('hdw.synccode'); setErr('Không kết nối được. Kiểm tra mạng rồi thử lại.'); }
    setBusy(false);
  };
  const errBox=err&&<div style={{marginTop:12,padding:'10px 12px',background:'var(--red-lt)',color:'var(--red)',borderRadius:11,fontSize:12.5,lineHeight:1.5}}>{err}</div>;

  if(mode==='start'||(mode==='pick'&&!active.length)) return (
    <AuthShell sub="Chưa có tài khoản nào trên máy này">
      <div style={authCard}>
        <b style={{fontFamily:'Baloo 2',fontSize:17}}>Bắt đầu thế nào?</b>
        <p style={{fontSize:13,color:'var(--muted)',lineHeight:1.6,margin:'8px 0 16px'}}>Nếu cửa hàng đã dùng app trên máy khác, hãy nhập <b>mã đồng bộ</b> để kéo tài khoản và dữ liệu về máy này. Chưa có gì thì tạo tài khoản chủ cửa hàng.</p>
        <button className="btn" style={{width:'100%',justifyContent:'center',marginBottom:9}} onClick={()=>{setMode('sync');setErr('');}}><i className="ti ti-cloud-download"></i>Nhập mã đồng bộ</button>
        <button className="btn ghost" style={{width:'100%',justifyContent:'center'}} onClick={()=>{setMode('owner');setErr('');}}><i className="ti ti-user-plus"></i>Tạo tài khoản chủ cửa hàng</button>
      </div>
    </AuthShell>
  );

  if(mode==='sync') return (
    <AuthShell sub="Kéo dữ liệu từ máy đã dùng">
      <div style={authCard}>
        <b style={{fontFamily:'Baloo 2',fontSize:17}}>Mã đồng bộ</b>
        <p style={{fontSize:12.5,color:'var(--muted)',lineHeight:1.6,margin:'8px 0 14px'}}>Lấy ở máy cũ: <b>Sổ tay → Đồng bộ</b>. Mã này là chìa khoá vào dữ liệu cửa hàng — chỉ đưa cho người trong đội.</p>
        <input value={code} onChange={e=>setCode(e.target.value)} onKeyDown={e=>e.key==='Enter'&&doSync()} placeholder="Dán mã đồng bộ" style={authInput} autoFocus/>
        {errBox}
        <button className="btn" disabled={busy} style={{width:'100%',justifyContent:'center',marginTop:14}} onClick={doSync}><i className="ti ti-cloud-download"></i>{busy?'Đang kéo dữ liệu…':'Kéo dữ liệu về'}</button>
        <button className="btn ghost sm" style={{width:'100%',justifyContent:'center',marginTop:8}} onClick={()=>{setMode(active.length?'pick':'start');setErr('');}}>Quay lại</button>
      </div>
    </AuthShell>
  );

  if(mode==='owner') return (
    <AuthShell sub="Tài khoản chủ cửa hàng">
      <div style={authCard}>
        <b style={{fontFamily:'Baloo 2',fontSize:17}}>Tạo tài khoản chủ</b>
        <p style={{fontSize:12.5,color:'var(--muted)',lineHeight:1.6,margin:'8px 0 14px'}}>Tài khoản này quản lý mọi thành viên khác. Nhớ kỹ mật khẩu — không có cách khôi phục nào ngoài file sao lưu.</p>
        <input value={nm} onChange={e=>setNm(e.target.value)} placeholder="Tên của bạn" style={{...authInput,marginBottom:9}} autoFocus/>

        <input value={pw2} onChange={e=>setPw2(e.target.value)} type="password" placeholder="Nhắc lại mật khẩu" onKeyDown={e=>e.key==='Enter'&&doCreateOwner()} style={authInput}/>
        {errBox}

        <button className="btn ghost sm" style={{width:'100%',justifyContent:'center',marginTop:8}} onClick={()=>{setMode('start');setErr('');}}>Quay lại</button>

  if(mode==='pw'&&pick){ const r=roleOf(pick,roles); return (
    <AuthShell sub={r.ic+' '+r.n}>

        <div style={{display:'flex',alignItems:'center',gap:12,marginBottom:16}}>

          <div><b style={{fontFamily:'Baloo 2',fontSize:17,display:'block'}}>{pick.name}</b><small style={{color:'var(--muted)'}}>{r.n}</small></div>
        </div>
        <input value={pw} onChange={e=>setPw(e.target.value)} type="password" placeholder={pick.mustChange?'Mã tạm chủ cửa hàng đưa':'Mật khẩu'} onKeyDown={e=>e.key==='Enter'&&doLogin()} style={authInput} autoFocus/>
        {errBox}
        <button className="btn" disabled={busy} style={{width:'100%',justifyContent:'center',marginTop:14}} onClick={doLogin}><i className="ti ti-login"></i>{busy?'Đang kiểm tra…':'Vào app'}</button>
        <button className="btn ghost sm" style={{width:'100%',justifyContent:'center',marginTop:8}} onClick={()=>{setMode('pick');setPw('');setErr('');}}>Chọn người khác</button>
        <div style={{marginTop:12,fontSize:11.5,color:'var(--muted2)',textAlign:'center',lineHeight:1.5}}>Quên mật khẩu? Nhờ chủ cửa hàng vào <b>Đội ngũ → Thành viên</b> cấp lại mã tạm.</div>
      </div>
    </AuthShell>
  ); }

  return (
    <AuthShell sub="Ai đang dùng máy này?">
      <div style={authCard}>
        {active.map(u=>{ const r=roleOf(u,roles); return (
          <button key={u.id} onClick={()=>{setPick(u);setMode('pw');setPw('');setErr('');}}
            style={{display:'flex',alignItems:'center',gap:12,width:'100%',padding:'11px 12px',borderRadius:13,border:'1.5px solid var(--border)',background:'var(--bg)',marginBottom:8,cursor:'pointer',textAlign:'left'}}>
            <div style={{width:38,height:38,borderRadius:12,background:'var(--o-lt)',color:'var(--o-dk)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:16,fontWeight:700,fontFamily:'Baloo 2',flexShrink:0}}>{initials(u.name)}</div>
            <div style={{flex:1,minWidth:0}}>
              <b style={{fontSize:14,display:'block',color:'var(--ink)'}}>{u.name}</b>
              <small style={{color:'var(--muted)',fontSize:12}}>{r.ic} {r.n}</small>
            </div>
            {u.mustChange
              ? <span className="tag" style={{background:'var(--amber-lt)',color:'var(--amber)'}}>Cần đặt mật khẩu</span>
              : <i className="ti ti-lock" style={{color:'var(--muted2)'}}></i>}
          </button>
        ); })}
        <button className="btn ghost sm" style={{width:'100%',justifyContent:'center',marginTop:6}} onClick={()=>{setMode('sync');setErr('');}}><i className="ti ti-cloud-download"></i>Máy mới · nhập mã đồng bộ</button>
      </div>
      <div style={{marginTop:14,fontSize:11.5,color:'var(--muted2)',textAlign:'center',lineHeight:1.6}}>
        Dữ liệu nằm trên máy này, không ai mở link mà thấy được.<br/>Mật khẩu lưu dạng băm — quên là phải nhờ chủ cấp lại.
      </div>
    </AuthShell>
  );
}
/* Người mới đăng nhập bằng mã tạm → buộc tự đặt mật khẩu riêng */
function SetPassword({user,onDone,onBack}){
  const [pw,setPw]=useState(''),[pw2,setPw2]=useState(''),[err,setErr]=useState(''),[busy,setBusy]=useState(false);
  const go=async()=>{
    if(pw.length<6){ setErr('Mật khẩu tối thiểu 6 ký tự.'); return; }
    if(pw!==pw2){ setErr('Hai ô mật khẩu chưa khớp.'); return; }
    setBusy(true);
    const salt=randHex(8), hash=await hashPw(pw,salt);
    onDone(hash,salt);
  };
  return (
    <AuthShell sub="Lần đầu đăng nhập">
      <div style={authCard}>
        <b style={{fontFamily:'Baloo 2',fontSize:17}}>Chào {user.name} — đặt mật khẩu riêng</b>
        <p style={{fontSize:12.5,color:'var(--muted)',lineHeight:1.6,margin:'8px 0 14px'}}>Mã tạm chỉ dùng được một lần. Đặt mật khẩu của riêng bạn để không ai khác vào được tài khoản này.</p>
        <input value={pw} onChange={e=>setPw(e.target.value)} type="password" placeholder="Mật khẩu mới (tối thiểu 6 ký tự)" style={{...authInput,marginBottom:9}} autoFocus/>
        <input value={pw2} onChange={e=>setPw2(e.target.value)} type="password" placeholder="Nhắc lại mật khẩu" onKeyDown={e=>e.key==='Enter'&&go()} style={authInput}/>
        {err&&<div style={{marginTop:12,padding:'10px 12px',background:'var(--red-lt)',color:'var(--red)',borderRadius:11,fontSize:12.5}}>{err}</div>}
        <button className="btn" disabled={busy} style={{width:'100%',justifyContent:'center',marginTop:14}} onClick={go}><i className="ti ti-check"></i>Lưu mật khẩu & vào app</button>
        <button className="btn ghost sm" style={{width:'100%',justifyContent:'center',marginTop:8}} onClick={onBack}>Thoát ra</button>
      </div>
    </AuthShell>
  );
}
/* Cổng vào: chưa đăng nhập thì KHÔNG dựng app, chỉ thấy màn khoá */
function Root(){
  const [users,setUsersState]=useState(()=>Auth.users());
  const [roles,setRolesState]=useState(()=>Auth.roles());
  const [curId,setCurId]=useState(()=>{ const s=Auth.session(); return (s&&s.uid)||null; });
  const [pulled,setPulled]=useState(!Sync.enabled());
  const setUsers=(u)=>{ setUsersState(u); Auth.saveUsers(u); };
  const setRoles=(r)=>{ setRolesState(r); Auth.saveRoles(r); };
  /* kéo dữ liệu mới nhất từ cloud TRƯỚC khi dựng màn khoá, để danh sách tài khoản luôn mới */
  useEffect(()=>{
    if(!Sync.enabled()){ setPulled(true); return; }
    Sync.pull().then(r=>{ if(r&&r.changed){ location.reload(); return; } setUsersState(Auth.users()); setRolesState(Auth.roles()); setPulled(true); })
      .catch(()=>setPulled(true));
  },[]);
  const me=users.find(u=>u.id===curId&&u.active!==false)||null;
  if(!pulled) return <AuthShell sub="Đang tải dữ liệu…"><div style={{...authCard,textAlign:'center',color:'var(--muted)',fontSize:13}}>Đang đồng bộ với đám mây…</div></AuthShell>;
  /* onIn đọc lại từ kho: màn khoá có thể vừa tạo tài khoản chủ đầu tiên */
  if(!me) return <Login users={users} roles={roles} onIn={(id)=>{ Auth.open(id); setUsersState(Auth.users()); setCurId(id); }}/>;
  if(me.mustChange) return <SetPassword user={me} onBack={()=>{ Auth.close(); setCurId(null); }}
    onDone={(hash,salt)=>setUsers(users.map(u=>u.id===me.id?{...u,hash,salt,mustChange:false}:u))}/>;
  return <App key={me.id} me={me} roles={roles} setRoles={setRoles} users={users} setUsers={setUsers}
    onLock={()=>{ Auth.close(); setCurId(null); }}/>;
}

/* ===================================================================== */
function App({me,roles,setRoles,users,setUsers,onLock}){
  const myRole=roleOf(me,roles);
  const isAdmin=!!myRole.admin;
  const isOwner=me.role==='owner';
  const [tasks,setTasks]=useState(()=>{const t=store.get('hdw.tasks',null);return mergeInbox(t||seed());});
  const [daily,setDaily]=useState(()=>store.get('hdw.daily',SEED_DAILY));
  const [recurring,setRecurring]=useState(()=>mergeSeed(store.get('hdw.recurring',SEED_RECUR),SEED_RECUR,'hdw.recurSeen'));
  const [bizmetrics,setBizmetrics]=useState(()=>store.get('hdw.bizmetrics',[]));
  const [bizconfig,setBizconfig]=useState(()=>store.get('hdw.bizconfig',{breakeven:425}));
  const [notebook,setNotebook]=useState(()=>{
    const nb=store.get('hdw.notebook',SEED_NOTEBOOK);
    return {...nb,sop:mergeSeed(nb.sop||[],SOP_2026,'hdw.sopSeen')};
  });
  const [sourcing,setSourcing]=useState(()=>store.get('hdw.sourcing',{}));
  const [compliance,setCompliance]=useState(()=>store.get('hdw.compliance',{}));
  const [focusTask,setFocusTask]=useState(null);
  const [deepIds,setDeepIds]=useState(null);
  const [breath,setBreath]=useState(false);
  /* ---- dữ liệu RIÊNG từng tài khoản (thói quen, năng lượng, bài đã học, kế hoạch ngày, 3 việc thắng lớn) ----
     Tài khoản chủ giữ nguyên dữ liệu cũ để không mất lịch sử; người mới bắt đầu từ trống. */
  const mine=(k,d)=>{ const v=store.get(ukey(me.id,k),null); if(v!==null) return v; return isOwner?store.get('hdw.'+k,d):d; };
  const [zen,setZen]=useState(()=>mine('zen',{min:0,sessions:0}));
  const [brainlog,setBrainlog]=useState(()=>mine('brainlog',{}));
  const [carecfg,setCarecfg]=useState(()=>mine('carecfg',{water:true,stand:true,eye:false,caffeine:true,caffeineHour:14,taskReminder:true}));
  const [learned,setLearned]=useState(()=>mine('learned',{}));
  const [toast,setToast]=useState(null);
  const [dailyState,setDailyState]=useState(()=>mine('dailyState',{date:today(),done:[],streak:0,last:''}));
  const [view,setView]=useState(()=>store.get('hdwork.lastview',isAdmin?'dash':'today'));
  const [todayPlan,setTodayPlan]=useState(()=>mine('todayPlan',null));
  const [threeWins,setThreeWins]=useState(()=>mine('threewins',null));
  const [dark,setDark]=useState(()=>store.get('hdw.dark',0)==1||store.get('hdw.dark',false)===true||localStorage.getItem('hdw.dark')==='1');
  const [editing,setEditing]=useState(null); // task object or null
  const [bellOpen,setBellOpen]=useState(false);
  const [q,setQ]=useState('');
  const [projFilter,setProjFilter]=useState('all');

  useEffect(()=>store.set('hdw.tasks',tasks),[tasks]);
  useEffect(()=>store.set('hdw.daily',daily),[daily]);
  useEffect(()=>store.set(ukey(me.id,'dailyState'),dailyState),[dailyState]);
  useEffect(()=>store.set(ukey(me.id,'todayPlan'),todayPlan),[todayPlan]);
  useEffect(()=>store.set(ukey(me.id,'threewins'),threeWins),[threeWins]);
  useEffect(()=>store.set('hdwork.lastview',view),[view]);
  useEffect(()=>store.set('hdw.recurring',recurring),[recurring]);
  useEffect(()=>store.set('hdw.bizmetrics',bizmetrics),[bizmetrics]);
  useEffect(()=>store.set('hdw.bizconfig',bizconfig),[bizconfig]);
  useEffect(()=>store.set('hdw.notebook',notebook),[notebook]);
  useEffect(()=>store.set('hdw.sourcing',sourcing),[sourcing]);
  useEffect(()=>store.set('hdw.compliance',compliance),[compliance]);
  useEffect(()=>store.set(ukey(me.id,'zen'),zen),[zen]);
  useEffect(()=>store.set(ukey(me.id,'brainlog'),brainlog),[brainlog]);
  useEffect(()=>store.set(ukey(me.id,'carecfg'),carecfg),[carecfg]);
  useEffect(()=>store.set(ukey(me.id,'learned'),learned),[learned]);
  const addZen=(m)=>setZen(z=>({min:(z.min||0)+m,sessions:(z.sessions||0)+1}));

  // Thông báo: dùng Notification thật khi tab đang ẩn (nếu đã cấp quyền), ngược lại bắn toast trong app
  const ping=(msg,tag)=>{
    let shown=false;
    try{
      if(document.hidden && 'Notification' in window && Notification.permission==='granted'){
        new Notification('Hương Diện · Quản lý công việc',{body:msg,tag});
        shown=true;
      }
    }catch(e){}
    if(!shown) setToast({msg});
  };

  // Nhắc nhịp chăm sóc: theo giờ khi app đang mở/chạy nền
  const careFired=useRef({});
  useEffect(()=>{
    const NUDGE={
      water:{every:60,msg:'💧 Uống một ngụm nước nhé!'},
      stand:{every:50,msg:'🧍 Đứng dậy vươn vai 1 phút cho máu lên não.'},
      eye:{every:20,msg:'👀 Nghỉ mắt 20 giây — nhìn ra xa 6 mét (quy tắc 20-20-20).'},
    };
    const tick=()=>{
      const now=Date.now();
      Object.keys(NUDGE).forEach(k=>{
        if(!carecfg[k]) return;
        const last=careFired.current[k]||0;
        if(now-last >= NUDGE[k].every*60000){ careFired.current[k]=now; ping(NUDGE[k].msg,'hdw-care-'+k); }
      });
      if(carecfg.caffeine){
        const h=new Date().getHours();
        if(h===(carecfg.caffeineHour||14) && careFired.current.caf!==dstr(new Date())){ careFired.current.caf=dstr(new Date()); ping('☕ Đến giờ cắt caffeine — tránh cà phê sau giờ này để ngủ ngon.','hdw-care-caffeine'); }
      }
    };
    careFired.current.water=careFired.current.water||Date.now();
    careFired.current.stand=careFired.current.stand||Date.now();
    careFired.current.eye=careFired.current.eye||Date.now();
    const id=setInterval(tick,30000);
    return ()=>clearInterval(id);
  },[carecfg]);
  // tự sinh việc lặp lại cho tuần/tháng hiện tại
  useEffect(()=>{ const add=genRecurring(recurring,tasks); if(add.length) setTasks(prev=>[...prev,...add]); },[recurring]);
  // toast tự ẩn
  useEffect(()=>{ if(!toast) return; const id=setTimeout(()=>setToast(null),2600); return ()=>clearTimeout(id); },[toast]);
  // đồng bộ: việc kéo dữ liệu từ cloud đã làm ở Root, trước màn khoá
  useEffect(()=>{ document.body.classList.toggle('dark',dark); store.set('hdw.dark',dark?1:0); },[dark]);

  // reset checklist hằng ngày khi sang ngày mới
  useEffect(()=>{
    if(dailyState.date!==today()){
      const all=dailyState.done.length>0 && dailyState.done.length>=daily.length;
      setDailyState(s=>({date:today(),done:[],
        streak: all? (s.streak+1):0,
        last: all? today(): s.last}));
    }
  },[]);

  /* task ops */
  const saveTask=(t)=>{
    setTasks(prev=>{
      let arr=prev.find(x=>x.id===t.id)?prev.map(x=>x.id===t.id?t:x):[...prev,t];
      if(t.frog) arr=arr.map(x=>x.id===t.id?x:(x.frog?{...x,frog:false}:x)); // chỉ 1 việc xương nhất
      return arr;
    });
    setEditing(null);
  };
  const delTask=(id)=>{ setTasks(prev=>prev.filter(x=>x.id!==id)); setEditing(null); };
  const importPlan=()=>{
    setTasks(prev=>{
      const have=new Set(prev.map(x=>x.id));
      const add=DEFENSE_PLAN.filter(p=>!have.has('plan-'+p.n)).map(p=>({
        id:'plan-'+p.n,title:p.title,proj:p.proj,status:'todo',pri:p.pri,progress:0,
        due:addDays(p.off),note:p.note,checklist:p.ck.map(t=>({t,done:false})),created:today(),plan:true
      }));
      return [...prev,...add];
    });
    setView('board');
  };
  const planEverLoaded=tasks.some(x=>x.plan);
  const missingPlan=DEFENSE_PLAN.filter(p=>!tasks.some(x=>x.id==='plan-'+p.n)).length;
  const planLoaded=missingPlan===0;
  const celebrate=(t)=>{
    const before=gamifyStats(tasks), pts=pointsFor(t);
    const leveledUp=before.next && (before.points+pts)>=before.next.min;
    setToast({msg:'+'+pts+' điểm! 🎉', sub: leveledUp?('Lên cấp: '+before.next.ic+' '+before.next.name):null});
  };
  const moveTask=(id,status)=>{
    const was=tasks.find(x=>x.id===id);
    setTasks(prev=>prev.map(x=>{
      if(x.id!==id) return x;
      const prog = status==='done'?100 : (x.progress===100?80 : x.progress);
      return {...x,status,progress: status==='done'?100:(status==='todo'&&x.progress===100?0:prog), doneAt: status==='done'?today():undefined};
    }));
    if(status==='done' && was && was.status!=='done') celebrate(was);
  };
  const addSpent=(id,mins)=>setTasks(prev=>prev.map(x=>x.id===id?{...x,spent:(x.spent||0)+mins}:x));
  const assignTask=(id,uidTo)=>setTasks(prev=>prev.map(x=>x.id===id?{...x,assignee:uidTo||'',assignedBy:uidTo?me.id:undefined,assignedAt:uidTo?today():undefined}:x));

  /* Sao lưu & khôi phục */
  const exportData=()=>{
    const data={};
    for(let i=0;i<localStorage.length;i++){ const k=localStorage.key(i); if(k&&k.indexOf('hdw.')===0) data[k]=localStorage.getItem(k); }
    const blob=new Blob([JSON.stringify({app:'huongdienwork',date:today(),data},null,2)],{type:'application/json'});
    const url=URL.createObjectURL(blob), a=document.createElement('a');
    a.href=url; a.download='huongdien-backup-'+today()+'.json'; document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
  };
  const importData=(file)=>{
    if(!file) return;
    const r=new FileReader();
    r.onload=e=>{ try{ const j=JSON.parse(e.target.result); const d=j.data||j;
        Object.keys(d).forEach(k=>{ if(k.indexOf('hdw.')===0) localStorage.setItem(k, typeof d[k]==='string'?d[k]:JSON.stringify(d[k])); });
        alert('Khôi phục dữ liệu thành công! Trang sẽ tải lại.'); location.reload();
      }catch(err){ alert('File sao lưu không hợp lệ.'); } };
    r.readAsText(file);
  };
  const setProgress=(id,p)=>{
    const was=tasks.find(x=>x.id===id);
    setTasks(prev=>prev.map(x=>x.id!==id?x:{...x,progress:p,status:p===100?'done':(p>0?'doing':x.status==='done'?'todo':x.status),doneAt:p===100?today():undefined}));
    if(p===100 && was && was.status!=='done') celebrate(was);
  };
  const toggleCk=(id,i)=>setTasks(prev=>prev.map(x=>{
    if(x.id!==id) return x;
    const cl=x.checklist.map((c,j)=>j===i?{...c,done:!c.done}:c);
    const dn=cl.filter(c=>c.done).length, prog=cl.length?Math.round(dn/cl.length*100):x.progress;
    return {...x,checklist:cl,progress:cl.length?prog:x.progress};
  }));

  /* kế hoạch hôm nay: xếp theo điểm ưu tiên, lấp đủ quỹ thời gian trong ngày.
     Chỉ xếp việc CỦA MÌNH — chủ/quản lý tính thêm việc chưa giao ai vào phần của mình. */
  const myPool=useMemo(()=>tasks.filter(t=>t.assignee===me.id||(isAdmin&&!t.assignee)),[tasks,me.id,isAdmin]);
  const rebuildPlan=(cap)=>{
    const capH=cap || (todayPlan&&todayPlan.cap) || 6;
    const open=myPool.filter(t=>t.status!=='done');
    const ranked=open.map(t=>({id:t.id,s:scoreTask(t),h:estOf(t)})).sort((a,b)=>b.s-a.s);
    const ids=[]; let used=0;
    for(const r of ranked){ if(used>=capH) break; ids.push(r.id); used+=r.h; }
    setTodayPlan({date:today(),cap:capH,ids,auto:[]});
  };
  useEffect(()=>{ if(!todayPlan || todayPlan.date!==today()) rebuildPlan(); },[]);

  // Tự bù việc: sau khi 1 việc xong, thời gian trống ra → đề xuất thêm việc ưu tiên cao còn lại cho đủ quỹ giờ
  useEffect(()=>{
    if(!todayPlan || todayPlan.date!==today()) return;
    const byId={}; myPool.forEach(t=>byId[t.id]=t);
    const inPlan=new Set(todayPlan.ids);
    const activeH=todayPlan.ids.map(id=>byId[id]).filter(t=>t&&t.status!=='done').reduce((a,t)=>a+estOf(t),0);
    if(activeH>=todayPlan.cap) return;                       // còn đầy việc thì thôi
    const cands=myPool.filter(t=>t.status!=='done'&&!inPlan.has(t.id))
      .map(t=>({id:t.id,s:scoreTask(t),h:estOf(t)})).sort((a,b)=>b.s-a.s);
    if(!cands.length) return;
    let used=activeH; const add=[];
    for(const c of cands){ if(used>=todayPlan.cap) break; add.push(c.id); used+=c.h; }
    if(add.length) setTodayPlan(p=>({...p,ids:[...p.ids,...add],auto:[...(p.auto||[]),...add]}));
  },[myPool]);

  /* 3 việc thắng lớn/ngày: 1 kiếm tiền ngay · 1 xây hệ thống · 1 nâng trình cá nhân — reset mỗi ngày mới */
  const wins=(threeWins&&threeWins.date===today())?threeWins:{date:today(),money:null,system:null,growth:null};
  const setWinSlot=(key,val)=>setThreeWins(w=>{
    const base=(w&&w.date===today())?w:{date:today(),money:null,system:null,growth:null};
    return {...base,[key]:{...val,done:false}};
  });
  const clearWinSlot=(key)=>setThreeWins(w=>{
    const base=(w&&w.date===today())?w:{date:today(),money:null,system:null,growth:null};
    return {...base,[key]:null};
  });
  const toggleWinText=(key)=>setThreeWins(w=>{
    const base=(w&&w.date===today())?w:{date:today(),money:null,system:null,growth:null};
    const cur=base[key];
    return cur?{...base,[key]:{...cur,done:!cur.done}}:base;
  });

  /* daily */
  const toggleDaily=(id)=>setDailyState(s=>{
    const done=s.done.includes(id)?s.done.filter(x=>x!==id):[...s.done,id];
    return {...s,done};
  });

  /* ---- Việc nào người này được thấy ----
     Nhân viên chỉ thấy việc được giao cho mình → to-do list riêng, không rối vì việc người khác.
     Chủ & quản lý thấy toàn bộ, lọc theo người ở ô "Người nhận" trên Bảng việc. */
  const [whoFilter,setWhoFilter]=useState('all');
  const vTasks=useMemo(()=>{
    if(!isAdmin) return tasks.filter(t=>t.assignee===me.id);
    if(whoFilter==='all') return tasks;
    if(whoFilter==='none') return tasks.filter(t=>!t.assignee);
    return tasks.filter(t=>t.assignee===whoFilter);
  },[tasks,isAdmin,me.id,whoFilter]);
  const nameOf=(id)=>{ const u=users.find(x=>x.id===id); return u?u.name:null; };

  /* derived */
  const filtered=useMemo(()=>{
    let r=vTasks;
    if(projFilter!=='all') r=r.filter(t=>t.proj===projFilter);
    if(q.trim()){const s=q.toLowerCase();r=r.filter(t=>t.title.toLowerCase().includes(s)||(t.note||'').toLowerCase().includes(s));}
    return r;
  },[vTasks,projFilter,q]);

  const stats=useMemo(()=>{
    const t=today();
    const open=vTasks.filter(x=>x.status!=='done');
    return {
      todayCnt: open.filter(x=>x.due===t).length,
      doing: vTasks.filter(x=>x.status==='doing').length,
      overdue: open.filter(x=>x.due && x.due<t).length,
      doneWeek: vTasks.filter(x=>x.status==='done' && x.doneAt && x.doneAt>=addDays(-7)).length,
      open: open.length,
      total: vTasks.length,
    };
  },[vTasks]);

  const overdueCount=stats.overdue;

  const alerts=useMemo(()=>{
    const t=today(), soon=addDays(3);
    const list=[];
    vTasks.forEach(x=>{
      if(x.status==='done'||!x.due) return;
      let kind=null;
      if(x.due<t) kind='over';
      else if(x.due===t) kind='today';
      else if(x.due<=soon) kind='soon';
      if(kind) list.push({kind,task:x});
    });
    const order={over:0,today:1,soon:2};
    list.sort((a,b)=>order[a.kind]-order[b.kind]||(a.task.due||'').localeCompare(b.task.due||''));
    return list.slice(0,20);
  },[tasks]);
  const urgentCount=alerts.filter(a=>a.kind==='over'||a.kind==='today').length;

  const riskOpen=useMemo(()=>COMPLIANCE.reduce((n,g)=>n+g.items.filter(i=>i.risk==='high'&&compliance[i.id]!=='done').length,0),[compliance]);
  /* ---- Menu 7 nhóm, mỗi nhóm có tab con ----
     Năm màn Hôm nay/Bảng việc/Theo mảng/Lịch/Việc lặp lại đọc cùng một kho việc,
     nên chúng là TAB CON của "Công việc" chứ không phải 5 mục ngang hàng. */
  const unassigned=isAdmin?tasks.filter(t=>!t.assignee&&t.status!=='done').length:0;
  const GROUPS=[
    {id:'g_dash',name:'Tổng quan',icon:'ti-layout-dashboard',views:[{id:'dash',n:'Tổng quan'}]},
    {id:'g_work',name:'Công việc',icon:'ti-checklist',badge:overdueCount,views:[
      {id:'today',n:'Hôm nay'},{id:'board',n:'Bảng việc'},{id:'proj',n:'Theo mảng'},{id:'cal',n:'Lịch · Hạn'},{id:'daily',n:'Việc lặp lại'}]},
    {id:'g_team',name:'Đội ngũ',icon:'ti-users',admin:true,badge:unassigned,views:[
      {id:'assign',n:'Phân công'},{id:'progress',n:'Tiến độ'},{id:'members',n:'Thành viên'}]},
    {id:'g_num',name:'Số liệu',icon:'ti-chart-histogram',admin:true,views:[
      {id:'sales',n:'Bán hàng'},{id:'kd',n:'Sổ KD'},{id:'stats',n:'Thống kê'}]},
    {id:'g_shop',name:'Cửa hàng',icon:'ti-building-store',badge:riskOpen,views:[
      {id:'ncc',n:'Nguồn hàng'},{id:'law',n:'Tuân thủ & Thuế'}]},
    {id:'g_ref',name:'Cẩm nang',icon:'ti-book',views:[{id:'learn',n:'Kiến thức'},{id:'book',n:'Sổ tay'}]},
    {id:'g_brain',name:'Não khỏe',icon:'ti-brain',views:[{id:'brain',n:'Não khỏe'}]},
  ].filter(g=>!g.admin||isAdmin);
  const groupOf=(v)=>GROUPS.find(g=>g.views.some(x=>x.id===v))||GROUPS[0];
  const curGroup=groupOf(view);
  /* mở nhóm thì quay lại đúng tab con dùng lần trước */
  const lastTab=useRef(store.get('hdwork.lasttab',{}));
  const openGroup=(g)=>{ const v=lastTab.current[g.id]; setView(g.views.some(x=>x.id===v)?v:g.views[0].id); };
  const goView=(v)=>{ const g=groupOf(v); lastTab.current={...lastTab.current,[g.id]:v}; store.set('hdwork.lasttab',lastTab.current); setView(v); };
  useEffect(()=>{ if(!GROUPS.some(g=>g.views.some(x=>x.id===view))) setView(GROUPS[0].views[0].id); },[view]);

  // Nhắc việc quá hạn / hôm nay còn tồn — mỗi 45 phút, ưu tiên báo quá hạn trước
  const taskFired=useRef(0);
  useEffect(()=>{
    if(!carecfg.taskReminder) return;
    const tick=()=>{
      const now=Date.now();
      if(now-taskFired.current < 45*60000) return;
      if(stats.overdue>0){ taskFired.current=now; ping(`⏰ Có ${stats.overdue} việc đã quá hạn — mở app để xử lý.`,'hdw-overdue'); }
      else if(stats.todayCnt>0){ taskFired.current=now; ping(`📌 Còn ${stats.todayCnt} việc cần làm hôm nay.`,'hdw-today'); }
    };
    const id=setInterval(tick,60000);
    return ()=>clearInterval(id);
  },[carecfg.taskReminder, stats.overdue, stats.todayCnt]);

  const viewMeta={
    dash:{t:'Tổng quan',s:'Tiến độ công việc cửa hàng hôm nay'},
    today:{t:'Kế hoạch hôm nay',s:'Bộ việc nên làm trong ngày — xếp theo thứ tự ưu tiên'},
    brain:{t:'Não khỏe',s:'Thói quen, năng lượng & nhịp chăm sóc để tập trung tốt hơn'},
    board:{t:'Bảng việc',s:'Kéo thẻ giữa các cột hoặc dùng nút mũi tên'},
    proj:{t:'Công việc theo mảng',s:'Tiến độ từng nhóm việc'},
    cal:{t:'Lịch · Hạn chót',s:'Sắp xếp theo ngày đến hạn'},
    stats:{t:'Thống kê hiệu suất',s:'Tổng kết tuần, năng suất, đúng hạn và phân bổ'},
    kd:{t:'Sổ kinh doanh',s:'Bảng điều khiển 10 số mỗi tuần — buồng lái cửa hàng'},
    sales:{t:'Bán hàng (KiotViet)',s:'Doanh thu, đơn hàng, sản phẩm bán chạy & tồn kho — đồng bộ tự động từ KiotViet'},
    ncc:{t:'Nguồn hàng chính ngạch',s:'24 thương hiệu nhóm A · theo dõi chuyển nguồn sang nhà phân phối chính thức'},
    law:{t:'Tuân thủ & Thuế',s:'Rủi ro pháp lý đang có, hồ sơ chứng từ và lịch khai thuế theo quý'},
    learn:{t:'Kiến thức kinh doanh',s:'Bài học ngắn về tài chính, định giá, khách hàng… cho chủ shop'},
    book:{t:'Sổ tay vận hành',s:'Quy trình, prompt AI, nhà cung cấp & sao lưu dữ liệu'},
    daily:{t:'Việc lặp lại',s:'Thói quen mỗi ngày + việc tự sinh theo tuần/tháng'},
    assign:{t:'Phân công việc',s:'Giao việc cho từng người và xem ai đang gánh bao nhiêu'},
    progress:{t:'Tiến độ đội ngũ',s:'Ai xong bao nhiêu việc, ai đang quá hạn'},
    members:{t:'Thành viên & vai trò',s:'Tạo tài khoản, đổi vai trò, cấp lại mật khẩu'},
  }[view]||{t:'Hương Diện',s:''};

  const openNew=(proj)=>setEditing({id:uid(),title:'',proj:proj||(myRole.projs&&myRole.projs[0])||'nhap',status:'todo',pri:'med',progress:0,due:'',note:'',checklist:[],created:today(),
    assignee:isAdmin?'':me.id,createdBy:me.id,_new:true});

  return (
    <div className="app">
      {/* sidebar */}
      <aside className="side">
        <div className="brand">
          <div className="lic">📋</div>
          <div><b>Hương Diện</b><br/><small>Quản lý công việc</small></div>
        </div>
        <nav className="nav">
          {GROUPS.map(g=>(
            <button key={g.id} className={curGroup.id===g.id?'on':''} onClick={()=>openGroup(g)}>
              <i className={'ti '+g.icon}></i>{g.name}
              {g.badge>0 && <span className="badge">{g.badge}</span>}
            </button>
          ))}
        </nav>
        <div className="side-foot">
          <div style={{padding:'4px 10px'}}>
            <div style={{fontSize:11,color:'var(--muted)',fontWeight:600,marginBottom:6}}>{isAdmin&&whoFilter==='all'?'CẢ ĐỘI':'CỦA TÔI'} · HOÀN THÀNH TUẦN</div>
            <div style={{display:'flex',alignItems:'center',gap:10}}>
              <Ring pct={stats.total?Math.round((vTasks.filter(x=>x.status==='done').length)/stats.total*100):0} size={42}/>
              <div style={{fontSize:12,color:'var(--muted)'}}><b style={{color:'var(--ink)',fontSize:15,fontFamily:'Baloo 2'}}>{stats.doneWeek}</b> việc xong<br/>{stats.open} việc còn lại</div>
            </div>
          </div>
          <button className="tgl" onClick={()=>setBreath(true)}>
            <i className="ti ti-yoga"></i>Nghỉ & Thở
          </button>
          <button className="tgl" onClick={()=>setDark(d=>!d)}>
            <i className={'ti '+(dark?'ti-sun':'ti-moon')}></i>{dark?'Giao diện sáng':'Giao diện tối'}
          </button>
          <div style={{display:'flex',alignItems:'center',gap:9,padding:'9px 10px',marginTop:6,borderTop:'1px solid var(--border)'}}>
            <div style={{width:30,height:30,borderRadius:10,background:'var(--o-lt)',color:'var(--o-dk)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:13,fontWeight:700,fontFamily:'Baloo 2',flexShrink:0}}>{initials(me.name)}</div>
            <div style={{flex:1,minWidth:0}}>
              <b style={{fontSize:12.5,display:'block',whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>{me.name}</b>
              <small style={{color:'var(--muted)',fontSize:11}}>{myRole.ic} {myRole.n}</small>
            </div>
            <button onClick={onLock} title="Khoá app" style={{color:'var(--muted)',padding:6,display:'flex'}}><i className="ti ti-lock" style={{fontSize:17}}></i></button>
          </div>
        </div>
      </aside>

      {/* mobile top */}
      <div className="main">
        <div className="mtop">
          <div className="lic">📋</div><b>Hương Diện</b>
          <div className="spacer" style={{flex:1}}></div>
          <span style={{fontSize:12,color:'var(--muted)',fontWeight:600}}>{me.name}</span>
          <button className="tgl" style={{padding:8}} onClick={onLock} title="Khoá app"><i className="ti ti-lock" style={{fontSize:19}}></i></button>
          <button className="tgl" style={{padding:8}} onClick={()=>setDark(d=>!d)}><i className={'ti '+(dark?'ti-sun':'ti-moon')} style={{fontSize:20}}></i></button>
        </div>

        <div className={"topbar"+(window.innerWidth<=768?' mob':'')}>
          <div>
            <h1>{viewMeta.t}</h1>
            <div className="sub">{viewMeta.s}</div>
          </div>
          <div className="spacer"></div>
          {(view==='board'||view==='proj'||view==='cal')&&(
            <div className="srch"><i className="ti ti-search"></i><input placeholder="Tìm việc…" value={q} onChange={e=>setQ(e.target.value)}/></div>
          )}
          <div className="bellwrap">
            <button className="bellbtn" onClick={()=>setBellOpen(o=>!o)} title="Nhắc việc đến hạn">
              <i className="ti ti-bell"></i>
              {urgentCount>0 && <span className="bell-dot">{urgentCount>9?'9+':urgentCount}</span>}
            </button>
            {bellOpen && <React.Fragment>
              <div className="bell-ov" onClick={()=>setBellOpen(false)}></div>
              <div className="bell-panel">
                <div className="bell-panel-h">🔔 Nhắc việc đến hạn</div>
                {alerts.length===0 && <div className="bell-empty">✅ Không có việc nào sắp đến hạn</div>}
                {alerts.map(a=>(
                  <div key={a.task.id} className="bell-item" onClick={()=>{setBellOpen(false);setView('board');setEditing(a.task);}}>
                    <span className="ic">{a.kind==='over'?'🔴':a.kind==='today'?'🟠':'🟡'}</span>
                    <div>
                      <div className="tt">{a.task.title}</div>
                      <div className="dd">{a.kind==='over'?'Quá hạn':a.kind==='today'?'Đến hạn hôm nay':'Sắp đến hạn'} · {a.task.due}</div>
                    </div>
                  </div>
                ))}
              </div>
            </React.Fragment>}
          </div>
          <button className="btn" onClick={()=>openNew(projFilter!=='all'?projFilter:null)}><i className="ti ti-plus"></i>Thêm việc</button>
        </div>

        {/* thanh tab con của nhóm đang mở */}
        {curGroup.views.length>1 &&
          <div className="chips subnav">
            {curGroup.views.map(v=>(
              <button key={v.id} className={'chip'+(view===v.id?' on':'')} onClick={()=>goView(v.id)}>{v.n}</button>
            ))}
            {isAdmin&&['today','board','proj','cal'].indexOf(view)>=0 &&
              <select value={whoFilter} onChange={e=>setWhoFilter(e.target.value)} style={{...selSt,marginLeft:'auto'}} title="Lọc theo người nhận việc">
                <option value="all">👥 Cả đội</option>
                <option value="none">◻️ Chưa giao ai</option>
                {users.filter(u=>u.active!==false).map(u=>(<option key={u.id} value={u.id}>{u.id===me.id?'⭐ ':''}{u.name}</option>))}
              </select>}
          </div>}

        <div className="content" key={view}>
          {view==='dash' && <Dash stats={stats} tasks={vTasks} setView={goView} edit={setEditing} daily={daily} dailyState={dailyState} toggleDaily={toggleDaily} importPlan={importPlan} planLoaded={planLoaded} missingPlan={missingPlan} planEverLoaded={planEverLoaded} onBreath={()=>setBreath(true)} zen={zen} me={me} isAdmin={isAdmin}/>}
          {view==='today' && <Today tasks={myPool} plan={todayPlan} rebuild={rebuildPlan} move={moveTask} edit={setEditing} toggleCk={toggleCk} openFocus={setFocusTask} startDeep={setDeepIds} wins={wins} setWinSlot={setWinSlot} clearWinSlot={clearWinSlot} toggleWinText={toggleWinText}/>}
          {view==='brain' && <BrainEnergy log={brainlog} setLog={setBrainlog} cfg={carecfg} setCfg={setCarecfg} onBreath={()=>setBreath(true)}/>}
          {view==='board' && <Board tasks={filtered} all={vTasks} projFilter={projFilter} setProjFilter={setProjFilter} move={moveTask} edit={setEditing} toggleCk={toggleCk} nameOf={nameOf}/>}
          {view==='proj' && <Projects tasks={vTasks} setView={goView} setProjFilter={setProjFilter}/>}
          {view==='cal' && <Calendar tasks={filtered} move={moveTask} edit={setEditing}/>}
          {view==='stats' && <Stats tasks={vTasks}/>}
          {view==='assign' && <Assign tasks={tasks} users={users} roles={roles} me={me} assign={assignTask} edit={setEditing} openNew={openNew} setWho={(id)=>{setWhoFilter(id);goView('board');}}/>}
          {view==='progress' && <TeamProgress tasks={tasks} users={users} roles={roles}/>}
          {view==='members' && <Members users={users} setUsers={setUsers} roles={roles} setRoles={setRoles} me={me} isOwner={isOwner} tasks={tasks}/>}
          {view==='kd' && <BizBook metrics={bizmetrics} setMetrics={setBizmetrics} config={bizconfig} setConfig={setBizconfig}/>}
          {view==='sales' && <Sales/>}
          {view==='ncc' && <Sourcing st={sourcing} setSt={setSourcing}/>}
          {view==='law' && <Compliance st={compliance} setSt={setCompliance}/>}
          {view==='learn' && <Knowledge learned={learned} setLearned={setLearned}/>}
          {view==='book' && <Notebook nb={notebook} setNb={setNotebook} onExport={exportData} onImport={importData}/>}
          {view==='daily' && <Daily daily={daily} setDaily={setDaily} st={dailyState} toggle={toggleDaily} recurring={recurring} setRecurring={setRecurring}/>}
        </div>
      </div>

      {/* mobile bottom nav + fab */}
      <button className="fab" onClick={()=>openNew(projFilter!=='all'?projFilter:null)}><i className="ti ti-plus"></i></button>
      <nav className="botnav">
        {GROUPS.map(g=>(
          <button key={g.id} className={curGroup.id===g.id?'on':''} onClick={()=>openGroup(g)}>
            <i className={'ti '+g.icon}></i>{g.name}
            {g.badge>0 && <span className="badge">{g.badge}</span>}
          </button>
        ))}
      </nav>

      {editing && <TaskModal task={editing} onSave={saveTask} onDel={delTask} onClose={()=>setEditing(null)}
        users={users} roles={roles} me={me} canAssign={isAdmin}/>}
      {focusTask && <FocusModal task={focusTask} onClose={()=>setFocusTask(null)} onLog={addSpent} onDone={(id)=>{moveTask(id,'done');setFocusTask(null);}}/>}
      {deepIds && <DeepWork ids={deepIds} tasks={tasks} onClose={()=>setDeepIds(null)} onLog={addSpent} onComplete={(id)=>moveTask(id,'done')} toggleCk={toggleCk}/>}
      {breath && <BreathMode onClose={()=>setBreath(false)} onLog={addZen}/>}
      {toast && <div className="toast"><i className="ti ti-trophy"></i><div><b>{toast.msg}</b>{toast.sub && <div style={{fontSize:11.5,opacity:.92,fontWeight:500}}>{toast.sub}</div>}</div></div>}
    </div>
  );
}

/* ---------- Dashboard ---------- */
function Dash({stats,tasks,setView,edit,daily,dailyState,toggleDaily,importPlan,planLoaded,missingPlan,planEverLoaded,onBreath,zen}){
  const t=today();
  const todayTasks=tasks.filter(x=>x.status!=='done' && (x.due===t || (x.due&&x.due<t))).sort((a,b)=>(a.due||'').localeCompare(b.due||''));
  const dailyDone=dailyState.done.length, dailyTotal=daily.length;
  const g=gamifyStats(tasks), badges=badgesOf(tasks,g);
  const lvPct=g.next?Math.round((g.points-g.level.min)/(g.next.min-g.level.min)*100):100;
  return (
    <div>
      {/* Gamify hero */}
      <div style={{background:'linear-gradient(135deg,#7c2d12,#c2410c)',borderRadius:18,padding:'16px 18px',marginBottom:18,color:'#fff',boxShadow:'var(--sh)'}}>
        <div style={{display:'flex',alignItems:'center',gap:14,flexWrap:'wrap'}}>
          <div style={{fontSize:36,lineHeight:1}}>{g.level.ic}</div>
          <div style={{flex:1,minWidth:140}}>
            <div style={{fontSize:11.5,opacity:.85,fontWeight:600}}>CẤP ĐỘ HIỆN TẠI</div>
            <div style={{fontFamily:'Baloo 2',fontSize:19,fontWeight:700}}>{g.level.name}</div>
          </div>
          <div style={{textAlign:'center'}}><div style={{fontFamily:'Baloo 2',fontSize:22,fontWeight:700}}>{g.points}</div><div style={{fontSize:10.5,opacity:.85}}>điểm</div></div>
          <div style={{textAlign:'center'}}><div style={{fontFamily:'Baloo 2',fontSize:22,fontWeight:700}}>🔥{g.streak}</div><div style={{fontSize:10.5,opacity:.85}}>ngày liền</div></div>
        </div>
        {g.next &&
          <div style={{marginTop:12}}>
            <div style={{height:8,background:'rgba(255,255,255,.25)',borderRadius:6,overflow:'hidden'}}><i style={{display:'block',height:'100%',width:lvPct+'%',background:'#fff',borderRadius:6}}></i></div>
            <div style={{fontSize:11,opacity:.9,marginTop:5}}>Còn <b>{g.next.min-g.points}</b> điểm để lên <b>{g.next.ic} {g.next.name}</b></div>
          </div>}
        <div style={{display:'flex',gap:8,marginTop:14,overflowX:'auto'}}>
          {badges.map(b=>(
            <div key={b.id} className={'badgechip'+(b.got?'':' off')} title={b.need} style={{background:'rgba(255,255,255,.12)',border:'1px solid rgba(255,255,255,.18)',color:'#fff'}}>
              <span className="be">{b.ic}</span><small style={{color:'#fff',opacity:b.got?1:.7}}>{b.name}</small>
            </div>
          ))}
        </div>
      </div>
      {!planLoaded &&
        <div style={{display:'flex',alignItems:'center',gap:14,background:'linear-gradient(135deg,#fff7ed,#ffedd5)',border:'1px solid var(--o-mid)',borderRadius:16,padding:'16px 18px',marginBottom:18,flexWrap:'wrap'}}>
          <div style={{fontSize:30,lineHeight:1}}>🛡️</div>
          <div style={{flex:1,minWidth:180}}>
            <b style={{fontFamily:'Baloo 2',fontSize:15,color:'var(--o-dk)'}}>Kế hoạch phòng thủ "năm xấu"</b>
