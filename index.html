  const [loading,setLoading]=useState(true);
  const [err,setErr]=useState('');
  const [syncing,setSyncing]=useState(false);
  const [msg,setMsg]=useState('');
  const [kNhap,setKNhap]=useState('');
  const [coKhoa,setCoKhoa]=useState(!!hdKey());

  const load=async()=>{
    setLoading(true); setErr('');
    try{
      const [r,iv,tp,pr,st,lg]=await Promise.all([
        supaGet('kv_daily_revenue?select=day,invoices,revenue&order=day.desc&limit=60'),
        supaGet('kv_invoices?select=code,purchase_date,customer_name,total_payment,status_value,branch_name&order=purchase_date.desc&limit=20'),
        supaGet('kv_top_products?select=product_name,qty,revenue&order=qty.desc&limit=12'),
        supaGet('kv_products?select=id,name'),
        supaGet('kv_inventory?select=product_id,branch_name,on_hand&order=on_hand.asc&limit=400'),
        supaGet('kv_sync_log?select=ok,detail,ran_at,counts&order=ran_at.desc&limit=1'),
      ]);
      const pmap={}; pr.forEach(p=>pmap[p.id]=p.name);
      setRev(r); setInv(iv); setTop(tp);
      setStock(st.map(s=>({...s,name:pmap[s.product_id]||('SP #'+s.product_id)})).slice(0,15));
      setLog(lg[0]||null);
    }catch(e){ setErr(String(e.message||e)); }
    setLoading(false);
  };
  useEffect(()=>{ load(); },[]);

  const syncNow=async()=>{
    setSyncing(true); setMsg('');
    try{
      const r=await fetch(`${SUPA_URL}/functions/v1/kiotviet-sync`,{
        method:'POST',headers:{apikey:SUPA_KEY,Authorization:'Bearer '+SUPA_KEY,'Content-Type':'application/json'},
        body:JSON.stringify({days:30})
      });
      const j=await r.json();
      if(!j.ok) throw new Error(j.error||'Đồng bộ lỗi');
      setMsg('Đồng bộ xong: '+Object.entries(j.counts||{}).map(([k,v])=>`${k} ${v}`).join(' · '));
      await load();
    }catch(e){ setMsg('Lỗi: '+String(e.message||e)); }
    setSyncing(false);
  };

  // Derived metrics
  const todayStr=today();
  const monthPfx=todayStr.slice(0,7);
  const revToday=rev.find(x=>x.day===todayStr)?.revenue||0;
  const revMonth=rev.filter(x=>(x.day||'').startsWith(monthPfx)).reduce((s,x)=>s+(+x.revenue||0),0);
  const ordMonth=rev.filter(x=>(x.day||'').startsWith(monthPfx)).reduce((s,x)=>s+(+x.invoices||0),0);
  const chart=[...rev].slice(0,14).reverse();
  const maxRev=Math.max(1,...chart.map(x=>+x.revenue||0));
  const hasData=rev.length>0||inv.length>0;
  const secretMissing=log&&!log.ok&&/secret|KV_RETAILER|KV_CLIENT/i.test(log.detail||'');

  return (
    <div>
      <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:14,flexWrap:'wrap'}}>
        <span style={{fontSize:12.5,color:'var(--muted)'}}>
          {log? <>Đồng bộ gần nhất: <b style={{color:log.ok?'var(--grn)':'var(--red)'}}>{log.ok?'OK':'Lỗi'}</b> · {fmtDate((log.ran_at||'').slice(0,10))} {(log.ran_at||'').slice(11,16)}</> : 'Chưa có lần đồng bộ nào'}
        </span>
        <span style={{flex:1}}></span>
        {msg && <span style={{fontSize:12,color:msg.startsWith('Lỗi')?'var(--red)':'var(--grn)',fontWeight:600}}>{msg}</span>}
        <button className="btn" onClick={syncNow} disabled={syncing}>
          <i className={'ti '+(syncing?'ti-loader-2':'ti-refresh')}></i>{syncing?'Đang đồng bộ…':'Đồng bộ ngay'}
        </button>
      </div>

      {!coKhoa &&
        <div style={{background:'var(--red-lt)',border:'1px solid var(--red)',borderRadius:12,padding:'12px 14px',marginBottom:16,fontSize:13}}>
          <div style={{fontWeight:700,color:'var(--red)',marginBottom:4}}><i className="ti ti-lock"></i> Máy này chưa có khoá Hương Diện</div>
          <div style={{color:'var(--muted)',marginBottom:8}}>
            Số liệu bán hàng chỉ mở cho máy có khoá. Khoá nằm ở file <b>KHOA-HUONGDIEN.txt</b> trên máy chủ.
          </div>
          <div style={{display:'flex',gap:8}}>
            <input className="inp" style={{flex:1}} type="password" placeholder="Dán khoá vào đây"
              value={kNhap} onChange={e=>setKNhap(e.target.value)}
              onKeyDown={e=>{if(e.key==='Enter'&&kNhap.trim()){setHdKey(kNhap);setCoKhoa(true);setKNhap('');load();}}}/>
            <button className="btn" onClick={()=>{if(!kNhap.trim())return;setHdKey(kNhap);setCoKhoa(true);setKNhap('');load();}}>Lưu</button>
          </div>
        </div>}

      {secretMissing &&
        <div style={{display:'flex',alignItems:'flex-start',gap:10,background:'var(--red-lt)',border:'1px solid var(--red)',borderRadius:12,padding:'12px 14px',marginBottom:16,fontSize:13,color:'var(--red)'}}>
          <i className="ti ti-key" style={{fontSize:20}}></i>
          <span>Chưa cấu hình khoá KiotViet. Vào <b>Supabase → Edge Functions → kiotviet-sync → Secrets</b> thêm 3 biến: <b>KV_RETAILER</b>, <b>KV_CLIENT_ID</b>, <b>KV_CLIENT_SECRET</b> (lấy trong KiotViet → Thiết lập → Public API), rồi bấm “Đồng bộ ngay”.</span>
        </div>}

      {err && <div style={{background:'var(--red-lt)',border:'1px solid var(--red)',borderRadius:12,padding:'12px 14px',marginBottom:16,fontSize:13,color:'var(--red)'}}>Lỗi tải dữ liệu: {err}</div>}

      {loading && <div style={{color:'var(--muted)',padding:'30px 0',textAlign:'center'}}><i className="ti ti-loader-2"></i> Đang tải…</div>}

      {!loading && !hasData && !secretMissing &&
        <div style={{color:'var(--muted)',padding:'30px 0',textAlign:'center',fontSize:13.5}}>
          Chưa có dữ liệu. Bấm <b>“Đồng bộ ngay”</b> để kéo dữ liệu bán hàng từ KiotViet.
        </div>}

      {!loading && hasData && <>
        {/* KPI cards */}
        <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(150px,1fr))',gap:12,marginBottom:16}}>
          {[
            {l:'Doanh thu hôm nay',v:vnd(revToday)+'đ',i:'ti-cash',c:'var(--grn)'},
            {l:'Doanh thu tháng này',v:mio(revMonth).toLocaleString('vi-VN',{maximumFractionDigits:1})+' tr',i:'ti-calendar-stats',c:'var(--o-dk)'},
            {l:'Số đơn tháng này',v:ordMonth,i:'ti-receipt',c:'var(--blue)'},
            {l:'Mã hàng theo dõi',v:top.length?'…':stock.length,i:'ti-box',c:'var(--muted)'},
          ].map((k,i)=>(
            <div key={i} className="panel" style={{margin:0}}>
              <div className="panel-b" style={{padding:'14px 16px'}}>
                <div style={{fontSize:11.5,color:'var(--muted)',fontWeight:600,marginBottom:6}}><i className={'ti '+k.i}></i> {k.l}</div>
                <div style={{fontSize:22,fontWeight:800,color:k.c}}>{k.v}</div>
              </div>
            </div>
          ))}
        </div>

        {/* Revenue chart */}
        {chart.length>0 &&
          <div className="panel">
            <div className="panel-h"><i className="ti ti-chart-bar lead"></i><b>Doanh thu 14 ngày gần nhất</b><span style={{marginLeft:'auto',fontSize:12,color:'var(--muted)'}}>đơn vị: triệu đồng</span></div>
            <div className="panel-b" style={{padding:'18px'}}>
              <div style={{display:'flex',alignItems:'flex-end',gap:6,height:130}}>
                {chart.map((m,i)=>(
                  <div key={i} style={{flex:1,display:'flex',flexDirection:'column',alignItems:'center',gap:4,height:'100%',justifyContent:'flex-end'}}>
                    <div style={{fontSize:10,fontWeight:700,color:'var(--o-dk)'}}>{mio(m.revenue).toFixed(1)}</div>
                    <div title={vnd(m.revenue)+'đ'} style={{width:'100%',maxWidth:28,height:((+m.revenue||0)/maxRev*92)+'px',minHeight:3,background:'linear-gradient(180deg,var(--o),var(--o-dk))',borderRadius:'5px 5px 0 0'}}></div>
                    <div style={{fontSize:9.5,color:'var(--muted)'}}>{fmtDate(m.day)}</div>
                  </div>
                ))}
              </div>
            </div>
          </div>}

        <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(300px,1fr))',gap:16}}>
          {/* Top products */}
          <div className="panel" style={{margin:0}}>
            <div className="panel-h"><i className="ti ti-trophy lead"></i><b>Sản phẩm bán chạy</b></div>
            <div className="panel-b" style={{padding:'6px 0'}}>
              {top.length===0 && <div style={{padding:'16px',color:'var(--muted)',fontSize:13}}>Chưa có dữ liệu.</div>}
              {top.map((p,i)=>(
                <div key={i} style={{display:'flex',alignItems:'center',gap:10,padding:'9px 16px',borderTop:i?'1px solid var(--border)':'none'}}>
                  <span style={{fontSize:12,fontWeight:700,color:'var(--muted)',width:18}}>{i+1}</span>
                  <span style={{flex:1,fontSize:13,color:'var(--ink)'}}>{p.product_name||'—'}</span>
                  <span style={{fontSize:12.5,fontWeight:700,color:'var(--o-dk)'}}>{Math.round(+p.qty||0)}</span>
                  <span style={{fontSize:11.5,color:'var(--muted)',width:80,textAlign:'right'}}>{vnd(p.revenue)}đ</span>
                </div>
              ))}
            </div>
          </div>

          {/* Low stock */}
          <div className="panel" style={{margin:0}}>
            <div className="panel-h"><i className="ti ti-packages lead"></i><b>Tồn kho thấp nhất</b></div>
            <div className="panel-b" style={{padding:'6px 0'}}>
              {stock.length===0 && <div style={{padding:'16px',color:'var(--muted)',fontSize:13}}>Chưa có dữ liệu.</div>}
              {stock.map((s,i)=>(
                <div key={i} style={{display:'flex',alignItems:'center',gap:10,padding:'9px 16px',borderTop:i?'1px solid var(--border)':'none'}}>
                  <span style={{flex:1,fontSize:13,color:'var(--ink)'}}>{s.name}</span>
                  {s.branch_name && <span style={{fontSize:11,color:'var(--muted)'}}>{s.branch_name}</span>}
                  <span style={{fontSize:12.5,fontWeight:700,color:(+s.on_hand<=5)?'var(--red)':'var(--ink)'}}>{Math.round(+s.on_hand||0)}</span>
                </div>
              ))}
            </div>
          </div>
        </div>

        {/* Recent invoices */}
        <div className="panel">
          <div className="panel-h"><i className="ti ti-list-details lead"></i><b>Đơn hàng gần đây</b></div>
          <div className="panel-b" style={{padding:0,overflowX:'auto'}}>
            <table style={{width:'100%',borderCollapse:'collapse',fontSize:12.5}}>
              <thead><tr style={{color:'var(--muted)',textAlign:'left'}}>
                <th style={{padding:'10px 16px',fontWeight:600}}>Mã đơn</th>
                <th style={{padding:'10px 16px',fontWeight:600}}>Ngày</th>
                <th style={{padding:'10px 16px',fontWeight:600}}>Khách</th>
                <th style={{padding:'10px 16px',fontWeight:600,textAlign:'right'}}>Thành tiền</th>
                <th style={{padding:'10px 16px',fontWeight:600}}>Trạng thái</th>
              </tr></thead>
              <tbody>
                {inv.length===0 && <tr><td colSpan={5} style={{padding:'16px',color:'var(--muted)'}}>Chưa có đơn.</td></tr>}
                {inv.map((v,i)=>(
                  <tr key={i} style={{borderTop:'1px solid var(--border)'}}>
                    <td style={{padding:'9px 16px',fontWeight:600,color:'var(--ink)'}}>{v.code}</td>
                    <td style={{padding:'9px 16px',color:'var(--muted)'}}>{fmtDate((v.purchase_date||'').slice(0,10))}</td>
                    <td style={{padding:'9px 16px',color:'var(--ink)'}}>{v.customer_name||'Khách lẻ'}</td>
                    <td style={{padding:'9px 16px',textAlign:'right',fontWeight:700,color:'var(--o-dk)'}}>{vnd(v.total_payment)}đ</td>
                    <td style={{padding:'9px 16px',color:'var(--muted)'}}>{v.status_value||'—'}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      </>}
    </div>
  );
}

function BizBook({metrics,setMetrics,config,setConfig}){
  const wk=dstr(startOfWeek());
  const [f,setF]=useState(()=>metrics.find(m=>m.week===wk)||{week:wk});
  const [saved,setSaved]=useState(false);
  const set=(k,v)=>{setF(p=>({...p,[k]:v===''?undefined:+v}));setSaved(false);};
  const save=()=>{ setMetrics(prev=>[...prev.filter(m=>m.week!==wk),{...f,week:wk}].sort((a,b)=>a.week<b.week?1:-1)); setSaved(true); };
  const margin=f.rev?Math.round((f.gross||0)/f.rev*1000)/10:null;
  const roas=f.adsCost?Math.round((f.adsRev||0)/f.adsCost*10)/10:null;
  const be=config.breakeven||0;
  const below=f.rev!==undefined&&be>0&&f.rev<be;
  const recent=[...metrics].sort((a,b)=>a.week<b.week?1:-1).slice(0,8);
  const chrono=[...recent].reverse();
  const maxRev=Math.max(1,...chrono.map(m=>m.rev||0),be);
  return (
    <div>
      <div style={{fontSize:12.5,color:'var(--muted)',marginBottom:14,display:'flex',alignItems:'center',gap:8,flexWrap:'wrap'}}>
        <i className="ti ti-info-circle" style={{color:'var(--o)'}}></i> Nhập số mỗi tuần (đơn vị: <b>triệu đồng</b>, riêng "khách quay lại" là số người). Tuần hiện tại: <b style={{color:'var(--ink)'}}>{fmtDate(wk)}</b>.
        <span style={{flex:1}}></span>
        <span style={{display:'flex',alignItems:'center',gap:6}}>Hòa vốn/tuần:
          <input type="number" value={be||''} onChange={e=>setConfig({...config,breakeven:e.target.value===''?0:+e.target.value})} style={{...selSt,width:80,padding:'6px 8px'}}/> tr
        </span>
      </div>

      {below &&
        <div style={{display:'flex',alignItems:'center',gap:10,background:'var(--red-lt)',border:'1px solid var(--red)',borderRadius:12,padding:'12px 14px',marginBottom:16,fontSize:13,color:'var(--red)'}}>
          <i className="ti ti-alert-triangle" style={{fontSize:20}}></i><span>Doanh thu tuần (<b>{f.rev} tr</b>) <b>dưới ngưỡng hòa vốn {be} tr</b> — cửa hàng đang ở vùng nguy hiểm. Xem lại kế hoạch phòng thủ.</span>
        </div>}

      <div className="panel">
        <div className="panel-h"><i className="ti ti-pencil lead"></i><b>Nhập số tuần này</b>
          {saved && <span style={{marginLeft:'auto',color:'var(--grn)',fontSize:12.5,fontWeight:600}}><i className="ti ti-check"></i> Đã lưu</span>}
        </div>
        <div className="panel-b" style={{padding:'16px 18px'}}>
          <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(140px,1fr))',gap:12}}>
            {BIZF.map(fd=>(
              <div key={fd.k}>
                <label style={{display:'block',fontSize:11.5,fontWeight:600,color:'var(--muted)',marginBottom:5}}>{fd.l}{fd.unit?'':' (tr)'}</label>
                <input type="number" value={f[fd.k]===undefined?'':f[fd.k]} onChange={e=>set(fd.k,e.target.value)} style={{width:'100%',background:'var(--bg)',border:'1.5px solid var(--border)',borderRadius:10,padding:'9px 11px',color:'var(--ink)',outline:'none'}}/>
              </div>
            ))}
          </div>
          <div style={{display:'flex',gap:10,flexWrap:'wrap',marginTop:14,alignItems:'center'}}>
            <span className="tag" style={{background:'var(--o-lt)',color:'var(--o-dk)',padding:'6px 11px'}}>Biên gộp thực tế: <b>{margin!==null?margin+'%':'—'}</b></span>
            <span className="tag" style={{background:'var(--blue-lt)',color:'var(--blue)',padding:'6px 11px'}}>ROAS (DT/Ads): <b>{roas!==null?roas+'×':'—'}</b></span>
            <span style={{flex:1}}></span>
            <button className="btn" onClick={save}><i className="ti ti-device-floppy"></i>Lưu tuần này</button>
          </div>
        </div>
      </div>

      {chrono.length>0 &&
        <div className="panel">
          <div className="panel-h"><i className="ti ti-chart-line lead"></i><b>Xu hướng doanh thu</b><span style={{marginLeft:'auto',fontSize:12,color:'var(--muted)'}}>{chrono.length} tuần gần nhất</span></div>
          <div className="panel-b" style={{padding:'18px'}}>
            <div style={{display:'flex',alignItems:'flex-end',gap:8,height:120,position:'relative'}}>
              {be>0 && <div style={{position:'absolute',left:0,right:0,bottom:(be/maxRev*100)+'px',borderTop:'2px dashed var(--red)',opacity:.6}}><span style={{position:'absolute',right:0,top:-16,fontSize:10,color:'var(--red)',fontWeight:600}}>hòa vốn {be}</span></div>}
              {chrono.map((m,i)=>(
                <div key={i} style={{flex:1,display:'flex',flexDirection:'column',alignItems:'center',gap:5,height:'100%',justifyContent:'flex-end'}}>
                  <div style={{fontSize:10.5,fontWeight:700,color:'var(--o-dk)'}}>{m.rev||0}</div>
                  <div style={{width:'100%',maxWidth:30,height:((m.rev||0)/maxRev*86)+'px',minHeight:3,background:(be>0&&(m.rev||0)<be)?'linear-gradient(180deg,#f87171,#dc2626)':'linear-gradient(180deg,var(--o),var(--o-dk))',borderRadius:'5px 5px 0 0'}}></div>
                  <div style={{fontSize:10,color:'var(--muted)'}}>{fmtDate(m.week)}</div>
                </div>
              ))}
            </div>
          </div>
        </div>}

      {recent.length>0 &&
        <div className="panel">
          <div className="panel-h"><i className="ti ti-table lead"></i><b>Lịch sử theo tuần</b></div>
          <div className="panel-b" style={{padding:0,overflowX:'auto'}}>
            <table style={{width:'100%',borderCollapse:'collapse',fontSize:12.5,minWidth:480}}>
              <thead><tr style={{color:'var(--muted)',textAlign:'right'}}>
                <th style={{textAlign:'left',padding:'10px 14px'}}>Tuần</th><th style={{padding:'10px 8px'}}>Doanh thu</th><th style={{padding:'10px 8px'}}>Biên%</th><th style={{padding:'10px 8px'}}>Tiền mặt</th><th style={{padding:'10px 8px'}}>Tồn &gt;60</th><th style={{padding:'10px 14px'}}>Khách lại</th>
              </tr></thead>
              <tbody>
                {recent.map(m=>{const mg=m.rev?Math.round((m.gross||0)/m.rev*1000)/10:null;const bad=be>0&&(m.rev||0)<be;return (
                  <tr key={m.week} style={{borderTop:'1px solid var(--border)',textAlign:'right'}}>
                    <td style={{textAlign:'left',padding:'10px 14px',fontWeight:600}}>{fmtDate(m.week)}</td>
                    <td style={{padding:'10px 8px',color:bad?'var(--red)':'var(--ink)',fontWeight:bad?700:400}}>{m.rev??'—'}</td>
                    <td style={{padding:'10px 8px'}}>{mg!==null?mg+'%':'—'}</td>
                    <td style={{padding:'10px 8px'}}>{m.cash??'—'}</td>
                    <td style={{padding:'10px 8px'}}>{m.stockOld??'—'}</td>
                    <td style={{padding:'10px 14px'}}>{m.returns??'—'}</td>
                  </tr>
                );})}
              </tbody>
            </table>
          </div>
        </div>}
    </div>
  );
}

/* ---------- Đồng bộ đám mây ---------- */
function SyncPanel(){
  const [code,setCode]=useState(Sync.code()||'');
  const [on,setOn]=useState(Sync.enabled());
  const [status,setStatus]=useState(Sync._status);
  const [conflictKeys,setConflictKeys]=useState(null);
  const [busy,setBusy]=useState(false);
  const [pushOn,setPushOn]=useState(null);
  const [pushBusy,setPushBusy]=useState(false);
  useEffect(()=>{ Push.subscribed().then(setPushOn); },[]);
  const togglePush=async()=>{
    setPushBusy(true);
    if(pushOn){ await Push.disable(); setPushOn(false); }
    else{ const r=await Push.enable(); if(r&&r.ok){ setPushOn(true); alert('Đã bật nhắc việc qua thông báo đẩy — kể cả khi đã đóng app, mỗi sáng ~7h30 sẽ nhắc nếu có việc quá hạn/đến hạn.'); } else alert((r&&r.error)||'Không bật được thông báo.'); }
    setPushBusy(false);
  };
  useEffect(()=>{ Sync._onStatus=setStatus; Sync._onConflict=(ks)=>setConflictKeys(ks); return ()=>{ if(Sync._onStatus===setStatus) Sync._onStatus=null; if(Sync._onConflict)Sync._onConflict=null; }; },[]);
  const lastStr=(()=>{ try{const v=localStorage.getItem('hdw.synclast'); return v?new Date(v).toLocaleString('vi-VN'):null;}catch(e){return null;} })();
  const STT={pending:['Chờ đồng bộ…','var(--amber)'],pushing:['Đang lưu lên cloud…','var(--blue)'],pulling:['Đang tải về…','var(--blue)'],synced:['Đã đồng bộ ✓','var(--grn)'],conflict:['Có xung đột — đã ưu tiên giữ bản máy này','var(--amber)'],error:['Lỗi kết nối — thử lại','var(--red)']};
  const st=status&&STT[status];
  const inp={width:'100%',background:'var(--bg)',border:'1.5px solid var(--border)',borderRadius:10,padding:'11px 13px',color:'var(--ink)',outline:'none',fontSize:15};
  const enable=async(mode)=>{
    const c=code.trim(); if(c.length<6){alert('Mã đồng bộ cần ít nhất 6 ký tự. Hãy dùng mã khó đoán (vd: huongdien-bimsua-2026).');return;}
    localStorage.setItem('hdw.synccode',c); setBusy(true);
    if(mode==='pull'){ const r=await Sync.pull(); setBusy(false);
      if(r&&r.ok&&!r.empty){ alert('Đã tải dữ liệu từ cloud về máy này. Trang sẽ tải lại.'); location.reload(); }
      else if(r&&r.empty){ await Sync.push(); setOn(true); alert('Cloud chưa có dữ liệu cho mã này — đã ĐẨY dữ liệu máy này lên cloud.\nTrên thiết bị kia: nhập ĐÚNG mã này rồi bấm "Bật & tải về".'); }
      else { localStorage.removeItem('hdw.synccode'); alert('Lỗi kết nối, thử lại.'); } }
    else { await Sync.push(); setBusy(false); setOn(true); alert('Đã bật đồng bộ và đẩy dữ liệu máy này lên cloud.'); }
  };
  const pullNow=async()=>{ setBusy(true); const r=await Sync.pull(); setBusy(false); if(r&&r.ok&&!r.empty){ if(r.changed)location.reload(); else alert('Đang là bản mới nhất.'); } else if(r&&r.empty) alert('Cloud chưa có dữ liệu.'); };
  const pushNow=async()=>{ setBusy(true); await Sync.push(); setBusy(false); };
  const off=()=>{ if(confirm('Tắt đồng bộ trên máy này? Dữ liệu trên cloud vẫn còn, dữ liệu máy này giữ nguyên.')){ localStorage.removeItem('hdw.synccode'); setOn(false); setStatus(null); } };
  return (
    <div className="panel">
      <div className="panel-h"><i className="ti ti-cloud lead"></i><b>Đồng bộ nhiều thiết bị</b>{on&&<span className="tag" style={{marginLeft:'auto',background:'var(--grn-lt)',color:'var(--grn)'}}>Đang bật</span>}</div>
      <div className="panel-b" style={{padding:'16px 18px'}}>
        <p style={{fontSize:13,color:'var(--muted)',lineHeight:1.6,marginBottom:14}}>Nhập <b>một mã đồng bộ</b> giống nhau trên máy tính & điện thoại để dùng chung dữ liệu. Mã chính là "chìa khóa" — ai có mã sẽ xem được dữ liệu, nên đặt mã khó đoán.</p>
        <div className="fld" style={{marginBottom:12}}>
          <label style={{display:'block',fontSize:12.5,fontWeight:600,color:'var(--muted)',marginBottom:6}}>Mã đồng bộ (≥ 6 ký tự)</label>
          <input value={code} onChange={e=>setCode(e.target.value)} placeholder="vd: huongdien-bimsua-2026" disabled={on} style={{...inp,opacity:on?.6:1}}/>
        </div>
        {!on
          ? <div style={{display:'flex',gap:10,flexWrap:'wrap'}}>
              <button className="btn" disabled={busy} onClick={()=>enable('pull')}><i className="ti ti-cloud-download"></i>Bật & tải về (thiết bị phụ)</button>
              <button className="btn ghost" disabled={busy} onClick={()=>enable('push')}><i className="ti ti-cloud-up"></i>Bật & đẩy lên (thiết bị chính)</button>
            </div>
          : <div>

      </div>
    </div>
  );
}

function Notebook({nb,setNb,onExport,onImport}){
  const [seg,setSeg]=useState('sync');
  const [openCat,setOpenCat]=useState(0);
  const [copied,setCopied]=useState(null);
  const segs=[{k:'sync',n:'Đồng bộ',i:'ti-cloud'},{k:'sop',n:'Quy trình',i:'ti-list-check'},{k:'prompts',n:'Prompt AI',i:'ti-sparkles'},{k:'lib',n:'Thư viện prompt',i:'ti-books'},{k:'suppliers',n:'Nhà cung cấp',i:'ti-truck'},{k:'data',n:'Sao lưu',i:'ti-database'}];
  const upd=(sec,arr)=>setNb({...nb,[sec]:arr});
  const addItem=(sec,obj)=>upd(sec,[...(nb[sec]||[]),{...obj,id:sec[0]+Date.now()}]);
  const delItem=(sec,id)=>upd(sec,nb[sec].filter(x=>x.id!==id));

              </div>
            </div>
          ))}
          <button className="btn ghost" onClick={()=>addItem('suppliers',{name:'NCC mới',phone:'',note:''})}><i className="ti ti-plus"></i>Thêm nhà cung cấp</button>
        </div>}

      {seg==='data'&&
        <div className="panel">
          <div className="panel-h"><i className="ti ti-database lead"></i><b>Sao lưu & khôi phục dữ liệu</b></div>
          <div className="panel-b" style={{padding:'16px 18px'}}>
            <p style={{fontSize:13,color:'var(--muted)',lineHeight:1.6,marginBottom:14}}>Toàn bộ dữ liệu lưu trên trình duyệt máy này — <b>dễ mất khi xoá cache/đổi máy</b>. Hãy xuất file sao lưu định kỳ và cất giữ an toàn.</p>
            <div style={{display:'flex',gap:10,flexWrap:'wrap'}}>
              <button className="btn" onClick={onExport}><i className="ti ti-download"></i>Xuất file sao lưu (.json)</button>
              <label className="btn ghost" style={{cursor:'pointer'}}><i className="ti ti-upload"></i>Khôi phục từ file
                <input type="file" accept="application/json,.json" style={{display:'none'}} onChange={e=>{onImport(e.target.files[0]);e.target.value='';}}/>
              </label>
            </div>
            <div style={{marginTop:14,padding:'12px 14px',background:'var(--amber-lt)',borderRadius:12,fontSize:12.5,color:'var(--amber)',lineHeight:1.5}}>
              <i className="ti ti-alert-triangle"></i> Khôi phục sẽ <b>ghi đè</b> toàn bộ dữ liệu hiện tại bằng dữ liệu trong file.
            </div>
          </div>
        </div>}

  );
}

/* ---------- Meditation (thở có dẫn nhịp) ---------- */
const BREATH_PAT={
  box:{name:'Thở hộp · 4-4-4-4',sub:'Cân bằng & tập trung',steps:[['Hít vào',4,'in'],['Giữ',4,'hold'],['Thở ra',4,'out'],['Giữ',4,'hold']]},
  relax:{name:'Thư giãn · 4-7-8',sub:'Hạ căng thẳng, dễ ngủ',steps:[['Hít vào',4,'in'],['Giữ',7,'hold'],['Thở ra',8,'out']]},
  calm:{name:'Đều · 5-5',sub:'Nhẹ nhàng, dễ theo',steps:[['Hít vào',5,'in'],['Thở ra',5,'out']]},
};
function BreathMode({onClose,onLog}){
  const [phase,setPhase]=useState('setup'); // setup | run | done
  const [patKey,setPatKey]=useState('box');
  const [mins,setMins]=useState(5);
  const [elapsed,setElapsed]=useState(0);
  const [paused,setPaused]=useState(false);
  const [scale,setScale]=useState(0.5);
  const steps=BREATH_PAT[patKey].steps;
  const cyc=steps.reduce((a,s)=>a+s[1],0);
  const sessionLeft=Math.max(0,mins*60-elapsed);
  const inCyc=elapsed%cyc; let acc=0,idx=0; for(let i=0;i<steps.length;i++){ if(inCyc<acc+steps[i][1]){idx=i;break;} acc+=steps[i][1]; }
  const [lbl,dur,type]=steps[idx];
  const stepLeft=acc+dur-inCyc;

  useEffect(()=>{ if(phase!=='run'||paused) return; const t=setInterval(()=>setElapsed(e=>e+1),1000); return ()=>clearInterval(t); },[phase,paused]);
  useEffect(()=>{ if(phase==='run'&&sessionLeft<=0){ onLog(mins); setPhase('done'); } },[sessionLeft,phase]);
  useEffect(()=>{ if(phase!=='run')return; if(type==='in')setScale(1); else if(type==='out')setScale(0.45); },[idx,phase]);
  useEffect(()=>()=>Noise.stop(),[]);

  const mm=String(Math.floor(sessionLeft/60)).padStart(2,'0'), ss=String(sessionLeft%60).padStart(2,'0');
  const bg={position:'fixed',inset:0,zIndex:300,background:'linear-gradient(160deg,#0c2a2e,#103e43 55%,#07201f)',color:'#eafaf8',display:'flex',flexDirection:'column',overflowY:'auto'};
  const lightBtn={background:'rgba(255,255,255,.14)',color:'#eafaf8',border:'1px solid rgba(255,255,255,.2)'};
  const transDur=type==='hold'?0.4:dur;

  if(phase==='setup') return (
    <div style={bg}>
      <div style={{maxWidth:440,margin:'auto',padding:24,textAlign:'center',width:'100%'}}>
        <div style={{fontSize:48}}>🌿</div>
        <h1 style={{fontFamily:'Baloo 2',fontSize:26,margin:'10px 0 4px'}}>Meditation</h1>
        <p style={{opacity:.75,fontSize:13.5,marginBottom:20}}>Vài phút thở có nhịp để đầu óc nhẹ lại, rồi quay lại làm việc tỉnh táo hơn.</p>
        <div style={{fontSize:12,opacity:.7,fontWeight:600,marginBottom:8,textAlign:'left'}}>Kiểu thở</div>
        <div style={{display:'flex',flexDirection:'column',gap:10,marginBottom:20}}>
          {Object.keys(BREATH_PAT).map(k=>(
            <button key={k} onClick={()=>setPatKey(k)} style={{...(patKey===k?{background:'rgba(255,255,255,.2)',border:'1.5px solid rgba(255,255,255,.5)'}:lightBtn),padding:'12px 16px',borderRadius:12,textAlign:'left',cursor:'pointer'}}>
              <b style={{fontSize:14}}>{BREATH_PAT[k].name}</b><div style={{fontSize:11.5,opacity:.75}}>{BREATH_PAT[k].sub}</div>
            </button>
          ))}
        </div>
        <div style={{fontSize:12,opacity:.7,fontWeight:600,marginBottom:8,textAlign:'left'}}>Thời lượng</div>
        <div style={{display:'flex',gap:10,marginBottom:24}}>
          {[1,5,10].map(m=>(
            <button key={m} onClick={()=>setMins(m)} style={{...(mins===m?{background:'#eafaf8',color:'#0c2a2e'}:lightBtn),flex:1,padding:'14px',borderRadius:12,fontFamily:'Baloo 2',fontSize:18,fontWeight:700,cursor:'pointer'}}>{m}<span style={{fontSize:11,fontWeight:500,opacity:.7}}> phút</span></button>
          ))}
        </div>
        <button onClick={()=>{setElapsed(0);setScale(0.45);setPhase('run');}} style={{background:'#eafaf8',color:'#0c2a2e',padding:'14px 30px',borderRadius:30,fontWeight:700,border:0,cursor:'pointer',fontSize:15,width:'100%'}}><i className="ti ti-player-play"></i> Bắt đầu</button>
        <button onClick={onClose} style={{marginTop:16,background:'none',border:0,color:'rgba(255,255,255,.6)',fontSize:13,cursor:'pointer'}}>← Quay lại</button>
      </div>
    </div>
  );

  if(phase==='done') return (
    <div style={bg}>
      <div style={{margin:'auto',textAlign:'center',padding:24}}>
        <div style={{fontSize:52}}>🌸</div>
        <h1 style={{fontFamily:'Baloo 2',fontSize:24,margin:'8px 0'}}>Xong rồi, nhẹ hơn chưa?</h1>
        <p style={{opacity:.75,fontSize:13.5,marginBottom:20}}>Bạn vừa dành {mins} phút cho chính mình. Quay lại làm việc nhẹ nhàng nhé.</p>
        <button onClick={onClose} style={{background:'#eafaf8',color:'#0c2a2e',padding:'13px 30px',borderRadius:30,fontWeight:700,border:0,cursor:'pointer'}}>Quay lại làm việc</button>
      </div>
    </div>
  );

  return (
    <div style={bg}>
      <div style={{display:'flex',alignItems:'center',padding:'16px 20px'}}>
        <div style={{fontSize:12.5,opacity:.6,fontWeight:600,letterSpacing:'.04em'}}>🌿 NGHỈ & THỞ · {mm}:{ss}</div>
        <div style={{flex:1}}></div>
        <button onClick={()=>{onLog(Math.round(elapsed/60));onClose();}} style={{background:'none',border:0,color:'rgba(255,255,255,.55)',fontSize:22,cursor:'pointer',display:'flex'}}><i className="ti ti-x"></i></button>
      </div>
      <div style={{margin:'auto',textAlign:'center',padding:'10px 22px 40px',width:'100%'}}>
        <div style={{position:'relative',width:260,height:260,margin:'0 auto',display:'flex',alignItems:'center',justifyContent:'center'}}>
          <div style={{position:'absolute',width:260,height:260,borderRadius:'50%',background:'radial-gradient(circle,rgba(110,231,214,.28),rgba(110,231,214,.05))',transform:'scale('+scale+')',transition:'transform '+transDur+'s ease-in-out'}}></div>
          <div style={{position:'absolute',width:200,height:200,borderRadius:'50%',border:'2px solid rgba(234,250,248,.35)',transform:'scale('+scale+')',transition:'transform '+transDur+'s ease-in-out'}}></div>
          <div style={{position:'relative',textAlign:'center'}}>
            <div style={{fontFamily:'Baloo 2',fontSize:30,fontWeight:700}}>{lbl}</div>
            <div style={{fontSize:40,fontFamily:'Baloo 2',opacity:.85}}>{stepLeft}</div>
          </div>
        </div>
        <div style={{display:'flex',gap:10,justifyContent:'center',marginTop:32}}>
          <button onClick={()=>setPaused(p=>!p)} style={{background:'#eafaf8',color:'#0c2a2e',padding:'13px 26px',borderRadius:30,fontWeight:700,border:0,cursor:'pointer',display:'flex',alignItems:'center',gap:7}}><i className={'ti '+(paused?'ti-player-play':'ti-player-pause')}></i>{paused?'Tiếp tục':'Tạm dừng'}</button>
          <button onClick={()=>{onLog(Math.round(elapsed/60));setPhase('done');}} style={{...lightBtn,padding:'13px 20px',borderRadius:30,fontWeight:600,cursor:'pointer'}}>Kết thúc</button>
        </div>
        <div style={{marginTop:20,fontSize:12.5,opacity:.55}}>Theo vòng tròn: phình ra khi hít vào, co lại khi thở ra.</div>
        <div style={{marginTop:22}}><SoundBar/></div>
      </div>
    </div>
  );
}

/* ---------- Não khỏe: thói quen + năng lượng + nhắc nhịp ---------- */
const BRAIN_HABITS=[
  {id:'sleep',label:'Ngủ đủ 7h+',ic:'😴'},
  {id:'water',label:'Uống đủ nước',ic:'💧'},
  {id:'move',label:'Vận động / đi bộ',ic:'🚶'},
  {id:'sun',label:'Ra nắng buổi sáng',ic:'☀️'},
  {id:'nocaf',label:'Không caffeine buổi chiều',ic:'☕'},
  {id:'eat',label:'Ăn đủ chất, không bỏ bữa',ic:'🥗'},
];
const ENERGY=[{v:1,e:'😵',l:'Kiệt'},{v:2,e:'😴',l:'Mệt'},{v:3,e:'😐',l:'Bình thường'},{v:4,e:'🙂',l:'Khỏe'},{v:5,e:'🔥',l:'Sung'}];
function BrainEnergy({log,setLog,cfg,setCfg,onBreath}){
  const d=today();
  const day=log[d]||{habits:{},water:0};
  const setDay=(patch)=>setLog({...log,[d]:{...day,...patch}});
  const toggleH=(id)=>setDay({habits:{...day.habits,[id]:!day.habits[id]}});
  const setEnergy=(v)=>setDay({energy:v});
  const setWater=(n)=>setDay({water:Math.max(0,n)});
  const hDone=BRAIN_HABITS.filter(h=>day.habits&&day.habits[h.id]).length;
  // streak: số ngày liên tiếp (tính tới hôm nay/hôm qua) có ≥1 thói quen
  let streak=0, cur=new Date(d+'T00:00:00');
  const has=(ds)=>{const x=log[ds];return x&&((x.habits&&Object.values(x.habits).some(Boolean))||x.energy);};
  if(!has(d)) cur.setDate(cur.getDate()-1);
  while(has(dstr(cur))){ streak++; cur.setDate(cur.getDate()-1); }
  // 7 ngày
  const days7=[]; for(let i=6;i>=0;i--){ const ds=addDays(-i); const x=log[ds]; const c=x&&x.habits?Object.values(x.habits).filter(Boolean).length:0; days7.push({ds,c,lbl:['CN','T2','T3','T4','T5','T6','T7'][new Date(ds+'T00:00:00').getDay()]}); }
  const en=day.energy;
  const advice=!en?null : en<=2?{c:'var(--amber)',bg:'var(--amber-lt)',t:'Năng lượng thấp — làm việc nhẹ, chia nhỏ, và thở 5 phút. Để dành việc khó cho lúc khỏe hơn.'}
    : en===3?{c:'var(--blue)',bg:'var(--blue-lt)',t:'Ổn định — làm việc vừa sức, xen kẽ nghỉ ngắn theo nhịp.'}
    : {c:'var(--grn)',bg:'var(--grn-lt)',t:'Năng lượng cao — tấn công ngay việc khó nhất / "việc xương nhất" 🐸 khi não đang đỉnh!'};
  const cares=[['water','💧 Nhắc uống nước (mỗi 60′)'],['stand','🧍 Nhắc đứng dậy vận động (mỗi 50′)'],['eye','👀 Nhắc nghỉ mắt 20-20-20 (mỗi 20′)'],['caffeine','☕ Nhắc cắt caffeine (theo giờ)'],['taskReminder','⏰ Nhắc việc quá hạn / hôm nay (mỗi 45′)']];
  const [notifPerm,setNotifPerm]=useState(()=>('Notification' in window?Notification.permission:'unsupported'));
  const askNotif=()=>{ try{ Notification.requestPermission().then(p=>setNotifPerm(p)); }catch(e){} };
  return (
    <div>
      {/* Check-in năng lượng */}
      <div className="panel">
        <div className="panel-h"><i className="ti ti-bolt lead"></i><b>Năng lượng não hôm nay</b></div>
        <div className="panel-b" style={{padding:'16px 18px'}}>
          <div style={{display:'flex',gap:8,justifyContent:'space-between'}}>
            {ENERGY.map(x=>(
              <button key={x.v} onClick={()=>setEnergy(x.v)} style={{flex:1,padding:'10px 4px',borderRadius:12,border:'1.5px solid '+(en===x.v?'var(--o)':'var(--border)'),background:en===x.v?'var(--o-lt)':'var(--bg)',cursor:'pointer'}}>
                <div style={{fontSize:26}}>{x.e}</div><div style={{fontSize:11,fontWeight:600,color:en===x.v?'var(--o-dk)':'var(--muted)',marginTop:2}}>{x.l}</div>
              </button>
            ))}
          </div>
          {advice && <div style={{marginTop:14,padding:'12px 14px',borderRadius:12,background:advice.bg,color:advice.c,fontSize:13,fontWeight:500,display:'flex',gap:8,alignItems:'center'}}>
            <i className="ti ti-bulb" style={{fontSize:18}}></i><span style={{flex:1}}>{advice.t}</span>
            {en<=2 && <button className="btn sm" style={{flexShrink:0}} onClick={onBreath}>Thở 5′</button>}
          </div>}
        </div>
      </div>

      {/* Thói quen não khỏe */}
      <div className="panel">
        <div className="panel-h"><i className="ti ti-checklist lead"></i><b>Thói quen não khỏe</b>
          <div style={{flex:1}}></div>
          {streak>0 && <span className="streak"><i className="ti ti-flame"></i>{streak} ngày</span>}
        </div>
        <div className="panel-b" style={{padding:'12px 18px 16px'}}>
          <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:12}}>
            <div className="prog full" style={{flex:1,height:9}}><i style={{width:(hDone/BRAIN_HABITS.length*100)+'%'}}></i></div>
            <b style={{fontFamily:'Baloo 2',color:'var(--grn)',fontSize:14}}>{hDone}/{BRAIN_HABITS.length}</b>
          </div>
          {BRAIN_HABITS.map(h=>{const on=day.habits&&day.habits[h.id];return (
            <div key={h.id} className={'row'+(on?' done':'')} style={{padding:'9px 0'}} onClick={()=>toggleH(h.id)}>
              <span className={'chk'+(on?' done':'')}>{on&&<i className="ti ti-check"></i>}</span>
              <div className="rt" style={{cursor:'pointer'}}><b style={{fontWeight:500}}>{h.ic} {h.label}</b></div>
            </div>
          );})}
          {/* nước hôm nay */}
          <div style={{display:'flex',alignItems:'center',gap:10,marginTop:12,padding:'10px 12px',background:'var(--bg)',borderRadius:12}}>
            <span style={{fontSize:18}}>💧</span><b style={{flex:1,fontSize:13}}>Số ly nước hôm nay</b>
            <button className="btn ghost sm" onClick={()=>setWater((day.water||0)-1)}><i className="ti ti-minus"></i></button>
            <b style={{fontFamily:'Baloo 2',fontSize:18,minWidth:30,textAlign:'center'}}>{day.water||0}</b>
            <button className="btn ghost sm" onClick={()=>setWater((day.water||0)+1)}><i className="ti ti-plus"></i></button>
          </div>
          {/* 7 ngày */}
          <div style={{display:'flex',gap:6,marginTop:16}}>
            {days7.map((x,i)=>(
              <div key={i} style={{flex:1,textAlign:'center'}}>
                <div style={{height:30,borderRadius:7,background:x.c===0?'var(--bg)':'var(--grn-lt)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:11,fontWeight:700,color:x.c?'var(--grn)':'var(--muted2)',border:x.ds===d?'1.5px solid var(--o)':'1px solid var(--border)'}}>{x.c||''}</div>
                <div style={{fontSize:10,color:'var(--muted)',marginTop:3}}>{x.lbl}</div>
              </div>
            ))}
          </div>
        </div>
      </div>

      {/* Thông báo trình duyệt */}
      <div className="panel">
        <div className="panel-h"><i className="ti ti-bell-ringing lead"></i><b>Thông báo trình duyệt</b></div>
        <div className="panel-b" style={{padding:'12px 18px 16px'}}>
          {notifPerm==='unsupported' && <div style={{fontSize:13,color:'var(--muted)'}}>Trình duyệt này không hỗ trợ thông báo.</div>}
          {notifPerm==='granted' && <div style={{display:'flex',alignItems:'center',gap:8,fontSize:13,color:'var(--grn)',fontWeight:600}}><i className="ti ti-circle-check"></i>Đã bật — sẽ nhận nhắc dù đang ở tab khác (khi app còn mở/chạy nền).</div>}
          {notifPerm==='denied' && <div style={{fontSize:13,color:'var(--muted)'}}>Thông báo đang bị chặn. Vào cài đặt trình duyệt cho site này → cho phép Thông báo, rồi tải lại trang.</div>}
          {notifPerm==='default' && <>
            <div style={{fontSize:13,color:'var(--muted)',marginBottom:10}}>Bật để nhận nhắc việc/chăm sóc ngay cả khi đang lướt tab khác (app cần vẫn đang mở).</div>
            <button className="btn sm" onClick={askNotif}><i className="ti ti-bell-plus"></i>Bật thông báo</button>
          </>}
        </div>
      </div>

      {/* Nhắc nhịp chăm sóc */}
      <div className="panel">
        <div className="panel-h"><i className="ti ti-bell lead"></i><b>Nhắc nhịp chăm sóc</b><span style={{marginLeft:'auto',fontSize:11.5,color:'var(--muted2)'}}>khi app đang mở</span></div>
        <div className="panel-b" style={{padding:'8px 18px 16px'}}>
          {cares.map(([k,lbl])=>(
            <div key={k} className="row" style={{padding:'11px 0'}} onClick={()=>setCfg({...cfg,[k]:!cfg[k]})}>
              <div className="rt"><b style={{fontWeight:500,fontSize:13.5}}>{lbl}</b></div>
              <div style={{width:44,height:25,borderRadius:13,background:cfg[k]?'var(--grn)':'var(--border2)',position:'relative',transition:'background .15s',flexShrink:0}}>
                <div style={{position:'absolute',top:2,left:cfg[k]?22:2,width:21,height:21,borderRadius:'50%',background:'#fff',transition:'left .15s',boxShadow:'0 1px 3px rgba(0,0,0,.3)'}}></div>
              </div>
            </div>
          ))}
          {cfg.caffeine &&
            <div style={{display:'flex',alignItems:'center',gap:8,marginTop:8,fontSize:13,color:'var(--muted)'}}>
              Giờ cắt caffeine:
              <input type="number" min="10" max="20" value={cfg.caffeineHour||14} onChange={e=>setCfg({...cfg,caffeineHour:+e.target.value})} style={{...selSt,width:64,padding:'6px 8px'}}/> giờ
            </div>}
        </div>
      </div>
    </div>
  );
}

/* ---------- Kiến thức kinh doanh ---------- */
const KNOWLEDGE=[
 {id:'fin',name:'Dòng tiền & Tài chính',ic:'💵',color:'#16a34a',bg:'#dcfce7',lessons:[
   {id:'fin1',t:'Dòng tiền ≠ Lợi nhuận',min:2,body:['Lợi nhuận là con số trên sổ; dòng tiền là tiền THẬT trong két.','Bạn có thể lãi nhưng hết tiền mặt vì vốn kẹt trong hàng tồn & công nợ.','Cửa hàng chết vì hết tiền mặt, không phải vì hết lãi.'],a:'Mỗi tuần ghi "tiền mặt còn lại" vào Sổ KD — đừng để tồn kho nuốt hết tiền.'},
   {id:'fin2',t:'Điểm hòa vốn — con số sống còn',min:2,body:['Là mức doanh thu vừa đủ bù mọi chi phí, chưa lãi chưa lỗ.','Dưới mức này là đang đốt tiền; trên mức này mới có lãi.'],f:'Hòa vốn = Chi phí cố định ÷ Biên lợi nhuận gộp (%)',a:'CP cố định 230tr, biên 13,5% → hòa vốn ≈ 1,7 tỷ/tháng. Suy ra mục tiêu doanh thu/ngày.'},
   {id:'fin3',t:'Biên gộp & biên ròng',min:2,body:['Biên gộp = (Giá bán − Giá vốn) ÷ Giá bán — đo sức kiếm lời của hàng.','Biên ròng = lãi sau khi trừ HẾT chi phí (lương, mặt bằng, ads…).','Biên gộp cao chưa chắc lãi ròng nếu bán chậm / chi phí lớn.'],a:'Biết biên gộp từng nhóm hàng để đẩy nhóm lãi thật, bớt nhóm "doanh thu ảo".'},
   {id:'fin4',t:'Vòng quay vốn & quỹ "oxy"',min:2,body:['Tiền phải chạy: nhập → bán → thu → nhập lại. Quay nhanh, 1 đồng vốn đẻ nhiều lãi.','Tồn nằm lâu = tiền chết.','Giữ "quỹ oxy" ≥ 1 tháng chi phí bằng tiền mặt, không đụng vào nhập hàng.'],a:'Năm xấu: ưu tiên quay vòng nhanh hơn là ôm nhiều hàng.'},
 ]},
 {id:'price',name:'Định giá & Lợi nhuận',ic:'🏷️',color:'#f97316',bg:'#fff7ed',lessons:[
   {id:'pr1',t:'Markup vs Margin — đừng nhầm',min:2,body:['Markup = lãi so với GIÁ VỐN. Margin = lãi so với GIÁ BÁN.','Nhầm là tưởng lãi nhiều mà thực ra mỏng.'],f:'Margin = Markup ÷ (1 + Markup). VD markup 50% → margin chỉ 33%.',a:'Khi tính lời, luôn quy về margin trên giá bán để không ảo tưởng.'},
   {id:'pr2',t:'3 cách định giá',min:2,body:['Theo chi phí: giá vốn + mức lãi (an toàn nhưng dễ bỏ lỡ giá trị).','Theo thị trường: nhìn đối thủ (dễ vào cuộc đua giá).','Theo giá trị: khách sẵn trả bao nhiêu cho lợi ích họ nhận.'],a:'Hàng thiết yếu (bỉm/sữa) bám giá thị trường; hàng tư vấn/combo định theo giá trị để nâng biên.'},
   {id:'pr3',t:'Hàng dẫn khách vs hàng tạo lãi',min:2,body:['Hàng dẫn khách (bỉm, sữa phổ thông): biên mỏng nhưng kéo khách đến đều.','Hàng tạo lãi (vitamin, phụ kiện, combo): biên cao, cần tư vấn để bán kèm.'],a:'Đừng kỳ vọng lãi ở hàng dẫn khách — kiếm lời ở hàng bán kèm.'},
   {id:'pr4',t:'Combo & upsell',min:2,body:['Combo giúp khách tiện + tiết kiệm, đồng thời nâng giá trị đơn và biên.','Upsell = gợi loại tốt hơn; cross-sell = gợi món đi kèm.','Combo phải THỰC DỤNG, không nhồi cho to bill.'],a:'"Giỏ đồ đi sinh", combo ăn dặm theo tháng tuổi bé.'},
 ]},
 {id:'inv',name:'Quản lý tồn kho',ic:'📦',color:'#7c3aed',bg:'#ede9fe',lessons:[
   {id:'inv1',t:'Vòng quay tồn kho',min:2,body:['Đo số lần bán hết & nhập lại trong kỳ. Quay nhanh = vốn khỏe.','Hàng >60 ngày là cảnh báo giam vốn.'],f:'Vòng quay = Giá vốn hàng bán ÷ Tồn kho trung bình',a:'Theo dõi mã quay chậm; hàng >60 ngày phải có kế hoạch xả.'},
   {id:'inv2',t:'Phân loại ABC',min:2,body:['A: ~20% mã tạo ~80% doanh thu — chăm kỹ, không để hết hàng.','B: mức trung bình. C: nhiều mã nhưng đóng góp ít — giữ gọn nhẹ.'],a:'Dồn vốn & chú ý nhóm A; cắt bớt nhóm C nhập theo cảm tính.'},
   {id:'inv3',t:'Cận date & nguyên tắc FEFO',min:2,body:['FEFO = hàng hết hạn trước thì bán trước (quan trọng với sữa, ăn dặm).','Đặt ngưỡng xả sớm TRƯỚC khi cận date, đừng chờ sát hạn.'],a:'Chia tồn theo tuổi hàng; cận date → đẩy combo/giảm giá có kiểm soát.'},
 ]},
 {id:'cus',name:'Khách hàng & Giữ chân',ic:'❤️',color:'#db2777',bg:'#fce7f3',lessons:[
   {id:'cus1',t:'Giá trị trọn đời khách (CLV)',min:2,body:['Một khách mẹ bỉm mua lại hàng chục lần/năm trong 2–3 năm.','Giá trị thật không nằm ở 1 đơn, mà ở cả vòng đời mua hàng.'],f:'CLV ≈ Giá trị đơn TB × Số lần mua/năm × Số năm gắn bó',a:'Đầu tư chăm khách thân — đó là lợi nhuận bền nhất.'},
   {id:'cus2',t:'Chi phí có khách (CAC)',min:2,body:['CAC = tổng chi marketing ÷ số khách mới có được.','Nếu CAC > lãi từ khách đó → đang mua khách lỗ.'],a:'So CAC với CLV; mẹ&bé CLV cao nên đầu tư có khách rồi GIỮ là đáng.'},
   {id:'cus3',t:'Phân nhóm khách RFM',min:2,body:['R (mua gần đây), F (tần suất), M (giá trị) — chấm khách theo 3 chiều.','Khách mua gần đây + thường xuyên + chi nhiều = nhóm vàng.'],a:'Trên Zalo, gắn nhãn nhóm để nhắc mua lại & ưu đãi đúng người.'},
   {id:'cus4',t:'Giữ khách rẻ hơn tìm khách mới',min:2,body:['Có khách mới tốn gấp nhiều lần giữ khách cũ.','Tăng nhẹ tỷ lệ giữ chân có thể tăng lợi nhuận đáng kể.'],a:'Nhắc mua lại đúng chu kỳ, chăm theo tuổi bé thay vì chỉ chạy ads.'},
 ]},
 {id:'mkt',name:'Marketing thực dụng',ic:'📣',color:'#2563eb',bg:'#dbeafe',lessons:[
   {id:'mkt1',t:'Phễu khách hàng',min:2,body:['Biết → Thích → Tin → Mua → Quay lại. Mỗi tầng rơi rớt bớt.','Đừng chỉ lo "có đơn", phải lấy thông tin (Zalo) để chăm tiếp.'],a:'Nội dung kiến thức xây "Tin"; Zalo OA lo "Quay lại".'},
   {id:'mkt2',t:'ROAS — quảng cáo có lời không',min:2,body:['ROAS đo doanh thu thu về trên mỗi đồng quảng cáo.','ROAS phải đủ cao để bù biên mỏng + chi phí khác, nếu không vẫn lỗ.'],f:'ROAS = Doanh thu từ ads ÷ Chi phí ads',a:'Mỗi chiến dịch ghi chi/đơn/lãi & khách có quay lại không — đừng chạy "hy vọng".'},
   {id:'mkt3',t:'Thương hiệu nhỏ thắng ở đâu',min:2,body:['Không đua giá với chuỗi lớn.','Thắng bằng: tư vấn thật, nhớ khách, giao nhanh khu vực, niềm tin.'],a:'Với mẹ&bé, NIỀM TIN & tư vấn đúng quan trọng hơn rẻ vài nghìn.'},
 ]},
 {id:'mind',name:'Tư duy chủ shop',ic:'🧭',color:'#0891b2',bg:'#cffafe',lessons:[
   {id:'mind1',t:'Quản trị bằng số, không bằng cảm giác',min:2,body:['"Cái gì đo được mới quản được."','Quyết định bằng dữ liệu thật, không bằng cảm giác.'],a:'Dùng Sổ KD & Thống kê hằng tuần thay vì đoán.'},
   {id:'mind2',t:'Gấp vs Quan trọng (ma trận Eisenhower)',min:2,body:['Quan trọng + gấp: làm ngay.','Quan trọng + không gấp: LÊN LỊCH (quyết định tương lai, dễ bị bỏ quên).','Gấp + không quan trọng: giao bớt. Không gì cả: bỏ.'],a:'Việc "xây hệ thống, chăm khách thân" là quan trọng-không-gấp — đừng để việc vặt nuốt hết.'},
   {id:'mind3',t:'Quản trị rủi ro & năm xấu',min:2,body:['Chuẩn bị kịch bản TRƯỚC khi xấu xảy ra (DT giảm 10/20/30%).','Năm tốt doanh thu cứu bạn; năm xấu DÒNG TIỀN cứu bạn.'],a:'Giữ quỹ oxy, giảm tồn chậm, giữ khách thân — đã có trong kế hoạch phòng thủ.'},
 ]},
 {id:'law',name:'Thuế & Pháp lý hộ KD',ic:'🧾',color:'#0d9488',bg:'#ccfbf1',tag:'CẬP NHẬT 7/2026',lessons:[
   {id:'law1',t:'Bỏ thuế khoán — hộ KD kê khai thực từ 2026',min:3,body:['Từ 2026 bỏ thuế khoán, toàn bộ hộ kinh doanh chuyển sang KÊ KHAI theo doanh thu thực + sổ sách.','Ngành phân phối hàng hoá nộp 1% GTGT + 0,5% TNCN = 1,5% TRÊN DOANH THU — không tính theo lãi, không phụ thuộc hoá đơn đầu vào.','Doanh thu ≤ 200 triệu/năm được miễn GTGT và TNCN (nâng từ 100 triệu, áp dụng 01/01/2026).','Lệ phí môn bài đã bãi bỏ từ 01/01/2026 (Nghị quyết 198/2025/QH15).'],f:'Thuế phải nộp ≈ Doanh thu × 1,5%',a:'Vì nộp trên doanh thu, hàng thiếu hoá đơn đầu vào cũng không làm tăng thuế — đổi lấy rủi ro pháp lý để giấu doanh thu là lỗ.'},
   {id:'law2',t:'Hoá đơn điện tử từ máy tính tiền',min:2,body:['Bán lẻ trực tiếp cho người tiêu dùng bắt buộc dùng HOÁ ĐƠN ĐIỆN TỬ khởi tạo từ máy tính tiền, kết nối cơ quan thuế.','Phần mềm bán hàng (KiotViet/Sapo…) thường tích hợp sẵn.','Kèm theo: chữ ký số + mẫu 01/ĐKTĐ-HĐĐT + tài khoản ngân hàng đứng tên hộ, đăng ký với thuế.'],a:'Bật HĐĐT ngay trên KiotViet — vừa quản lý vừa đúng luật, đỡ làm tay.'},
   {id:'law5',t:'Hộ kinh doanh hay công ty — ở mức 3 tỷ',min:3,body:['HKD ở mức 3 tỷ: 1% GTGT (30tr) + 0,5% TNCN (15tr), sổ TT88 tự làm được → khoảng 45tr/năm.','Công ty TNHH: 10% GTGT trên giá trị gia tăng + 15% thuế TNDN + thuê kế toán 36–72tr/năm → khoảng 120–180tr/năm.','Điểm quyết định: hàng mẹ&bé đầu vào thường thiếu hoá đơn. Công ty không có hoá đơn đầu vào thì không được khấu trừ VAT và không được tính chi phí → thuế vọt lên gấp mấy lần.'],a:'Ở quy mô hiện tại chọn HKD. Chỉ lên công ty khi cần xuất hoá đơn VAT cho khách sỉ/đại lý, gọi vốn, hoặc mở chuỗi.'},
   {id:'law6',t:'Bốn thứ quản lý thị trường soi nhiều nhất',min:3,body:['1. Hoá đơn chứng từ nguồn gốc hàng — rủi ro số 1, lớn hơn thuế nhiều. Hàng không chứng từ bị coi là nhập lậu: tịch thu + phạt theo giá trị lô.','2. Dấu hợp quy CR trên đồ chơi trẻ em (QCVN 3:2019/BKHCN).','3. Niêm yết giá đầy đủ — sữa cho trẻ dưới 6 tuổi thuộc danh mục bình ổn giá.','4. Quảng cáo: cấm tuyệt đối quảng cáo sữa thay thế sữa mẹ cho trẻ dưới 24 tháng, bình bú và núm vú giả (NĐ 100/2014).'],a:'Ba lỗi sau sửa gần như miễn phí trong một buổi. Lỗi đầu mới là việc dài hạn — xem tab Nguồn hàng.'},
   {id:'law7',t:'Mỗi người chỉ đứng tên được 1 hộ kinh doanh',min:2,body:['Một cá nhân chỉ được đứng tên 1 HKD trên toàn quốc. Hộ thứ hai phải để người khác đứng tên, và người đó là chủ thật về pháp lý, chịu trách nhiệm vô hạn bằng tài sản riêng.','Hai HKD cùng địa điểm, cùng ngành, cùng kho, cùng nhân viên bị xác định là chia tách nhân tạo → cơ quan thuế GỘP doanh thu lại tính, cộng phạt.'],a:'Hai hộ 114 và Đỗ Quang phải tách thật: địa điểm riêng, kho riêng, hợp đồng riêng, nhân viên riêng — nếu không thì đừng tách.'},
   {id:'law8',t:'Thủ tục mở hộ kinh doanh mới',min:3,body:['Hồ sơ: giấy đề nghị đăng ký (Phụ lục III-1) + bản sao CCCD chủ hộ + hợp đồng thuê địa điểm/giấy tờ nhà.','Nộp tại bộ phận một cửa UBND cấp xã/phường nơi đặt địa điểm (từ 01/07/2025 bỏ cấp huyện), hoặc online tại dangkykinhdoanh.gov.vn. Xử lý 3 ngày làm việc, lệ phí khoảng 100.000đ.','Mã ngành nên đăng ký rộng ngay: 4719, 4722, 4772, 4771, 4764, 4759, 4791 (bán lẻ qua internet).','Căn hộ chung cư để ở KHÔNG đăng ký kinh doanh được.','Sau khi có giấy chứng nhận: mã số thuế (dùng số định danh cá nhân) → chữ ký số + HĐĐT → máy tính tiền → tài khoản ngân hàng đứng tên hộ → sổ TT88 → kê khai quý.'],a:'Phần tốn thời gian nằm ở sau khi có giấy phép, không phải ở khâu đăng ký.'},
   {id:'law3',t:'ATTP & nhãn mác hàng mẹ&bé',min:3,body:['Sữa, thực phẩm ăn dặm, TPCN cần công bố/đủ điều kiện ATTP.','Hàng nhập khẩu phải có TEM NHÃN PHỤ tiếng Việt, nguồn gốc, hạn dùng rõ ràng.','Giữ hóa đơn/chứng từ nhập để chứng minh hàng chính hãng.'],a:'Tránh nhập hàng trôi nổi không giấy tờ — rủi ro phạt & mất niềm tin khách.'},
   {id:'law4',t:'Chính sách đổi trả & quyền lợi khách',min:2,body:['Chính sách đổi trả rõ ràng, công khai làm khách yên tâm mua.','Bán đúng hàng chính hãng, tư vấn trung thực, không nhập nhèm thông tin.'],a:'Niềm tin là lợi thế cạnh tranh lớn nhất của shop mẹ&bé.'},
 ]},
 {id:'src',name:'Chứng từ & Nguồn hàng',ic:'📑',color:'#b45309',bg:'#fef3c7',tag:'MỚI 7/2026',lessons:[
   {id:'src1',t:'Ba loại giấy duy nhất có giá trị khi bị kiểm tra',min:2,body:['Lời cam kết "hàng chính hãng" của nhà cung cấp không có giá trị pháp lý nào.','Chỉ ba thứ này chứng minh được nguồn gốc: hoá đơn điện tử hợp lệ · giấy công bố sản phẩm · tờ khai hải quan của lô hàng.','Thêm một chứng cứ mạnh nữa: chứng từ chuyển khoản từ tài khoản đứng tên hộ kinh doanh.'],a:'Mỗi lô hàng nhập về đều phải đủ bộ này rồi mới cho lên kệ. Quy trình chi tiết ở Sổ tay → Quy trình nhận hàng đủ chứng từ.'},
   {id:'src2',t:'Hàng xách tay không hợp thức hoá được',min:3,body:['Hàng nhập khẩu không có tờ khai hải quan, chưa nộp thuế nhập khẩu và VAT khâu nhập là hàng nhập lậu (NĐ 98/2020).','Không tồn tại thủ tục nào biến nó thành hợp pháp sau khi đã vào Việt Nam ngoài luồng. Bảng kê mua của cá nhân, hợp đồng với người xách về, hoá đơn nội địa mua đi bán lại đều không phải chứng từ nhập khẩu.','Ba lớp rủi ro cộng dồn với hàng mẹ&bé: tịch thu + phạt theo giá trị lô · vi phạm ATTP nếu chưa công bố sản phẩm · hàng cho trẻ em thuộc nhóm tình tiết tăng nặng.','Có cửa hàng, biển hiệu, địa chỉ đăng ký mà bày hàng xách tay trên kệ thì rủi ro TĂNG so với bán chui.'],a:'Ba lối ra: mua từ nhà nhập khẩu chính thức · tự nhập chính ngạch nếu sản lượng đủ · hoặc bỏ dòng hàng.'},
   {id:'src3',t:'Nhập khẩu chính ngạch cần bộ hồ sơ gì',min:2,body:['Tờ khai hải quan, hợp đồng ngoại thương, invoice, packing list, vận đơn.','Chứng từ nộp thuế nhập khẩu + VAT khâu nhập khẩu; C/O nếu muốn ưu đãi thuế.','Với thực phẩm: kiểm tra nhà nước về ATTP tại cửa khẩu.','Công bố sản phẩm TRƯỚC khi bán — tự công bố với thực phẩm thường; đăng ký bản công bố tại Cục ATTP với sản phẩm cho trẻ dưới 36 tháng và thực phẩm dinh dưỡng y học.'],a:'Chỉ đáng làm khi sản lượng một mã đủ lớn để gánh chi phí công bố và thông quan.'},
   {id:'src4',t:'Nhận diện nhà phân phối thật',min:2,body:['Nhiều website tự xưng "nhà phân phối chính hãng" thực chất là hộ bán lẻ tự dựng web mang tên thương hiệu.','Cách kiểm: xin tên pháp nhân + mã số thuế rồi đối chiếu trên masothue.com trước khi đặt cọc.','Nhà cung cấp đòi cộng thêm 5–10% "để xuất hoá đơn" nghĩa là họ đang giấu doanh thu — đàm phán lại giá gốc hoặc đổi nguồn.'],a:'Danh sách 24 nhà phân phối đã tra và xác minh nằm ở tab Nguồn hàng, kèm mã số thuế và mức độ xác minh từng dòng.'},
 ]},
 {id:'hr',name:'Nhân sự & Đội nhóm',ic:'👥',color:'#ea580c',bg:'#ffedd5',lessons:[
   {id:'hr1',t:'Tuyển đúng người',min:2,body:['Với cửa hàng nhỏ: THÁI ĐỘ & sự tin cậy quan trọng hơn kỹ năng (kỹ năng dạy được).','Thử việc rõ ràng: kỳ vọng, tiêu chí đánh giá cụ thể.'],a:'Tuyển người chịu học chốt Zalo, chăm khách, kiểm kho — không chỉ đứng bán.'},
   {id:'hr2',t:'Đào tạo bằng SOP & đa năng',min:2,body:['Có quy trình chuẩn (SOP) thì người mới vào việc nhanh, ít sai.','1 nhân viên đa năng = bán + chốt Zalo + kiểm kho + gợi ý combo.'],a:'Dùng Sổ tay → mục Quy trình làm tài liệu đào tạo cho nhân viên mới.'},
   {id:'hr3',t:'Lương + thưởng theo kết quả',min:2,body:['Lương cứng giữ thấp hợp lý; thưởng gắn với doanh số, đơn chốt, khách quay lại.','Thưởng đúng việc tạo ra tiền → nhân viên chủ động hơn.'],a:'VD thưởng theo số đơn chốt qua Zalo / combo bán thêm.'},
   {id:'hr4',t:'Giữ người giỏi',min:2,body:['Người giỏi rời đi vì môi trường & sự ghi nhận, không chỉ vì lương.','Ghi nhận công khai, lộ trình rõ, đối xử công bằng.'],a:'Giữ được 1 nhân viên cứng = đỡ tốn tuyển + đào tạo lại nhiều lần.'},
 ]},
 {id:'omni',name:'Bán hàng đa kênh',ic:'🛒',color:'#9333ea',bg:'#f3e8ff',lessons:[
   {id:'omni1',t:'Mỗi kênh một vai trò',min:2,body:['TikTok/Facebook: khám phá, kéo khách mới.','Shopee/TikTok Shop: chốt đơn, tiếp cận người săn hàng.','Zalo OA + cửa hàng: giữ chân, bán lại, tư vấn sâu.'],a:'Đừng dồn mọi kỳ vọng vào 1 kênh — phối hợp theo đúng vai trò.'},
   {id:'omni2',t:'Đồng bộ tồn kho & đơn về 1 nơi',min:2,body:['Bán nhiều kênh dễ bán trùng / hết hàng mà không biết.','Một phần mềm hợp nhất tồn + đơn từ mọi kênh → số liệu sạch.'],a:'Đây cũng là điều kiện để AI & báo cáo hoạt động chính xác.'},
   {id:'omni3',t:'Trải nghiệm nhất quán',min:2,body:['Giá, thông tin, chăm sóc nên đồng nhất giữa các kênh.','Khách thấy lệch giá/thông tin sẽ mất tin tưởng.'],a:'Thống nhất bảng giá & kịch bản tư vấn dùng chung mọi kênh.'},
 ]},
 {id:'ai',name:'AI cho Hương Diện',ic:'🤖',color:'#4f46e5',bg:'#e0e7ff',tag:'CẬP NHẬT 6/2026',lessons:[
   {id:'ai1',t:'Bộ công cụ AI nền tảng',min:3,body:['Nội dung & phân tích: ChatGPT / Claude (viết bài, caption, phân tích doanh thu).','Ảnh: Google Gemini (Nano Banana), Canva Magic Studio (banner, tách nền).','Video & giọng: CapCut + Heygen (avatar ảo) + ElevenLabs/Vbee (giọng Việt).'],a:'1 tài khoản ChatGPT/Claude + Canva lo ~80% nội dung, chi phí gần 0.'},
   {id:'ai2',t:'AI Agent bán hàng (xu hướng 2026)',min:3,body:['Khác chatbot cũ: "nhân viên AI" tự tư vấn theo tháng tuổi bé, gửi catalog, hướng dẫn thanh toán, gửi ZNS.','Ví dụ BanHang.AI gắn vào Zalo OA — trả lời tức thì 24/7.','70–80% câu hỏi mẹ bỉm lặp lại (size, giá, còn hàng) → để AI lọc trước.'],a:'Để AI chốt đơn cơ bản & lọc câu hỏi; người chỉ xử lý ca khó. Tiết kiệm nhân sự nhất.'},
   {id:'ai3',t:'AI Smart Listing & ảnh sản phẩm',min:2,body:['Sàn (Shopee/Lazada/TikTok Shop) có AI tự tối ưu tiêu đề chuẩn SEO, mô tả, đổi nền/tạo ảnh.','Đăng sản phẩm nhanh, ảnh đẹp mà không cần studio.'],a:'Tận dụng AI của sàn để lên hàng nhanh & dễ được tìm thấy.'},
   {id:'ai4',t:'Tìm kiếm bằng giọng nói & hình ảnh',min:2,body:['Khách ngày càng tìm sản phẩm bằng ảnh chụp / giọng nói.','AI sàn "đọc" tên + mô tả + ảnh để gợi ý hàng của bạn.'],a:'Đặt tên rõ ràng, mô tả đủ từ khoá, ảnh sạch để AI hiểu & đẩy hàng mình.'},
   {id:'ai5',t:'AI phân tích & dự báo nhập hàng',min:2,body:['Metric.vn: xem ngành hàng mẹ&bé bán chạy trên Shopee/TikTok Shop.','Công cụ analytics AI dự báo nhu cầu theo mùa, gợi ý giá & lượng nhập.'],a:'Nhập đúng hàng đúng mùa, đúng nhóm tháng tuổi bé — bớt tồn, bớt hết hàng.'},
   {id:'ai6',t:'Marketing & nhắc mua lại tự động',min:2,body:['Meta Advantage+ / TikTok Smart+: AI tự tối ưu ads, tìm tệp giống khách đã mua.','Zalo ZNS + CRM: tự nhắc mua lại đúng chu kỳ (bỉm/sữa hết sau 3–4 tuần).'],a:'"Mỏ vàng" giữ chân: tự động nhắc đổi size & mua lại — doanh thu lặp lại bền.'},
   {id:'ai8',t:'AI tạo VIDEO sản phẩm từ chữ (2026)',min:3,body:['Google Veo 3.1: video 4K tự kèm tiếng/âm thanh. Kling 3.0: video tới ~2 phút, giá rẻ.','InVideo AI: "studio tự động" — từ 1 prompt ra cả kịch bản, cảnh, lồng tiếng, phụ đề.','HeyGen: avatar ảo + dịch & lip-sync 175 ngôn ngữ (làm video không lộ mặt).','Lưu ý: OpenAI đang đóng Sora — chuyển dùng Veo/Kling/InVideo.'],a:'Làm video quảng cáo/giới thiệu sản phẩm không cần quay, không lộ mặt, không thuê KOL.'},
   {id:'ai9',t:'AI Agent điều phối & tự động hóa quy trình',min:3,body:['Khác trợ lý hỏi-đáp: AI agent tự CHẠY chuỗi việc nhiều bước (Manus…).','n8n / Make + AI: nối Zalo → bảng tính → nhắc tự động mà không thao tác tay.'],a:'Tự động hóa luồng: đơn mới → ghi sổ → hẹn nhắc mua lại, đỡ tốn người.'},
   {id:'ai10',t:'AI nghiên cứu sâu (deep research)',min:2,body:['Chế độ research của Claude/ChatGPT tự khảo sát nhiều nguồn, có trích dẫn.','Khảo sát NCC, đối thủ, xu hướng sản phẩm, mặt bằng giá.'],a:'Trước khi nhập dòng hàng mới, cho AI nghiên cứu thị trường + giá để quyết cho chắc.'},
   {id:'ai11',t:'Cá nhân hóa & gợi ý sản phẩm',min:2,body:['AI gợi ý sản phẩm theo lịch sử mua & tháng tuổi bé của từng khách.','Gợi ý đúng nhu cầu → tăng tỷ lệ mua & giá trị mỗi đơn.'],a:'Trên Zalo/web: gợi combo theo giai đoạn của bé thay vì gửi đại trà.'},
   {id:'ai7',t:'Lưu ý khi dùng AI',min:2,body:['AI chỉ tốt khi DỮ LIỆU SẠCH & TẬP TRUNG → gom đơn vào 1 phần mềm trước.','Luôn kiểm chứng nội dung AI, nhất là thông tin sản phẩm mẹ&bé nhạy cảm.','AI thay đổi rất nhanh — định kỳ cập nhật công cụ mới.'],a:'Đừng để AI tự đăng thông tin y tế/giá chưa kiểm. Người vẫn là người quyết định cuối.'},
 ]},
];

     được cấp quyền đọc tin, thì mã đọc tin người dùng vừa gõ KHÔNG bao giờ được thử — màn
     hình đòi nhập mã ngay sau khi vừa nhập mã xong, và không có cách nào thoát. */
  maUngVien(ma){
    let a=[]; try{ a=[ma,localStorage.getItem('hdw.synccode'),localStorage.getItem('hdw.tincode')]; }catch(e){ a=[ma]; }
    return a.filter((x,i)=>x&&a.indexOf(x)===i);
  },
  async tai(ma){
    const ds=this.maUngVien(ma);
    this.daGoi=true; this.dangTai=true; this.err=''; this.bao();
    if(!ds.length){ this.err='chua-co-ma'; this.dangTai=false; this.bao(); return; }
    let loiCuoi='';
    for(const m of ds){
      try{
        const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('hdw:'+m));
        const id=Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
        const r=await fetch(SB_URL+'/functions/v1/hdw-tin',{method:'POST',headers:{'Content-Type':'application/json','apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY},body:JSON.stringify({viec:'doc',sync_id:id,so_ngay:21})});
        const j=await r.json();
        if(r.ok){ this.ds=j.ban_tin||[]; this.err=''; this.dangTai=false; this.bao(); return; }
        loiCuoi=j.loi||('Không tải được bản tin (mã '+r.status+')');
      }catch(e){ loiCuoi='Không kết nối được. Kiểm tra mạng rồi thử lại.'; }
    }
    this.err=loiCuoi; this.dangTai=false; this.bao();
  },
  /* Mọi mục của một phần, đã kèm ngày và khoá riêng. Khoá lấy theo URL khi có: chỉ số trong
     mảng đổi mỗi lần bản tin được ghi đè, mà khoá đổi thì dấu "đã đọc" và mục đã lưu trỏ
     sang mục khác — cùng lỗi neo-theo-chỉ-số đã vấp ở bảng ánh xạ tên hàng. */
  /* "Đã đọc" và "đã lưu" cũng nằm trong kho dùng chung, không nằm trong state của tab.
     Bản đầu để chúng trong `useState` của TinKD, và badge trên menu đọc từ localStorage lúc
     App vẽ — nên đọc xong một mục thì chấm cam biến mất mà con số trên menu vẫn y nguyên
     cho tới lần vẽ sau. Một con số không nhúc nhích khi vừa làm đúng việc nó đòi là con số
     người dùng thôi tin. */
  daDoc(){ if(!this._dd) this._dd=store.get('hdw.docDaDoc',{}); return this._dd; },
  luu(){ if(!this._lu) this._lu=store.get('hdw.docLuu',{}); return this._lu; },
  ghiDoc(k){ const n={...this.daDoc(),[k]:1}; this._dd=n; store.set('hdw.docDaDoc',n); this.bao(); },
  doiLuu(m){ const n={...this.luu()}; if(n[m._k]) delete n[m._k]; else n[m._k]=m; this._lu=n; store.set('hdw.docLuu',n); this.bao(); },
  muc(phan){
    const ra=[];
    (this.ds||[]).forEach(ngay=>{
      const ds=phan==='hd'?(ngay.muc_hd||[]):(((ngay.muc_them||{})[phan])||[]);
      (Array.isArray(ds)?ds:[ds]).forEach((m,i)=>{
        if(m&&Object.keys(m).length) ra.push({...m,_ngay:ngay.ngay,_phan:phan,
          _k:phan+'#'+(m.url||(ngay.ngay+'#'+i))});
      });
    });
    return ra;
  },
};
function useKhoTin(){
  const [,ve]=useReducer(x=>x+1,0);
  useEffect(()=>{ KhoTin.subs.add(ve); if(!KhoTin.daGoi) KhoTin.tai(); return ()=>KhoTin.subs.delete(ve); },[]);
  return KhoTin;
}

const MAU_MUC={cao:{n:'Cần làm sớm',bg:'#fee2e2',ch:'#991b1b'},vua:{n:'Nên chuẩn bị',bg:'#fef3c7',ch:'#92400e'},thap:{n:'Biết để đó',bg:'var(--bg)',ch:'var(--muted)'}};

/* Một mục tin. Bấm vào tiêu đề là mở ra VÀ đánh dấu đã đọc — không có nút "đánh dấu đã đọc"
   riêng: thêm một nút cho việc mà hành động mở đã nói rõ là bắt người dùng làm hai lần. */
function MucDoc({m,cot,mo,doiMo,daDoc,luu,doiLuu,onTaoViec}){
  const mau=MAU_MUC[m.muc_do]||MAU_MUC.thap, dang=!!mo, daLuu=!!luu;
  return (
    <div style={{border:'1px solid var(--border)',borderRadius:12,padding:'12px 14px',marginBottom:9,background:'var(--card,transparent)'}}>
      <div className="row" style={{gap:8,alignItems:'flex-start',cursor:'pointer'}} onClick={doiMo}>
        {!daDoc&&<span title="Chưa đọc" style={{width:7,height:7,borderRadius:99,background:'var(--o,#f97316)',marginTop:6,flex:'0 0 auto'}}></span>}
        <div className="rt" style={{flex:1}}>
          <b style={{fontWeight:daDoc?550:700,fontSize:14,lineHeight:1.45,display:'block',color:'var(--ink)'}}>{m.tieu_de}</b>
          <small style={{color:'var(--muted2)'}}>{m.bao}{m._ngay?' · '+m._ngay.split('-').reverse().join('/'):''}</small>
        </div>
        {m.muc_do&&<span style={{fontSize:11,fontWeight:700,padding:'3px 8px',borderRadius:99,background:mau.bg,color:mau.ch,whiteSpace:'nowrap'}}>{mau.n}</span>}
        <i className={'ti '+(dang?'ti-chevron-up':'ti-chevron-down')} style={{color:'var(--muted2)'}}></i>
      </div>
      {m.tom_tat&&<div style={{fontSize:13.5,lineHeight:1.6,color:'var(--muted)',marginTop:6}}>{m.tom_tat}</div>}
      {dang&&
        <div style={{marginTop:6,animation:'fade .2s'}}>
          {cot.map(([nhan,khoa])=> m[khoa]?(
            <div key={khoa} style={{marginTop:9}}>
              <div style={{fontSize:11.5,fontWeight:700,color:'var(--muted)',textTransform:'uppercase',letterSpacing:.3}}>{nhan}</div>
              <div style={{fontSize:13.5,lineHeight:1.6,color:'var(--ink)',marginTop:2}}>{m[khoa]}</div>
            </div>
          ):null)}
          <div className="row" style={{gap:8,marginTop:12,flexWrap:'wrap'}}>
            {m.url&&<a href={m.url} target="_blank" rel="noopener" className="btn sm ghost"><i className="ti ti-external-link"></i>Bài gốc</a>}
            <button className="btn sm ghost" onClick={doiLuu}><i className={'ti '+(daLuu?'ti-bookmark-filled':'ti-bookmark')}></i>{daLuu?'Bỏ lưu':'Lưu lại'}</button>
            {onTaoViec&&<button className="btn sm ghost" onClick={()=>onTaoViec(m)}><i className="ti ti-plus"></i>Tạo việc</button>}
          </div>
        </div>}
    </div>
  );
}

function TinKD({tab,onTaoViec}){
  const kho=useKhoTin();
  const [mo,setMo]=useState({});
  const [oMa,setOMa]=useState('');
  const [tim,setTim]=useState('');
  const daDoc=kho.daDoc(), luu=kho.luu();
  const ghiDoc=(k)=>kho.ghiDoc(k);
  const doiLuu=(m)=>kho.doiLuu(m);
  const luuMa=()=>{ const m=oMa.trim(); if(m.length<6){alert('Mã đọc tin phải từ 6 ký tự.');return;} try{localStorage.setItem('hdw.tincode',m);}catch(e){} KhoTin.tai(m); };

  if(kho.dangTai&&!kho.ds) return <div style={{padding:'26px 4px',color:'var(--muted)',fontSize:13.5}}>Đang tải bản tin…</div>;

  if(kho.err==='chua-co-ma'||(kho.err&&kho.err.indexOf('chưa được cấp quyền')>=0)) return (
    <div style={{padding:'18px 4px',maxWidth:520}}>
      <b style={{fontSize:15}}>Nhập mã đọc tin</b>
      <p style={{fontSize:13.5,color:'var(--muted)',lineHeight:1.6,marginTop:6}}>
        Máy này chưa có mã để đọc bản tin. Hỏi chủ cửa hàng lấy <b>mã đọc tin</b> rồi nhập vào đây — chỉ cần nhập một lần trên mỗi máy.
      </p>
      <div className="row" style={{gap:8,marginTop:10}}>
        <input value={oMa} onChange={e=>setOMa(e.target.value)} placeholder="ví dụ: hd-tin-…" style={{flex:1,padding:'9px 11px',border:'1px solid var(--border)',borderRadius:9,fontSize:14,background:'var(--card,#fff)',color:'var(--ink)'}}/>
        <button className="btn sm" onClick={luuMa}><i className="ti ti-check"></i>Lưu</button>
      </div>
      {kho.err&&kho.err!=='chua-co-ma'&&<div style={{marginTop:9,fontSize:13,color:'#991b1b'}}>{kho.err}</div>}
    </div>
  );

  if(kho.err) return (
    <div style={{padding:'22px 4px'}}>
      <div style={{fontSize:13.5,color:'#991b1b'}}>{kho.err}</div>
      <button className="btn sm ghost" style={{marginTop:10}} onClick={()=>KhoTin.tai()}><i className="ti ti-rotate"></i>Thử lại</button>
    </div>
  );

  const Rong=({chu})=> <div style={{padding:'26px 4px',color:'var(--muted)',fontSize:13.5,lineHeight:1.6}}>{chu}</div>;
  const loc=(ds)=>{ const t=tim.trim().toLowerCase(); if(!t) return ds;
    return ds.filter(m=>JSON.stringify(m).toLowerCase().indexOf(t)>=0); };
  const OTim=()=> (
    <input value={tim} onChange={e=>setTim(e.target.value)} placeholder="Tìm trong mục Đọc…"
      style={{width:'100%',maxWidth:340,padding:'8px 11px',border:'1px solid var(--border)',borderRadius:9,fontSize:13.5,background:'var(--card,#fff)',color:'var(--ink)',marginBottom:12}}/>
  );

  /* ── TUẦN QUA ─ bản tổng hợp tuần, mỗi tuần MỘT mục, không phải danh sách tin. */
  if(tab==='tintuan'){
    const ds=kho.muc('tuan');
    if(!ds.length) return <Rong chu="Chưa có bản tổng hợp tuần nào. Bản này được dựng sáng Chủ Nhật, từ các bản tin trong tuần."/>;
    return (
      <div>
        <div style={{fontSize:13,color:'var(--muted)',lineHeight:1.6,marginBottom:12}}>
          Nhìn lại cả tuần: xu hướng nào đang lặp lại, nó chạm vào cửa hàng ở đâu, tuần tới nên làm gì. Dựng sáng Chủ Nhật.
        </div>
        {ds.map(m=>(
          <div key={m._k} style={{border:'1px solid var(--border)',borderRadius:12,padding:'14px 15px',marginBottom:12,background:'var(--card,transparent)'}}>
            <b style={{fontSize:14.5}}>Tuần tới {(m._ngay||'').split('-').reverse().join('/')}</b>
            {[['Cái gì đang đổi','cai_gi_dang_doi'],['Ăn vào cửa hàng ở đâu','an_vao_cua_hang']].map(([nhan,khoa])=> m[khoa]?(
              <div key={khoa} style={{marginTop:10}}>
                <div style={{fontSize:11.5,fontWeight:700,color:'var(--muted)',textTransform:'uppercase',letterSpacing:.3}}>{nhan}</div>
                <div style={{fontSize:13.5,lineHeight:1.6,color:'var(--ink)',marginTop:2}}>{m[khoa]}</div>
              </div>
            ):null)}
            {Array.isArray(m.viec_nen_lam)&&m.viec_nen_lam.length>0&&
              <div style={{marginTop:10}}>
                <div style={{fontSize:11.5,fontWeight:700,color:'var(--muted)',textTransform:'uppercase',letterSpacing:.3}}>Việc nên làm tuần tới</div>
                {m.viec_nen_lam.map((v,i)=>(
                  <div key={i} className="row" style={{gap:8,alignItems:'flex-start',marginTop:6}}>
                    <div style={{flex:1,fontSize:13.5,lineHeight:1.6,color:'var(--ink)'}}>{typeof v==='string'?v:(v.viec||JSON.stringify(v))}</div>
                    {onTaoViec&&<button className="btn sm ghost" onClick={()=>onTaoViec({tieu_de:(typeof v==='string'?v:v.viec),tom_tat:'Từ bản tổng hợp tuần '+(m._ngay||'')})}><i className="ti ti-plus"></i>Tạo việc</button>}
                  </div>
                ))}
              </div>}
            {m.ghi_chu&&<div style={{marginTop:10,fontSize:13,color:'var(--muted)',lineHeight:1.6}}>{m.ghi_chu}</div>}
          </div>
        ))}
      </div>
    );
  }

  /* ── ĐÃ LƯU ─ đọc từ máy, không gọi máy chủ: mục đã lưu phải còn xem được cả khi bản tin
     cũ đã trôi khỏi cửa sổ 21 ngày, nếu không thì nút Lưu chỉ là một cái nhãn tạm. */
  if(tab==='tinluu'){
    const ds=loc(Object.values(luu).sort((a,b)=>(b._ngay||'').localeCompare(a._ngay||'')));
    if(!Object.keys(luu).length) return <Rong chu={'Chưa lưu mục nào. Mở một mục bất kỳ trong Đọc rồi bấm "Lưu lại" — mục đã lưu nằm lại đây kể cả khi bản tin cũ đã trôi đi.'}/>;
    return (
      <div>
        <OTim/>
        {!ds.length&&<Rong chu="Không có mục đã lưu nào khớp từ khoá."/>}
        {ds.map(m=>{
          const c=DOC_PHAN[Object.keys(DOC_PHAN).find(k=>DOC_PHAN[k].phan===m._phan)||'tinkd'];
          return <MucDoc key={m._k} m={m} cot={c.o} mo={!!mo[m._k]} daDoc={true} luu={true}
                   doiMo={()=>setMo({...mo,[m._k]:!mo[m._k]})} doiLuu={()=>doiLuu(m)} onTaoViec={onTaoViec}/>;
        })}
      </div>
    );
  }

  /* ── BA TAB TIN ─ cùng một khuôn, khác cột và khác lời dẫn. */
  const c=DOC_PHAN[tab]||DOC_PHAN.tinkd;
  const ds=loc(kho.muc(c.phan));
  return (
    <div>
      <div style={{fontSize:13,color:'var(--muted)',lineHeight:1.6,marginBottom:10}}>{c.mo_ta}</div>
      <OTim/>
      {!ds.length&&<Rong chu={'Chưa có mục nào trong 21 ngày gần đây. Bản tin được cập nhật khoảng 6h30 sáng hằng ngày.'}/>}
      {ds.map(m=>(
        <MucDoc key={m._k} m={m} cot={c.o} mo={!!mo[m._k]} daDoc={!!daDoc[m._k]} luu={!!luu[m._k]}
          doiMo={()=>{ setMo({...mo,[m._k]:!mo[m._k]}); if(!daDoc[m._k]) ghiDoc(m._k); }}
          doiLuu={()=>doiLuu(m)} onTaoViec={onTaoViec}/>
      ))}
    </div>
  );
}

function Knowledge({learned,setLearned}){
  const all=KNOWLEDGE.flatMap(t=>t.lessons);
  const doneN=all.filter(l=>learned[l.id]).length;
  const next=all.find(l=>!learned[l.id]);
  const nextTopic=next?KNOWLEDGE.find(t=>t.lessons.some(l=>l.id===next.id)):null;
  const [openT,setOpenT]=useState(next?nextTopic.id:KNOWLEDGE[0].id);
  const [openL,setOpenL]=useState(next?next.id:null);
  const mark=(id)=>setLearned({...learned,[id]:!learned[id]});
  const goLesson=(tid,lid)=>{ setOpenT(tid); setOpenL(lid); };
  const Lesson=(l)=>(
    <div key={l.id} style={{borderTop:'1px solid var(--border)'}}>
      <div className="row" style={{padding:'11px 4px',cursor:'pointer'}} onClick={()=>setOpenL(openL===l.id?null:l.id)}>
        <span className={'chk'+(learned[l.id]?' done':'')} onClick={e=>{e.stopPropagation();mark(l.id);}}>{learned[l.id]&&<i className="ti ti-check"></i>}</span>
        <div className="rt"><b style={{fontWeight:600,fontSize:13.5,textDecoration:learned[l.id]?'line-through':'none',color:learned[l.id]?'var(--muted)':'var(--ink)'}}>{l.t}</b><small>{l.min} phút đọc</small></div>
        <i className={'ti '+(openL===l.id?'ti-chevron-up':'ti-chevron-down')} style={{color:'var(--muted2)'}}></i>
      </div>
      {openL===l.id &&
        <div style={{padding:'4px 6px 16px',animation:'fade .2s'}}>
          <ul style={{margin:'0 0 0 4px',paddingLeft:18,fontSize:13.5,lineHeight:1.7,color:'var(--ink)'}}>
            {l.body.map((b,i)=><li key={i} style={{marginBottom:4}}>{b}</li>)}
          </ul>
          {l.f && <div style={{margin:'12px 0',padding:'10px 13px',background:'var(--bg)',borderLeft:'3px solid var(--o)',borderRadius:8,fontSize:13,fontWeight:600}}>📐 {l.f}</div>}
          <div style={{marginTop:12,padding:'11px 13px',background:'var(--o-lt)',borderRadius:10,fontSize:13,color:'var(--o-dk)',lineHeight:1.55}}><b>Áp dụng cho Hương Diện:</b> {l.a}</div>
          <button className={'btn'+(learned[l.id]?' ghost':'')+' sm'} style={{marginTop:12}} onClick={()=>mark(l.id)}><i className={'ti '+(learned[l.id]?'ti-rotate':'ti-check')}></i>{learned[l.id]?'Bỏ đánh dấu':'Đánh dấu đã học'}</button>
        </div>}
    </div>
  );
  return (
    <div>
      {/* tiến độ */}
      <div className="panel">
        <div className="panel-b" style={{padding:'16px 18px',display:'flex',alignItems:'center',gap:14}}>
          <Ring pct={all.length?Math.round(doneN/all.length*100):0} size={50} color="#4f46e5"/>
          <div style={{flex:1}}>
            <b style={{fontFamily:'Baloo 2',fontSize:16}}>Đã học {doneN}/{all.length} bài</b>
            <div style={{fontSize:12.5,color:'var(--muted)'}}>{KNOWLEDGE.length} chủ đề cốt lõi cho chủ shop</div>
          </div>
        </div>
      </div>

      {/* gợi ý bài tiếp theo */}
      {next &&
        <div onClick={()=>goLesson(nextTopic.id,next.id)} style={{display:'flex',alignItems:'center',gap:13,background:'linear-gradient(135deg,#312e81,#4f46e5)',borderRadius:16,padding:'15px 18px',marginBottom:18,color:'#fff',cursor:'pointer',boxShadow:'var(--sh)'}}>
          <div style={{fontSize:28}}>{nextTopic.ic}</div>
          <div style={{flex:1,minWidth:0}}><div style={{fontSize:11.5,opacity:.85,fontWeight:600}}>HỌC TIẾP</div><b style={{fontFamily:'Baloo 2',fontSize:15.5}}>{next.t}</b><div style={{fontSize:12,opacity:.8}}>{nextTopic.name} · {next.min} phút</div></div>
          <span className="btn sm" style={{background:'rgba(255,255,255,.2)',pointerEvents:'none'}}>Học ngay</span>
        </div>}

      {/* chủ đề */}
      {KNOWLEDGE.map(tp=>{
        const dn=tp.lessons.filter(l=>learned[l.id]).length;
        const open=openT===tp.id;
        return (
          <div className="panel" key={tp.id} style={{marginBottom:12}}>
            <div className="panel-h" style={{cursor:'pointer'}} onClick={()=>setOpenT(open?null:tp.id)}>
              <div style={{width:34,height:34,borderRadius:10,background:tp.bg,color:tp.color,display:'flex',alignItems:'center',justifyContent:'center',fontSize:18}}>{tp.ic}</div>
              <div style={{flex:1}}>
                <b style={{fontSize:14.5,fontFamily:'Baloo 2'}}>{tp.name} {tp.tag&&<span className="tag" style={{background:'var(--blue-lt)',color:'var(--blue)',marginLeft:4,verticalAlign:'middle'}}>✨ {tp.tag}</span>}</b>
                <div style={{fontSize:12,color:'var(--muted)'}}>{dn}/{tp.lessons.length} bài đã học</div>
              </div>
              <i className={'ti '+(open?'ti-chevron-up':'ti-chevron-down')} style={{color:'var(--muted2)',fontSize:20}}></i>
            </div>
            {open && <div className="panel-b" style={{padding:'2px 16px 8px'}}>{tp.lessons.map(Lesson)}</div>}
          </div>
        );
      })}
    </div>
  );
}
