          <div className="panel-h"><i className="ti ti-circle-check lead" style={{color:'var(--grn)'}}></i><b>Đã xong hôm nay ({doneItems.length})</b></div>
          <div className="panel-b" style={{padding:0}}>
            {doneItems.map(t=>(
              <div className="row done" key={t.id}><span className="chk done"><i className="ti ti-check"></i></span><div className="rt"><b>{t.title}</b></div></div>
            ))}
          </div>
        </div>}

      {/* để dành hôm sau */}
      {rest.length>0 &&
        <div className="panel" style={{marginTop:16}}>
          <div className="panel-h"><i className="ti ti-calendar-plus lead" style={{color:'var(--muted)'}}></i><b>Để dành hôm sau ({rest.length})</b><span style={{marginLeft:'auto',fontSize:12,color:'var(--muted2)'}}>xếp theo ưu tiên</span></div>
          <div className="panel-b" style={{padding:0}}>
            {rest.slice(0,12).map(({t})=>{
              const p=projOf(t.proj),di=dueInfo(t.due),r=planReason(t);
              return (
                <div className="row" key={t.id} onClick={()=>edit(t)} style={{cursor:'pointer'}}>
                  <span className="tag" style={{background:p.bg,color:p.color,padding:'2px 7px'}}>{p.icon}</span>
                  <div className="rt"><b>{t.title}</b><small>{r.ic} {r.tx} · ~{estOf(t)}h</small></div>
                  {di && <span className={'due '+di.cls}><i className="ti ti-clock"></i>{di.label}</span>}
                </div>
              );
            })}
            {rest.length>12 && <div style={{padding:'10px 16px',fontSize:12.5,color:'var(--muted2)',textAlign:'center'}}>… và {rest.length-12} việc khác</div>}
          </div>
        </div>}
    </div>
  );
}

/* ---------- Thống kê hiệu suất ---------- */
function Stats({tasks}){
  const done=tasks.filter(t=>t.status==='done');
  const WDX=['CN','T2','T3','T4','T5','T6','T7'];
  const days=[]; for(let i=6;i>=0;i--){ const d=addDays(-i); days.push({d,lbl:WDX[new Date(d+'T00:00:00').getDay()],n:done.filter(t=>t.doneAt===d).length}); }
  const maxN=Math.max(1,...days.map(x=>x.n));
  const week=days.reduce((a,x)=>a+x.n,0);
  const withDue=done.filter(t=>t.due), onTime=withDue.filter(t=>t.doneAt&&t.doneAt<=t.due).length;
  const onTimeRate=withDue.length?Math.round(onTime/withDue.length*100):100;
  const byProj=PROJECTS.map(p=>({p,total:tasks.filter(t=>t.proj===p.id).length,done:tasks.filter(t=>t.proj===p.id&&t.status==='done').length})).filter(x=>x.total>0).sort((a,b)=>b.total-a.total);
  const maxProj=Math.max(1,...byProj.map(x=>x.total));
  const activeDays=new Set(done.map(t=>t.doneAt).filter(Boolean)).size||1;
  const avg=(done.length/activeDays).toFixed(1);
  const spentMin=tasks.reduce((a,t)=>a+(t.spent||0),0);
  const spentH=(spentMin/60).toFixed(1);
  // tổng kết tuần
  const wkStart=dstr(startOfWeek());
  const lastStart=dstr(new Date(new Date(wkStart+'T00:00:00').getTime()-7*86400000));
  const wkDone=done.filter(t=>t.doneAt&&t.doneAt>=wkStart);
  const lastDone=done.filter(t=>t.doneAt&&t.doneAt>=lastStart&&t.doneAt<wkStart);
  const wkPts=wkDone.reduce((a,t)=>a+pointsFor(t),0);
  const wkWithDue=wkDone.filter(t=>t.due), wkOnTime=wkWithDue.filter(t=>t.doneAt<=t.due).length;
  const wkOnTimeR=wkWithDue.length?Math.round(wkOnTime/wkWithDue.length*100):100;
  const open=tasks.filter(t=>t.status!=='done');
  const overdue=open.filter(t=>t.due&&t.due<today());
  const suggest=open.filter(t=>(t.due&&t.due<today())||t.pri==='high').sort((a,b)=>scoreTask(b)-scoreTask(a)).slice(0,5);
  const trend=wkDone.length-lastDone.length;
  if(done.length===0 && tasks.length===0) return <div className="panel"><div className="empty"><i className="ti ti-chart-bar"></i><p>Chưa có dữ liệu.</p></div></div>;
  return (
    <div>
      {/* Tổng kết tuần */}
      <div className="panel">
        <div className="panel-h"><i className="ti ti-calendar-stats lead"></i><b>Tổng kết tuần này</b><span style={{marginLeft:'auto',fontSize:12,color:'var(--muted)'}}>từ {fmtDate(wkStart)}</span></div>
        <div className="panel-b" style={{padding:'14px 18px 18px'}}>
          <div style={{display:'flex',gap:18,flexWrap:'wrap',marginBottom:14}}>
            <div><div style={{fontFamily:'Baloo 2',fontSize:26,color:'var(--o-dk)'}}>{wkDone.length}</div><div style={{fontSize:11.5,color:'var(--muted)'}}>việc xong {trend!==0&&<b style={{color:trend>0?'var(--grn)':'var(--red)'}}>{trend>0?'▲':'▼'}{Math.abs(trend)}</b>}</div></div>
            <div><div style={{fontFamily:'Baloo 2',fontSize:26}}>{wkOnTimeR}%</div><div style={{fontSize:11.5,color:'var(--muted)'}}>đúng hạn</div></div>
            <div><div style={{fontFamily:'Baloo 2',fontSize:26}}>+{wkPts}</div><div style={{fontSize:11.5,color:'var(--muted)'}}>điểm</div></div>
            <div><div style={{fontFamily:'Baloo 2',fontSize:26,color:overdue.length?'var(--red)':'var(--ink)'}}>{overdue.length}</div><div style={{fontSize:11.5,color:'var(--muted)'}}>đang quá hạn</div></div>
          </div>
          <div style={{fontSize:12.5,fontWeight:600,color:'var(--muted)',marginBottom:8}}>👉 Gợi ý ưu tiên tuần sau</div>
          {suggest.length===0 ? <div style={{fontSize:13,color:'var(--muted2)'}}>Không có việc quá hạn hay ưu tiên cao — tuyệt vời!</div> :
            suggest.map(t=>{const p=projOf(t.proj),r=planReason(t);return (
              <div key={t.id} style={{display:'flex',gap:8,alignItems:'center',padding:'6px 0',fontSize:13}}>
                <span className="tag" style={{background:p.bg,color:p.color,padding:'2px 7px'}}>{p.icon}</span>
                <span style={{flex:1}}>{t.title}</span>
                <span style={{fontSize:11,color:'var(--muted)'}}>{r.ic} {r.tx}</span>
              </div>
            );})}
        </div>
      </div>
      <div className="grid-stat">
        <div className="stat"><div className="ic g"><i className="ti ti-circle-check"></i></div><div className="n">{done.length}</div><div className="l">Tổng việc đã xong</div></div>
        <div className="stat"><div className="ic b"><i className="ti ti-calendar-week"></i></div><div className="n">{week}</div><div className="l">Xong trong 7 ngày</div></div>
        <div className="stat"><div className="ic o"><i className="ti ti-trending-up"></i></div><div className="n">{avg}</div><div className="l">TB việc/ngày làm</div></div>
        <div className="stat"><div className={'ic '+(onTimeRate>=80?'g':onTimeRate>=50?'a':'r')}><i className="ti ti-clock-check"></i></div><div className="n">{onTimeRate}%</div><div className="l">Đúng hạn</div></div>
      </div>

      <div className="panel">
        <div className="panel-h"><i className="ti ti-chart-bar lead"></i><b>Việc hoàn thành 7 ngày qua</b></div>
        <div className="panel-b" style={{padding:'18px'}}>
          <div style={{display:'flex',alignItems:'flex-end',gap:8,height:130}}>
            {days.map((x,i)=>(
              <div key={i} style={{flex:1,display:'flex',flexDirection:'column',alignItems:'center',gap:6,height:'100%',justifyContent:'flex-end'}}>
                <div style={{fontSize:12,fontWeight:700,color:x.n?'var(--o-dk)':'var(--muted2)'}}>{x.n}</div>
                <div style={{width:'100%',maxWidth:34,height:(x.n/maxN*90)+'px',minHeight:x.n?6:0,background:'linear-gradient(180deg,var(--o),var(--o-dk))',borderRadius:'6px 6px 0 0',transition:'height .4s'}}></div>
                <div style={{fontSize:11,color:'var(--muted)',fontWeight:600}}>{x.lbl}</div>
              </div>
            ))}
          </div>
        </div>
      </div>

      <div className="panel">
        <div className="panel-h"><i className="ti ti-folders lead"></i><b>Phân bổ theo mảng</b></div>
        <div className="panel-b" style={{padding:'14px 18px 18px'}}>
          {byProj.map(({p,total,done})=>(
            <div key={p.id} style={{marginBottom:12}}>
              <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:5,fontSize:12.5}}>
                <span>{p.icon}</span><b style={{flex:1}}>{p.name}</b>
                <span style={{color:'var(--muted)'}}>{done}/{total} xong</span>
              </div>
              <div style={{height:18,background:'var(--bg)',borderRadius:6,overflow:'hidden',position:'relative'}}>
                <div style={{height:'100%',width:(total/maxProj*100)+'%',background:p.bg,borderRadius:6}}></div>
                <div style={{position:'absolute',top:0,left:0,height:'100%',width:(done/maxProj*100)+'%',background:p.color,borderRadius:6,transition:'width .4s'}}></div>
              </div>
            </div>
          ))}
        </div>
      </div>

      <div className="panel">
        <div className="panel-h"><i className="ti ti-hourglass lead"></i><b>Thời gian tập trung (Pomodoro)</b></div>
        <div className="panel-b" style={{padding:'16px 18px'}}>
          {spentMin>0
            ? <div style={{display:'flex',alignItems:'center',gap:12}}><div style={{fontFamily:'Baloo 2',fontSize:30,color:'var(--o-dk)'}}>{spentH}h</div><div style={{fontSize:12.5,color:'var(--muted)'}}>tổng thời gian đã bấm giờ tập trung cho công việc.<br/>Dùng nút <b>Tập trung</b> ở tab Hôm nay để đo.</div></div>
            : <div style={{fontSize:13,color:'var(--muted)'}}>Chưa có phiên tập trung nào. Vào tab <b>Hôm nay</b> → bấm <b>Tập trung</b> trên một việc để bắt đầu Pomodoro.</div>}
        </div>
      </div>
    </div>
  );
}

/* ---------- Pomodoro / Tập trung ---------- */
function FocusModal({task,onClose,onLog,onDone}){
  const FOCUS=25*60, BREAK=5*60;
  const [mode,setMode]=useState('focus');
  const [left,setLeft]=useState(FOCUS);
  const [running,setRunning]=useState(false);
  const [focusedSec,setFocusedSec]=useState(0);
  useEffect(()=>{
    if(!running) return;
    const t=setInterval(()=>{
      setLeft(l=>{
        if(l<=1){ setRunning(false); if(mode==='focus'){setMode('break');return BREAK;} setMode('focus'); return FOCUS; }
        return l-1;
      });
      if(mode==='focus') setFocusedSec(s=>s+1);
    },1000);
    return ()=>clearInterval(t);
  },[running,mode]);
  const total=mode==='focus'?FOCUS:BREAK;
  const mm=String(Math.floor(left/60)).padStart(2,'0'), ss=String(left%60).padStart(2,'0');
  const minutes=Math.round(focusedSec/60);
  const finish=()=>{ if(minutes>0)onLog(task.id,minutes); onClose(); };
  const R=92, C=2*Math.PI*R, off=C*(1-left/total);
  return (
    <div className="ov" onClick={finish}>
      <div className="modal" onClick={e=>e.stopPropagation()} style={{maxWidth:380}}>
        <div className="modal-h"><b><i className="ti ti-target-arrow" style={{color:'var(--o)',marginRight:6}}></i>Tập trung</b><button className="x" onClick={finish}><i className="ti ti-x"></i></button></div>
        <div className="modal-b" style={{textAlign:'center'}}>
          <div style={{fontSize:13.5,fontWeight:600,color:'var(--muted)',marginBottom:4}}>{mode==='focus'?'🎯 Đang làm':'☕ Nghỉ ngắn'}</div>
          <div style={{fontSize:14,fontWeight:600,marginBottom:16,minHeight:38}}>{task.title}</div>
          <div style={{position:'relative',width:210,height:210,margin:'0 auto'}}>
            <svg width="210" height="210">
              <circle cx="105" cy="105" r={R} fill="none" stroke="var(--border2)" strokeWidth="10"/>
              <circle cx="105" cy="105" r={R} fill="none" stroke={mode==='focus'?'var(--o)':'var(--grn)'} strokeWidth="10" strokeLinecap="round" strokeDasharray={C} strokeDashoffset={off} transform="rotate(-90 105 105)" style={{transition:'stroke-dashoffset 1s linear'}}/>
            </svg>
            <div style={{position:'absolute',inset:0,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center'}}>
              <div style={{fontFamily:'Baloo 2',fontSize:46,fontWeight:700,lineHeight:1}}>{mm}:{ss}</div>
              <div style={{fontSize:12,color:'var(--muted)',marginTop:4}}>đã tập trung ~{minutes}p</div>
            </div>
          </div>
          <div style={{display:'flex',gap:10,justifyContent:'center',marginTop:20}}>
            <button className="btn" style={{padding:'12px 22px'}} onClick={()=>setRunning(r=>!r)}><i className={'ti '+(running?'ti-player-pause':'ti-player-play')}></i>{running?'Tạm dừng':'Bắt đầu'}</button>
            <button className="btn ghost" style={{padding:'12px 16px'}} onClick={()=>{setRunning(false);setMode('focus');setLeft(FOCUS);}}><i className="ti ti-rotate"></i></button>
          </div>
          {task.est && <div style={{fontSize:12,color:'var(--muted)',marginTop:14}}>Ước tính việc này: ~{task.est}h{task.spent?(' · đã làm tổng '+(task.spent+minutes)+'p'):''}</div>}
        </div>
        <div className="modal-f">
          <button className="btn ghost" style={{flex:'0 0 auto',padding:'12px 16px'}} onClick={finish}>Lưu & đóng</button>
          <button className="btn" onClick={()=>{if(minutes>0)onLog(task.id,minutes);onDone(task.id);}}><i className="ti ti-check"></i>Hoàn thành việc</button>
        </div>
      </div>
    </div>
  );
}

/* ---------- Deep Work (toàn màn hình, không xao nhãng) ---------- */
function DeepWork({ids,tasks,onClose,onLog,onComplete,toggleCk}){
  const [phase,setPhase]=useState('setup'); // setup | work | done
  const [len,setLen]=useState(50);           // độ dài phiên (phút)
  const [left,setLeft]=useState(50*60);
  const [running,setRunning]=useState(false);
  const [seg,setSeg]=useState(0);            // giây trên việc hiện tại
  const [curId,setCurId]=useState(null);
  const [doneCnt,setDoneCnt]=useState(0);
  const [totalSec,setTotalSec]=useState(0);
  const [asking,setAsking]=useState(false);

  const byId={}; tasks.forEach(t=>byId[t.id]=t);
  const queue=ids.map(id=>byId[id]).filter(t=>t&&t.status!=='done');
  const cur=queue.find(t=>t.id===curId)||queue[0]||null;

  useEffect(()=>{ if(cur&&!curId) setCurId(cur.id); });
  useEffect(()=>{
    if(!running||phase!=='work') return;
    const tm=setInterval(()=>{
      setSeg(s=>s+1); setTotalSec(s=>s+1);
      setLeft(l=>{ if(l<=1){ setRunning(false); setPhase('done'); return 0; } return l-1; });
    },1000);
    return ()=>clearInterval(tm);
  },[running,phase]);

  const mm=String(Math.floor(left/60)).padStart(2,'0'), ss=String(left%60).padStart(2,'0');
  const logSeg=()=>{ if(cur){ const m=Math.round(seg/60); if(m>0)onLog(cur.id,m); } setSeg(0); };
  const start=(mins)=>{ setLen(mins); setLeft(mins*60); setPhase('work'); setRunning(true); };
  const nextTask=(afterComplete)=>{
    if(!cur) return;
    const i=queue.findIndex(t=>t.id===cur.id);
    const nxt=queue[i+1]||queue.find(t=>t.id!==cur.id)||null;
    logSeg();
    if(afterComplete) { onComplete(cur.id); setDoneCnt(c=>c+1); }
    if(nxt) setCurId(nxt.id); else { setRunning(false); setPhase('done'); }
  };
  const exit=()=>{ logSeg(); onClose(); };
  useEffect(()=>()=>Noise.stop(),[]);

  const bg={position:'fixed',inset:0,zIndex:300,background:'linear-gradient(160deg,#1a1410,#2a1c10 60%,#0f0c09)',color:'#fff',display:'flex',flexDirection:'column',overflowY:'auto'};
  const lightBtn={background:'rgba(255,255,255,.14)',color:'#fff',border:'1px solid rgba(255,255,255,.2)'};

  // ----- SETUP -----
  if(phase==='setup') return (
    <div style={bg}>
      <div style={{maxWidth:480,margin:'auto',padding:24,textAlign:'center',width:'100%'}}>
        <div style={{fontSize:48}}>🧘</div>
        <h1 style={{fontFamily:'Baloo 2',fontSize:26,margin:'10px 0 4px'}}>Deep Work</h1>
        <p style={{opacity:.7,fontSize:13.5,marginBottom:8}}>Một phiên tập trung sâu, không xao nhãng — đi qua {queue.length} việc đã ưu tiên.</p>
        {queue.length===0
          ? <p style={{opacity:.6,marginTop:20}}>Không có việc nào đang mở để tập trung.</p>
          : <>
            <div style={{textAlign:'left',background:'rgba(255,255,255,.07)',borderRadius:14,padding:'12px 16px',margin:'14px 0 22px'}}>
              {queue.slice(0,5).map((t,i)=>(<div key={t.id} style={{display:'flex',gap:8,padding:'5px 0',fontSize:13.5,opacity:i===0?1:.6}}><b style={{color:'var(--o-mid)'}}>{i+1}.</b><span>{t.title}</span></div>))}
              {queue.length>5 && <div style={{fontSize:12,opacity:.5,paddingTop:4}}>… và {queue.length-5} việc nữa</div>}
            </div>
            <div style={{fontSize:12.5,opacity:.7,marginBottom:10,fontWeight:600}}>Chọn độ dài phiên</div>
            <div style={{display:'flex',gap:10,justifyContent:'center'}}>
              {[25,50,90].map(m=>(
                <button key={m} onClick={()=>start(m)} style={{...lightBtn,padding:'16px 20px',borderRadius:14,fontFamily:'Baloo 2',fontSize:20,fontWeight:700,flex:1,cursor:'pointer'}}>{m}<div style={{fontSize:11,fontWeight:500,opacity:.7}}>phút</div></button>
              ))}
            </div>
          </>}
        <button onClick={onClose} style={{marginTop:24,background:'none',border:0,color:'rgba(255,255,255,.6)',fontSize:13,cursor:'pointer'}}>← Quay lại</button>
      </div>
    </div>
  );

  // ----- DONE -----
  if(phase==='done') return (
    <div style={bg}>
      <div style={{maxWidth:440,margin:'auto',padding:24,textAlign:'center',width:'100%'}}>
        <div style={{fontSize:48}}>🎉</div>
        <h1 style={{fontFamily:'Baloo 2',fontSize:24,margin:'10px 0'}}>Hết phiên Deep Work!</h1>
        <div style={{display:'flex',gap:14,justifyContent:'center',margin:'18px 0'}}>
          <div><div style={{fontFamily:'Baloo 2',fontSize:30}}>{Math.round(totalSec/60)}</div><div style={{fontSize:11,opacity:.7}}>phút tập trung</div></div>
          <div><div style={{fontFamily:'Baloo 2',fontSize:30}}>{doneCnt}</div><div style={{fontSize:11,opacity:.7}}>việc hoàn thành</div></div>
        </div>
        <div style={{display:'flex',gap:10,justifyContent:'center',flexWrap:'wrap'}}>
          {queue.length>0 && <button onClick={()=>{setLeft(25*60);setPhase('work');setRunning(true);}} style={{...lightBtn,padding:'12px 18px',borderRadius:12,fontWeight:600,cursor:'pointer'}}><i className="ti ti-plus"></i> Thêm 25 phút</button>}
          <button onClick={onClose} style={{background:'#fff',color:'#1a1410',padding:'12px 22px',borderRadius:12,fontWeight:700,border:0,cursor:'pointer'}}>Kết thúc</button>
        </div>
      </div>
    </div>
  );

  // ----- WORK -----
  return (
    <div style={bg}>
      {/* top bar tối giản */}
      <div style={{display:'flex',alignItems:'center',padding:'16px 20px',flexShrink:0}}>
        <div style={{fontSize:12.5,opacity:.6,fontWeight:600,letterSpacing:'.04em'}}>🧘 DEEP WORK · việc {Math.min(doneCnt+1,queue.length)}/{queue.length+doneCnt}</div>
        <div style={{flex:1}}></div>
        <button onClick={()=>setAsking(true)} style={{background:'none',border:0,color:'rgba(255,255,255,.55)',fontSize:22,cursor:'pointer',display:'flex'}}><i className="ti ti-x"></i></button>
      </div>

      {!cur
        ? <div style={{margin:'auto',textAlign:'center',opacity:.7}}><div style={{fontSize:40}}>✅</div><p style={{marginTop:10}}>Đã xong hết việc trong hàng đợi!</p><button onClick={onClose} style={{...lightBtn,marginTop:16,padding:'10px 18px',borderRadius:12,cursor:'pointer'}}>Kết thúc</button></div>
        : <div style={{margin:'auto',width:'100%',maxWidth:560,padding:'10px 22px 30px',textAlign:'center'}}>
            {/* đồng hồ lớn */}
            <div style={{fontFamily:'Baloo 2',fontSize:'clamp(64px,18vw,108px)',fontWeight:700,lineHeight:1,letterSpacing:'.02em'}}>{mm}:{ss}</div>
            <div style={{opacity:.55,fontSize:13,marginBottom:26}}>{running?'Đang tập trung — đừng rời đi':'Tạm dừng'}</div>

            {/* việc hiện tại */}
            <div style={{fontSize:12,opacity:.55,fontWeight:600,marginBottom:6}}>ĐANG LÀM</div>
            <div style={{fontFamily:'Baloo 2',fontSize:'clamp(20px,5vw,28px)',fontWeight:700,marginBottom:18,lineHeight:1.25}}>{cur.title}</div>

            {cur.checklist&&cur.checklist.length>0 &&
              <div style={{textAlign:'left',maxWidth:380,margin:'0 auto 22px'}}>
                {cur.checklist.map((c,i)=>(
                  <div key={i} onClick={()=>toggleCk(cur.id,i)} style={{display:'flex',gap:10,alignItems:'center',padding:'9px 12px',marginBottom:6,background:'rgba(255,255,255,.06)',borderRadius:10,cursor:'pointer',fontSize:14,opacity:c.done?.5:1}}>
                    <i className={'ti '+(c.done?'ti-circle-check-filled':'ti-circle')} style={{fontSize:20,color:c.done?'#4ade80':'rgba(255,255,255,.5)'}}></i>
                    <span style={{textDecoration:c.done?'line-through':'none'}}>{c.t}</span>
                  </div>
                ))}
              </div>}

            {/* điều khiển */}
            <div style={{display:'flex',gap:10,justifyContent:'center',flexWrap:'wrap'}}>
              <button onClick={()=>setRunning(r=>!r)} style={{background:'#fff',color:'#1a1410',padding:'13px 26px',borderRadius:30,fontWeight:700,border:0,cursor:'pointer',display:'flex',alignItems:'center',gap:7}}><i className={'ti '+(running?'ti-player-pause':'ti-player-play')}></i>{running?'Tạm dừng':'Tiếp tục'}</button>
              <button onClick={()=>nextTask(true)} style={{...lightBtn,padding:'13px 20px',borderRadius:30,fontWeight:600,cursor:'pointer',display:'flex',alignItems:'center',gap:7}}><i className="ti ti-check"></i>Xong việc này</button>
              {queue.length>1 && <button onClick={()=>nextTask(false)} title="Bỏ qua, sang việc sau" style={{...lightBtn,padding:'13px 16px',borderRadius:30,cursor:'pointer'}}><i className="ti ti-player-skip-forward"></i></button>}
            </div>

            {queue.length>1 && <div style={{marginTop:22,fontSize:12,opacity:.45}}>Tiếp theo: {(queue.find(t=>t.id!==cur.id)||{}).title||'—'}</div>}
            <div style={{marginTop:26,paddingTop:18,borderTop:'1px solid rgba(255,255,255,.12)'}}>
              <div style={{fontSize:11,opacity:.5,fontWeight:600,marginBottom:8,letterSpacing:'.04em'}}>🎧 ÂM THANH NỀN</div>
              <SoundBar/>
            </div>
          </div>}

      {/* xác nhận thoát */}
      {asking &&
        <div style={{position:'absolute',inset:0,background:'rgba(0,0,0,.6)',display:'flex',alignItems:'center',justifyContent:'center',zIndex:5}} onClick={()=>setAsking(false)}>
          <div onClick={e=>e.stopPropagation()} style={{background:'#241c14',borderRadius:16,padding:'22px',maxWidth:300,textAlign:'center',border:'1px solid rgba(255,255,255,.12)'}}>
            <div style={{fontSize:32}}>🚪</div>
            <p style={{margin:'8px 0 16px',fontSize:14}}>Thoát Deep Work? Thời gian đã làm vẫn được lưu.</p>
            <div style={{display:'flex',gap:10}}>
              <button onClick={()=>setAsking(false)} style={{...lightBtn,flex:1,padding:'11px',borderRadius:10,fontWeight:600,cursor:'pointer'}}>Ở lại</button>
              <button onClick={exit} style={{flex:1,padding:'11px',borderRadius:10,fontWeight:700,background:'#fff',color:'#1a1410',border:0,cursor:'pointer'}}>Thoát</button>
            </div>
          </div>
        </div>}
    </div>
  );
}

/* ---------- Sổ kinh doanh (10 số mỗi tuần) ---------- */
const BIZF=[
  {k:'rev',l:'Doanh thu'},{k:'gross',l:'Lãi gộp'},{k:'cash',l:'Tiền mặt'},
  {k:'debt',l:'Công nợ NCC'},{k:'stock',l:'Tồn kho'},{k:'stockOld',l:'Tồn >60 ngày'},
  {k:'returns',l:'Khách quay lại',unit:'người'},{k:'adsCost',l:'Chi phí Ads'},{k:'adsRev',l:'DT từ Ads'},
];
function BizBook({metrics,setMetrics,config,setConfig}){
  const wk=dstr(startOfWeek());
  const [f,setF]=useState(()=>metrics.find(m=>m.week===wk)||{week:wk});
  const [saved,setSaved]=useState(false);
  const set=(k,v)=>{setF(p=>({...p,[k]:v===''?undefined:+v}));setSaved(false);};
  const save=()=>{ setMetrics(prev=>[...prev.filter(m=>m.week!==wk),{...f,week:wk}].sort((a,b)=>a.week<b.week?1:-1)); setSaved(true); };
  const margin=f.rev?Math.round((f.gross||0)/f.rev*1000)/10:null;
  const roas=f.adsCost?Math.round((f.adsRev||0)/f.adsCost*10)/10:null;
  const be=config.breakeven||0;
  const below=f.rev!==undefined&&be>0&&f.rev<be;
  const recent=[...metrics].sort((a,b)=>a.week<b.week?1:-1).slice(0,8);
  const chrono=[...recent].reverse();
  const maxRev=Math.max(1,...chrono.map(m=>m.rev||0),be);
  return (
    <div>
      <div style={{fontSize:12.5,color:'var(--muted)',marginBottom:14,display:'flex',alignItems:'center',gap:8,flexWrap:'wrap'}}>
        <i className="ti ti-info-circle" style={{color:'var(--o)'}}></i> Nhập số mỗi tuần (đơn vị: <b>triệu đồng</b>, riêng "khách quay lại" là số người). Tuần hiện tại: <b style={{color:'var(--ink)'}}>{fmtDate(wk)}</b>.
        <span style={{flex:1}}></span>
        <span style={{display:'flex',alignItems:'center',gap:6}}>Hòa vốn/tuần:
          <input type="number" value={be||''} onChange={e=>setConfig({...config,breakeven:e.target.value===''?0:+e.target.value})} style={{...selSt,width:80,padding:'6px 8px'}}/> tr
        </span>
      </div>

      {below &&
        <div style={{display:'flex',alignItems:'center',gap:10,background:'var(--red-lt)',border:'1px solid var(--red)',borderRadius:12,padding:'12px 14px',marginBottom:16,fontSize:13,color:'var(--red)'}}>
          <i className="ti ti-alert-triangle" style={{fontSize:20}}></i><span>Doanh thu tuần (<b>{f.rev} tr</b>) <b>dưới ngưỡng hòa vốn {be} tr</b> — cửa hàng đang ở vùng nguy hiểm. Xem lại kế hoạch phòng thủ.</span>
        </div>}

      <div className="panel">
        <div className="panel-h"><i className="ti ti-pencil lead"></i><b>Nhập số tuần này</b>
          {saved && <span style={{marginLeft:'auto',color:'var(--grn)',fontSize:12.5,fontWeight:600}}><i className="ti ti-check"></i> Đã lưu</span>}
        </div>
        <div className="panel-b" style={{padding:'16px 18px'}}>
          <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(140px,1fr))',gap:12}}>
            {BIZF.map(fd=>(
              <div key={fd.k}>
                <label style={{display:'block',fontSize:11.5,fontWeight:600,color:'var(--muted)',marginBottom:5}}>{fd.l}{fd.unit?'':' (tr)'}</label>
                <input type="number" value={f[fd.k]===undefined?'':f[fd.k]} onChange={e=>set(fd.k,e.target.value)} style={{width:'100%',background:'var(--bg)',border:'1.5px solid var(--border)',borderRadius:10,padding:'9px 11px',color:'var(--ink)',outline:'none'}}/>
              </div>
            ))}
          </div>
          <div style={{display:'flex',gap:10,flexWrap:'wrap',marginTop:14,alignItems:'center'}}>
            <span className="tag" style={{background:'var(--o-lt)',color:'var(--o-dk)',padding:'6px 11px'}}>Biên gộp thực tế: <b>{margin!==null?margin+'%':'—'}</b></span>
            <span className="tag" style={{background:'var(--blue-lt)',color:'var(--blue)',padding:'6px 11px'}}>ROAS (DT/Ads): <b>{roas!==null?roas+'×':'—'}</b></span>
            <span style={{flex:1}}></span>
            <button className="btn" onClick={save}><i className="ti ti-device-floppy"></i>Lưu tuần này</button>
          </div>
        </div>
      </div>

      {chrono.length>0 &&
        <div className="panel">
          <div className="panel-h"><i className="ti ti-chart-line lead"></i><b>Xu hướng doanh thu</b><span style={{marginLeft:'auto',fontSize:12,color:'var(--muted)'}}>{chrono.length} tuần gần nhất</span></div>
          <div className="panel-b" style={{padding:'18px'}}>
            <div style={{display:'flex',alignItems:'flex-end',gap:8,height:120,position:'relative'}}>
              {be>0 && <div style={{position:'absolute',left:0,right:0,bottom:(be/maxRev*100)+'px',borderTop:'2px dashed var(--red)',opacity:.6}}><span style={{position:'absolute',right:0,top:-16,fontSize:10,color:'var(--red)',fontWeight:600}}>hòa vốn {be}</span></div>}
              {chrono.map((m,i)=>(
                <div key={i} style={{flex:1,display:'flex',flexDirection:'column',alignItems:'center',gap:5,height:'100%',justifyContent:'flex-end'}}>
                  <div style={{fontSize:10.5,fontWeight:700,color:'var(--o-dk)'}}>{m.rev||0}</div>
                  <div style={{width:'100%',maxWidth:30,height:((m.rev||0)/maxRev*86)+'px',minHeight:3,background:(be>0&&(m.rev||0)<be)?'linear-gradient(180deg,#f87171,#dc2626)':'linear-gradient(180deg,var(--o),var(--o-dk))',borderRadius:'5px 5px 0 0'}}></div>
                  <div style={{fontSize:10,color:'var(--muted)'}}>{fmtDate(m.week)}</div>
                </div>
              ))}
            </div>
          </div>
        </div>}

      {recent.length>0 &&
        <div className="panel">
          <div className="panel-h"><i className="ti ti-table lead"></i><b>Lịch sử theo tuần</b></div>
          <div className="panel-b" style={{padding:0,overflowX:'auto'}}>
            <table style={{width:'100%',borderCollapse:'collapse',fontSize:12.5,minWidth:480}}>
              <thead><tr style={{color:'var(--muted)',textAlign:'right'}}>
                <th style={{textAlign:'left',padding:'10px 14px'}}>Tuần</th><th style={{padding:'10px 8px'}}>Doanh thu</th><th style={{padding:'10px 8px'}}>Biên%</th><th style={{padding:'10px 8px'}}>Tiền mặt</th><th style={{padding:'10px 8px'}}>Tồn &gt;60</th><th style={{padding:'10px 14px'}}>Khách lại</th>
              </tr></thead>
              <tbody>
                {recent.map(m=>{const mg=m.rev?Math.round((m.gross||0)/m.rev*1000)/10:null;const bad=be>0&&(m.rev||0)<be;return (
                  <tr key={m.week} style={{borderTop:'1px solid var(--border)',textAlign:'right'}}>
                    <td style={{textAlign:'left',padding:'10px 14px',fontWeight:600}}>{fmtDate(m.week)}</td>
                    <td style={{padding:'10px 8px',color:bad?'var(--red)':'var(--ink)',fontWeight:bad?700:400}}>{m.rev??'—'}</td>
                    <td style={{padding:'10px 8px'}}>{mg!==null?mg+'%':'—'}</td>
                    <td style={{padding:'10px 8px'}}>{m.cash??'—'}</td>
                    <td style={{padding:'10px 8px'}}>{m.stockOld??'—'}</td>
                    <td style={{padding:'10px 14px'}}>{m.returns??'—'}</td>
                  </tr>
                );})}
              </tbody>
            </table>
          </div>
        </div>}
    </div>
  );
}

/* ---------- Sổ tay vận hành ---------- */
function Notebook({nb,setNb,onExport,onImport}){
  const [seg,setSeg]=useState('sop');
  const [openCat,setOpenCat]=useState(0);
  const [copied,setCopied]=useState(null);
  const segs=[{k:'sop',n:'Quy trình',i:'ti-list-check'},{k:'prompts',n:'Prompt AI',i:'ti-sparkles'},{k:'lib',n:'Thư viện prompt',i:'ti-books'},{k:'suppliers',n:'Nhà cung cấp',i:'ti-truck'},{k:'data',n:'Sao lưu',i:'ti-database'}];
  const upd=(sec,arr)=>setNb({...nb,[sec]:arr});
  const addItem=(sec,obj)=>upd(sec,[...(nb[sec]||[]),{...obj,id:sec[0]+Date.now()}]);
  const delItem=(sec,id)=>upd(sec,nb[sec].filter(x=>x.id!==id));
  const setItem=(sec,id,patch)=>upd(sec,nb[sec].map(x=>x.id===id?{...x,...patch}:x));
  const copy=(txt,id)=>{ try{navigator.clipboard.writeText(txt);}catch(e){} if(id){setCopied(id);setTimeout(()=>setCopied(c=>c===id?null:c),1500);} };
  const inp={width:'100%',background:'var(--bg)',border:'1.5px solid var(--border)',borderRadius:10,padding:'9px 11px',color:'var(--ink)',outline:'none'};
  return (
    <div>
      <div className="chips" style={{marginBottom:16}}>
        {segs.map(s=>(<button key={s.k} className={'chip'+(seg===s.k?' on':'')} onClick={()=>setSeg(s.k)}><i className={'ti '+s.i}></i> {s.n}</button>))}
      </div>

      {(seg==='sop'||seg==='prompts')&&
        <div>
          {(nb[seg]||[]).map(it=>(
            <div className="panel" key={it.id} style={{marginBottom:12}}>
              <div className="panel-b" style={{padding:'14px 16px'}}>
                <div style={{display:'flex',gap:8,alignItems:'center',marginBottom:8}}>
                  <input value={it.title} onChange={e=>setItem(seg,it.id,{title:e.target.value})} style={{...inp,fontWeight:700,flex:1}}/>
                  {seg==='prompts'&&<button className="btn ghost sm" onClick={()=>copy(it.body,it.id)}><i className={'ti '+(copied===it.id?'ti-check':'ti-copy')}></i>{copied===it.id?'Đã copy':'Copy'}</button>}
                  <button onClick={()=>delItem(seg,it.id)} style={{color:'var(--red)',padding:6,display:'flex'}}><i className="ti ti-trash" style={{fontSize:18}}></i></button>
                </div>
                <textarea value={it.body} onChange={e=>setItem(seg,it.id,{body:e.target.value})} style={{...inp,minHeight:80,resize:'vertical',fontFamily:'inherit',whiteSpace:'pre-wrap'}}/>

        </div>}

      {seg==='lib'&&
        <div>
          <div style={{fontSize:12.5,color:'var(--muted)',marginBottom:14,display:'flex',gap:8,alignItems:'center'}}><i className="ti ti-bulb" style={{color:'var(--o)'}}></i> {PROMPT_LIBRARY.reduce((a,c)=>a+c.items.length,0)} prompt sẵn dùng — bấm <b>Copy</b>, dán vào ChatGPT/Claude rồi điền chỗ <b>[trong ngoặc]</b>.</div>
          {PROMPT_LIBRARY.map((c,ci)=>{
            const open=openCat===ci;
            return (
              <div className="panel" key={ci} style={{marginBottom:10}}>
                <div className="panel-h" style={{cursor:'pointer'}} onClick={()=>setOpenCat(open?-1:ci)}>
                  <span style={{fontSize:18}}>{c.ic}</span><b style={{fontSize:14.5,fontFamily:'Baloo 2'}}>{c.cat}</b>
                  <span style={{marginLeft:'auto',display:'flex',alignItems:'center',gap:8}}><span style={{fontSize:12,color:'var(--muted2)'}}>{c.items.length}</span><i className={'ti '+(open?'ti-chevron-up':'ti-chevron-down')} style={{color:'var(--muted2)',fontSize:20}}></i></span>
                </div>
                {open && <div className="panel-b" style={{padding:'4px 14px 12px'}}>
                  {c.items.map(it=>(
                    <div key={it.id} style={{borderTop:'1px solid var(--border)',padding:'12px 2px'}}>
                      <div style={{display:'flex',gap:8,alignItems:'center',marginBottom:6}}>

                      </div>

                  ))}
                </div>}
              </div>
            );
          })}
        </div>}

      {seg==='suppliers'&&
        <div>
          {(nb.suppliers||[]).map(it=>(
            <div className="panel" key={it.id} style={{marginBottom:10}}>
              <div className="panel-b" style={{padding:'12px 16px'}}>
                <div style={{display:'flex',gap:8,marginBottom:8}}>
                  <input placeholder="Tên NCC" value={it.name} onChange={e=>setItem('suppliers',it.id,{name:e.target.value})} style={{...inp,fontWeight:700,flex:2}}/>
                  <input placeholder="SĐT" value={it.phone||''} onChange={e=>setItem('suppliers',it.id,{phone:e.target.value})} style={{...inp,flex:1}}/>
                  <button onClick={()=>delItem('suppliers',it.id)} style={{color:'var(--red)',padding:6,display:'flex'}}><i className="ti ti-trash" style={{fontSize:18}}></i></button>
                </div>
                <input placeholder="Ghi chú (chiết khấu, lịch giao…)" value={it.note||''} onChange={e=>setItem('suppliers',it.id,{note:e.target.value})} style={inp}/>
              </div>
            </div>
          ))}
          <button className="btn ghost" onClick={()=>addItem('suppliers',{name:'NCC mới',phone:'',note:''})}><i className="ti ti-plus"></i>Thêm nhà cung cấp</button>
        </div>}

      {seg==='data'&&
        <div className="panel">
          <div className="panel-h"><i className="ti ti-database lead"></i><b>Sao lưu & khôi phục dữ liệu</b></div>
          <div className="panel-b" style={{padding:'16px 18px'}}>
            <p style={{fontSize:13,color:'var(--muted)',lineHeight:1.6,marginBottom:14}}>Toàn bộ dữ liệu lưu trên trình duyệt máy này — <b>dễ mất khi xoá cache/đổi máy</b>. Hãy xuất file sao lưu định kỳ và cất giữ an toàn.</p>
            <div style={{display:'flex',gap:10,flexWrap:'wrap'}}>
              <button className="btn" onClick={onExport}><i className="ti ti-download"></i>Xuất file sao lưu (.json)</button>
              <label className="btn ghost" style={{cursor:'pointer'}}><i className="ti ti-upload"></i>Khôi phục từ file
                <input type="file" accept="application/json,.json" style={{display:'none'}} onChange={e=>{onImport(e.target.files[0]);e.target.value='';}}/>
              </label>
            </div>
            <div style={{marginTop:14,padding:'12px 14px',background:'var(--amber-lt)',borderRadius:12,fontSize:12.5,color:'var(--amber)',lineHeight:1.5}}>
              <i className="ti ti-alert-triangle"></i> Khôi phục sẽ <b>ghi đè</b> toàn bộ dữ liệu hiện tại bằng dữ liệu trong file.
            </div>
          </div>
        </div>}
    </div>
  );
}

/* ---------- Nghỉ & Thở (thiền có dẫn nhịp) ---------- */
const BREATH_PAT={
  box:{name:'Thở hộp · 4-4-4-4',sub:'Cân bằng & tập trung',steps:[['Hít vào',4,'in'],['Giữ',4,'hold'],['Thở ra',4,'out'],['Giữ',4,'hold']]},
  relax:{name:'Thư giãn · 4-7-8',sub:'Hạ căng thẳng, dễ ngủ',steps:[['Hít vào',4,'in'],['Giữ',7,'hold'],['Thở ra',8,'out']]},
  calm:{name:'Đều · 5-5',sub:'Nhẹ nhàng, dễ theo',steps:[['Hít vào',5,'in'],['Thở ra',5,'out']]},
};
function BreathMode({onClose,onLog}){
  const [phase,setPhase]=useState('setup'); // setup | run | done
  const [patKey,setPatKey]=useState('box');
  const [mins,setMins]=useState(5);
  const [elapsed,setElapsed]=useState(0);
  const [paused,setPaused]=useState(false);
  const [scale,setScale]=useState(0.5);
  const steps=BREATH_PAT[patKey].steps;
  const cyc=steps.reduce((a,s)=>a+s[1],0);
  const sessionLeft=Math.max(0,mins*60-elapsed);
  const inCyc=elapsed%cyc; let acc=0,idx=0; for(let i=0;i<steps.length;i++){ if(inCyc<acc+steps[i][1]){idx=i;break;} acc+=steps[i][1]; }
  const [lbl,dur,type]=steps[idx];
  const stepLeft=acc+dur-inCyc;

  useEffect(()=>{ if(phase!=='run'||paused) return; const t=setInterval(()=>setElapsed(e=>e+1),1000); return ()=>clearInterval(t); },[phase,paused]);
  useEffect(()=>{ if(phase==='run'&&sessionLeft<=0){ onLog(mins); setPhase('done'); } },[sessionLeft,phase]);
  useEffect(()=>{ if(phase!=='run')return; if(type==='in')setScale(1); else if(type==='out')setScale(0.45); },[idx,phase]);
  useEffect(()=>()=>Noise.stop(),[]);

  const mm=String(Math.floor(sessionLeft/60)).padStart(2,'0'), ss=String(sessionLeft%60).padStart(2,'0');
  const bg={position:'fixed',inset:0,zIndex:300,background:'linear-gradient(160deg,#0c2a2e,#103e43 55%,#07201f)',color:'#eafaf8',display:'flex',flexDirection:'column',overflowY:'auto'};
  const lightBtn={background:'rgba(255,255,255,.14)',color:'#eafaf8',border:'1px solid rgba(255,255,255,.2)'};
  const transDur=type==='hold'?0.4:dur;

  if(phase==='setup') return (
    <div style={bg}>
      <div style={{maxWidth:440,margin:'auto',padding:24,textAlign:'center',width:'100%'}}>
        <div style={{fontSize:48}}>🌿</div>
        <h1 style={{fontFamily:'Baloo 2',fontSize:26,margin:'10px 0 4px'}}>Nghỉ & Thở</h1>
        <p style={{opacity:.75,fontSize:13.5,marginBottom:20}}>Vài phút thở có nhịp để đầu óc nhẹ lại, rồi quay lại làm việc tỉnh táo hơn.</p>
        <div style={{fontSize:12,opacity:.7,fontWeight:600,marginBottom:8,textAlign:'left'}}>Kiểu thở</div>
        <div style={{display:'flex',flexDirection:'column',gap:10,marginBottom:20}}>
          {Object.keys(BREATH_PAT).map(k=>(
            <button key={k} onClick={()=>setPatKey(k)} style={{...(patKey===k?{background:'rgba(255,255,255,.2)',border:'1.5px solid rgba(255,255,255,.5)'}:lightBtn),padding:'12px 16px',borderRadius:12,textAlign:'left',cursor:'pointer'}}>
              <b style={{fontSize:14}}>{BREATH_PAT[k].name}</b><div style={{fontSize:11.5,opacity:.75}}>{BREATH_PAT[k].sub}</div>
            </button>
          ))}
        </div>
        <div style={{fontSize:12,opacity:.7,fontWeight:600,marginBottom:8,textAlign:'left'}}>Thời lượng</div>
        <div style={{display:'flex',gap:10,marginBottom:24}}>
          {[1,5,10].map(m=>(
            <button key={m} onClick={()=>setMins(m)} style={{...(mins===m?{background:'#eafaf8',color:'#0c2a2e'}:lightBtn),flex:1,padding:'14px',borderRadius:12,fontFamily:'Baloo 2',fontSize:18,fontWeight:700,cursor:'pointer'}}>{m}<span style={{fontSize:11,fontWeight:500,opacity:.7}}> phút</span></button>
          ))}
        </div>
        <button onClick={()=>{setElapsed(0);setScale(0.45);setPhase('run');}} style={{background:'#eafaf8',color:'#0c2a2e',padding:'14px 30px',borderRadius:30,fontWeight:700,border:0,cursor:'pointer',fontSize:15,width:'100%'}}><i className="ti ti-player-play"></i> Bắt đầu</button>
        <button onClick={onClose} style={{marginTop:16,background:'none',border:0,color:'rgba(255,255,255,.6)',fontSize:13,cursor:'pointer'}}>← Quay lại</button>
      </div>
    </div>
  );

  if(phase==='done') return (
    <div style={bg}>
      <div style={{margin:'auto',textAlign:'center',padding:24}}>
        <div style={{fontSize:52}}>🌸</div>
        <h1 style={{fontFamily:'Baloo 2',fontSize:24,margin:'8px 0'}}>Xong rồi, nhẹ hơn chưa?</h1>
        <p style={{opacity:.75,fontSize:13.5,marginBottom:20}}>Bạn vừa dành {mins} phút cho chính mình. Quay lại làm việc nhẹ nhàng nhé.</p>
        <button onClick={onClose} style={{background:'#eafaf8',color:'#0c2a2e',padding:'13px 30px',borderRadius:30,fontWeight:700,border:0,cursor:'pointer'}}>Quay lại làm việc</button>
      </div>
    </div>
  );

  return (
    <div style={bg}>
      <div style={{display:'flex',alignItems:'center',padding:'16px 20px'}}>
        <div style={{fontSize:12.5,opacity:.6,fontWeight:600,letterSpacing:'.04em'}}>🌿 NGHỈ & THỞ · {mm}:{ss}</div>
        <div style={{flex:1}}></div>
        <button onClick={()=>{onLog(Math.round(elapsed/60));onClose();}} style={{background:'none',border:0,color:'rgba(255,255,255,.55)',fontSize:22,cursor:'pointer',display:'flex'}}><i className="ti ti-x"></i></button>
      </div>
      <div style={{margin:'auto',textAlign:'center',padding:'10px 22px 40px',width:'100%'}}>
        <div style={{position:'relative',width:260,height:260,margin:'0 auto',display:'flex',alignItems:'center',justifyContent:'center'}}>
          <div style={{position:'absolute',width:260,height:260,borderRadius:'50%',background:'radial-gradient(circle,rgba(110,231,214,.28),rgba(110,231,214,.05))',transform:'scale('+scale+')',transition:'transform '+transDur+'s ease-in-out'}}></div>
          <div style={{position:'absolute',width:200,height:200,borderRadius:'50%',border:'2px solid rgba(234,250,248,.35)',transform:'scale('+scale+')',transition:'transform '+transDur+'s ease-in-out'}}></div>
          <div style={{position:'relative',textAlign:'center'}}>
            <div style={{fontFamily:'Baloo 2',fontSize:30,fontWeight:700}}>{lbl}</div>
            <div style={{fontSize:40,fontFamily:'Baloo 2',opacity:.85}}>{stepLeft}</div>
          </div>
        </div>
        <div style={{display:'flex',gap:10,justifyContent:'center',marginTop:32}}>
          <button onClick={()=>setPaused(p=>!p)} style={{background:'#eafaf8',color:'#0c2a2e',padding:'13px 26px',borderRadius:30,fontWeight:700,border:0,cursor:'pointer',display:'flex',alignItems:'center',gap:7}}><i className={'ti '+(paused?'ti-player-play':'ti-player-pause')}></i>{paused?'Tiếp tục':'Tạm dừng'}</button>
          <button onClick={()=>{onLog(Math.round(elapsed/60));setPhase('done');}} style={{...lightBtn,padding:'13px 20px',borderRadius:30,fontWeight:600,cursor:'pointer'}}>Kết thúc</button>
        </div>
        <div style={{marginTop:20,fontSize:12.5,opacity:.55}}>Theo vòng tròn: phình ra khi hít vào, co lại khi thở ra.</div>
        <div style={{marginTop:22}}><SoundBar/></div>
      </div>
    </div>
  );
}

/* ---------- Não khỏe: thói quen + năng lượng + nhắc nhịp ---------- */
const BRAIN_HABITS=[
  {id:'sleep',label:'Ngủ đủ 7h+',ic:'😴'},
  {id:'water',label:'Uống đủ nước',ic:'💧'},
  {id:'move',label:'Vận động / đi bộ',ic:'🚶'},
  {id:'sun',label:'Ra nắng buổi sáng',ic:'☀️'},
  {id:'nocaf',label:'Không caffeine buổi chiều',ic:'☕'},
  {id:'eat',label:'Ăn đủ chất, không bỏ bữa',ic:'🥗'},
];
const ENERGY=[{v:1,e:'😵',l:'Kiệt'},{v:2,e:'😴',l:'Mệt'},{v:3,e:'😐',l:'Bình thường'},{v:4,e:'🙂',l:'Khỏe'},{v:5,e:'🔥',l:'Sung'}];
function BrainEnergy({log,setLog,cfg,setCfg,onBreath}){
  const d=today();
  const day=log[d]||{habits:{},water:0};
  const setDay=(patch)=>setLog({...log,[d]:{...day,...patch}});
  const toggleH=(id)=>setDay({habits:{...day.habits,[id]:!day.habits[id]}});
  const setEnergy=(v)=>setDay({energy:v});
  const setWater=(n)=>setDay({water:Math.max(0,n)});
  const hDone=BRAIN_HABITS.filter(h=>day.habits&&day.habits[h.id]).length;
  // streak: số ngày liên tiếp (tính tới hôm nay/hôm qua) có ≥1 thói quen
  let streak=0, cur=new Date(d+'T00:00:00');
  const has=(ds)=>{const x=log[ds];return x&&((x.habits&&Object.values(x.habits).some(Boolean))||x.energy);};
  if(!has(d)) cur.setDate(cur.getDate()-1);
  while(has(dstr(cur))){ streak++; cur.setDate(cur.getDate()-1); }
  // 7 ngày
  const days7=[]; for(let i=6;i>=0;i--){ const ds=addDays(-i); const x=log[ds]; const c=x&&x.habits?Object.values(x.habits).filter(Boolean).length:0; days7.push({ds,c,lbl:['CN','T2','T3','T4','T5','T6','T7'][new Date(ds+'T00:00:00').getDay()]}); }
  const en=day.energy;
  const advice=!en?null : en<=2?{c:'var(--amber)',bg:'var(--amber-lt)',t:'Năng lượng thấp — làm việc nhẹ, chia nhỏ, và thở 5 phút. Để dành việc khó cho lúc khỏe hơn.'}
    : en===3?{c:'var(--blue)',bg:'var(--blue-lt)',t:'Ổn định — làm việc vừa sức, xen kẽ nghỉ ngắn theo nhịp.'}
    : {c:'var(--grn)',bg:'var(--grn-lt)',t:'Năng lượng cao — tấn công ngay việc khó nhất / "việc xương nhất" 🐸 khi não đang đỉnh!'};
  const cares=[['water','💧 Nhắc uống nước (mỗi 60′)'],['stand','🧍 Nhắc đứng dậy vận động (mỗi 50′)'],['eye','👀 Nhắc nghỉ mắt 20-20-20 (mỗi 20′)'],['caffeine','☕ Nhắc cắt caffeine (theo giờ)']];
  return (
    <div>
      {/* Check-in năng lượng */}
      <div className="panel">
        <div className="panel-h"><i className="ti ti-bolt lead"></i><b>Năng lượng não hôm nay</b></div>
        <div className="panel-b" style={{padding:'16px 18px'}}>
          <div style={{display:'flex',gap:8,justifyContent:'space-between'}}>
            {ENERGY.map(x=>(
              <button key={x.v} onClick={()=>setEnergy(x.v)} style={{flex:1,padding:'10px 4px',borderRadius:12,border:'1.5px solid '+(en===x.v?'var(--o)':'var(--border)'),background:en===x.v?'var(--o-lt)':'var(--bg)',cursor:'pointer'}}>
                <div style={{fontSize:26}}>{x.e}</div><div style={{fontSize:11,fontWeight:600,color:en===x.v?'var(--o-dk)':'var(--muted)',marginTop:2}}>{x.l}</div>
              </button>
            ))}
          </div>
          {advice && <div style={{marginTop:14,padding:'12px 14px',borderRadius:12,background:advice.bg,color:advice.c,fontSize:13,fontWeight:500,display:'flex',gap:8,alignItems:'center'}}>
            <i className="ti ti-bulb" style={{fontSize:18}}></i><span style={{flex:1}}>{advice.t}</span>
            {en<=2 && <button className="btn sm" style={{flexShrink:0}} onClick={onBreath}>Thở 5′</button>}
          </div>}
        </div>
      </div>

      {/* Thói quen não khỏe */}
      <div className="panel">
        <div className="panel-h"><i className="ti ti-checklist lead"></i><b>Thói quen não khỏe</b>
          <div style={{flex:1}}></div>
          {streak>0 && <span className="streak"><i className="ti ti-flame"></i>{streak} ngày</span>}
        </div>
        <div className="panel-b" style={{padding:'12px 18px 16px'}}>
          <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:12}}>
            <div className="prog full" style={{flex:1,height:9}}><i style={{width:(hDone/BRAIN_HABITS.length*100)+'%'}}></i></div>
            <b style={{fontFamily:'Baloo 2',color:'var(--grn)',fontSize:14}}>{hDone}/{BRAIN_HABITS.length}</b>
          </div>
          {BRAIN_HABITS.map(h=>{const on=day.habits&&day.habits[h.id];return (
            <div key={h.id} className={'row'+(on?' done':'')} style={{padding:'9px 0'}} onClick={()=>toggleH(h.id)}>
              <span className={'chk'+(on?' done':'')}>{on&&<i className="ti ti-check"></i>}</span>
              <div className="rt" style={{cursor:'pointer'}}><b style={{fontWeight:500}}>{h.ic} {h.label}</b></div>
            </div>
          );})}
          {/* nước hôm nay */}
          <div style={{display:'flex',alignItems:'center',gap:10,marginTop:12,padding:'10px 12px',background:'var(--bg)',borderRadius:12}}>
            <span style={{fontSize:18}}>💧</span><b style={{flex:1,fontSize:13}}>Số ly nước hôm nay</b>
            <button className="btn ghost sm" onClick={()=>setWater((day.water||0)-1)}><i className="ti ti-minus"></i></button>
            <b style={{fontFamily:'Baloo 2',fontSize:18,minWidth:30,textAlign:'center'}}>{day.water||0}</b>
            <button className="btn ghost sm" onClick={()=>setWater((day.water||0)+1)}><i className="ti ti-plus"></i></button>
          </div>
          {/* 7 ngày */}
          <div style={{display:'flex',gap:6,marginTop:16}}>
            {days7.map((x,i)=>(
              <div key={i} style={{flex:1,textAlign:'center'}}>
                <div style={{height:30,borderRadius:7,background:x.c===0?'var(--bg)':'var(--grn-lt)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:11,fontWeight:700,color:x.c?'var(--grn)':'var(--muted2)',border:x.ds===d?'1.5px solid var(--o)':'1px solid var(--border)'}}>{x.c||''}</div>
                <div style={{fontSize:10,color:'var(--muted)',marginTop:3}}>{x.lbl}</div>
              </div>
            ))}
          </div>
        </div>
      </div>

      {/* Nhắc nhịp chăm sóc */}
      <div className="panel">
        <div className="panel-h"><i className="ti ti-bell lead"></i><b>Nhắc nhịp chăm sóc</b><span style={{marginLeft:'auto',fontSize:11.5,color:'var(--muted2)'}}>khi app đang mở</span></div>
        <div className="panel-b" style={{padding:'8px 18px 16px'}}>
          {cares.map(([k,lbl])=>(
            <div key={k} className="row" style={{padding:'11px 0'}} onClick={()=>setCfg({...cfg,[k]:!cfg[k]})}>
              <div className="rt"><b style={{fontWeight:500,fontSize:13.5}}>{lbl}</b></div>
              <div style={{width:44,height:25,borderRadius:13,background:cfg[k]?'var(--grn)':'var(--border2)',position:'relative',transition:'background .15s',flexShrink:0}}>
                <div style={{position:'absolute',top:2,left:cfg[k]?22:2,width:21,height:21,borderRadius:'50%',background:'#fff',transition:'left .15s',boxShadow:'0 1px 3px rgba(0,0,0,.3)'}}></div>
              </div>
            </div>
          ))}
          {cfg.caffeine &&
            <div style={{display:'flex',alignItems:'center',gap:8,marginTop:8,fontSize:13,color:'var(--muted)'}}>
              Giờ cắt caffeine:
              <input type="number" min="10" max="20" value={cfg.caffeineHour||14} onChange={e=>setCfg({...cfg,caffeineHour:+e.target.value})} style={{...selSt,width:64,padding:'6px 8px'}}/> giờ
            </div>}
        </div>
      </div>
    </div>
  );
}

/* ---------- Kiến thức kinh doanh ---------- */
const KNOWLEDGE=[
 {id:'fin',name:'Dòng tiền & Tài chính',ic:'💵',color:'#16a34a',bg:'#dcfce7',lessons:[
   {id:'fin1',t:'Dòng tiền ≠ Lợi nhuận',min:2,body:['Lợi nhuận là con số trên sổ; dòng tiền là tiền THẬT trong két.','Bạn có thể lãi nhưng hết tiền mặt vì vốn kẹt trong hàng tồn & công nợ.','Cửa hàng chết vì hết tiền mặt, không phải vì hết lãi.'],a:'Mỗi tuần ghi "tiền mặt còn lại" vào Sổ KD — đừng để tồn kho nuốt hết tiền.'},
   {id:'fin2',t:'Điểm hòa vốn — con số sống còn',min:2,body:['Là mức doanh thu vừa đủ bù mọi chi phí, chưa lãi chưa lỗ.','Dưới mức này là đang đốt tiền; trên mức này mới có lãi.'],f:'Hòa vốn = Chi phí cố định ÷ Biên lợi nhuận gộp (%)',a:'CP cố định 230tr, biên 13,5% → hòa vốn ≈ 1,7 tỷ/tháng. Suy ra mục tiêu doanh thu/ngày.'},
   {id:'fin3',t:'Biên gộp & biên ròng',min:2,body:['Biên gộp = (Giá bán − Giá vốn) ÷ Giá bán — đo sức kiếm lời của hàng.','Biên ròng = lãi sau khi trừ HẾT chi phí (lương, mặt bằng, ads…).','Biên gộp cao chưa chắc lãi ròng nếu bán chậm / chi phí lớn.'],a:'Biết biên gộp từng nhóm hàng để đẩy nhóm lãi thật, bớt nhóm "doanh thu ảo".'},
   {id:'fin4',t:'Vòng quay vốn & quỹ "oxy"',min:2,body:['Tiền phải chạy: nhập → bán → thu → nhập lại. Quay nhanh, 1 đồng vốn đẻ nhiều lãi.','Tồn nằm lâu = tiền chết.','Giữ "quỹ oxy" ≥ 1 tháng chi phí bằng tiền mặt, không đụng vào nhập hàng.'],a:'Năm xấu: ưu tiên quay vòng nhanh hơn là ôm nhiều hàng.'},
 ]},
 {id:'price',name:'Định giá & Lợi nhuận',ic:'🏷️',color:'#f97316',bg:'#fff7ed',lessons:[
   {id:'pr1',t:'Markup vs Margin — đừng nhầm',min:2,body:['Markup = lãi so với GIÁ VỐN. Margin = lãi so với GIÁ BÁN.','Nhầm là tưởng lãi nhiều mà thực ra mỏng.'],f:'Margin = Markup ÷ (1 + Markup). VD markup 50% → margin chỉ 33%.',a:'Khi tính lời, luôn quy về margin trên giá bán để không ảo tưởng.'},
   {id:'pr2',t:'3 cách định giá',min:2,body:['Theo chi phí: giá vốn + mức lãi (an toàn nhưng dễ bỏ lỡ giá trị).','Theo thị trường: nhìn đối thủ (dễ vào cuộc đua giá).','Theo giá trị: khách sẵn trả bao nhiêu cho lợi ích họ nhận.'],a:'Hàng thiết yếu (bỉm/sữa) bám giá thị trường; hàng tư vấn/combo định theo giá trị để nâng biên.'},
   {id:'pr3',t:'Hàng dẫn khách vs hàng tạo lãi',min:2,body:['Hàng dẫn khách (bỉm, sữa phổ thông): biên mỏng nhưng kéo khách đến đều.','Hàng tạo lãi (vitamin, phụ kiện, combo): biên cao, cần tư vấn để bán kèm.'],a:'Đừng kỳ vọng lãi ở hàng dẫn khách — kiếm lời ở hàng bán kèm.'},
   {id:'pr4',t:'Combo & upsell',min:2,body:['Combo giúp khách tiện + tiết kiệm, đồng thời nâng giá trị đơn và biên.','Upsell = gợi loại tốt hơn; cross-sell = gợi món đi kèm.','Combo phải THỰC DỤNG, không nhồi cho to bill.'],a:'"Giỏ đồ đi sinh", combo ăn dặm theo tháng tuổi bé.'},
 ]},
 {id:'inv',name:'Quản lý tồn kho',ic:'📦',color:'#7c3aed',bg:'#ede9fe',lessons:[
   {id:'inv1',t:'Vòng quay tồn kho',min:2,body:['Đo số lần bán hết & nhập lại trong kỳ. Quay nhanh = vốn khỏe.','Hàng >60 ngày là cảnh báo giam vốn.'],f:'Vòng quay = Giá vốn hàng bán ÷ Tồn kho trung bình',a:'Theo dõi mã quay chậm; hàng >60 ngày phải có kế hoạch xả.'},
   {id:'inv2',t:'Phân loại ABC',min:2,body:['A: ~20% mã tạo ~80% doanh thu — chăm kỹ, không để hết hàng.','B: mức trung bình. C: nhiều mã nhưng đóng góp ít — giữ gọn nhẹ.'],a:'Dồn vốn & chú ý nhóm A; cắt bớt nhóm C nhập theo cảm tính.'},
   {id:'inv3',t:'Cận date & nguyên tắc FEFO',min:2,body:['FEFO = hàng hết hạn trước thì bán trước (quan trọng với sữa, ăn dặm).','Đặt ngưỡng xả sớm TRƯỚC khi cận date, đừng chờ sát hạn.'],a:'Chia tồn theo tuổi hàng; cận date → đẩy combo/giảm giá có kiểm soát.'},
 ]},
 {id:'cus',name:'Khách hàng & Giữ chân',ic:'❤️',color:'#db2777',bg:'#fce7f3',lessons:[
   {id:'cus1',t:'Giá trị trọn đời khách (CLV)',min:2,body:['Một khách mẹ bỉm mua lại hàng chục lần/năm trong 2–3 năm.','Giá trị thật không nằm ở 1 đơn, mà ở cả vòng đời mua hàng.'],f:'CLV ≈ Giá trị đơn TB × Số lần mua/năm × Số năm gắn bó',a:'Đầu tư chăm khách thân — đó là lợi nhuận bền nhất.'},
   {id:'cus2',t:'Chi phí có khách (CAC)',min:2,body:['CAC = tổng chi marketing ÷ số khách mới có được.','Nếu CAC > lãi từ khách đó → đang mua khách lỗ.'],a:'So CAC với CLV; mẹ&bé CLV cao nên đầu tư có khách rồi GIỮ là đáng.'},
   {id:'cus3',t:'Phân nhóm khách RFM',min:2,body:['R (mua gần đây), F (tần suất), M (giá trị) — chấm khách theo 3 chiều.','Khách mua gần đây + thường xuyên + chi nhiều = nhóm vàng.'],a:'Trên Zalo, gắn nhãn nhóm để nhắc mua lại & ưu đãi đúng người.'},
   {id:'cus4',t:'Giữ khách rẻ hơn tìm khách mới',min:2,body:['Có khách mới tốn gấp nhiều lần giữ khách cũ.','Tăng nhẹ tỷ lệ giữ chân có thể tăng lợi nhuận đáng kể.'],a:'Nhắc mua lại đúng chu kỳ, chăm theo tuổi bé thay vì chỉ chạy ads.'},
 ]},
 {id:'mkt',name:'Marketing thực dụng',ic:'📣',color:'#2563eb',bg:'#dbeafe',lessons:[
   {id:'mkt1',t:'Phễu khách hàng',min:2,body:['Biết → Thích → Tin → Mua → Quay lại. Mỗi tầng rơi rớt bớt.','Đừng chỉ lo "có đơn", phải lấy thông tin (Zalo) để chăm tiếp.'],a:'Nội dung kiến thức xây "Tin"; Zalo OA lo "Quay lại".'},
   {id:'mkt2',t:'ROAS — quảng cáo có lời không',min:2,body:['ROAS đo doanh thu thu về trên mỗi đồng quảng cáo.','ROAS phải đủ cao để bù biên mỏng + chi phí khác, nếu không vẫn lỗ.'],f:'ROAS = Doanh thu từ ads ÷ Chi phí ads',a:'Mỗi chiến dịch ghi chi/đơn/lãi & khách có quay lại không — đừng chạy "hy vọng".'},
   {id:'mkt3',t:'Thương hiệu nhỏ thắng ở đâu',min:2,body:['Không đua giá với chuỗi lớn.','Thắng bằng: tư vấn thật, nhớ khách, giao nhanh khu vực, niềm tin.'],a:'Với mẹ&bé, NIỀM TIN & tư vấn đúng quan trọng hơn rẻ vài nghìn.'},
 ]},
 {id:'mind',name:'Tư duy chủ shop',ic:'🧭',color:'#0891b2',bg:'#cffafe',lessons:[
   {id:'mind1',t:'Quản trị bằng số, không bằng cảm giác',min:2,body:['"Cái gì đo được mới quản được."','Quyết định bằng dữ liệu thật, không bằng cảm giác.'],a:'Dùng Sổ KD & Thống kê hằng tuần thay vì đoán.'},
   {id:'mind2',t:'Gấp vs Quan trọng (ma trận Eisenhower)',min:2,body:['Quan trọng + gấp: làm ngay.','Quan trọng + không gấp: LÊN LỊCH (quyết định tương lai, dễ bị bỏ quên).','Gấp + không quan trọng: giao bớt. Không gì cả: bỏ.'],a:'Việc "xây hệ thống, chăm khách thân" là quan trọng-không-gấp — đừng để việc vặt nuốt hết.'},
   {id:'mind3',t:'Quản trị rủi ro & năm xấu',min:2,body:['Chuẩn bị kịch bản TRƯỚC khi xấu xảy ra (DT giảm 10/20/30%).','Năm tốt doanh thu cứu bạn; năm xấu DÒNG TIỀN cứu bạn.'],a:'Giữ quỹ oxy, giảm tồn chậm, giữ khách thân — đã có trong kế hoạch phòng thủ.'},
 ]},
 {id:'law',name:'Thuế & Pháp lý hộ KD',ic:'🧾',color:'#0d9488',bg:'#ccfbf1',tag:'CẬP NHẬT 2026',lessons:[
   {id:'law1',t:'Thuế khoán vs kê khai — đang đổi từ 2026',min:3,body:['Trước đây hộ KD nộp THUẾ KHOÁN (mức cố định ấn định).','Lộ trình 2026: bỏ dần thuế khoán, hộ doanh thu lớn chuyển sang KÊ KHAI theo doanh thu thực + sổ sách.','Thuế GTGT+TNCN ngành bán lẻ hàng hóa khoảng 1,5% doanh thu.'],a:'Dữ liệu bán hàng sạch (1 phần mềm) giúp kê khai dễ. Nên có kế toán/đại lý thuế tư vấn theo quy định mới nhất.'},
   {id:'law2',t:'Hóa đơn điện tử từ máy tính tiền',min:2,body:['Hộ KD doanh thu lớn phải dùng HÓA ĐƠN ĐIỆN TỬ khởi tạo từ máy tính tiền, kết nối cơ quan thuế.','Phần mềm bán hàng (KiotViet/Sapo…) thường tích hợp sẵn HĐĐT.'],a:'Chọn phần mềm có HĐĐT để vừa quản lý vừa đúng luật, đỡ làm tay.'},
   {id:'law3',t:'ATTP & nhãn mác hàng mẹ&bé',min:3,body:['Sữa, thực phẩm ăn dặm, TPCN cần công bố/đủ điều kiện ATTP.','Hàng nhập khẩu phải có TEM NHÃN PHỤ tiếng Việt, nguồn gốc, hạn dùng rõ ràng.','Giữ hóa đơn/chứng từ nhập để chứng minh hàng chính hãng.'],a:'Tránh nhập hàng trôi nổi không giấy tờ — rủi ro phạt & mất niềm tin khách.'},
   {id:'law4',t:'Chính sách đổi trả & quyền lợi khách',min:2,body:['Chính sách đổi trả rõ ràng, công khai làm khách yên tâm mua.','Bán đúng hàng chính hãng, tư vấn trung thực, không nhập nhèm thông tin.'],a:'Niềm tin là lợi thế cạnh tranh lớn nhất của shop mẹ&bé.'},
 ]},
 {id:'hr',name:'Nhân sự & Đội nhóm',ic:'👥',color:'#ea580c',bg:'#ffedd5',lessons:[
   {id:'hr1',t:'Tuyển đúng người',min:2,body:['Với cửa hàng nhỏ: THÁI ĐỘ & sự tin cậy quan trọng hơn kỹ năng (kỹ năng dạy được).','Thử việc rõ ràng: kỳ vọng, tiêu chí đánh giá cụ thể.'],a:'Tuyển người chịu học chốt Zalo, chăm khách, kiểm kho — không chỉ đứng bán.'},
   {id:'hr2',t:'Đào tạo bằng SOP & đa năng',min:2,body:['Có quy trình chuẩn (SOP) thì người mới vào việc nhanh, ít sai.','1 nhân viên đa năng = bán + chốt Zalo + kiểm kho + gợi ý combo.'],a:'Dùng Sổ tay → mục Quy trình làm tài liệu đào tạo cho nhân viên mới.'},
   {id:'hr3',t:'Lương + thưởng theo kết quả',min:2,body:['Lương cứng giữ thấp hợp lý; thưởng gắn với doanh số, đơn chốt, khách quay lại.','Thưởng đúng việc tạo ra tiền → nhân viên chủ động hơn.'],a:'VD thưởng theo số đơn chốt qua Zalo / combo bán thêm.'},
   {id:'hr4',t:'Giữ người giỏi',min:2,body:['Người giỏi rời đi vì môi trường & sự ghi nhận, không chỉ vì lương.','Ghi nhận công khai, lộ trình rõ, đối xử công bằng.'],a:'Giữ được 1 nhân viên cứng = đỡ tốn tuyển + đào tạo lại nhiều lần.'},
 ]},
 {id:'omni',name:'Bán hàng đa kênh',ic:'🛒',color:'#9333ea',bg:'#f3e8ff',lessons:[
   {id:'omni1',t:'Mỗi kênh một vai trò',min:2,body:['TikTok/Facebook: khám phá, kéo khách mới.','Shopee/TikTok Shop: chốt đơn, tiếp cận người săn hàng.','Zalo OA + cửa hàng: giữ chân, bán lại, tư vấn sâu.'],a:'Đừng dồn mọi kỳ vọng vào 1 kênh — phối hợp theo đúng vai trò.'},
   {id:'omni2',t:'Đồng bộ tồn kho & đơn về 1 nơi',min:2,body:['Bán nhiều kênh dễ bán trùng / hết hàng mà không biết.','Một phần mềm hợp nhất tồn + đơn từ mọi kênh → số liệu sạch.'],a:'Đây cũng là điều kiện để AI & báo cáo hoạt động chính xác.'},
   {id:'omni3',t:'Trải nghiệm nhất quán',min:2,body:['Giá, thông tin, chăm sóc nên đồng nhất giữa các kênh.','Khách thấy lệch giá/thông tin sẽ mất tin tưởng.'],a:'Thống nhất bảng giá & kịch bản tư vấn dùng chung mọi kênh.'},
 ]},

function Knowledge({learned,setLearned}){
  const all=KNOWLEDGE.flatMap(t=>t.lessons);
  const doneN=all.filter(l=>learned[l.id]).length;
  const next=all.find(l=>!learned[l.id]);
  const nextTopic=next?KNOWLEDGE.find(t=>t.lessons.some(l=>l.id===next.id)):null;
  const [openT,setOpenT]=useState(next?nextTopic.id:KNOWLEDGE[0].id);
  const [openL,setOpenL]=useState(next?next.id:null);
  const mark=(id)=>setLearned({...learned,[id]:!learned[id]});
  const goLesson=(tid,lid)=>{ setOpenT(tid); setOpenL(lid); };
  const Lesson=(l)=>(
    <div key={l.id} style={{borderTop:'1px solid var(--border)'}}>
      <div className="row" style={{padding:'11px 4px',cursor:'pointer'}} onClick={()=>setOpenL(openL===l.id?null:l.id)}>
        <span className={'chk'+(learned[l.id]?' done':'')} onClick={e=>{e.stopPropagation();mark(l.id);}}>{learned[l.id]&&<i className="ti ti-check"></i>}</span>
        <div className="rt"><b style={{fontWeight:600,fontSize:13.5,textDecoration:learned[l.id]?'line-through':'none',color:learned[l.id]?'var(--muted)':'var(--ink)'}}>{l.t}</b><small>{l.min} phút đọc</small></div>
        <i className={'ti '+(openL===l.id?'ti-chevron-up':'ti-chevron-down')} style={{color:'var(--muted2)'}}></i>
      </div>
      {openL===l.id &&
        <div style={{padding:'4px 6px 16px',animation:'fade .2s'}}>
          <ul style={{margin:'0 0 0 4px',paddingLeft:18,fontSize:13.5,lineHeight:1.7,color:'var(--ink)'}}>
            {l.body.map((b,i)=><li key={i} style={{marginBottom:4}}>{b}</li>)}
          </ul>
          {l.f && <div style={{margin:'12px 0',padding:'10px 13px',background:'var(--bg)',borderLeft:'3px solid var(--o)',borderRadius:8,fontSize:13,fontWeight:600}}>📐 {l.f}</div>}
          <div style={{marginTop:12,padding:'11px 13px',background:'var(--o-lt)',borderRadius:10,fontSize:13,color:'var(--o-dk)',lineHeight:1.55}}><b>Áp dụng cho Hương Diện:</b> {l.a}</div>
          <button className={'btn'+(learned[l.id]?' ghost':'')+' sm'} style={{marginTop:12}} onClick={()=>mark(l.id)}><i className={'ti '+(learned[l.id]?'ti-rotate':'ti-check')}></i>{learned[l.id]?'Bỏ đánh dấu':'Đánh dấu đã học'}</button>
        </div>}
    </div>
  );
  return (
    <div>
      {/* tiến độ */}
      <div className="panel">
        <div className="panel-b" style={{padding:'16px 18px',display:'flex',alignItems:'center',gap:14}}>
          <Ring pct={all.length?Math.round(doneN/all.length*100):0} size={50} color="#4f46e5"/>
          <div style={{flex:1}}>
            <b style={{fontFamily:'Baloo 2',fontSize:16}}>Đã học {doneN}/{all.length} bài</b>
            <div style={{fontSize:12.5,color:'var(--muted)'}}>{KNOWLEDGE.length} chủ đề cốt lõi cho chủ shop</div>
          </div>
        </div>
      </div>

      {/* gợi ý bài tiếp theo */}
      {next &&
        <div onClick={()=>goLesson(nextTopic.id,next.id)} style={{display:'flex',alignItems:'center',gap:13,background:'linear-gradient(135deg,#312e81,#4f46e5)',borderRadius:16,padding:'15px 18px',marginBottom:18,color:'#fff',cursor:'pointer',boxShadow:'var(--sh)'}}>
          <div style={{fontSize:28}}>{nextTopic.ic}</div>
          <div style={{flex:1,minWidth:0}}><div style={{fontSize:11.5,opacity:.85,fontWeight:600}}>HỌC TIẾP</div><b style={{fontFamily:'Baloo 2',fontSize:15.5}}>{next.t}</b><div style={{fontSize:12,opacity:.8}}>{nextTopic.name} · {next.min} phút</div></div>
          <span className="btn sm" style={{background:'rgba(255,255,255,.2)',pointerEvents:'none'}}>Học ngay</span>
        </div>}

      {/* chủ đề */}
      {KNOWLEDGE.map(tp=>{
        const dn=tp.lessons.filter(l=>learned[l.id]).length;
        const open=openT===tp.id;
        return (
          <div className="panel" key={tp.id} style={{marginBottom:12}}>
            <div className="panel-h" style={{cursor:'pointer'}} onClick={()=>setOpenT(open?null:tp.id)}>
              <div style={{width:34,height:34,borderRadius:10,background:tp.bg,color:tp.color,display:'flex',alignItems:'center',justifyContent:'center',fontSize:18}}>{tp.ic}</div>
              <div style={{flex:1}}>
                <b style={{fontSize:14.5,fontFamily:'Baloo 2'}}>{tp.name} {tp.tag&&<span className="tag" style={{background:'var(--blue-lt)',color:'var(--blue)',marginLeft:4,verticalAlign:'middle'}}>✨ {tp.tag}</span>}</b>
                <div style={{fontSize:12,color:'var(--muted)'}}>{dn}/{tp.lessons.length} bài đã học</div>
              </div>
              <i className={'ti '+(open?'ti-chevron-up':'ti-chevron-down')} style={{color:'var(--muted2)',fontSize:20}}></i>
            </div>
            {open && <div className="panel-b" style={{padding:'2px 16px 8px'}}>{tp.lessons.map(Lesson)}</div>}
          </div>
        );
      })}
    </div>
  );
}

/* ---------- Task Modal ---------- */
function TaskModal({task,onSave,onDel,onClose}){
  const [f,setF]=useState({...task,checklist:task.checklist?[...task.checklist]:[]});
  const set=(k,v)=>setF(p=>({...p,[k]:v}));
  const addCk=()=>set('checklist',[...f.checklist,{t:'',done:false}]);
  const setCk=(i,v)=>set('checklist',f.checklist.map((c,j)=>j===i?{...c,t:v}:c));
  const delCk=(i)=>set('checklist',f.checklist.filter((_,j)=>j!==i));
  const submit=()=>{
    if(!f.title.trim())return;
    const cl=f.checklist.filter(c=>c.t.trim());
    let prog=f.progress, status=f.status;
    if(status==='done')prog=100;
    delete f._new;
    onSave({...f,title:f.title.trim(),checklist:cl,progress:prog,status,doneAt:status==='done'?(task.doneAt||today()):undefined});
  };
  return (
    <div className="ov" onClick={onClose}>
      <div className="modal" onClick={e=>e.stopPropagation()}>
        <div className="modal-h">
          <b>{task._new?'Thêm công việc':'Sửa công việc'}</b>
          <button className="x" onClick={onClose}><i className="ti ti-x"></i></button>
        </div>
        <div className="modal-b">
          <div className="fld">
            <label>Tên công việc</label>
            <input autoFocus placeholder="VD: Nhập 5 thùng bỉm Bobby…" value={f.title} onChange={e=>set('title',e.target.value)}/>
          </div>
          <button onClick={()=>set('frog',!f.frog)} style={{display:'flex',alignItems:'center',gap:9,width:'100%',padding:'11px 13px',borderRadius:11,marginBottom:15,border:'1.5px solid '+(f.frog?'var(--grn)':'var(--border)'),background:f.frog?'var(--grn-lt)':'var(--bg)',color:f.frog?'var(--grn)':'var(--muted)',fontWeight:600,fontSize:13,cursor:'pointer',textAlign:'left'}}>
            <span style={{fontSize:20}}>🐸</span><span style={{flex:1}}>Việc xương nhất hôm nay {f.frog?'— đã chọn':''}</span>
            <i className={'ti '+(f.frog?'ti-checkbox':'ti-square')} style={{fontSize:20}}></i>
          </button>
          <div className="fld">
            <label>Thuộc mảng</label>
            <div className="chips">
              {PROJECTS.map(p=>(
                <button key={p.id} className={'chip'+(f.proj===p.id?' on':'')} onClick={()=>set('proj',p.id)}>{p.icon} {p.name}</button>
              ))}
            </div>
          </div>
          <div className="frow">
            <div className="fld">
              <label>Mức ưu tiên</label>
              <div className="chips">
                {Object.keys(PRI).map(k=>(
                  <button key={k} className={'chip prichip '+k+(f.pri===k?' on':'')} onClick={()=>set('pri',k)}>{PRI[k]}</button>
                ))}
              </div>
            </div>
            <div className="fld">
              <label>Hạn chót</label>
              <input type="date" value={f.due||''} onChange={e=>set('due',e.target.value)}/>
            </div>
          </div>
          <div className="fld">
            <label>Trạng thái</label>
            <div className="chips">
              {Object.keys(STATUS).map(k=>(
                <button key={k} className={'chip'+(f.status===k?' on':'')} onClick={()=>set('status',k)}>{STATUS[k].name}</button>
              ))}
            </div>
          </div>
          <div className="fld">
            <label>Thời lượng ước tính (giờ) — để trống sẽ tự tính</label>
            <input type="number" min="0.5" step="0.5" placeholder={'Tự tính ~'+estOf(f)+'h'} value={f.est||''} onChange={e=>set('est',e.target.value?+e.target.value:undefined)}/>
          </div>
          {f.status!=='done' &&
          <div className="fld">
            <label>Tiến độ</label>
            <div className="rng">
              <input type="range" min="0" max="100" step="5" value={f.progress} onChange={e=>set('progress',+e.target.value)}/>
              <b>{f.progress}%</b>
            </div>
          </div>}
          <div className="fld">
            <label>Ghi chú</label>
            <textarea placeholder="Chi tiết, ghi chú thêm…" value={f.note||''} onChange={e=>set('note',e.target.value)}></textarea>
          </div>
          <div className="fld">
            <label>Việc nhỏ (checklist)</label>
            {f.checklist.map((c,i)=>(
              <div className="ckedit" key={i}>
                <input placeholder={'Bước '+(i+1)} value={c.t} onChange={e=>setCk(i,e.target.value)}/>
                <button onClick={()=>delCk(i)}><i className="ti ti-trash"></i></button>
              </div>
            ))}
            <button className="btn ghost sm" onClick={addCk}><i className="ti ti-plus"></i>Thêm bước</button>
          </div>
          {!task._new &&
            <button className="del" onClick={()=>onDel(f.id)}><i className="ti ti-trash"></i>Xoá công việc này</button>}
        </div>
        <div className="modal-f">
          <button className="btn ghost" style={{flex:'0 0 auto',padding:'12px 18px'}} onClick={onClose}>Huỷ</button>
          <button className="btn" onClick={submit}><i className="ti ti-check"></i>Lưu công việc</button>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
