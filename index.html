        <i className="ti ti-truck-delivery" style={{fontSize:17,flexShrink:0}}></i>
        <span style={{flex:1}}><b>App đã chuyển sang địa chỉ mới.</b> Bấm vào đây để mang việc và tài khoản sang.</span>
        <i className="ti ti-chevron-right" style={{fontSize:16,flexShrink:0}}></i>
      </div>
      <div style={{height:38}}></div>
      {mo&&(
        <div onClick={e=>{ if(e.target===e.currentTarget) setMo(false); }} style={{position:'fixed',inset:0,zIndex:9999,background:'rgba(0,0,0,.45)',display:'flex',alignItems:'center',justifyContent:'center',padding:18}}>
          <div style={{width:'100%',maxWidth:400,background:'var(--card)',borderRadius:17,padding:20,boxShadow:'0 18px 50px rgba(0,0,0,.3)',maxHeight:'88vh',overflowY:'auto'}}>
            <b style={{fontFamily:'Baloo 2',fontSize:18,display:'block',marginBottom:8}}>Mang dữ liệu sang địa chỉ mới</b>
            {buoc!=='xong'&&(
              <p style={{fontSize:13,color:'var(--muted)',lineHeight:1.65,margin:'0 0 15px'}}>Việc, tài khoản và ghi chép đang nằm trong bộ nhớ của <b>riêng địa chỉ này</b>, nên mở địa chỉ mới sẽ thấy trống trơn. Bấm nút dưới: máy sẽ gửi toàn bộ dữ liệu lên đám mây rồi mở địa chỉ mới và tự kéo về.</p>
            )}
            {buoc==='xong'?(
              <React.Fragment>
                <p style={{fontSize:13,color:'var(--muted)',lineHeight:1.65,margin:'0 0 12px'}}>Dữ liệu đã lên đám mây. Bấm nút dưới để sang địa chỉ mới — bên đó tự kéo về, không phải gõ gì.</p>
                <a className="btn" href={DIA_CHI_MOI+'#dongbo='+encodeURIComponent(ma)} style={{width:'100%',justifyContent:'center',marginBottom:13,textDecoration:'none'}}><i className="ti ti-arrow-right"></i>Sang địa chỉ mới ngay</a>
                <div style={{fontSize:12,color:'var(--muted2)',marginBottom:6}}>Máy khác thì mở <b>{DIA_CHI_MOI.replace('https://','')}</b> rồi chọn <b>Nhập mã đồng bộ</b> và gõ mã này:</div>
                <div style={oMa}>{ma}</div>
                <div style={{fontSize:11.5,color:'var(--muted2)',marginTop:9,lineHeight:1.55}}>Mã này là chìa khoá vào toàn bộ dữ liệu cửa hàng — chỉ đưa cho người trong đội.</div>
              </React.Fragment>
            ):(
              <button className="btn" disabled={buoc==='dang'} style={{width:'100%',justifyContent:'center'}} onClick={mangSang}>
                <i className="ti ti-cloud-upload"></i>{buoc==='dang'?'Đang gửi dữ liệu lên…':'Mang dữ liệu sang'}
              </button>
            )}
            {buoc==='loi'&&<div style={{marginTop:12,padding:'10px 12px',background:'var(--red-lt)',color:'var(--red)',borderRadius:11,fontSize:12.5,lineHeight:1.5}}>Chưa gửi được. Kiểm tra mạng rồi bấm lại — dữ liệu trên máy này vẫn còn nguyên.</div>}
            <button className="btn ghost sm" style={{width:'100%',justifyContent:'center',marginTop:9}} onClick={()=>setMo(false)}>Để lúc khác</button>
          </div>
        </div>
      )}
    </React.Fragment>
  );
}

function Root(){
  const [users,setUsersState]=useState(()=>Auth.users());
  const [roles,setRolesState]=useState(()=>Auth.roles());
  const [curId,setCurId]=useState(()=>{ const s=Auth.session(); return (s&&s.uid)||null; });
  const [pulled,setPulled]=useState(!Sync.enabled());
  const setUsers=(u)=>{ setUsersState(u); Auth.saveUsers(u); };
  const setRoles=(r)=>{ setRolesState(r); Auth.saveRoles(r); };
  /* kéo dữ liệu mới nhất từ cloud TRƯỚC khi dựng màn khoá, để danh sách tài khoản luôn mới */
  useEffect(()=>{
    if(!Sync.enabled()){ setPulled(true); return; }
    Sync.pull().then(r=>{ if(r&&r.changed){ location.reload(); return; } setUsersState(Auth.users()); setRolesState(Auth.roles()); setPulled(true); })
      .catch(()=>setPulled(true));
  },[]);
  const me=users.find(u=>u.id===curId&&u.active!==false)||null;
  /* Dải chuyển nhà phải nằm ngoài mọi nhánh: ở địa chỉ cũ thì màn hay gặp nhất chính là
     màn khoá đòi tạo tài khoản chủ, tức nhánh mà người cần dải này nhất lại rơi vào. */
  const than=(()=>{
    if(!pulled) return <AuthShell sub="Đang tải dữ liệu…"><div style={{...authCard,textAlign:'center',color:'var(--muted)',fontSize:13}}>Đang đồng bộ với đám mây…</div></AuthShell>;
    /* onIn đọc lại từ kho: màn khoá có thể vừa tạo tài khoản chủ đầu tiên */
    if(!me) return <Login users={users} roles={roles} onIn={(id)=>{ Auth.open(id); setUsersState(Auth.users()); setCurId(id); }}/>;
    if(me.mustChange) return <SetPassword user={me} onBack={()=>{ Auth.close(); setCurId(null); }}
      onDone={(hash,salt)=>setUsers(users.map(u=>u.id===me.id?{...u,hash,salt,mustChange:false}:u))}/>;
    return <App key={me.id} me={me} roles={roles} setRoles={setRoles} users={users} setUsers={setUsers}
      onLock={()=>{ Auth.close(); setCurId(null); }}/>;
  })();
  return <React.Fragment><BangChuyenNha/>{than}</React.Fragment>;
}

/* ===================================================================== */
function App({me,roles,setRoles,users,setUsers,onLock}){
  const myRole=roleOf(me,roles);
  const isAdmin=!!myRole.admin;
  const isOwner=me.role==='owner';
  const [tasks,setTasks]=useState(()=>{const t=store.get('hdw.tasks',null);return mergeInbox(t||seed());});
  const [daily,setDaily]=useState(()=>mergeSeed(store.get('hdw.daily',SEED_DAILY),SEED_DAILY,'hdw.dailySeen'));
  const [recurring,setRecurring]=useState(()=>mergeSeed(store.get('hdw.recurring',SEED_RECUR),SEED_RECUR,'hdw.recurSeen'));
  const [bizmetrics,setBizmetrics]=useState(()=>store.get('hdw.bizmetrics',[]));
  const [bizconfig,setBizconfig]=useState(()=>store.get('hdw.bizconfig',{breakeven:425}));
  const [notebook,setNotebook]=useState(()=>{
    const nb=store.get('hdw.notebook',SEED_NOTEBOOK);
    return {...nb,sop:mergeSeed(nb.sop||[],SOP_2026,'hdw.sopSeen')};
  });
  const [sourcing,setSourcing]=useState(()=>store.get('hdw.sourcing',{}));
  const [compliance,setCompliance]=useState(()=>store.get('hdw.compliance',{}));
  const [focusTask,setFocusTask]=useState(null);
  const [deepIds,setDeepIds]=useState(null);
  const [breath,setBreath]=useState(false);
  /* ---- dữ liệu RIÊNG từng tài khoản (thói quen, năng lượng, bài đã học, kế hoạch ngày, 3 việc thắng lớn) ----
     Tài khoản chủ giữ nguyên dữ liệu cũ để không mất lịch sử; người mới bắt đầu từ trống. */
  const mine=(k,d)=>{ const v=store.get(ukey(me.id,k),null); if(v!==null) return v; return isOwner?store.get('hdw.'+k,d):d; };
  const [zen,setZen]=useState(()=>mine('zen',{min:0,sessions:0}));
  const [brainlog,setBrainlog]=useState(()=>mine('brainlog',{}));
  const [carecfg,setCarecfg]=useState(()=>mine('carecfg',{water:true,stand:true,eye:false,caffeine:true,caffeineHour:14,taskReminder:true}));
  const [learned,setLearned]=useState(()=>mine('learned',{}));
  const [trained,setTrained]=useState(()=>mine('trained',{}));
  const [toast,setToast]=useState(null);
  const [dailyState,setDailyState]=useState(()=>mine('dailyState',{date:today(),done:[],streak:0,last:''}));
  const [view,setView]=useState(()=>store.get('hdwork.lastview',isAdmin?'dash':'today'));
  const [todayPlan,setTodayPlan]=useState(()=>mine('todayPlan',null));
  const [threeWins,setThreeWins]=useState(()=>mine('threewins',null));
  const [dark,setDark]=useState(()=>store.get('hdw.dark',0)==1||store.get('hdw.dark',false)===true||localStorage.getItem('hdw.dark')==='1');
  /* Cỡ chữ: phóng cả app 100%→170%, bước 10%, nhớ theo từng tài khoản (cho mẹ chỉnh thoải mái) */
  const [fontScale,setFontScale]=useState(()=>{ const v=+store.get(ukey(me.id,'fontscale'),1); return (v>=1&&v<=1.7)?v:1; });
  const stepFont=(d)=>setFontScale(v=>Math.round(Math.min(1.7,Math.max(1,v+d))*10)/10);
  const [settingsOpen,setSettingsOpen]=useState(false);
  const [editing,setEditing]=useState(null); // task object or null
  const [bellOpen,setBellOpen]=useState(false);
  const [q,setQ]=useState('');
  const [projFilter,setProjFilter]=useState('all');

  useEffect(()=>store.set('hdw.tasks',tasks),[tasks]);
  useEffect(()=>store.set('hdw.daily',daily),[daily]);
  useEffect(()=>store.set(ukey(me.id,'dailyState'),dailyState),[dailyState]);
  useEffect(()=>store.set(ukey(me.id,'todayPlan'),todayPlan),[todayPlan]);
  useEffect(()=>store.set(ukey(me.id,'threewins'),threeWins),[threeWins]);
  useEffect(()=>store.set('hdwork.lastview',view),[view]);
  useEffect(()=>store.set('hdw.recurring',recurring),[recurring]);
  useEffect(()=>store.set('hdw.bizmetrics',bizmetrics),[bizmetrics]);
  useEffect(()=>store.set('hdw.bizconfig',bizconfig),[bizconfig]);
  useEffect(()=>store.set('hdw.notebook',notebook),[notebook]);
  useEffect(()=>store.set('hdw.sourcing',sourcing),[sourcing]);
  useEffect(()=>store.set('hdw.compliance',compliance),[compliance]);
  useEffect(()=>store.set(ukey(me.id,'zen'),zen),[zen]);
  useEffect(()=>store.set(ukey(me.id,'brainlog'),brainlog),[brainlog]);
  useEffect(()=>store.set(ukey(me.id,'carecfg'),carecfg),[carecfg]);
  useEffect(()=>store.set(ukey(me.id,'learned'),learned),[learned]);
  useEffect(()=>store.set(ukey(me.id,'trained'),trained),[trained]);
  const addZen=(m)=>setZen(z=>({min:(z.min||0)+m,sessions:(z.sessions||0)+1}));

  // Thông báo: dùng Notification thật khi tab đang ẩn (nếu đã cấp quyền), ngược lại bắn toast trong app
  const ping=(msg,tag)=>{
    let shown=false;
    try{
      if(document.hidden && 'Notification' in window && Notification.permission==='granted'){
        new Notification('Hương Diện · Quản lý công việc',{body:msg,tag});
        shown=true;
      }
    }catch(e){}
    if(!shown) setToast({msg});
  };

  // Nhắc nhịp chăm sóc: theo giờ khi app đang mở/chạy nền
  const careFired=useRef({});
  useEffect(()=>{
    const NUDGE={
      water:{every:60,msg:'💧 Uống một ngụm nước nhé!'},
      stand:{every:50,msg:'🧍 Đứng dậy vươn vai 1 phút cho máu lên não.'},
      eye:{every:20,msg:'👀 Nghỉ mắt 20 giây — nhìn ra xa 6 mét (quy tắc 20-20-20).'},
    };
    const tick=()=>{
      const now=Date.now();
      Object.keys(NUDGE).forEach(k=>{
        if(!carecfg[k]) return;
        const last=careFired.current[k]||0;
        if(now-last >= NUDGE[k].every*60000){ careFired.current[k]=now; ping(NUDGE[k].msg,'hdw-care-'+k); }
      });
      if(carecfg.caffeine){
        const h=new Date().getHours();
        if(h===(carecfg.caffeineHour||14) && careFired.current.caf!==dstr(new Date())){ careFired.current.caf=dstr(new Date()); ping('☕ Đến giờ cắt caffeine — tránh cà phê sau giờ này để ngủ ngon.','hdw-care-caffeine'); }
      }
    };
    careFired.current.water=careFired.current.water||Date.now();
    careFired.current.stand=careFired.current.stand||Date.now();
    careFired.current.eye=careFired.current.eye||Date.now();
    const id=setInterval(tick,30000);
    return ()=>clearInterval(id);
  },[carecfg]);
  // tự sinh việc lặp lại cho tuần/tháng hiện tại
  useEffect(()=>{ const add=genRecurring(recurring,tasks); if(add.length) setTasks(prev=>[...prev,...add]); },[recurring]);
  // toast tự ẩn
  useEffect(()=>{ if(!toast) return; const id=setTimeout(()=>setToast(null),2600); return ()=>clearTimeout(id); },[toast]);
  // đồng bộ: việc kéo dữ liệu từ cloud đã làm ở Root, trước màn khoá
  useEffect(()=>{ document.body.classList.toggle('dark',dark); store.set('hdw.dark',dark?1:0); },[dark]);
  useEffect(()=>{ document.body.style.zoom=fontScale===1?'':String(fontScale); store.set(ukey(me.id,'fontscale'),fontScale); },[fontScale]);
  useEffect(()=>()=>{document.body.style.zoom='';},[]); // khoá app thì trả lại cỡ thường

  // reset checklist hằng ngày khi sang ngày mới
  useEffect(()=>{
    if(dailyState.date!==today()){
      const all=dailyState.done.length>0 && dailyState.done.length>=daily.length;
      setDailyState(s=>({date:today(),done:[],
        streak: all? (s.streak+1):0,
        last: all? today(): s.last}));
    }
  },[]);

  /* task ops */
  const saveTask=(t)=>{
    setTasks(prev=>{
      let arr=prev.find(x=>x.id===t.id)?prev.map(x=>x.id===t.id?t:x):[...prev,t];
      if(t.frog) arr=arr.map(x=>x.id===t.id?x:(x.frog?{...x,frog:false}:x)); // chỉ 1 việc xương nhất
      return arr;
    });
    setEditing(null);
  };
  const delTask=(id)=>{ setTasks(prev=>prev.filter(x=>x.id!==id)); setEditing(null); };
  const importPlan=()=>{
    setTasks(prev=>{
      const have=new Set(prev.map(x=>x.id));
      const add=DEFENSE_PLAN.filter(p=>!have.has('plan-'+p.n)).map(p=>({
        id:'plan-'+p.n,title:p.title,proj:p.proj,status:'todo',pri:p.pri,progress:0,
        due:addDays(p.off),note:p.note,checklist:p.ck.map(t=>({t,done:false})),created:today(),plan:true
      }));
      return [...prev,...add];
    });
    setView('board');
  };
  const planEverLoaded=tasks.some(x=>x.plan);
  const missingPlan=DEFENSE_PLAN.filter(p=>!tasks.some(x=>x.id==='plan-'+p.n)).length;
  const planLoaded=missingPlan===0;
  const celebrate=(t)=>{
    const before=gamifyStats(tasks), pts=pointsFor(t);
    const leveledUp=before.next && (before.points+pts)>=before.next.min;
    setToast({msg:'+'+pts+' điểm! 🎉', sub: leveledUp?('Lên cấp: '+before.next.ic+' '+before.next.name):null});
  };
  const moveTask=(id,status)=>{
    const was=tasks.find(x=>x.id===id);
    setTasks(prev=>prev.map(x=>{
      if(x.id!==id) return x;
      const prog = status==='done'?100 : (x.progress===100?80 : x.progress);
      return {...x,status,progress: status==='done'?100:(status==='todo'&&x.progress===100?0:prog), doneAt: status==='done'?today():undefined};
    }));
    if(status==='done' && was && was.status!=='done') celebrate(was);
  };
  const addSpent=(id,mins)=>setTasks(prev=>prev.map(x=>x.id===id?{...x,spent:(x.spent||0)+mins}:x));
  /* Chế độ Deep Work mở từ bất kỳ đâu: ưu tiên đúng bộ việc đã xếp cho hôm nay,
     chưa xếp thì tự lấy 5 việc điểm ưu tiên cao nhất của mình. */
  const startDeepMode=()=>{
    const open=myPool.filter(t=>t.status!=='done');
    const planIds=(todayPlan&&todayPlan.date===today())?todayPlan.ids.filter(id=>open.some(t=>t.id===id)):[];
    setDeepIds(planIds.length?planIds
      :open.map(t=>({id:t.id,s:scoreTask(t)})).sort((a,b)=>b.s-a.s).slice(0,5).map(x=>x.id));
  };
  const assignTask=(id,uidTo)=>setTasks(prev=>prev.map(x=>x.id===id?{...x,assignee:uidTo||'',assignedBy:uidTo?me.id:undefined,assignedAt:uidTo?today():undefined}:x));

  /* Sao lưu & khôi phục */
  const exportData=()=>{
    const data={};
    for(let i=0;i<localStorage.length;i++){ const k=localStorage.key(i); if(k&&k.indexOf('hdw.')===0) data[k]=localStorage.getItem(k); }
    const blob=new Blob([JSON.stringify({app:'huongdienwork',date:today(),data},null,2)],{type:'application/json'});
    const url=URL.createObjectURL(blob), a=document.createElement('a');
    a.href=url; a.download='huongdien-backup-'+today()+'.json'; document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
  };
  const importData=(file)=>{
    if(!file) return;
    const r=new FileReader();
    r.onload=e=>{ try{ const j=JSON.parse(e.target.result); const d=j.data||j;
        Object.keys(d).forEach(k=>{ if(k.indexOf('hdw.')===0) localStorage.setItem(k, typeof d[k]==='string'?d[k]:JSON.stringify(d[k])); });
        alert('Khôi phục dữ liệu thành công! Trang sẽ tải lại.'); location.reload();
      }catch(err){ alert('File sao lưu không hợp lệ.'); } };
    r.readAsText(file);
  };
  const setProgress=(id,p)=>{
    const was=tasks.find(x=>x.id===id);
    setTasks(prev=>prev.map(x=>x.id!==id?x:{...x,progress:p,status:p===100?'done':(p>0?'doing':x.status==='done'?'todo':x.status),doneAt:p===100?today():undefined}));
    if(p===100 && was && was.status!=='done') celebrate(was);
  };
  const toggleCk=(id,i)=>setTasks(prev=>prev.map(x=>{
    if(x.id!==id) return x;
    const cl=x.checklist.map((c,j)=>j===i?{...c,done:!c.done}:c);
    const dn=cl.filter(c=>c.done).length, prog=cl.length?Math.round(dn/cl.length*100):x.progress;
    return {...x,checklist:cl,progress:cl.length?prog:x.progress};
  }));

  /* kế hoạch hôm nay: xếp theo điểm ưu tiên, lấp đủ quỹ thời gian trong ngày.
     Chỉ xếp việc CỦA MÌNH — chủ/quản lý tính thêm việc chưa giao ai vào phần của mình. */
  const myPool=useMemo(()=>tasks.filter(t=>t.assignee===me.id||(isAdmin&&!t.assignee)),[tasks,me.id,isAdmin]);
  const rebuildPlan=(cap)=>{
    const capH=cap || (todayPlan&&todayPlan.cap) || 6;
    const open=myPool.filter(t=>t.status!=='done');
    const ranked=open.map(t=>({id:t.id,s:scoreTask(t),h:estOf(t)})).sort((a,b)=>b.s-a.s);
    const ids=[]; let used=0;
    for(const r of ranked){ if(used>=capH) break; ids.push(r.id); used+=r.h; }
    setTodayPlan({date:today(),cap:capH,ids,auto:[]});
  };
  useEffect(()=>{ if(!todayPlan || todayPlan.date!==today()) rebuildPlan(); },[]);

  // Tự bù việc: sau khi 1 việc xong, thời gian trống ra → đề xuất thêm việc ưu tiên cao còn lại cho đủ quỹ giờ
  useEffect(()=>{
    if(!todayPlan || todayPlan.date!==today()) return;
    const byId={}; myPool.forEach(t=>byId[t.id]=t);
    const inPlan=new Set(todayPlan.ids);
    const activeH=todayPlan.ids.map(id=>byId[id]).filter(t=>t&&t.status!=='done').reduce((a,t)=>a+estOf(t),0);
    if(activeH>=todayPlan.cap) return;                       // còn đầy việc thì thôi
    const cands=myPool.filter(t=>t.status!=='done'&&!inPlan.has(t.id))
      .map(t=>({id:t.id,s:scoreTask(t),h:estOf(t)})).sort((a,b)=>b.s-a.s);
    if(!cands.length) return;
    let used=activeH; const add=[];
    for(const c of cands){ if(used>=todayPlan.cap) break; add.push(c.id); used+=c.h; }
    if(add.length) setTodayPlan(p=>({...p,ids:[...p.ids,...add],auto:[...(p.auto||[]),...add]}));
  },[myPool]);

  /* 3 việc thắng lớn/ngày: 1 kiếm tiền ngay · 1 xây hệ thống · 1 nâng trình cá nhân — reset mỗi ngày mới */
  const wins=(threeWins&&threeWins.date===today())?threeWins:{date:today(),money:null,system:null,growth:null};
  const setWinSlot=(key,val)=>setThreeWins(w=>{
    const base=(w&&w.date===today())?w:{date:today(),money:null,system:null,growth:null};
    return {...base,[key]:{...val,done:false}};
  });
  const clearWinSlot=(key)=>setThreeWins(w=>{
    const base=(w&&w.date===today())?w:{date:today(),money:null,system:null,growth:null};
    return {...base,[key]:null};
  });
  const toggleWinText=(key)=>setThreeWins(w=>{
    const base=(w&&w.date===today())?w:{date:today(),money:null,system:null,growth:null};
    const cur=base[key];
    return cur?{...base,[key]:{...cur,done:!cur.done}}:base;
  });

  /* daily */
  const toggleDaily=(id)=>setDailyState(s=>{
    const done=s.done.includes(id)?s.done.filter(x=>x!==id):[...s.done,id];
    return {...s,done};
  });

  /* ---- Việc nào người này được thấy ----
     Nhân viên chỉ thấy việc được giao cho mình → to-do list riêng, không rối vì việc người khác.
     Chủ & quản lý thấy toàn bộ, lọc theo người ở ô "Người nhận" trên Bảng việc. */
  const [whoFilter,setWhoFilter]=useState('all');
  const vTasks=useMemo(()=>{
    if(!isAdmin) return tasks.filter(t=>t.assignee===me.id);
    if(whoFilter==='all') return tasks;
    if(whoFilter==='none') return tasks.filter(t=>!t.assignee);
    return tasks.filter(t=>t.assignee===whoFilter);
  },[tasks,isAdmin,me.id,whoFilter]);
  const nameOf=(id)=>{ const u=users.find(x=>x.id===id); return u?u.name:null; };

  /* derived */
  const filtered=useMemo(()=>{
    let r=vTasks;
    if(projFilter!=='all') r=r.filter(t=>t.proj===projFilter);
    if(q.trim()){const s=q.toLowerCase();r=r.filter(t=>t.title.toLowerCase().includes(s)||(t.note||'').toLowerCase().includes(s));}
    return r;
  },[vTasks,projFilter,q]);

  const stats=useMemo(()=>{
    const t=today();
    const open=vTasks.filter(x=>x.status!=='done');
    return {
      todayCnt: open.filter(x=>x.due===t).length,
      doing: vTasks.filter(x=>x.status==='doing').length,
      overdue: open.filter(x=>x.due && x.due<t).length,
      doneWeek: vTasks.filter(x=>x.status==='done' && x.doneAt && x.doneAt>=addDays(-7)).length,
      open: open.length,
      total: vTasks.length,
    };
  },[vTasks]);

  const overdueCount=stats.overdue;

  const alerts=useMemo(()=>{
    const t=today(), soon=addDays(3);
    const list=[];
    vTasks.forEach(x=>{
      if(x.status==='done'||!x.due) return;
      let kind=null;
      if(x.due<t) kind='over';
      else if(x.due===t) kind='today';
      else if(x.due<=soon) kind='soon';
      if(kind) list.push({kind,task:x});
    });
    const order={over:0,today:1,soon:2};
    list.sort((a,b)=>order[a.kind]-order[b.kind]||(a.task.due||'').localeCompare(b.task.due||''));
    return list.slice(0,20);
  },[tasks]);
  const urgentCount=alerts.filter(a=>a.kind==='over'||a.kind==='today').length;

  const riskOpen=useMemo(()=>COMPLIANCE.reduce((n,g)=>n+g.items.filter(i=>i.risk==='high'&&compliance[i.id]!=='done').length,0),[compliance]);
  /* Tạm ẩn mục Não khỏe theo yêu cầu — code giữ nguyên, đổi thành true là hiện lại đủ cả
     nút chân sidebar lẫn thanh dưới điện thoại. */
  const SHOW_BRAIN=false;
  /* ---- Menu 7 nhóm, mỗi nhóm có tab con ----
     Năm màn Hôm nay/Bảng việc/Theo mảng/Lịch/Việc lặp lại đọc cùng một kho việc,
     nên chúng là TAB CON của "Công việc" chứ không phải 5 mục ngang hàng. */
  /* Badge Đội ngũ đếm việc QUÁ HẠN của người khác trong đội — thứ chủ/quản lý cần để mắt và
     tự tắt khi đội làm kịp. Không đếm việc chưa giao (số đó nằm to trong màn Phân công) và
     không đếm việc của chính mình (đã có badge ở Công việc rồi, đếm lại là trùng). */
  const teamOverdue=isAdmin?tasks.filter(t=>t.status!=='done'&&t.due&&t.due<today()&&t.assignee&&t.assignee!==me.id).length:0;
  /* Badge nhóm Đọc = số mục CHƯA ĐỌC của cả 03 phần tin. Bản tin không tự gọi ai, nên không
     có badge thì người dùng phải tự nhớ mở kiểm mỗi sáng — mà thứ phải nhớ mới mở thì vài
     hôm là thôi mở. Chỉ đếm cho chủ và quản lý, đúng bằng phạm vi của nhóm.
     Dùng CHUNG kho `KhoTin` với các tab, không gọi mạng riêng: hai đường đếm trên hai bản dữ
     liệu là hai con số lệch nhau mà không ai biết bên nào đúng. */
  const kho=useKhoTin();
  const docChuaDoc=isAdmin?['hd','thi_truong','chinh_sach']
    .reduce((n,p)=>n+kho.muc(p).filter(m=>!kho.daDoc()[m._k]).length,0):0;
  /* Biến một mục đang đọc thành một việc trong Bảng việc. Đây là chỗ mục Đọc thôi là chỗ để
     đọc: tin nào phải làm gì đó thì việc ấy nằm luôn trong hàng đợi, khỏi phải nhớ. */
  /* Hạn chót của một mục chính sách là thứ đáng giá nhất trong mục đó, nên nó phải đi theo
     việc. Không lấy thì người dùng đọc được "hạn 31/08" rồi tạo ra một việc KHÔNG hạn — tức
     vừa mất đúng dữ kiện vừa đọc, và cái lịch của app không biết gì về nó. Nhận cả 'dd/mm/yyyy'
     lẫn 'yyyy-mm-dd'; không đọc được thì để trống, KHÔNG đoán. */
  const hanThanhNgay=(v)=>{ const t=String(v||'').trim();
    let m=t.match(/(\d{1,2})[\/-](\d{1,2})[\/-](\d{4})/);
    if(m) return m[3]+'-'+String(m[2]).padStart(2,'0')+'-'+String(m[1]).padStart(2,'0');
    m=t.match(/(\d{4})-(\d{2})-(\d{2})/); return m?m[0]:''; };
  const taoViecTuTin=(m)=>{
    const t={id:uid(),title:String(m.tieu_de||'').slice(0,120),proj:(myRole.projs&&myRole.projs[0])||'nhap',
      status:'todo',pri:m.muc_do==='cao'?'high':'med',progress:0,due:hanThanhNgay(m.han_chot)||hanThanhNgay(m.hieu_luc_tu),
      note:[m.tom_tat,m.viec_phai_lam,m.hanh_dong,m.chuan_bi,m.url].filter(Boolean).join('\n'),
      checklist:[],created:today(),assignee:me.id};
    setTasks([t,...tasks]);
    alert('Đã thêm vào Bảng việc: '+t.title+(t.due?'\nHạn: '+t.due.split('-').reverse().join('/'):''));
  };
  /* Sổ Công Nợ là app RIÊNG, cố ý không nhúng vào đây — chỉ nối bằng một nút mở sang.
     Lý do (Huy chốt 31/07/2026): repo này PUBLIC và đồng bộ bằng "mã sync" ai-biết-thì-vào
     (tối thiểu 6 ký tự, không cần tài khoản), trong khi Sổ Công Nợ để repo riêng tư, đăng
     nhập bằng tài khoản thật và mã hoá tên người bằng mật khẩu sổ. Nhúng vào là hạ mức bảo
     vệ đó xuống bằng mức mã sync. Nhân viên cửa hàng cũng dùng app này, nên nút chỉ hiện
     với chủ/quản lý. */
  const SO_CONG_NO='https://so-cong-no.pages.dev';
  const moSoCongNo=()=>window.open(SO_CONG_NO,'_blank','noopener');
  const GROUPS=[
    {id:'g_dash',name:'Tổng quan',icon:'ti-layout-dashboard',views:[{id:'dash',n:'Tổng quan'}]},
    {id:'g_work',name:'Công việc',icon:'ti-checklist',badge:overdueCount,hint:'Việc quá hạn',views:[
      {id:'today',n:'Hôm nay'},{id:'board',n:'Bảng việc'},{id:'proj',n:'Theo mảng'},{id:'cal',n:'Lịch · Hạn'},{id:'daily',n:'Việc lặp lại'}]},
    {id:'g_team',name:'Đội ngũ',icon:'ti-users',admin:true,badge:teamOverdue,hint:'Việc quá hạn của người khác trong đội',views:[
      {id:'assign',n:'Phân công'},{id:'progress',n:'Tiến độ'},{id:'members',n:'Thành viên'}]},
    {id:'g_num',name:'Số liệu',icon:'ti-chart-histogram',admin:true,views:[
      {id:'sales',n:'Bán hàng'},{id:'kd',n:'Sổ KD'},{id:'stats',n:'Thống kê'}]},
    {id:'g_shop',name:'Cửa hàng',icon:'ti-building-store',badge:riskOpen,hint:'Mục rủi ro cao chưa xử lý',views:[
      {id:'ncc',n:'Nguồn hàng'},{id:'law',n:'Tuân thủ & Thuế'}]},
    /* Nhóm RIÊNG chứ không nhét vào Cẩm nang: `admin` lọc theo NHÓM, không lọc theo tab,
       nên muốn bản tin chỉ dành cho chủ và quản lý thì nó phải đứng thành một nhóm. */
    {id:'g_tin',name:'Đọc',icon:'ti-news',admin:true,badge:docChuaDoc,hint:'Mục chưa đọc trong bản tin',views:[
      {id:'tinkd',n:'Tin kinh doanh'},{id:'tinthitruong',n:'Thị trường Mẹ & Bé'},
      {id:'tinchinhsach',n:'Chính sách & Thuế'},{id:'tintuan',n:'Tuần qua'},{id:'tinluu',n:'Đã lưu'}]},
    {id:'g_ref',name:'Cẩm nang',icon:'ti-book',views:[{id:'train',n:'Huấn luyện'},{id:'learn',n:'Kiến thức'},{id:'book',n:'Sổ tay'}]},
    /* foot: nằm ở chân sidebar cùng nhóm "chăm mình" (Meditation, Deep Work), không đứng chung
       với các mục công việc phía trên. Trên điện thoại vẫn giữ trong thanh dưới cho dễ với. */
    {id:'g_brain',name:'Não khỏe',icon:'ti-brain',foot:true,views:[{id:'brain',n:'Não khỏe'}]},
  ].filter(g=>(!g.admin||isAdmin) && (g.id!=='g_brain'||SHOW_BRAIN));
  const groupOf=(v)=>GROUPS.find(g=>g.views.some(x=>x.id===v))||GROUPS[0];
  const curGroup=groupOf(view);
  /* mở nhóm thì quay lại đúng tab con dùng lần trước */
  const lastTab=useRef(store.get('hdwork.lasttab',{}));
  const openGroup=(g)=>{ const v=lastTab.current[g.id]; setView(g.views.some(x=>x.id===v)?v:g.views[0].id); };
  const goView=(v)=>{ const g=groupOf(v); lastTab.current={...lastTab.current,[g.id]:v}; store.set('hdwork.lasttab',lastTab.current); setView(v); };
  useEffect(()=>{ if(!GROUPS.some(g=>g.views.some(x=>x.id===view))) setView(GROUPS[0].views[0].id); },[view]);

  // Nhắc việc quá hạn / hôm nay còn tồn — mỗi 45 phút, ưu tiên báo quá hạn trước
  const taskFired=useRef(0);
  useEffect(()=>{
    if(!carecfg.taskReminder) return;
    const tick=()=>{
      const now=Date.now();
      if(now-taskFired.current < 45*60000) return;
      if(stats.overdue>0){ taskFired.current=now; ping(`⏰ Có ${stats.overdue} việc đã quá hạn — mở app để xử lý.`,'hdw-overdue'); }
      else if(stats.todayCnt>0){ taskFired.current=now; ping(`📌 Còn ${stats.todayCnt} việc cần làm hôm nay.`,'hdw-today'); }
    };
    const id=setInterval(tick,60000);
    return ()=>clearInterval(id);
  },[carecfg.taskReminder, stats.overdue, stats.todayCnt]);

  const viewMeta={
    dash:{t:'Tổng quan',s:'Tiến độ công việc cửa hàng hôm nay'},
    today:{t:'Kế hoạch hôm nay',s:'Bộ việc nên làm trong ngày — xếp theo thứ tự ưu tiên'},
    brain:{t:'Não khỏe',s:'Thói quen, năng lượng & nhịp chăm sóc để tập trung tốt hơn'},
    board:{t:'Bảng việc',s:'Kéo thẻ giữa các cột hoặc dùng nút mũi tên'},
    proj:{t:'Công việc theo mảng',s:'Tiến độ từng nhóm việc'},
    cal:{t:'Lịch · Hạn chót',s:'Sắp xếp theo ngày đến hạn'},
    stats:{t:'Thống kê hiệu suất',s:'Tổng kết tuần, năng suất, đúng hạn và phân bổ'},
    kd:{t:'Sổ kinh doanh',s:'Bảng điều khiển 10 số mỗi tuần — buồng lái cửa hàng'},
    sales:{t:'Bán hàng (KiotViet)',s:'Doanh thu, đơn hàng, sản phẩm bán chạy & tồn kho — đồng bộ tự động từ KiotViet'},
    ncc:{t:'Nguồn hàng chính ngạch',s:'24 thương hiệu nhóm A · theo dõi chuyển nguồn sang nhà phân phối chính thức'},
    law:{t:'Tuân thủ & Thuế',s:'Rủi ro pháp lý đang có, hồ sơ chứng từ và lịch khai thuế theo quý'},
    train:{t:'Huấn luyện theo vai trò',s:'Giáo trình riêng cho từng vị trí — học xong tick lại để theo dõi tiến độ'},
    learn:{t:'Kiến thức kinh doanh',s:'Bài học ngắn về tài chính, định giá, khách hàng… cho chủ shop'},
    book:{t:'Sổ tay vận hành',s:'Quy trình, prompt AI, nhà cung cấp & sao lưu dữ liệu'},
    daily:{t:'Việc lặp lại',s:'Thói quen mỗi ngày + việc tự sinh theo tuần/tháng'},
    assign:{t:'Phân công việc',s:'Giao việc cho từng người và xem ai đang gánh bao nhiêu'},
    progress:{t:'Tiến độ đội ngũ',s:'Ai xong bao nhiêu việc, ai đang quá hạn'},
    members:{t:'Thành viên & vai trò',s:'Tạo tài khoản, đổi vai trò, cấp lại mật khẩu'},
  }[view]||{t:'Hương Diện',s:''};

  const openNew=(proj)=>setEditing({id:uid(),title:'',proj:proj||(myRole.projs&&myRole.projs[0])||'nhap',status:'todo',pri:'med',progress:0,due:'',note:'',checklist:[],created:today(),
    assignee:isAdmin?'':me.id,createdBy:me.id,_new:true});

  return (
    <div className="app">
      {/* sidebar */}
      <aside className="side">
        <div className="brand">
          <div className="lic">📋</div>
          <div><b>Hương Diện</b><br/><small>Quản lý công việc</small></div>
        </div>
        <nav className="nav">
          {GROUPS.filter(g=>!g.foot).map(g=>(
            <button key={g.id} className={curGroup.id===g.id?'on':''} onClick={()=>openGroup(g)} title={g.badge>0?g.hint:''}>
              <i className={'ti '+g.icon}></i>{g.name}
              {g.badge>0 && <span className="badge" title={g.hint}>{g.badge}</span>}
            </button>
          ))}
        </nav>
        <div className="side-foot">
          <div style={{padding:'4px 10px'}}>
            <div style={{fontSize:11,color:'var(--muted)',fontWeight:600,marginBottom:6}}>{isAdmin&&whoFilter==='all'?'CẢ ĐỘI':'CỦA TÔI'} · HOÀN THÀNH TUẦN</div>
            <div style={{display:'flex',alignItems:'center',gap:10}}>
              <Ring pct={stats.total?Math.round((vTasks.filter(x=>x.status==='done').length)/stats.total*100):0} size={42}/>
              <div style={{fontSize:12,color:'var(--muted)'}}><b style={{color:'var(--ink)',fontSize:15,fontFamily:'Baloo 2'}}>{stats.doneWeek}</b> việc xong<br/>{stats.open} việc còn lại</div>
            </div>
          </div>
          {GROUPS.filter(g=>g.foot).map(g=>(
            <button key={g.id} className={'tgl'+(curGroup.id===g.id?' on':'')} onClick={()=>openGroup(g)}>
              <i className={'ti '+g.icon}></i>{g.name}
            </button>
          ))}
          {isAdmin && <button className="tgl" onClick={moSoCongNo} title="Mở Sổ Công Nợ trong tab mới — app riêng, đăng nhập riêng">
            <i className="ti ti-notebook"></i>Sổ Công Nợ<i className="ti ti-external-link" style={{marginLeft:'auto',fontSize:14,opacity:.6}}></i>
          </button>}
          {/* Meditation không để ở đây nữa — lối vào là thẻ mời trên Tổng quan.
             Chế độ Deep Work, Cài đặt và khối tài khoản đã chuyển lên thanh header
             (Huy chốt 07/08/2026 — gọn chân sidebar, chỉ giữ việc hay dùng ở đây). */}
        </div>
      </aside>

      {/* mobile top */}
      <div className="main">
        <div className="mtop">
          <div className="lic">📋</div><b>Hương Diện</b>
          <div className="spacer" style={{flex:1}}></div>
          <span style={{fontSize:12,color:'var(--muted)',fontWeight:600}}>{me.name}</span>
          <button className="fontbtn" onClick={()=>stepFont(-0.1)} disabled={fontScale<=1} title="Chữ nhỏ lại">A−</button>
          <button className="fontbtn" onClick={()=>stepFont(0.1)} disabled={fontScale>=1.7} title="Chữ to lên">A+</button>
          <button className="tgl" style={{padding:8}} onClick={onLock} title="Khoá app"><i className="ti ti-lock" style={{fontSize:19}}></i></button>
          <button className="tgl" style={{padding:8}} onClick={()=>setDark(d=>!d)}><i className={'ti '+(dark?'ti-sun':'ti-moon')} style={{fontSize:20}}></i></button>
        </div>

        <div className={"topbar"+(window.innerWidth<=768?' mob':'')}>
          <div>
            <h1>{viewMeta.t}</h1>
            <div className="sub">{viewMeta.s}</div>
          </div>
          <div className="spacer"></div>
          {(view==='board'||view==='proj'||view==='cal')&&(
            <div className="srch"><i className="ti ti-search"></i><input placeholder="Tìm việc…" value={q} onChange={e=>setQ(e.target.value)}/></div>
          )}
          <button className="btn sm" style={{background:'linear-gradient(135deg,#7c2d12,#c2410c)'}} onClick={startDeepMode} title="Phiên tập trung sâu, đi lần lượt qua các việc ưu tiên">
            <i className="ti ti-flame"></i>Deep Work
          </button>
          <div style={{position:'relative'}}>
            <button className="bellbtn" onClick={()=>setSettingsOpen(o=>!o)} title="Cài đặt hiển thị">
              <i className="ti ti-settings"></i>
            </button>
            {settingsOpen && <React.Fragment>
              <div className="bell-ov" onClick={()=>setSettingsOpen(false)}></div>
              <div className="bell-panel" style={{width:260}}>
                <div className="bell-panel-h">Cài đặt hiển thị</div>
                <div style={{padding:'12px 16px',display:'flex',flexDirection:'column',gap:12}}>
                  <div className="row" style={{justifyContent:'space-between'}}>
                    <span style={{fontSize:13,color:'var(--muted)',fontWeight:500}}><i className="ti ti-text-size" style={{marginRight:8}}></i>Cỡ chữ</span>
                    <span style={{display:'flex',alignItems:'center',gap:6}}>
                      <button onClick={()=>stepFont(-0.1)} disabled={fontScale<=1} className="fontbtn">A−</button>
                      <b style={{fontSize:11.5,minWidth:36,textAlign:'center',color:fontScale>1?'var(--o-dk)':'var(--muted)'}}>{Math.round(fontScale*100)}%</b>
                      <button onClick={()=>stepFont(0.1)} disabled={fontScale>=1.7} className="fontbtn">A+</button>
                    </span>
                  </div>
                  <button className="tgl" style={{padding:'9px 0'}} onClick={()=>setDark(d=>!d)}>
                    <i className={'ti '+(dark?'ti-sun':'ti-moon')}></i>{dark?'Giao diện sáng':'Giao diện tối'}
                  </button>
                </div>
              </div>
            </React.Fragment>}
          </div>
          <div className="bellwrap">
            <button className="bellbtn" onClick={()=>setBellOpen(o=>!o)} title="Nhắc việc đến hạn">
              <i className="ti ti-bell"></i>
              {urgentCount>0 && <span className="bell-dot">{urgentCount>9?'9+':urgentCount}</span>}
            </button>
            {bellOpen && <React.Fragment>
              <div className="bell-ov" onClick={()=>setBellOpen(false)}></div>
              <div className="bell-panel">
                <div className="bell-panel-h">🔔 Nhắc việc đến hạn</div>
                {alerts.length===0 && <div className="bell-empty">✅ Không có việc nào sắp đến hạn</div>}
                {alerts.map(a=>(
                  <div key={a.task.id} className="bell-item" onClick={()=>{setBellOpen(false);setView('board');setEditing(a.task);}}>
                    <span className="ic">{a.kind==='over'?'🔴':a.kind==='today'?'🟠':'🟡'}</span>
                    <div>
                      <div className="tt">{a.task.title}</div>
                      <div className="dd">{a.kind==='over'?'Quá hạn':a.kind==='today'?'Đến hạn hôm nay':'Sắp đến hạn'} · {a.task.due}</div>
                    </div>
                  </div>
                ))}
              </div>
            </React.Fragment>}
          </div>
          <button className="btn" onClick={()=>openNew(projFilter!=='all'?projFilter:null)}><i className="ti ti-plus"></i>Thêm việc</button>
          <div style={{display:'flex',alignItems:'center',gap:8,paddingLeft:10,marginLeft:2,borderLeft:'1px solid var(--border)'}}>
            <div style={{width:30,height:30,borderRadius:10,background:'var(--o-lt)',color:'var(--o-dk)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:13,fontWeight:700,fontFamily:'Baloo 2',flexShrink:0}} title={me.name+' · '+myRole.n}>{initials(me.name)}</div>
            <div style={{lineHeight:1.25}}>
              <b style={{fontSize:12.5,display:'block',whiteSpace:'nowrap'}}>{me.name}</b>
              <small style={{color:'var(--muted)',fontSize:11}}>{myRole.ic} {myRole.n}</small>
            </div>
            <button onClick={onLock} title="Khoá app" style={{color:'var(--muted)',padding:6,display:'flex'}}><i className="ti ti-lock" style={{fontSize:17}}></i></button>
          </div>
        </div>

        {/* thanh tab con của nhóm đang mở */}
        {curGroup.views.length>1 &&
          <div className="chips subnav">
            {curGroup.views.map(v=>(
              <button key={v.id} className={'chip'+(view===v.id?' on':'')} onClick={()=>goView(v.id)}>{v.n}</button>
            ))}
            {isAdmin&&['today','board','proj','cal'].indexOf(view)>=0 &&
              <select value={whoFilter} onChange={e=>setWhoFilter(e.target.value)} style={{...selSt,marginLeft:'auto'}} title="Lọc theo người nhận việc">
                <option value="all">👥 Cả đội</option>
                <option value="none">◻️ Chưa giao ai</option>
                {users.filter(u=>u.active!==false).map(u=>(<option key={u.id} value={u.id}>{u.id===me.id?'⭐ ':''}{u.name}</option>))}
              </select>}
          </div>}

        <div className="content" key={view}>
          {view==='dash' && <Dash stats={stats} tasks={vTasks} setView={goView} edit={setEditing} daily={daily} dailyState={dailyState} toggleDaily={toggleDaily} importPlan={importPlan} planLoaded={planLoaded} missingPlan={missingPlan} planEverLoaded={planEverLoaded} onBreath={()=>setBreath(true)} zen={zen} me={me} isAdmin={isAdmin} myPool={myPool} plan={todayPlan}/>}
          {view==='today' && <Today tasks={myPool} plan={todayPlan} rebuild={rebuildPlan} move={moveTask} edit={setEditing} toggleCk={toggleCk} openFocus={setFocusTask} startDeep={setDeepIds} wins={wins} setWinSlot={setWinSlot} clearWinSlot={clearWinSlot} toggleWinText={toggleWinText}/>}
          {view==='brain' && <BrainEnergy log={brainlog} setLog={setBrainlog} cfg={carecfg} setCfg={setCarecfg} onBreath={()=>setBreath(true)}/>}
          {view==='board' && <Board tasks={filtered} all={vTasks} projFilter={projFilter} setProjFilter={setProjFilter} move={moveTask} edit={setEditing} toggleCk={toggleCk} nameOf={nameOf}/>}
          {view==='proj' && <Projects tasks={vTasks} setView={goView} setProjFilter={setProjFilter}/>}
          {view==='cal' && <Calendar tasks={filtered} move={moveTask} edit={setEditing}/>}
          {view==='stats' && <Stats tasks={vTasks}/>}
          {view==='assign' && <Assign tasks={tasks} users={users} roles={roles} me={me} assign={assignTask} edit={setEditing} openNew={openNew} setWho={(id)=>{setWhoFilter(id);goView('board');}}/>}
          {view==='progress' && <TeamProgress tasks={tasks} users={users} roles={roles}/>}
          {view==='members' && <Members users={users} setUsers={setUsers} roles={roles} setRoles={setRoles} me={me} isOwner={isOwner} tasks={tasks}/>}
          {view==='kd' && <BizBook metrics={bizmetrics} setMetrics={setBizmetrics} config={bizconfig} setConfig={setBizconfig}/>}
          {view==='sales' && <Sales/>}
          {view==='ncc' && <Sourcing st={sourcing} setSt={setSourcing}/>}
          {view==='law' && <Compliance st={compliance} setSt={setCompliance}/>}
          {view==='train' && <Training me={me} roles={roles} isAdmin={isAdmin} done={trained} setDone={setTrained}/>}
          {DOC_TAB.indexOf(view)>=0 && <TinKD tab={view} onTaoViec={taoViecTuTin}/>}
          {view==='learn' && <Knowledge learned={learned} setLearned={setLearned}/>}
          {view==='book' && <Notebook nb={notebook} setNb={setNotebook} onExport={exportData} onImport={importData}/>}
          {view==='daily' && <Daily daily={daily} setDaily={setDaily} st={dailyState} toggle={toggleDaily} recurring={recurring} setRecurring={setRecurring}/>}
        </div>
      </div>

      {/* mobile bottom nav + fab */}
      <button className="fab" onClick={()=>openNew(projFilter!=='all'?projFilter:null)}><i className="ti ti-plus"></i></button>
      <nav className="botnav">
        {GROUPS.map(g=>(
          <button key={g.id} className={curGroup.id===g.id?'on':''} onClick={()=>openGroup(g)} title={g.badge>0?g.hint:''}>
            <i className={'ti '+g.icon}></i>{g.name}
            {g.badge>0 && <span className="badge">{g.badge}</span>}
          </button>
        ))}
        {isAdmin && <button onClick={moSoCongNo}><i className="ti ti-notebook"></i>Sổ nợ</button>}
      </nav>

      {editing && <TaskModal task={editing} onSave={saveTask} onDel={delTask} onClose={()=>setEditing(null)}
        users={users} roles={roles} me={me} canAssign={isAdmin}/>}
      {focusTask && <FocusModal task={focusTask} onClose={()=>setFocusTask(null)} onLog={addSpent} onDone={(id)=>{moveTask(id,'done');setFocusTask(null);}}/>}
      {deepIds && <DeepWork ids={deepIds} tasks={tasks} onClose={()=>setDeepIds(null)} onLog={addSpent} onComplete={(id)=>moveTask(id,'done')} toggleCk={toggleCk}/>}
      {breath && <BreathMode onClose={()=>setBreath(false)} onLog={addZen}/>}
      {toast && <div className="toast"><i className="ti ti-trophy"></i><div><b>{toast.msg}</b>{toast.sub && <div style={{fontSize:11.5,opacity:.92,fontWeight:500}}>{toast.sub}</div>}</div></div>}
    </div>
  );
}

/* ---------- Dashboard ---------- */
function Dash({stats,tasks,setView,edit,daily,dailyState,toggleDaily,importPlan,planLoaded,missingPlan,planEverLoaded,onBreath,zen,me,myPool,plan}){
  const t=today();
  const todayTasks=tasks.filter(x=>x.status!=='done' && (x.due===t || (x.due&&x.due<t))).sort((a,b)=>(a.due||'').localeCompare(b.due||''));
  const dailyDone=dailyState.done.length, dailyTotal=daily.length;
  const g=gamifyStats(tasks), badges=badgesOf(tasks,g);
  const lvPct=g.next?Math.round((g.points-g.level.min)/(g.next.min-g.level.min)*100):100;
  /* Tóm tắt đầu ca: số CỦA TÔI (myPool) chứ không phải của cả đội — mở app là biết ngay ca này làm gì */
  const my=(myPool||[]).filter(x=>x.status!=='done');
  const myOver=my.filter(x=>x.due&&x.due<t).length;
  const myToday=my.filter(x=>x.due===t).length;
  const planCnt=(plan&&plan.date===t)?plan.ids.filter(id=>my.some(x=>x.id===id)).length:0;
  const hr=new Date().getHours();
  const greet=hr<11?'Chào buổi sáng':hr<14?'Chào buổi trưa':hr<18?'Chào buổi chiều':'Chào buổi tối';
  return (
    <div>
      {/* Đầu ca */}
      <div style={{background:'var(--card)',border:'2px solid var(--o)',borderRadius:18,padding:'16px 18px',marginBottom:18,boxShadow:'var(--sh)'}}>
        <div style={{display:'flex',alignItems:'center',gap:14,flexWrap:'wrap'}}>
          <div style={{fontSize:34,lineHeight:1}}>👋</div>
          <div style={{flex:1,minWidth:150}}>
            <b style={{fontFamily:'Baloo 2',fontSize:17,display:'block'}}>{greet}, {me?me.name:''}!</b>
            <div style={{fontSize:13,color:'var(--muted)'}}>
              {my.length===0?'Không còn việc nào đang mở — quá đỉnh.':
                <span>Hôm nay của bạn: <b style={{color:'var(--ink)'}}>{planCnt||my.length} việc</b>
                {myToday>0&&<span> · <b style={{color:'var(--amber)'}}>{myToday} đến hạn hôm nay</b></span>}
                {myOver>0&&<span> · <b style={{color:'var(--red)'}}>{myOver} quá hạn</b></span>}
                <span> · việc hằng ngày {dailyDone}/{dailyTotal}</span></span>}
            </div>
          </div>
          <button className="btn" onClick={()=>setView('today')}><i className="ti ti-player-play"></i>Bắt đầu ca</button>
        </div>
      </div>
      {/* Gamify hero */}
      <div style={{background:'linear-gradient(135deg,#7c2d12,#c2410c)',borderRadius:18,padding:'16px 18px',marginBottom:18,color:'#fff',boxShadow:'var(--sh)'}}>
        <div style={{display:'flex',alignItems:'center',gap:14,flexWrap:'wrap'}}>
          <div style={{fontSize:36,lineHeight:1}}>{g.level.ic}</div>
          <div style={{flex:1,minWidth:140}}>
            <div style={{fontSize:11.5,opacity:.85,fontWeight:600}}>CẤP ĐỘ HIỆN TẠI</div>
            <div style={{fontFamily:'Baloo 2',fontSize:19,fontWeight:700}}>{g.level.name}</div>
          </div>
          <div style={{textAlign:'center'}}><div style={{fontFamily:'Baloo 2',fontSize:22,fontWeight:700}}>{g.points}</div><div style={{fontSize:10.5,opacity:.85}}>điểm</div></div>
          <div style={{textAlign:'center'}}><div style={{fontFamily:'Baloo 2',fontSize:22,fontWeight:700}}>🔥{g.streak}</div><div style={{fontSize:10.5,opacity:.85}}>ngày liền</div></div>
        </div>
        {g.next &&
          <div style={{marginTop:12}}>
            <div style={{height:8,background:'rgba(255,255,255,.25)',borderRadius:6,overflow:'hidden'}}><i style={{display:'block',height:'100%',width:lvPct+'%',background:'#fff',borderRadius:6}}></i></div>
            <div style={{fontSize:11,opacity:.9,marginTop:5}}>Còn <b>{g.next.min-g.points}</b> điểm để lên <b>{g.next.ic} {g.next.name}</b></div>
          </div>}
        <div style={{display:'flex',gap:8,marginTop:14,overflowX:'auto'}}>
          {badges.map(b=>(
            <div key={b.id} className={'badgechip'+(b.got?'':' off')} title={b.need} style={{background:'rgba(255,255,255,.12)',border:'1px solid rgba(255,255,255,.18)',color:'#fff'}}>
              <span className="be">{b.ic}</span><small style={{color:'#fff',opacity:b.got?1:.7}}>{b.name}</small>
            </div>
          ))}
        </div>
      </div>
      {!planLoaded &&
        <div style={{display:'flex',alignItems:'center',gap:14,background:'linear-gradient(135deg,#fff7ed,#ffedd5)',border:'1px solid var(--o-mid)',borderRadius:16,padding:'16px 18px',marginBottom:18,flexWrap:'wrap'}}>
          <div style={{fontSize:30,lineHeight:1}}>🛡️</div>
          <div style={{flex:1,minWidth:180}}>
            <b style={{fontFamily:'Baloo 2',fontSize:15,color:'var(--o-dk)'}}>Kế hoạch phòng thủ "năm xấu"</b>
            <div style={{fontSize:12.5,color:'var(--o-dk)',opacity:.85,marginTop:2}}>{planEverLoaded?`Có ${missingPlan} việc mới trong kế hoạch chưa nạp.`:`${missingPlan} việc giúp Hương Diện sống khỏe năm xấu + ứng dụng AI: hòa vốn, quỹ oxy, tồn kho, giữ khách thân, xả tồn, chatbot…`}</div>
          </div>
          <button className="btn" onClick={importPlan}><i className="ti ti-download"></i>{planEverLoaded?`Nạp ${missingPlan} việc mới`:`Nạp ${missingPlan} việc vào bảng`}</button>

      <div className="grid-stat">
        <div className="stat"><div className="ic o"><i className="ti ti-calendar-event"></i></div><div className="n">{stats.todayCnt}</div><div className="l">Đến hạn hôm nay</div></div>
        <div className="stat"><div className="ic b"><i className="ti ti-progress"></i></div><div className="n">{stats.doing}</div><div className="l">Đang làm</div></div>
        <div className="stat"><div className="ic r"><i className="ti ti-alert-triangle"></i></div><div className="n">{stats.overdue}</div><div className="l">Quá hạn</div></div>
        <div className="stat"><div className="ic g"><i className="ti ti-circle-check"></i></div><div className="n">{stats.doneWeek}</div><div className="l">Xong trong 7 ngày</div></div>

      {/* Meditation */}
      <div onClick={onBreath} style={{display:'flex',alignItems:'center',gap:14,background:'linear-gradient(135deg,#0d3b3f,#155e63)',borderRadius:16,padding:'14px 18px',marginBottom:18,color:'#eafaf8',cursor:'pointer',boxShadow:'var(--sh)'}}>
        <div style={{fontSize:30,lineHeight:1}}>🌿</div>
        <div style={{flex:1,minWidth:140}}>
          <b style={{fontFamily:'Baloo 2',fontSize:15}}>Meditation</b>
          <div style={{fontSize:12.5,opacity:.85,marginTop:1}}>Thở 5–10 phút để lấy lại tập trung{zen&&zen.min>0?` · đã thiền ${zen.min} phút`:''}</div>
        </div>
        <span className="btn sm" style={{background:'rgba(255,255,255,.18)',pointerEvents:'none'}}><i className="ti ti-player-play"></i>Bắt đầu</span>
      </div>

      <div style={{display:'grid',gridTemplateColumns:'1.5fr 1fr',gap:18,alignItems:'start'}} className="dashgrid">
        <div className="panel">
          <div className="panel-h"><i className="ti ti-flame lead"></i><b>Ưu tiên hôm nay</b><div className="spacer" style={{flex:1}}></div><button className="btn ghost sm" onClick={()=>setView('board')}>Xem bảng</button></div>
          <div className="panel-b" style={{padding:'4px 0 8px'}}>
            {todayTasks.length===0 ? <div className="empty"><i className="ti ti-confetti"></i><p>Tuyệt vời! Không có việc nào tới hạn.</p></div> :
              todayTasks.map(x=>{
                const di=dueInfo(x.due), p=projOf(x.proj);
                return (
                  <div className="row" key={x.id} onClick={()=>edit(x)} style={{cursor:'pointer'}}>
                    <span className="pri" style={{width:5,height:34,borderRadius:6,background:x.pri==='high'?'var(--red)':x.pri==='med'?'var(--amber)':'var(--grn)'}}></span>
                    <div className="rt"><b>{x.title}</b><small><span className="tag" style={{background:p.bg,color:p.color,padding:'1px 6px'}}>{p.icon} {p.name}</span></small></div>
                    {di && <span className={'due '+di.cls}><i className="ti ti-clock"></i>{di.label}</span>}

                );
              })

        </div>

        <div className="panel">
          <div className="panel-h"><i className="ti ti-checkup-list lead"></i><b>Việc hằng ngày</b>
            <div className="spacer" style={{flex:1}}></div>
            {dailyState.streak>0 && <span className="streak"><i className="ti ti-flame"></i>{dailyState.streak} ngày</span>}
          </div>
          <div className="panel-b" style={{padding:'12px 18px 16px'}}>
            <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:12}}>
              <div className="prog full" style={{flex:1,height:9}}><i style={{width:(dailyTotal?dailyDone/dailyTotal*100:0)+'%'}}></i></div>
              <b style={{fontFamily:'Baloo 2',color:'var(--grn)',fontSize:14}}>{dailyDone}/{dailyTotal}</b>
            </div>
            {daily.map(d=>{
              const on=dailyState.done.includes(d.id);
              return (
                <div className={'row'+(on?' done':'')} key={d.id} style={{padding:'9px 0',borderColor:'var(--border)'}} onClick={()=>toggleDaily(d.id)}>
                  <span className={'chk'+(on?' done':'')}>{on&&<i className="ti ti-check"></i>}</span>
                  <div className="rt"><b style={{fontWeight:500}}>{d.t}</b></div>

/* ---------- Kanban Board ---------- */
function Board({tasks,projFilter,setProjFilter,move,edit,toggleCk,nameOf}){
  const [dragId,setDragId]=useState(null);
  const [dropCol,setDropCol]=useState(null);
  const cols=['todo','doing','done'];
  const onDrop=(status)=>{ if(dragId){move(dragId,status);} setDragId(null);setDropCol(null); };
  return (
    <div>
      <div className="filterbar">
        <button className={'fpill'+(projFilter==='all'?' on':'')} onClick={()=>setProjFilter('all')}><i className="ti ti-asterisk"></i>Tất cả</button>
        {PROJECTS.map(p=>(
          <button key={p.id} className={'fpill'+(projFilter===p.id?' on':'')} onClick={()=>setProjFilter(p.id)}>{p.icon} {p.name}</button>
        ))}
      </div>
      <div className="board">
        {cols.map(cs=>{
          const list=tasks.filter(t=>t.status===cs);
          return (
            <div key={cs} className={'col'+(dropCol===cs?' drop':'')}
              onDragOver={e=>{e.preventDefault();setDropCol(cs);}}
              onDragLeave={e=>{ if(e.currentTarget===e.target) setDropCol(null); }}
              onDrop={()=>onDrop(cs)}>
              <div className="col-h"><span className="dot" style={{background:STATUS[cs].dot}}></span>{STATUS[cs].name}<span className="cnt">{list.length}</span></div>
              {list.length===0 && <div style={{padding:'16px 8px',color:'var(--muted2)',fontSize:12.5,textAlign:'center'}}>Trống</div>}
              {list.map(t=>(
                <TaskCard key={t.id} t={t} cs={cs} cols={cols}
                  onDragStart={()=>setDragId(t.id)} onDragEnd={()=>{setDragId(null);setDropCol(null);}}
                  dragging={dragId===t.id} move={move} edit={edit} toggleCk={toggleCk} nameOf={nameOf}/>
              ))}
            </div>
          );
        })}
      </div>
    </div>
  );
}

function TaskCard({t,cs,onDragStart,onDragEnd,dragging,move,edit,toggleCk,nameOf}){
  const p=projOf(t.proj), di=dueInfo(t.due);
  const idx=['todo','doing','done'].indexOf(cs);
  return (
    <div className={'tcard'+(dragging?' drag':'')+(t.status==='done'?' done':'')} draggable
      onDragStart={onDragStart} onDragEnd={onDragEnd} onClick={(e)=>{if(e.target.closest('button')||e.target.closest('.ckitem')||e.target.closest('.cklist'))return;edit(t);}}>
      <div className="top">
        <span className={'pri '+t.pri}></span>
        <div className="tt">{t.frog&&'🐸 '}{t.title}</div>
      </div>
      <div className="metarow">
        <span className="tag" style={{background:p.bg,color:p.color}}>{p.icon} {p.name}</span>
        {di && <span className={'due '+di.cls}><i className="ti ti-clock"></i>{di.label}</span>}
        {nameOf && nameOf(t.assignee) && <span className="tag" style={{background:'var(--bg)',color:'var(--muted)'}}><i className="ti ti-user"></i>{nameOf(t.assignee)}</span>}
      </div>
      {t.checklist&&t.checklist.length>0 &&
        <div className="cklist">
          {t.checklist.map((c,i)=>(
            <div key={i} className={'ckitem'+(c.done?' done':'')} onClick={()=>toggleCk(t.id,i)}>
              <i className={'ti '+(c.done?'ti-square-check-filled':'ti-square')} style={{color:c.done?'var(--grn)':'var(--muted2)'}}></i><span>{c.t}</span>
            </div>
          ))}
        </div>}
      {t.status!=='done' &&
        <div className="prog"><i style={{width:t.progress+'%'}}></i></div>}
      <div className="cardacts">
        <button title="Sửa" onClick={()=>edit(t)}><i className="ti ti-pencil"></i></button>
        <div className="mv" style={{display:'flex',gap:2}}>
          {idx>0 && <button title="Lùi" onClick={()=>move(t.id,['todo','doing','done'][idx-1])}><i className="ti ti-arrow-left"></i></button>}
          {idx<2 && <button title={idx===1?'Hoàn thành':'Tiến'} onClick={()=>move(t.id,['todo','doing','done'][idx+1])}><i className={'ti '+(idx===1?'ti-check':'ti-arrow-right')}></i></button>}
        </div>
      </div>
    </div>
  );
}

/* ---------- Projects ---------- */
function Projects({tasks,setView,setProjFilter}){
  const data=PROJECTS.map(p=>{
    const list=tasks.filter(t=>t.proj===p.id);
    const done=list.filter(t=>t.status==='done').length;
    const pct=list.length?Math.round(done/list.length*100):0;
    const open=list.length-done;
    const overdue=list.filter(t=>t.status!=='done'&&t.due&&t.due<today()).length;
    return {p,total:list.length,done,pct,open,overdue};
  });
  return (
    <div className="projgrid">
      {data.map(({p,total,done,pct,open,overdue})=>(
        <div className="projcard" key={p.id} onClick={()=>{setProjFilter(p.id);setView('board');}}>
          <div className="ph">
            <div className="pic" style={{background:p.bg,color:p.color}}>{p.icon}</div>
            <div><div className="pn">{p.name}</div><div className="pmeta">{total} việc · {open} còn lại</div></div>
            <Ring pct={pct} size={46} color={p.color}/>
          </div>
          <div className="prog" style={{marginTop:0}}><i style={{width:pct+'%',background:p.color}}></i></div>
          <div style={{display:'flex',gap:10,marginTop:11,fontSize:12,color:'var(--muted)'}}>
            <span><i className="ti ti-circle-check" style={{color:'var(--grn)'}}></i> {done} xong</span>
            {overdue>0 && <span style={{color:'var(--red)',fontWeight:600}}><i className="ti ti-alert-triangle"></i> {overdue} quá hạn</span>}
          </div>
        </div>
      ))}
    </div>
  );
}

/* ---------- Calendar / Deadlines ---------- */
function Calendar({tasks,move,edit}){
  const t=today();
  const groups=useMemo(()=>{
    const open=tasks.filter(x=>x.status!=='done');
    const g={overdue:[],today:[],tomorrow:[],week:[],later:[],noDate:[]};
    open.forEach(x=>{
      if(!x.due){g.noDate.push(x);return;}
      const di=dueInfo(x.due);
      if(di.diff<0)g.overdue.push(x);
      else if(di.diff===0)g.today.push(x);
      else if(di.diff===1)g.tomorrow.push(x);
      else if(di.diff<=7)g.week.push(x);
      else g.later.push(x);
    });
    Object.values(g).forEach(arr=>arr.sort((a,b)=>(a.due||'9').localeCompare(b.due||'9')));
    return g;
  },[tasks]);
  const sections=[
    {k:'overdue',name:'Quá hạn',icon:'ti-alert-triangle',color:'var(--red)'},
    {k:'today',name:'Hôm nay',icon:'ti-calendar-event',color:'var(--o)'},
    {k:'tomorrow',name:'Ngày mai',icon:'ti-calendar',color:'var(--amber)'},
    {k:'week',name:'Trong tuần',icon:'ti-calendar-week',color:'var(--blue)'},
    {k:'later',name:'Sau này',icon:'ti-calendar-plus',color:'var(--muted)'},
    {k:'noDate',name:'Chưa đặt hạn',icon:'ti-calendar-off',color:'var(--muted2)'},
  ];
  const any=sections.some(s=>groups[s.k].length);
  if(!any) return <div className="panel"><div className="empty"><i className="ti ti-calendar-check"></i><p>Không có việc nào cần làm. Nghỉ ngơi thôi!</p></div></div>;
  return (
    <div>
      {sections.map(s=>groups[s.k].length>0 && (
        <div className="panel" key={s.k}>
          <div className="panel-h"><i className={'ti '+s.icon+' lead'} style={{color:s.color}}></i><b>{s.name}</b><span className="cnt" style={{marginLeft:'auto',background:'var(--bg)',color:'var(--muted)',fontSize:12,fontWeight:600,padding:'2px 9px',borderRadius:9}}>{groups[s.k].length}</span></div>
          <div className="panel-b" style={{padding:0}}>
            {groups[s.k].map(x=>{
              const p=projOf(x.proj),di=dueInfo(x.due);
              return (
                <div className={'row'} key={x.id}>
                  <span className="chk" onClick={()=>move(x.id,'done')} title="Đánh dấu xong"></span>
                  <div className="rt" onClick={()=>edit(x)} style={{cursor:'pointer'}}>
                    <b>{x.title}</b>
                    <small><span className="tag" style={{background:p.bg,color:p.color,padding:'1px 6px'}}>{p.icon} {p.name}</span> {x.status==='doing'&&<span style={{color:'var(--o)',fontWeight:600}}>· {x.progress}%</span>}</small>
                  </div>
                  {di && <span className={'due '+di.cls}><i className="ti ti-clock"></i>{x.due?fmtDate(x.due):''} {di.cls==='over'?'· trễ':''}</span>}
                </div>
              );
            })}
          </div>
        </div>
      ))}
    </div>
  );
}

/* ---------- Daily editor ---------- */
function Daily({daily,setDaily,st,toggle,recurring,setRecurring}){
  const [nt,setNt]=useState('');
  const add=()=>{ if(!nt.trim())return; setDaily([...daily,{id:'d'+Date.now(),t:nt.trim()}]); setNt(''); };
  const del=(id)=>setDaily(daily.filter(d=>d.id!==id));
  const done=st.done.length, total=daily.length;
  // form rule lặp lại
  const [rf,setRf]=useState({title:'',proj:'tc',every:'week',day:1,pri:'med'});
  const addRule=()=>{ if(!rf.title.trim())return; setRecurring([...recurring,{...rf,title:rf.title.trim(),id:'rc'+Date.now()}]); setRf({title:'',proj:'tc',every:'week',day:1,pri:'med'}); };
  const delRule=(id)=>setRecurring(recurring.filter(r=>r.id!==id));
  return (
    <div>
    <div className="dailywrap">
      <div className="panel">
        <div className="panel-h"><i className="ti ti-checkup-list lead"></i><b>Hôm nay · {done}/{total}</b>
          <div className="spacer" style={{flex:1}}></div>
          {st.streak>0 && <span className="streak"><i className="ti ti-flame"></i>Chuỗi {st.streak} ngày</span>}
        </div>
        <div className="panel-b" style={{padding:'14px 18px 18px'}}>
          <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:14}}>
            <div className="prog full" style={{flex:1,height:10}}><i style={{width:(total?done/total*100:0)+'%'}}></i></div>
            <b style={{fontFamily:'Baloo 2',color:'var(--grn)'}}>{total?Math.round(done/total*100):0}%</b>
          </div>
          {daily.length===0 && <div className="empty"><i className="ti ti-list"></i><p>Chưa có việc lặp lại nào.</p></div>}
          {daily.map(d=>{
            const on=st.done.includes(d.id);
            return (

const selSt={background:'var(--card)',border:'1.5px solid var(--border)',borderRadius:9,padding:'8px 10px',color:'var(--ink)',outline:'none',fontWeight:600,fontSize:12.5};

const WIN_SLOTS=[

  {key:'system',ic:'🧱',label:'Xây hệ thống',hint:'viết quy trình, tạo form đơn hàng, cập nhật bảng tồn, chuẩn hoá dữ liệu, sửa chatbot…',color:'blue'},
  {key:'growth',ic:'🌱',label:'Nâng trình cá nhân',hint:'tập bi-a đúng bài, học AI, tập thể lực, đọc một bài phân tích sâu…',color:'o'},
];

function ThreeWins({tasks,wins,setSlot,clearSlot,toggleText,move,edit}){
  const [pickingKey,setPickingKey]=useState(null);
  const byId={}; tasks.forEach(t=>byId[t.id]=t);
  const rows=WIN_SLOTS.map(s=>{
    const v=wins[s.key];
    const task=v&&v.taskId?byId[v.taskId]:null;
    const missing=v&&v.taskId&&!task; // việc đã bị xoá khỏi Bảng việc
    const isDone=task?task.status==='done':!!(v&&v.done);
    const title=task?task.title:(v?v.text:null);
    return {s,v,task,missing,isDone,title};
  });
  const doneCount=rows.filter(r=>r.title&&r.isDone).length;
  const allDone=doneCount===3;
  return (
    <div className="panel">
      <div className="panel-h">
        <i className="ti ti-trophy lead"></i><b>3 việc thắng lớn hôm nay</b>
        <div style={{flex:1}}></div>
        <span className="tag" style={{background:allDone?'var(--grn-lt)':'var(--bg)',color:allDone?'var(--grn)':'var(--muted)',border:allDone?'none':'1px solid var(--border)'}}>{allDone&&'🎉 '}{doneCount}/3 xong</span>
      </div>
      <div className="panel-b" style={{padding:'10px 18px 16px',display:'flex',flexDirection:'column',gap:9}}>
        {rows.map(({s,task,missing,isDone,title})=>(
          <div key={s.key} style={{display:'flex',alignItems:'center',gap:12,padding:'11px 13px',borderRadius:12,background:'var(--'+s.color+'-lt)',opacity:isDone?.6:1}}>
            <span style={{fontSize:20,flexShrink:0}}>{s.ic}</span>
            <div style={{flex:1,minWidth:0}}>
              <div style={{fontSize:10.5,fontWeight:700,letterSpacing:'.03em',textTransform:'uppercase',color:'var(--'+s.color+')'}}>{s.label}</div>
              {title
                ? <div style={{fontSize:13.5,fontWeight:600,marginTop:2,textDecoration:isDone?'line-through':'none',cursor:task?'pointer':'default'}} onClick={()=>task&&edit(task)}>{missing?'(việc đã bị xoá)':title}</div>
                : <div style={{fontSize:12.5,color:'var(--muted)',marginTop:2}}>{s.hint}</div>}
            </div>
            {title ? (
              <div style={{display:'flex',gap:6,flexShrink:0}}>
                {!isDone && task && <button className="btn ghost sm" onClick={()=>move(task.id,'done')}><i className="ti ti-check"></i></button>}
                {!task && !missing && <button className="btn ghost sm" onClick={()=>toggleText(s.key)}><i className={'ti '+(isDone?'ti-square-check-filled':'ti-square')}></i></button>}
                <button className="btn ghost sm" onClick={()=>clearSlot(s.key)}><i className="ti ti-x"></i></button>
              </div>
            ) : <button className="btn ghost sm" style={{flexShrink:0}} onClick={()=>setPickingKey(s.key)}><i className="ti ti-plus"></i>Chọn</button>}
          </div>
        ))}
      </div>
      {pickingKey && <WinPicker slot={WIN_SLOTS.find(s=>s.key===pickingKey)} tasks={tasks} onClose={()=>setPickingKey(null)} onPick={(v)=>{setSlot(pickingKey,v);setPickingKey(null);}}/>}
    </div>
  );
}

          </div>
        </div>}

/* ---------- Thống kê hiệu suất ---------- */
function Stats({tasks}){
  const done=tasks.filter(t=>t.status==='done');
  const WDX=['CN','T2','T3','T4','T5','T6','T7'];
  const days=[]; for(let i=6;i>=0;i--){ const d=addDays(-i); days.push({d,lbl:WDX[new Date(d+'T00:00:00').getDay()],n:done.filter(t=>t.doneAt===d).length}); }
  const maxN=Math.max(1,...days.map(x=>x.n));
  const week=days.reduce((a,x)=>a+x.n,0);
  const withDue=done.filter(t=>t.due), onTime=withDue.filter(t=>t.doneAt&&t.doneAt<=t.due).length;
  const onTimeRate=withDue.length?Math.round(onTime/withDue.length*100):100;
  const byProj=PROJECTS.map(p=>({p,total:tasks.filter(t=>t.proj===p.id).length,done:tasks.filter(t=>t.proj===p.id&&t.status==='done').length})).filter(x=>x.total>0).sort((a,b)=>b.total-a.total);
  const maxProj=Math.max(1,...byProj.map(x=>x.total));
  const activeDays=new Set(done.map(t=>t.doneAt).filter(Boolean)).size||1;
  const avg=(done.length/activeDays).toFixed(1);
  const spentMin=tasks.reduce((a,t)=>a+(t.spent||0),0);
  const spentH=(spentMin/60).toFixed(1);
  // tổng kết tuần
  const wkStart=dstr(startOfWeek());
  const lastStart=dstr(new Date(new Date(wkStart+'T00:00:00').getTime()-7*86400000));
  const wkDone=done.filter(t=>t.doneAt&&t.doneAt>=wkStart);
  const lastDone=done.filter(t=>t.doneAt&&t.doneAt>=lastStart&&t.doneAt<wkStart);
  const wkPts=wkDone.reduce((a,t)=>a+pointsFor(t),0);
  const wkWithDue=wkDone.filter(t=>t.due), wkOnTime=wkWithDue.filter(t=>t.doneAt<=t.due).length;
  const wkOnTimeR=wkWithDue.length?Math.round(wkOnTime/wkWithDue.length*100):100;
  const open=tasks.filter(t=>t.status!=='done');
  const overdue=open.filter(t=>t.due&&t.due<today());
  const suggest=open.filter(t=>(t.due&&t.due<today())||t.pri==='high').sort((a,b)=>scoreTask(b)-scoreTask(a)).slice(0,5);
  const trend=wkDone.length-lastDone.length;
  if(done.length===0 && tasks.length===0) return <div className="panel"><div className="empty"><i className="ti ti-chart-bar"></i><p>Chưa có dữ liệu.</p></div></div>;
  return (
    <div>
      {/* Tổng kết tuần */}

      <div className="panel">

      <div className="panel">

  );

/* ---------- Pomodoro / Tập trung ---------- */
function FocusModal({task,onClose,onLog,onDone}){
  const FOCUS=25*60, BREAK=5*60;
  const [mode,setMode]=useState('focus');
  const [left,setLeft]=useState(FOCUS);
  const [running,setRunning]=useState(false);
  const [focusedSec,setFocusedSec]=useState(0);
  useEffect(()=>{
    if(!running) return;
    const t=setInterval(()=>{
      setLeft(l=>{
        if(l<=1){ setRunning(false); if(mode==='focus'){setMode('break');return BREAK;} setMode('focus'); return FOCUS; }
        return l-1;
      });
      if(mode==='focus') setFocusedSec(s=>s+1);
    },1000);
    return ()=>clearInterval(t);
  },[running,mode]);
  const total=mode==='focus'?FOCUS:BREAK;
  const mm=String(Math.floor(left/60)).padStart(2,'0'), ss=String(left%60).padStart(2,'0');
  const minutes=Math.round(focusedSec/60);
  const finish=()=>{ if(minutes>0)onLog(task.id,minutes); onClose(); };
  const R=92, C=2*Math.PI*R, off=C*(1-left/total);
  return (
    <div className="ov" onClick={finish}>
      <div className="modal" onClick={e=>e.stopPropagation()} style={{maxWidth:380}}>
        <div className="modal-h"><b><i className="ti ti-target-arrow" style={{color:'var(--o)',marginRight:6}}></i>Tập trung</b><button className="x" onClick={finish}><i className="ti ti-x"></i></button></div>
        <div className="modal-b" style={{textAlign:'center'}}>
          <div style={{fontSize:13.5,fontWeight:600,color:'var(--muted)',marginBottom:4}}>{mode==='focus'?'🎯 Đang làm':'☕ Nghỉ ngắn'}</div>
          <div style={{fontSize:14,fontWeight:600,marginBottom:16,minHeight:38}}>{task.title}</div>
          <div style={{position:'relative',width:210,height:210,margin:'0 auto'}}>
            <svg width="210" height="210">
              <circle cx="105" cy="105" r={R} fill="none" stroke="var(--border2)" strokeWidth="10"/>
              <circle cx="105" cy="105" r={R} fill="none" stroke={mode==='focus'?'var(--o)':'var(--grn)'} strokeWidth="10" strokeLinecap="round" strokeDasharray={C} strokeDashoffset={off} transform="rotate(-90 105 105)" style={{transition:'stroke-dashoffset 1s linear'}}/>
            </svg>
            <div style={{position:'absolute',inset:0,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center'}}>
              <div style={{fontFamily:'Baloo 2',fontSize:46,fontWeight:700,lineHeight:1}}>{mm}:{ss}</div>
              <div style={{fontSize:12,color:'var(--muted)',marginTop:4}}>đã tập trung ~{minutes}p</div>
            </div>
          </div>
          <div style={{display:'flex',gap:10,justifyContent:'center',marginTop:20}}>
            <button className="btn" style={{padding:'12px 22px'}} onClick={()=>setRunning(r=>!r)}><i className={'ti '+(running?'ti-player-pause':'ti-player-play')}></i>{running?'Tạm dừng':'Bắt đầu'}</button>
            <button className="btn ghost" style={{padding:'12px 16px'}} onClick={()=>{setRunning(false);setMode('focus');setLeft(FOCUS);}}><i className="ti ti-rotate"></i></button>
          </div>
          {task.est && <div style={{fontSize:12,color:'var(--muted)',marginTop:14}}>Ước tính việc này: ~{task.est}h{task.spent?(' · đã làm tổng '+(task.spent+minutes)+'p'):''}</div>}
        </div>
        <div className="modal-f">
          <button className="btn ghost" style={{flex:'0 0 auto',padding:'12px 16px'}} onClick={finish}>Lưu & đóng</button>
          <button className="btn" onClick={()=>{if(minutes>0)onLog(task.id,minutes);onDone(task.id);}}><i className="ti ti-check"></i>Hoàn thành việc</button>
        </div>
      </div>
    </div>
  );
}

/* ---------- Deep Work (toàn màn hình, không xao nhãng) ---------- */
function DeepWork({ids,tasks,onClose,onLog,onComplete,toggleCk}){
  const [phase,setPhase]=useState('setup'); // setup | work | done
  const [len,setLen]=useState(50);           // độ dài phiên (phút)
  const [left,setLeft]=useState(50*60);
  const [running,setRunning]=useState(false);
  const [seg,setSeg]=useState(0);            // giây trên việc hiện tại
  const [curId,setCurId]=useState(null);
  const [doneCnt,setDoneCnt]=useState(0);
  const [totalSec,setTotalSec]=useState(0);
  const [asking,setAsking]=useState(false);

  const byId={}; tasks.forEach(t=>byId[t.id]=t);
  const queue=ids.map(id=>byId[id]).filter(t=>t&&t.status!=='done');
  const cur=queue.find(t=>t.id===curId)||queue[0]||null;

  useEffect(()=>{ if(cur&&!curId) setCurId(cur.id); });
  useEffect(()=>{
    if(!running||phase!=='work') return;
    const tm=setInterval(()=>{
      setSeg(s=>s+1); setTotalSec(s=>s+1);
      setLeft(l=>{ if(l<=1){ setRunning(false); setPhase('done'); return 0; } return l-1; });
    },1000);
    return ()=>clearInterval(tm);
  },[running,phase]);

  const mm=String(Math.floor(left/60)).padStart(2,'0'), ss=String(left%60).padStart(2,'0');
  const logSeg=()=>{ if(cur){ const m=Math.round(seg/60); if(m>0)onLog(cur.id,m); } setSeg(0); };
  const start=(mins)=>{ setLen(mins); setLeft(mins*60); setPhase('work'); setRunning(true); };
  const nextTask=(afterComplete)=>{
    if(!cur) return;
    const i=queue.findIndex(t=>t.id===cur.id);
    const nxt=queue[i+1]||queue.find(t=>t.id!==cur.id)||null;
    logSeg();
    if(afterComplete) { onComplete(cur.id); setDoneCnt(c=>c+1); }
    if(nxt) setCurId(nxt.id); else { setRunning(false); setPhase('done'); }
  };
  const exit=()=>{ logSeg(); onClose(); };
  useEffect(()=>()=>Noise.stop(),[]);

  const bg={position:'fixed',inset:0,zIndex:300,background:'linear-gradient(160deg,#1a1410,#2a1c10 60%,#0f0c09)',color:'#fff',display:'flex',flexDirection:'column',overflowY:'auto'};
  const lightBtn={background:'rgba(255,255,255,.14)',color:'#fff',border:'1px solid rgba(255,255,255,.2)'};

  // ----- SETUP -----
  if(phase==='setup') return (
    <div style={bg}>
      <div style={{maxWidth:480,margin:'auto',padding:24,textAlign:'center',width:'100%'}}>
        <div style={{fontSize:48}}>🧘</div>
        <h1 style={{fontFamily:'Baloo 2',fontSize:26,margin:'10px 0 4px'}}>Deep Work</h1>
        <p style={{opacity:.7,fontSize:13.5,marginBottom:8}}>Một phiên tập trung sâu, không xao nhãng — đi qua {queue.length} việc đã ưu tiên.</p>
        {queue.length===0
          ? <p style={{opacity:.6,marginTop:20}}>Không có việc nào đang mở để tập trung.</p>
          : <>
            <div style={{textAlign:'left',background:'rgba(255,255,255,.07)',borderRadius:14,padding:'12px 16px',margin:'14px 0 22px'}}>
              {queue.slice(0,5).map((t,i)=>(<div key={t.id} style={{display:'flex',gap:8,padding:'5px 0',fontSize:13.5,opacity:i===0?1:.6}}><b style={{color:'var(--o-mid)'}}>{i+1}.</b><span>{t.title}</span></div>))}
              {queue.length>5 && <div style={{fontSize:12,opacity:.5,paddingTop:4}}>… và {queue.length-5} việc nữa</div>}
            </div>
            <div style={{fontSize:12.5,opacity:.7,marginBottom:10,fontWeight:600}}>Chọn độ dài phiên</div>
            <div style={{display:'flex',gap:10,justifyContent:'center'}}>
              {[25,50,90].map(m=>(
                <button key={m} onClick={()=>start(m)} style={{...lightBtn,padding:'16px 20px',borderRadius:14,fontFamily:'Baloo 2',fontSize:20,fontWeight:700,flex:1,cursor:'pointer'}}>{m}<div style={{fontSize:11,fontWeight:500,opacity:.7}}>phút</div></button>
              ))}
            </div>
          </>}
        <button onClick={onClose} style={{marginTop:24,background:'none',border:0,color:'rgba(255,255,255,.6)',fontSize:13,cursor:'pointer'}}>← Quay lại</button>
      </div>
    </div>
  );

  // ----- DONE -----
  if(phase==='done') return (
    <div style={bg}>
      <div style={{maxWidth:440,margin:'auto',padding:24,textAlign:'center',width:'100%'}}>
        <div style={{fontSize:48}}>🎉</div>
        <h1 style={{fontFamily:'Baloo 2',fontSize:24,margin:'10px 0'}}>Hết phiên Deep Work!</h1>
        <div style={{display:'flex',gap:14,justifyContent:'center',margin:'18px 0'}}>
          <div><div style={{fontFamily:'Baloo 2',fontSize:30}}>{Math.round(totalSec/60)}</div><div style={{fontSize:11,opacity:.7}}>phút tập trung</div></div>
          <div><div style={{fontFamily:'Baloo 2',fontSize:30}}>{doneCnt}</div><div style={{fontSize:11,opacity:.7}}>việc hoàn thành</div></div>
        </div>
        <div style={{display:'flex',gap:10,justifyContent:'center',flexWrap:'wrap'}}>
          {queue.length>0 && <button onClick={()=>{setLeft(25*60);setPhase('work');setRunning(true);}} style={{...lightBtn,padding:'12px 18px',borderRadius:12,fontWeight:600,cursor:'pointer'}}><i className="ti ti-plus"></i> Thêm 25 phút</button>}
          <button onClick={onClose} style={{background:'#fff',color:'#1a1410',padding:'12px 22px',borderRadius:12,fontWeight:700,border:0,cursor:'pointer'}}>Kết thúc</button>
        </div>
      </div>
    </div>
  );

  // ----- WORK -----
  return (
    <div style={bg}>
      {/* top bar tối giản */}
      <div style={{display:'flex',alignItems:'center',padding:'16px 20px',flexShrink:0}}>
        <div style={{fontSize:12.5,opacity:.6,fontWeight:600,letterSpacing:'.04em'}}>🧘 DEEP WORK · việc {Math.min(doneCnt+1,queue.length)}/{queue.length+doneCnt}</div>
        <div style={{flex:1}}></div>
        <button onClick={()=>setAsking(true)} style={{background:'none',border:0,color:'rgba(255,255,255,.55)',fontSize:22,cursor:'pointer',display:'flex'}}><i className="ti ti-x"></i></button>
      </div>

      {!cur
        ? <div style={{margin:'auto',textAlign:'center',opacity:.7}}><div style={{fontSize:40}}>✅</div><p style={{marginTop:10}}>Đã xong hết việc trong hàng đợi!</p><button onClick={onClose} style={{...lightBtn,marginTop:16,padding:'10px 18px',borderRadius:12,cursor:'pointer'}}>Kết thúc</button></div>
        : <div style={{margin:'auto',width:'100%',maxWidth:560,padding:'10px 22px 30px',textAlign:'center'}}>
            {/* đồng hồ lớn */}
            <div style={{fontFamily:'Baloo 2',fontSize:'clamp(64px,18vw,108px)',fontWeight:700,lineHeight:1,letterSpacing:'.02em'}}>{mm}:{ss}</div>
            <div style={{opacity:.55,fontSize:13,marginBottom:26}}>{running?'Đang tập trung — đừng rời đi':'Tạm dừng'}</div>

            {/* việc hiện tại */}
            <div style={{fontSize:12,opacity:.55,fontWeight:600,marginBottom:6}}>ĐANG LÀM</div>
            <div style={{fontFamily:'Baloo 2',fontSize:'clamp(20px,5vw,28px)',fontWeight:700,marginBottom:18,lineHeight:1.25}}>{cur.title}</div>

            {cur.checklist&&cur.checklist.length>0 &&
              <div style={{textAlign:'left',maxWidth:380,margin:'0 auto 22px'}}>
                {cur.checklist.map((c,i)=>(
                  <div key={i} onClick={()=>toggleCk(cur.id,i)} style={{display:'flex',gap:10,alignItems:'center',padding:'9px 12px',marginBottom:6,background:'rgba(255,255,255,.06)',borderRadius:10,cursor:'pointer',fontSize:14,opacity:c.done?.5:1}}>
                    <i className={'ti '+(c.done?'ti-circle-check-filled':'ti-circle')} style={{fontSize:20,color:c.done?'#4ade80':'rgba(255,255,255,.5)'}}></i>
                    <span style={{textDecoration:c.done?'line-through':'none'}}>{c.t}</span>
                  </div>
                ))}
              </div>}

            {/* điều khiển */}
            <div style={{display:'flex',gap:10,justifyContent:'center',flexWrap:'wrap'}}>
              <button onClick={()=>setRunning(r=>!r)} style={{background:'#fff',color:'#1a1410',padding:'13px 26px',borderRadius:30,fontWeight:700,border:0,cursor:'pointer',display:'flex',alignItems:'center',gap:7}}><i className={'ti '+(running?'ti-player-pause':'ti-player-play')}></i>{running?'Tạm dừng':'Tiếp tục'}</button>
              <button onClick={()=>nextTask(true)} style={{...lightBtn,padding:'13px 20px',borderRadius:30,fontWeight:600,cursor:'pointer',display:'flex',alignItems:'center',gap:7}}><i className="ti ti-check"></i>Xong việc này</button>
              {queue.length>1 && <button onClick={()=>nextTask(false)} title="Bỏ qua, sang việc sau" style={{...lightBtn,padding:'13px 16px',borderRadius:30,cursor:'pointer'}}><i className="ti ti-player-skip-forward"></i></button>}
            </div>

            {queue.length>1 && <div style={{marginTop:22,fontSize:12,opacity:.45}}>Tiếp theo: {(queue.find(t=>t.id!==cur.id)||{}).title||'—'}</div>}
            <div style={{marginTop:26,paddingTop:18,borderTop:'1px solid rgba(255,255,255,.12)'}}>
              <div style={{fontSize:11,opacity:.5,fontWeight:600,marginBottom:8,letterSpacing:'.04em'}}>🎧 ÂM THANH NỀN</div>
              <SoundBar/>
            </div>
          </div>}

      {/* xác nhận thoát */}
      {asking &&
        <div style={{position:'absolute',inset:0,background:'rgba(0,0,0,.6)',display:'flex',alignItems:'center',justifyContent:'center',zIndex:5}} onClick={()=>setAsking(false)}>
          <div onClick={e=>e.stopPropagation()} style={{background:'#241c14',borderRadius:16,padding:'22px',maxWidth:300,textAlign:'center',border:'1px solid rgba(255,255,255,.12)'}}>
            <div style={{fontSize:32}}>🚪</div>
            <p style={{margin:'8px 0 16px',fontSize:14}}>Thoát Deep Work? Thời gian đã làm vẫn được lưu.</p>
            <div style={{display:'flex',gap:10}}>
              <button onClick={()=>setAsking(false)} style={{...lightBtn,flex:1,padding:'11px',borderRadius:10,fontWeight:600,cursor:'pointer'}}>Ở lại</button>
              <button onClick={exit} style={{flex:1,padding:'11px',borderRadius:10,fontWeight:700,background:'#fff',color:'#1a1410',border:0,cursor:'pointer'}}>Thoát</button>
            </div>
          </div>
        </div>}
    </div>
  );
}

  const [stock,setStock]=useState([]);   // low inventory
