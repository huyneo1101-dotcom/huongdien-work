   {id:'pr1',t:'Markup vs Margin — đừng nhầm',min:2,body:['Markup = lãi so với GIÁ VỐN. Margin = lãi so với GIÁ BÁN.','Nhầm là tưởng lãi nhiều mà thực ra mỏng.'],f:'Margin = Markup ÷ (1 + Markup). VD markup 50% → margin chỉ 33%.',a:'Khi tính lời, luôn quy về margin trên giá bán để không ảo tưởng.'},
   {id:'pr2',t:'3 cách định giá',min:2,body:['Theo chi phí: giá vốn + mức lãi (an toàn nhưng dễ bỏ lỡ giá trị).','Theo thị trường: nhìn đối thủ (dễ vào cuộc đua giá).','Theo giá trị: khách sẵn trả bao nhiêu cho lợi ích họ nhận.'],a:'Hàng thiết yếu (bỉm/sữa) bám giá thị trường; hàng tư vấn/combo định theo giá trị để nâng biên.'},
   {id:'pr3',t:'Hàng dẫn khách vs hàng tạo lãi',min:2,body:['Hàng dẫn khách (bỉm, sữa phổ thông): biên mỏng nhưng kéo khách đến đều.','Hàng tạo lãi (vitamin, phụ kiện, combo): biên cao, cần tư vấn để bán kèm.'],a:'Đừng kỳ vọng lãi ở hàng dẫn khách — kiếm lời ở hàng bán kèm.'},
   {id:'pr4',t:'Combo & upsell',min:2,body:['Combo giúp khách tiện + tiết kiệm, đồng thời nâng giá trị đơn và biên.','Upsell = gợi loại tốt hơn; cross-sell = gợi món đi kèm.','Combo phải THỰC DỤNG, không nhồi cho to bill.'],a:'"Giỏ đồ đi sinh", combo ăn dặm theo tháng tuổi bé.'},
 ]},
 {id:'inv',name:'Quản lý tồn kho',ic:'📦',color:'#7c3aed',bg:'#ede9fe',lessons:[
   {id:'inv1',t:'Vòng quay tồn kho',min:2,body:['Đo số lần bán hết & nhập lại trong kỳ. Quay nhanh = vốn khỏe.','Hàng >60 ngày là cảnh báo giam vốn.'],f:'Vòng quay = Giá vốn hàng bán ÷ Tồn kho trung bình',a:'Theo dõi mã quay chậm; hàng >60 ngày phải có kế hoạch xả.'},
   {id:'inv2',t:'Phân loại ABC',min:2,body:['A: ~20% mã tạo ~80% doanh thu — chăm kỹ, không để hết hàng.','B: mức trung bình. C: nhiều mã nhưng đóng góp ít — giữ gọn nhẹ.'],a:'Dồn vốn & chú ý nhóm A; cắt bớt nhóm C nhập theo cảm tính.'},
   {id:'inv3',t:'Cận date & nguyên tắc FEFO',min:2,body:['FEFO = hàng hết hạn trước thì bán trước (quan trọng với sữa, ăn dặm).','Đặt ngưỡng xả sớm TRƯỚC khi cận date, đừng chờ sát hạn.'],a:'Chia tồn theo tuổi hàng; cận date → đẩy combo/giảm giá có kiểm soát.'},
 ]},
 {id:'cus',name:'Khách hàng & Giữ chân',ic:'❤️',color:'#db2777',bg:'#fce7f3',lessons:[
   {id:'cus1',t:'Giá trị trọn đời khách (CLV)',min:2,body:['Một khách mẹ bỉm mua lại hàng chục lần/năm trong 2–3 năm.','Giá trị thật không nằm ở 1 đơn, mà ở cả vòng đời mua hàng.'],f:'CLV ≈ Giá trị đơn TB × Số lần mua/năm × Số năm gắn bó',a:'Đầu tư chăm khách thân — đó là lợi nhuận bền nhất.'},
   {id:'cus2',t:'Chi phí có khách (CAC)',min:2,body:['CAC = tổng chi marketing ÷ số khách mới có được.','Nếu CAC > lãi từ khách đó → đang mua khách lỗ.'],a:'So CAC với CLV; mẹ&bé CLV cao nên đầu tư có khách rồi GIỮ là đáng.'},
   {id:'cus3',t:'Phân nhóm khách RFM',min:2,body:['R (mua gần đây), F (tần suất), M (giá trị) — chấm khách theo 3 chiều.','Khách mua gần đây + thường xuyên + chi nhiều = nhóm vàng.'],a:'Trên Zalo, gắn nhãn nhóm để nhắc mua lại & ưu đãi đúng người.'},
   {id:'cus4',t:'Giữ khách rẻ hơn tìm khách mới',min:2,body:['Có khách mới tốn gấp nhiều lần giữ khách cũ.','Tăng nhẹ tỷ lệ giữ chân có thể tăng lợi nhuận đáng kể.'],a:'Nhắc mua lại đúng chu kỳ, chăm theo tuổi bé thay vì chỉ chạy ads.'},
 ]},
 {id:'mkt',name:'Marketing thực dụng',ic:'📣',color:'#2563eb',bg:'#dbeafe',lessons:[
   {id:'mkt1',t:'Phễu khách hàng',min:2,body:['Biết → Thích → Tin → Mua → Quay lại. Mỗi tầng rơi rớt bớt.','Đừng chỉ lo "có đơn", phải lấy thông tin (Zalo) để chăm tiếp.'],a:'Nội dung kiến thức xây "Tin"; Zalo OA lo "Quay lại".'},
   {id:'mkt2',t:'ROAS — quảng cáo có lời không',min:2,body:['ROAS đo doanh thu thu về trên mỗi đồng quảng cáo.','ROAS phải đủ cao để bù biên mỏng + chi phí khác, nếu không vẫn lỗ.'],f:'ROAS = Doanh thu từ ads ÷ Chi phí ads',a:'Mỗi chiến dịch ghi chi/đơn/lãi & khách có quay lại không — đừng chạy "hy vọng".'},
   {id:'mkt3',t:'Thương hiệu nhỏ thắng ở đâu',min:2,body:['Không đua giá với chuỗi lớn.','Thắng bằng: tư vấn thật, nhớ khách, giao nhanh khu vực, niềm tin.'],a:'Với mẹ&bé, NIỀM TIN & tư vấn đúng quan trọng hơn rẻ vài nghìn.'},
 ]},
 {id:'mind',name:'Tư duy chủ shop',ic:'🧭',color:'#0891b2',bg:'#cffafe',lessons:[
   {id:'mind1',t:'Quản trị bằng số, không bằng cảm giác',min:2,body:['"Cái gì đo được mới quản được."','Quyết định bằng dữ liệu thật, không bằng cảm giác.'],a:'Dùng Sổ KD & Thống kê hằng tuần thay vì đoán.'},
   {id:'mind2',t:'Gấp vs Quan trọng (ma trận Eisenhower)',min:2,body:['Quan trọng + gấp: làm ngay.','Quan trọng + không gấp: LÊN LỊCH (quyết định tương lai, dễ bị bỏ quên).','Gấp + không quan trọng: giao bớt. Không gì cả: bỏ.'],a:'Việc "xây hệ thống, chăm khách thân" là quan trọng-không-gấp — đừng để việc vặt nuốt hết.'},
   {id:'mind3',t:'Quản trị rủi ro & năm xấu',min:2,body:['Chuẩn bị kịch bản TRƯỚC khi xấu xảy ra (DT giảm 10/20/30%).','Năm tốt doanh thu cứu bạn; năm xấu DÒNG TIỀN cứu bạn.'],a:'Giữ quỹ oxy, giảm tồn chậm, giữ khách thân — đã có trong kế hoạch phòng thủ.'},
 ]},
 {id:'law',name:'Thuế & Pháp lý hộ KD',ic:'🧾',color:'#0d9488',bg:'#ccfbf1',tag:'CẬP NHẬT 7/2026',lessons:[
   {id:'law1',t:'Bỏ thuế khoán — hộ KD kê khai thực từ 2026',min:3,body:['Từ 2026 bỏ thuế khoán, toàn bộ hộ kinh doanh chuyển sang KÊ KHAI theo doanh thu thực + sổ sách.','Ngành phân phối hàng hoá nộp 1% GTGT + 0,5% TNCN = 1,5% TRÊN DOANH THU — không tính theo lãi, không phụ thuộc hoá đơn đầu vào.','Doanh thu ≤ 200 triệu/năm được miễn GTGT và TNCN (nâng từ 100 triệu, áp dụng 01/01/2026).','Lệ phí môn bài đã bãi bỏ từ 01/01/2026 (Nghị quyết 198/2025/QH15).'],f:'Thuế phải nộp ≈ Doanh thu × 1,5%',a:'Vì nộp trên doanh thu, hàng thiếu hoá đơn đầu vào cũng không làm tăng thuế — đổi lấy rủi ro pháp lý để giấu doanh thu là lỗ.'},
   {id:'law2',t:'Hoá đơn điện tử từ máy tính tiền',min:2,body:['Bán lẻ trực tiếp cho người tiêu dùng bắt buộc dùng HOÁ ĐƠN ĐIỆN TỬ khởi tạo từ máy tính tiền, kết nối cơ quan thuế.','Phần mềm bán hàng (KiotViet/Sapo…) thường tích hợp sẵn.','Kèm theo: chữ ký số + mẫu 01/ĐKTĐ-HĐĐT + tài khoản ngân hàng đứng tên hộ, đăng ký với thuế.'],a:'Bật HĐĐT ngay trên KiotViet — vừa quản lý vừa đúng luật, đỡ làm tay.'},
   {id:'law5',t:'Hộ kinh doanh hay công ty — ở mức 3 tỷ',min:3,body:['HKD ở mức 3 tỷ: 1% GTGT (30tr) + 0,5% TNCN (15tr), sổ TT88 tự làm được → khoảng 45tr/năm.','Công ty TNHH: 10% GTGT trên giá trị gia tăng + 15% thuế TNDN + thuê kế toán 36–72tr/năm → khoảng 120–180tr/năm.','Điểm quyết định: hàng mẹ&bé đầu vào thường thiếu hoá đơn. Công ty không có hoá đơn đầu vào thì không được khấu trừ VAT và không được tính chi phí → thuế vọt lên gấp mấy lần.'],a:'Ở quy mô hiện tại chọn HKD. Chỉ lên công ty khi cần xuất hoá đơn VAT cho khách sỉ/đại lý, gọi vốn, hoặc mở chuỗi.'},
   {id:'law6',t:'Bốn thứ quản lý thị trường soi nhiều nhất',min:3,body:['1. Hoá đơn chứng từ nguồn gốc hàng — rủi ro số 1, lớn hơn thuế nhiều. Hàng không chứng từ bị coi là nhập lậu: tịch thu + phạt theo giá trị lô.','2. Dấu hợp quy CR trên đồ chơi trẻ em (QCVN 3:2019/BKHCN).','3. Niêm yết giá đầy đủ — sữa cho trẻ dưới 6 tuổi thuộc danh mục bình ổn giá.','4. Quảng cáo: cấm tuyệt đối quảng cáo sữa thay thế sữa mẹ cho trẻ dưới 24 tháng, bình bú và núm vú giả (NĐ 100/2014).'],a:'Ba lỗi sau sửa gần như miễn phí trong một buổi. Lỗi đầu mới là việc dài hạn — xem tab Nguồn hàng.'},
   {id:'law7',t:'Mỗi người chỉ đứng tên được 1 hộ kinh doanh',min:2,body:['Một cá nhân chỉ được đứng tên 1 HKD trên toàn quốc. Hộ thứ hai phải để người khác đứng tên, và người đó là chủ thật về pháp lý, chịu trách nhiệm vô hạn bằng tài sản riêng.','Hai HKD cùng địa điểm, cùng ngành, cùng kho, cùng nhân viên bị xác định là chia tách nhân tạo → cơ quan thuế GỘP doanh thu lại tính, cộng phạt.'],a:'Hai hộ 114 và Đỗ Quang phải tách thật: địa điểm riêng, kho riêng, hợp đồng riêng, nhân viên riêng — nếu không thì đừng tách.'},
   {id:'law8',t:'Thủ tục mở hộ kinh doanh mới',min:3,body:['Hồ sơ: giấy đề nghị đăng ký (Phụ lục III-1) + bản sao CCCD chủ hộ + hợp đồng thuê địa điểm/giấy tờ nhà.','Nộp tại bộ phận một cửa UBND cấp xã/phường nơi đặt địa điểm (từ 01/07/2025 bỏ cấp huyện), hoặc online tại dangkykinhdoanh.gov.vn. Xử lý 3 ngày làm việc, lệ phí khoảng 100.000đ.','Mã ngành nên đăng ký rộng ngay: 4719, 4722, 4772, 4771, 4764, 4759, 4791 (bán lẻ qua internet).','Căn hộ chung cư để ở KHÔNG đăng ký kinh doanh được.','Sau khi có giấy chứng nhận: mã số thuế (dùng số định danh cá nhân) → chữ ký số + HĐĐT → máy tính tiền → tài khoản ngân hàng đứng tên hộ → sổ TT88 → kê khai quý.'],a:'Phần tốn thời gian nằm ở sau khi có giấy phép, không phải ở khâu đăng ký.'},
   {id:'law3',t:'ATTP & nhãn mác hàng mẹ&bé',min:3,body:['Sữa, thực phẩm ăn dặm, TPCN cần công bố/đủ điều kiện ATTP.','Hàng nhập khẩu phải có TEM NHÃN PHỤ tiếng Việt, nguồn gốc, hạn dùng rõ ràng.','Giữ hóa đơn/chứng từ nhập để chứng minh hàng chính hãng.'],a:'Tránh nhập hàng trôi nổi không giấy tờ — rủi ro phạt & mất niềm tin khách.'},
   {id:'law4',t:'Chính sách đổi trả & quyền lợi khách',min:2,body:['Chính sách đổi trả rõ ràng, công khai làm khách yên tâm mua.','Bán đúng hàng chính hãng, tư vấn trung thực, không nhập nhèm thông tin.'],a:'Niềm tin là lợi thế cạnh tranh lớn nhất của shop mẹ&bé.'},
 ]},
 {id:'src',name:'Chứng từ & Nguồn hàng',ic:'📑',color:'#b45309',bg:'#fef3c7',tag:'MỚI 7/2026',lessons:[
   {id:'src1',t:'Ba loại giấy duy nhất có giá trị khi bị kiểm tra',min:2,body:['Lời cam kết "hàng chính hãng" của nhà cung cấp không có giá trị pháp lý nào.','Chỉ ba thứ này chứng minh được nguồn gốc: hoá đơn điện tử hợp lệ · giấy công bố sản phẩm · tờ khai hải quan của lô hàng.','Thêm một chứng cứ mạnh nữa: chứng từ chuyển khoản từ tài khoản đứng tên hộ kinh doanh.'],a:'Mỗi lô hàng nhập về đều phải đủ bộ này rồi mới cho lên kệ. Quy trình chi tiết ở Sổ tay → Quy trình nhận hàng đủ chứng từ.'},
   {id:'src2',t:'Hàng xách tay không hợp thức hoá được',min:3,body:['Hàng nhập khẩu không có tờ khai hải quan, chưa nộp thuế nhập khẩu và VAT khâu nhập là hàng nhập lậu (NĐ 98/2020).','Không tồn tại thủ tục nào biến nó thành hợp pháp sau khi đã vào Việt Nam ngoài luồng. Bảng kê mua của cá nhân, hợp đồng với người xách về, hoá đơn nội địa mua đi bán lại đều không phải chứng từ nhập khẩu.','Ba lớp rủi ro cộng dồn với hàng mẹ&bé: tịch thu + phạt theo giá trị lô · vi phạm ATTP nếu chưa công bố sản phẩm · hàng cho trẻ em thuộc nhóm tình tiết tăng nặng.','Có cửa hàng, biển hiệu, địa chỉ đăng ký mà bày hàng xách tay trên kệ thì rủi ro TĂNG so với bán chui.'],a:'Ba lối ra: mua từ nhà nhập khẩu chính thức · tự nhập chính ngạch nếu sản lượng đủ · hoặc bỏ dòng hàng.'},
   {id:'src3',t:'Nhập khẩu chính ngạch cần bộ hồ sơ gì',min:2,body:['Tờ khai hải quan, hợp đồng ngoại thương, invoice, packing list, vận đơn.','Chứng từ nộp thuế nhập khẩu + VAT khâu nhập khẩu; C/O nếu muốn ưu đãi thuế.','Với thực phẩm: kiểm tra nhà nước về ATTP tại cửa khẩu.','Công bố sản phẩm TRƯỚC khi bán — tự công bố với thực phẩm thường; đăng ký bản công bố tại Cục ATTP với sản phẩm cho trẻ dưới 36 tháng và thực phẩm dinh dưỡng y học.'],a:'Chỉ đáng làm khi sản lượng một mã đủ lớn để gánh chi phí công bố và thông quan.'},
   {id:'src4',t:'Nhận diện nhà phân phối thật',min:2,body:['Nhiều website tự xưng "nhà phân phối chính hãng" thực chất là hộ bán lẻ tự dựng web mang tên thương hiệu.','Cách kiểm: xin tên pháp nhân + mã số thuế rồi đối chiếu trên masothue.com trước khi đặt cọc.','Nhà cung cấp đòi cộng thêm 5–10% "để xuất hoá đơn" nghĩa là họ đang giấu doanh thu — đàm phán lại giá gốc hoặc đổi nguồn.'],a:'Danh sách 24 nhà phân phối đã tra và xác minh nằm ở tab Nguồn hàng, kèm mã số thuế và mức độ xác minh từng dòng.'},
 ]},
 {id:'hr',name:'Nhân sự & Đội nhóm',ic:'👥',color:'#ea580c',bg:'#ffedd5',lessons:[
   {id:'hr1',t:'Tuyển đúng người',min:2,body:['Với cửa hàng nhỏ: THÁI ĐỘ & sự tin cậy quan trọng hơn kỹ năng (kỹ năng dạy được).','Thử việc rõ ràng: kỳ vọng, tiêu chí đánh giá cụ thể.'],a:'Tuyển người chịu học chốt Zalo, chăm khách, kiểm kho — không chỉ đứng bán.'},
   {id:'hr2',t:'Đào tạo bằng SOP & đa năng',min:2,body:['Có quy trình chuẩn (SOP) thì người mới vào việc nhanh, ít sai.','1 nhân viên đa năng = bán + chốt Zalo + kiểm kho + gợi ý combo.'],a:'Dùng Sổ tay → mục Quy trình làm tài liệu đào tạo cho nhân viên mới.'},
   {id:'hr3',t:'Lương + thưởng theo kết quả',min:2,body:['Lương cứng giữ thấp hợp lý; thưởng gắn với doanh số, đơn chốt, khách quay lại.','Thưởng đúng việc tạo ra tiền → nhân viên chủ động hơn.'],a:'VD thưởng theo số đơn chốt qua Zalo / combo bán thêm.'},
   {id:'hr4',t:'Giữ người giỏi',min:2,body:['Người giỏi rời đi vì môi trường & sự ghi nhận, không chỉ vì lương.','Ghi nhận công khai, lộ trình rõ, đối xử công bằng.'],a:'Giữ được 1 nhân viên cứng = đỡ tốn tuyển + đào tạo lại nhiều lần.'},
 ]},
 {id:'omni',name:'Bán hàng đa kênh',ic:'🛒',color:'#9333ea',bg:'#f3e8ff',lessons:[
   {id:'omni1',t:'Mỗi kênh một vai trò',min:2,body:['TikTok/Facebook: khám phá, kéo khách mới.','Shopee/TikTok Shop: chốt đơn, tiếp cận người săn hàng.','Zalo OA + cửa hàng: giữ chân, bán lại, tư vấn sâu.'],a:'Đừng dồn mọi kỳ vọng vào 1 kênh — phối hợp theo đúng vai trò.'},

function Knowledge({learned,setLearned}){
  const all=KNOWLEDGE.flatMap(t=>t.lessons);
  const doneN=all.filter(l=>learned[l.id]).length;
  const next=all.find(l=>!learned[l.id]);
  const nextTopic=next?KNOWLEDGE.find(t=>t.lessons.some(l=>l.id===next.id)):null;
  const [openT,setOpenT]=useState(next?nextTopic.id:KNOWLEDGE[0].id);
  const [openL,setOpenL]=useState(next?next.id:null);
  const mark=(id)=>setLearned({...learned,[id]:!learned[id]});
  const goLesson=(tid,lid)=>{ setOpenT(tid); setOpenL(lid); };
  const Lesson=(l)=>(
    <div key={l.id} style={{borderTop:'1px solid var(--border)'}}>
      <div className="row" style={{padding:'11px 4px',cursor:'pointer'}} onClick={()=>setOpenL(openL===l.id?null:l.id)}>
        <span className={'chk'+(learned[l.id]?' done':'')} onClick={e=>{e.stopPropagation();mark(l.id);}}>{learned[l.id]&&<i className="ti ti-check"></i>}</span>
        <div className="rt"><b style={{fontWeight:600,fontSize:13.5,textDecoration:learned[l.id]?'line-through':'none',color:learned[l.id]?'var(--muted)':'var(--ink)'}}>{l.t}</b><small>{l.min} phút đọc</small></div>
        <i className={'ti '+(openL===l.id?'ti-chevron-up':'ti-chevron-down')} style={{color:'var(--muted2)'}}></i>
      </div>
      {openL===l.id &&
        <div style={{padding:'4px 6px 16px',animation:'fade .2s'}}>
          <ul style={{margin:'0 0 0 4px',paddingLeft:18,fontSize:13.5,lineHeight:1.7,color:'var(--ink)'}}>
            {l.body.map((b,i)=><li key={i} style={{marginBottom:4}}>{b}</li>)}
          </ul>
          {l.f && <div style={{margin:'12px 0',padding:'10px 13px',background:'var(--bg)',borderLeft:'3px solid var(--o)',borderRadius:8,fontSize:13,fontWeight:600}}>📐 {l.f}</div>}
          <div style={{marginTop:12,padding:'11px 13px',background:'var(--o-lt)',borderRadius:10,fontSize:13,color:'var(--o-dk)',lineHeight:1.55}}><b>Áp dụng cho Hương Diện:</b> {l.a}</div>
          <button className={'btn'+(learned[l.id]?' ghost':'')+' sm'} style={{marginTop:12}} onClick={()=>mark(l.id)}><i className={'ti '+(learned[l.id]?'ti-rotate':'ti-check')}></i>{learned[l.id]?'Bỏ đánh dấu':'Đánh dấu đã học'}</button>
        </div>}
    </div>
  );
  return (
    <div>
      {/* tiến độ */}
      <div className="panel">
        <div className="panel-b" style={{padding:'16px 18px',display:'flex',alignItems:'center',gap:14}}>
          <Ring pct={all.length?Math.round(doneN/all.length*100):0} size={50} color="#4f46e5"/>
          <div style={{flex:1}}>
            <b style={{fontFamily:'Baloo 2',fontSize:16}}>Đã học {doneN}/{all.length} bài</b>
            <div style={{fontSize:12.5,color:'var(--muted)'}}>{KNOWLEDGE.length} chủ đề cốt lõi cho chủ shop</div>
          </div>
        </div>
      </div>

      {/* gợi ý bài tiếp theo */}
      {next &&
        <div onClick={()=>goLesson(nextTopic.id,next.id)} style={{display:'flex',alignItems:'center',gap:13,background:'linear-gradient(135deg,#312e81,#4f46e5)',borderRadius:16,padding:'15px 18px',marginBottom:18,color:'#fff',cursor:'pointer',boxShadow:'var(--sh)'}}>
          <div style={{fontSize:28}}>{nextTopic.ic}</div>
          <div style={{flex:1,minWidth:0}}><div style={{fontSize:11.5,opacity:.85,fontWeight:600}}>HỌC TIẾP</div><b style={{fontFamily:'Baloo 2',fontSize:15.5}}>{next.t}</b><div style={{fontSize:12,opacity:.8}}>{nextTopic.name} · {next.min} phút</div></div>
          <span className="btn sm" style={{background:'rgba(255,255,255,.2)',pointerEvents:'none'}}>Học ngay</span>
        </div>}

      {/* chủ đề */}
      {KNOWLEDGE.map(tp=>{
        const dn=tp.lessons.filter(l=>learned[l.id]).length;
        const open=openT===tp.id;
        return (
          <div className="panel" key={tp.id} style={{marginBottom:12}}>
            <div className="panel-h" style={{cursor:'pointer'}} onClick={()=>setOpenT(open?null:tp.id)}>
              <div style={{width:34,height:34,borderRadius:10,background:tp.bg,color:tp.color,display:'flex',alignItems:'center',justifyContent:'center',fontSize:18}}>{tp.ic}</div>
              <div style={{flex:1}}>
                <b style={{fontSize:14.5,fontFamily:'Baloo 2'}}>{tp.name} {tp.tag&&<span className="tag" style={{background:'var(--blue-lt)',color:'var(--blue)',marginLeft:4,verticalAlign:'middle'}}>✨ {tp.tag}</span>}</b>
                <div style={{fontSize:12,color:'var(--muted)'}}>{dn}/{tp.lessons.length} bài đã học</div>
              </div>
              <i className={'ti '+(open?'ti-chevron-up':'ti-chevron-down')} style={{color:'var(--muted2)',fontSize:20}}></i>
            </div>
            {open && <div className="panel-b" style={{padding:'2px 16px 8px'}}>{tp.lessons.map(Lesson)}</div>}
          </div>
        );
      })}
    </div>
  );
}

        </div>
      </React.Fragment>}

      {seg==='b' && <div className="panel">
        <div className="panel-h"><i className="ti ti-alert-triangle lead" style={{color:'var(--amber)'}}></i><b>Nhóm B — chưa tìm ra đường chính ngạch</b></div>

          {GROUP_B.map((g,i)=>(
            <div className="row" key={i} style={{padding:'10px 0'}}>
              <span className="tag" style={{background:'var(--amber-lt)',color:'var(--amber)'}}>B</span>

            </div>
          ))}
          <div style={{marginTop:14,padding:'12px 14px',background:'var(--o-lt)',borderRadius:12,fontSize:12.5,color:'var(--o-dk)',lineHeight:1.6}}>

          </div>
        </div>
      </div>}
    </div>
  );
}

const TAX_QUARTERS=[{q:1,r:'Q1 (tháng 1–3)',d:'30/04'},{q:2,r:'Q2 (tháng 4–6)',d:'31/07'},{q:3,r:'Q3 (tháng 7–9)',d:'31/10'},{q:4,r:'Q4 (tháng 10–12)',d:'31/01 năm sau'}];
function Compliance({st,setSt}){
  const [openG,setOpenG]=useState(0);
  const [openI,setOpenI]=useState(null);
  const set=(id,patch)=>setSt({...st,[id]:{...(st[id]||{}),...patch}});
  const done=(id)=>(st[id]||{}).s==='done';
  const all=COMPLIANCE.reduce((a,g)=>a.concat(g.items),[]);
  const doneN=all.filter(i=>done(i.id)).length;
  const highOpen=all.filter(i=>i.risk==='high'&&!done(i.id)).length;

  /* Hạn nộp tờ khai gần nhất */
  const now=new Date(today()+'T00:00:00'), y=now.getFullYear();
  const deadlines=[new Date(y,3,30),new Date(y,6,31),new Date(y,9,31),new Date(y+1,0,31)];
  const nextD=deadlines.find(d=>d>=now)||deadlines[0];
  const daysLeft=Math.round((nextD-now)/86400000);
  const nextQ=[1,2,3,4][deadlines.indexOf(nextD)];
  const inp={width:'100%',background:'var(--bg)',border:'1.5px solid var(--border)',borderRadius:10,padding:'9px 11px',color:'var(--ink)',outline:'none',fontFamily:'inherit'};

  return (
    <div>
      <div className="panel" style={{marginBottom:14}}>
        <div className="panel-b" style={{padding:'16px 18px',display:'flex',alignItems:'center',gap:16,flexWrap:'wrap'}}>
          <Ring pct={all.length?Math.round(doneN/all.length*100):0} size={54} color={highOpen?'#dc2626':'#16a34a'}/>
          <div style={{flex:1,minWidth:200}}>
            <b style={{fontFamily:'Baloo 2',fontSize:16}}>Đã xử lý {doneN}/{all.length} mục</b>
            <div style={{fontSize:12.5,color:'var(--muted)'}}>{highOpen>0?<span style={{color:'var(--red)',fontWeight:600}}>Còn {highOpen} mục rủi ro cao chưa xử lý</span>:'Không còn mục rủi ro cao nào'}</div>
          </div>
          <div style={{padding:'11px 15px',borderRadius:12,background:daysLeft<=10?'var(--red-lt)':'var(--blue-lt)',color:daysLeft<=10?'var(--red)':'var(--blue)',textAlign:'center'}}>
            <div style={{fontSize:11,fontWeight:700}}>HẠN NỘP TỜ KHAI Q{nextQ}</div>
            <b style={{fontFamily:'Baloo 2',fontSize:19}}>{dstr(nextD).split('-').reverse().slice(0,2).join('/')}</b>
            <div style={{fontSize:11.5,fontWeight:600}}>còn {daysLeft} ngày</div>
          </div>
        </div>
      </div>

      <div className="panel" style={{marginBottom:14}}>
        <div className="panel-h"><i className="ti ti-calendar-due lead"></i><b>Lịch khai thuế quý — tờ khai 01/CNKD</b></div>
        <div className="panel-b" style={{padding:'6px 18px 14px'}}>
          {TAX_QUARTERS.map(q=>(
            <div className="row" key={q.q} style={{padding:'9px 0'}}>
              <span className="tag" style={{background:'var(--blue-lt)',color:'var(--blue)'}}>Q{q.q}</span>
              <div className="rt"><b>{q.r}</b></div>
              <b style={{fontSize:13.5}}>hạn {q.d}</b>
            </div>
          ))}
          <div style={{marginTop:12,padding:'11px 13px',background:'var(--o-lt)',color:'var(--o-dk)',borderRadius:11,fontSize:12.5,lineHeight:1.6}}>
            <i className="ti ti-bulb"></i> Quy trình 9 bước làm báo cáo quý nằm ở <b>Sổ tay → Quy trình</b>. App tự tạo việc "Làm &amp; nộp tờ khai thuế quý" vào đầu mỗi tháng khai (1/4/7/10). Nhớ: <b>tồn đầu kỳ lấy từ số cuối kỳ của bảng quý trước</b>, không lấy cột tồn đầu kỳ của KiotViet.
          </div>
        </div>
      </div>

      {COMPLIANCE.map((g,gi)=>{
        const dn=g.items.filter(i=>done(i.id)).length, open=openG===gi;
        return (
          <div className="panel" key={gi} style={{marginBottom:12}}>
            <div className="panel-h" style={{cursor:'pointer'}} onClick={()=>setOpenG(open?-1:gi)}>
              <span style={{fontSize:19}}>{g.ic}</span>
              <div style={{flex:1}}>
                <b style={{fontSize:14.5,fontFamily:'Baloo 2'}}>{g.g}</b>
                <div style={{fontSize:12,color:'var(--muted)'}}>{dn}/{g.items.length} đã xử lý</div>
              </div>
              <i className={'ti '+(open?'ti-chevron-up':'ti-chevron-down')} style={{color:'var(--muted2)',fontSize:20}}></i>
            </div>
            {open && <div className="panel-b" style={{padding:'2px 16px 10px'}}>
              {g.items.map(it=>{
                const r=RISK[it.risk], isOpen=openI===it.id, my=st[it.id]||{};
                return (
                  <div key={it.id} style={{borderTop:'1px solid var(--border)'}}>
                    <div className="row" style={{padding:'11px 4px',cursor:'pointer'}} onClick={()=>setOpenI(isOpen?null:it.id)}>
                      <span className={'chk'+(done(it.id)?' done':'')} onClick={e=>{e.stopPropagation();set(it.id,{s:done(it.id)?'':'done'});}}>{done(it.id)&&<i className="ti ti-check"></i>}</span>
                      <div className="rt">
                        <b style={{fontWeight:600,fontSize:13.5,textDecoration:done(it.id)?'line-through':'none',color:done(it.id)?'var(--muted)':'var(--ink)'}}>{it.t}</b>
                        <small>{it.law||'—'}</small>
                      </div>
                      <span className="tag" style={{background:r.bg,color:r.c}}>{r.n}</span>
                      <i className={'ti '+(isOpen?'ti-chevron-up':'ti-chevron-down')} style={{color:'var(--muted2)'}}></i>
                    </div>
                    {isOpen &&
                      <div style={{padding:'4px 6px 16px',animation:'fade .2s'}}>
                        <ul style={{margin:'0 0 0 4px',paddingLeft:18,fontSize:13.5,lineHeight:1.7}}>
                          {it.why.map((w,i)=><li key={i} style={{marginBottom:4}}>{w}</li>)}
                        </ul>
                        <div style={{marginTop:12,padding:'11px 13px',background:'var(--o-lt)',borderRadius:11,fontSize:13,color:'var(--o-dk)',lineHeight:1.6}}>
                          <b>Việc cần làm:</b>
                          <ul style={{margin:'6px 0 0',paddingLeft:18}}>{it.act.map((a,i)=><li key={i} style={{marginBottom:3}}>{a}</li>)}</ul>
                        </div>
                        <textarea placeholder="Ghi chú: đã xử lý đến đâu, ai làm, còn vướng gì…" value={my.note||''}
                          onChange={e=>set(it.id,{note:e.target.value})} style={{...inp,minHeight:56,resize:'vertical',marginTop:10}}/>
                      </div>}
                  </div>
                );
              })}
            </div>}
          </div>
        );
      })}

      <div style={{padding:'12px 14px',background:'var(--bg)',borderRadius:12,fontSize:12,color:'var(--muted)',lineHeight:1.6,marginTop:6}}>
        Nội dung tổng hợp ngày 25/07/2026 từ đợt rà soát danh mục 826 sản phẩm và làm báo cáo thuế Q2/2026. Đây là bản ghi việc cần làm, không thay thế tư vấn của kế toán hay đại lý thuế — với các mục rủi ro cao nên hỏi thêm người có chuyên môn.
      </div>
    </div>
  );
}

/* ================= ĐỘI NGŨ: phân công · tiến độ · thành viên ================= */
function memberStats(tasks,uid){
  const t=today(), mine=tasks.filter(x=>x.assignee===uid);
  const open=mine.filter(x=>x.status!=='done');
  return {
    all:mine.length,
    todo:open.filter(x=>x.status==='todo').length,

    doneAll:mine.filter(x=>x.status==='done').length,

  };
}

          {free.map(t=>{ const p=projOf(t.proj), sg=suggest(t); return (

                <div style={{flex:1,minWidth:0}}>

function Members({users,setUsers,roles,setRoles,me,isOwner,tasks}){

  const [busy,setBusy]=useState(false);

    if(nm.trim().length<2){ alert('Nhập tên thành viên.'); return; }
    setBusy(true);
    const code=tempCode(), salt=randHex(8), hash=await hashPw(code,salt);
    const u={id:'u'+Date.now(),name:nm.trim(),role:rl,salt,hash,mustChange:true,active:true,createdAt:today()};
    setUsers([...users,u]); setMade({name:u.name,code}); setNm(''); setBusy(false);

  const reset=async(u)=>{

    setBusy(true);

    setMade({name:u.name,code}); setBusy(false);
  };
  const toggleActive=(u)=>{
    if(u.id===me.id){ alert('Không tự khoá tài khoản của chính mình được.'); return; }
    setUsers(users.map(x=>x.id===u.id?{...x,active:x.active===false}:x));

                <div style={{flex:'1 1 120px',minWidth:0}}>
                  <b style={{fontSize:14}}>{u.name}{u.id===me.id&&<span style={{color:'var(--muted2)',fontWeight:500}}> · bạn</span>}</b>

            </div>
          </div>
          <div className="fld">
            <label>Giao cho</label>
            {canAssign
              ? <div className="chips">
                  <button className={'chip'+(!f.assignee?' on':'')} onClick={()=>set('assignee','')}>◻️ Chưa giao</button>
                  {(users||[]).filter(u=>u.active!==false).map(u=>{ const r=roleOf(u,roles||[]); return (
                    <button key={u.id} className={'chip'+(f.assignee===u.id?' on':'')} onClick={()=>set('assignee',u.id)} title={r.n}>{r.ic} {u.name}{u.id===(me&&me.id)?' (tôi)':''}</button>
                  ); })}
                </div>
              : <div style={{fontSize:13,color:'var(--muted)',padding:'8px 0'}}>
                  {f.assignee===(me&&me.id)?'Việc của bạn':'Chỉ chủ và quản lý mới đổi được người nhận việc.'}
                </div>}
          </div>
          <div className="frow">
            <div className="fld">
              <label>Mức ưu tiên</label>
              <div className="chips">
                {Object.keys(PRI).map(k=>(
                  <button key={k} className={'chip prichip '+k+(f.pri===k?' on':'')} onClick={()=>set('pri',k)}>{PRI[k]}</button>
                ))}
              </div>
            </div>
            <div className="fld">
              <label>Hạn chót</label>
              <input type="date" value={f.due||''} onChange={e=>set('due',e.target.value)}/>
            </div>
          </div>
          <div className="fld">
            <label>Trạng thái</label>
            <div className="chips">
              {Object.keys(STATUS).map(k=>(
                <button key={k} className={'chip'+(f.status===k?' on':'')} onClick={()=>set('status',k)}>{STATUS[k].name}</button>
              ))}
            </div>
          </div>
          <div className="fld">
            <label>Thời lượng ước tính (giờ) — để trống sẽ tự tính</label>
            <input type="number" min="0.5" step="0.5" placeholder={'Tự tính ~'+estOf(f)+'h'} value={f.est||''} onChange={e=>set('est',e.target.value?+e.target.value:undefined)}/>
          </div>
          {f.status!=='done' &&
          <div className="fld">
            <label>Tiến độ</label>
            <div className="rng">
              <input type="range" min="0" max="100" step="5" value={f.progress} onChange={e=>set('progress',+e.target.value)}/>
              <b>{f.progress}%</b>
            </div>
          </div>}
          <div className="fld">
            <label>Ghi chú</label>
            <textarea placeholder="Chi tiết, ghi chú thêm…" value={f.note||''} onChange={e=>set('note',e.target.value)}></textarea>
          </div>
          <div className="fld">
            <label>Việc nhỏ (checklist)</label>
            {f.checklist.map((c,i)=>(
              <div className="ckedit" key={i}>
                <input placeholder={'Bước '+(i+1)} value={c.t} onChange={e=>setCk(i,e.target.value)}/>
                <button onClick={()=>delCk(i)}><i className="ti ti-trash"></i></button>
              </div>
            ))}
            <button className="btn ghost sm" onClick={addCk}><i className="ti ti-plus"></i>Thêm bước</button>
          </div>
          {!task._new &&
            <button className="del" onClick={()=>onDel(f.id)}><i className="ti ti-trash"></i>Xoá công việc này</button>}
        </div>
        <div className="modal-f">
          <button className="btn ghost" style={{flex:'0 0 auto',padding:'12px 18px'}} onClick={onClose}>Huỷ</button>
          <button className="btn" onClick={submit}><i className="ti ti-check"></i>Lưu công việc</button>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<Root/>);
</script>

<!-- pwa-update-banner: tự phát hiện bản mới (so ETag/Last-Modified index.html) -->
<script>
(function(){
  if('serviceWorker' in navigator){
    window.addEventListener('load',function(){
      navigator.serviceWorker.register('sw.js').then(function(reg){
        setInterval(function(){ try{ reg.update(); }catch(e){} }, 300000);
      }).catch(function(){});
    });
  }
  if(location.protocol==='file:') return;
  var pageUrl=location.href.split('#')[0].split('?')[0], baseTag=null, shown=false;
  function getTag(cb){ fetch(pageUrl,{method:'HEAD',cache:'no-store'}).then(function(r){ cb(r.headers.get('etag')||r.headers.get('last-modified')||null); }).catch(function(){ cb(null); }); }
  function showBanner(){
    if(shown||!document.body) return; shown=true;
    var b=document.createElement('div');
    b.textContent='🔄 Có bản Quản lý CV mới — chạm để cập nhật';
    b.style.cssText='position:fixed;left:10px;right:10px;top:calc(10px + env(safe-area-inset-top));z-index:2147483647;background:#111827;color:#fff;padding:11px 16px;border-radius:13px;text-align:center;font-family:system-ui,-apple-system,sans-serif;font-size:14px;font-weight:700;box-shadow:0 8px 24px rgba(0,0,0,.3);cursor:pointer;line-height:1.35';
    b.setAttribute('role','button');
    b.onclick=function(){ b.textContent='Đang cập nhật…'; try{ if(navigator.serviceWorker&&navigator.serviceWorker.getRegistration){ navigator.serviceWorker.getRegistration().then(function(reg){ try{ if(reg) reg.update(); }catch(e){} setTimeout(function(){ location.reload(); },500); }); return; } }catch(e){} location.reload(); };
    document.body.appendChild(b);
  }
  getTag(function(t){ baseTag=t; });
  function check(){ if(baseTag==null){ getTag(function(t){ baseTag=t; }); return; } getTag(function(t){ if(t&&t!==baseTag) showBanner(); }); }
  setInterval(check, 180000);
  document.addEventListener('visibilitychange',function(){ if(document.visibilityState==='visible') check(); });
})();
</script>
