function Sourcing({st,setSt}){
  const [seg,setSeg]=useState('list');
  const [filter,setFilter]=useState('all');
  const [open,setOpen]=useState(null);
  const [copied,setCopied]=useState(null);
  const set=(id,patch)=>setSt({...st,[id]:{...(st[id]||{}),...patch}});
  const stat=(id)=>(st[id]&&st[id].s)||'todo';
  const copy=(txt,id)=>{ try{navigator.clipboard.writeText(txt);}catch(e){} setCopied(id); setTimeout(()=>setCopied(c=>c===id?null:c),1500); };

  const totalTon=SOURCING_BRANDS.reduce((a,b)=>a+b.ton,0);
  const doneTon=SOURCING_BRANDS.filter(b=>stat(b.id)==='switched').reduce((a,b)=>a+b.ton,0);
  const cnt={}; SRC_STATUS.forEach(s=>cnt[s.k]=SOURCING_BRANDS.filter(b=>stat(b.id)===s.k).length);
  const totalSku=SOURCING_BRANDS.reduce((a,b)=>a+b.sku,0);

  const list=SOURCING_BRANDS.filter(b=>filter==='all'?true:filter==='prio'?!!b.prio:stat(b.id)===filter)
    .sort((a,b)=>(a.prio||99)-(b.prio||99)||b.ton-a.ton);
  const inp={width:'100%',background:'var(--bg)',border:'1.5px solid var(--border)',borderRadius:10,padding:'9px 11px',color:'var(--ink)',outline:'none',fontFamily:'inherit'};

  return (
    <div>
      <div className="chips" style={{marginBottom:16}}>
        <button className={'chip'+(seg==='list'?' on':'')} onClick={()=>setSeg('list')}><i className="ti ti-list"></i> 24 thương hiệu nhóm A</button>
        <button className={'chip'+(seg==='script'?' on':'')} onClick={()=>setSeg('script')}><i className="ti ti-phone-call"></i> Kịch bản gọi</button>
        <button className={'chip'+(seg==='b'?' on':'')} onClick={()=>setSeg('b')}><i className="ti ti-alert-triangle"></i> Nhóm B</button>
      </div>

      {seg==='list' && <React.Fragment>
        <div className="panel" style={{marginBottom:14}}>
          <div className="panel-b" style={{padding:'16px 18px',display:'flex',alignItems:'center',gap:16,flexWrap:'wrap'}}>
            <Ring pct={totalTon?Math.round(doneTon/totalTon*100):0} size={54} color="#16a34a"/>
            <div style={{flex:1,minWidth:190}}>
              <b style={{fontFamily:'Baloo 2',fontSize:16}}>Đã chuyển nguồn {doneTon.toFixed(1)}tr / {totalTon.toFixed(1)}tr tồn kho</b>
              <div style={{fontSize:12.5,color:'var(--muted)'}}>{cnt.switched}/{SOURCING_BRANDS.length} thương hiệu · {totalSku} SKU thuộc diện chuyển nguồn</div>
            </div>
            <div style={{display:'flex',gap:8,flexWrap:'wrap'}}>
              {SRC_STATUS.map(s=>(
                <div key={s.k} style={{textAlign:'center',minWidth:64,padding:'8px 10px',borderRadius:11,background:s.bg}}>
                  <b style={{display:'block',fontFamily:'Baloo 2',fontSize:18,color:s.c}}>{cnt[s.k]}</b>
                  <span style={{fontSize:10.5,color:'var(--muted)',fontWeight:600}}>{s.n}</span>
                </div>
              ))}
            </div>
          </div>
        </div>

        <div style={{padding:'12px 14px',background:'var(--o-lt)',borderRadius:12,fontSize:12.5,color:'var(--o-dk)',lineHeight:1.55,marginBottom:14}}>
          <i className="ti ti-info-circle"></i> Danh sách tra ngày <b>25/07/2026</b> từ website chính thức của nhà phân phối và masothue.com — <b>chưa gọi kiểm chứng số nào</b>. Gọi xong nhớ bấm đổi trạng thái và ghi kết quả để lần sau khỏi tra lại.
        </div>

        <div className="chips" style={{marginBottom:14}}>
          <button className={'chip'+(filter==='all'?' on':'')} onClick={()=>setFilter('all')}>Tất cả ({SOURCING_BRANDS.length})</button>
          <button className={'chip'+(filter==='prio'?' on':'')} onClick={()=>setFilter('prio')}>⭐ Gọi trước ({SOURCING_BRANDS.filter(b=>b.prio).length})</button>
          {SRC_STATUS.map(s=>(<button key={s.k} className={'chip'+(filter===s.k?' on':'')} onClick={()=>setFilter(s.k)}>{s.n} ({cnt[s.k]})</button>))}
        </div>

        {list.length===0 && <div className="empty"><i className="ti ti-mood-empty"></i><p>Không có thương hiệu nào ở trạng thái này.</p></div>}
        {list.map(b=>{
          const s=SRC_STATUS.find(x=>x.k===stat(b.id)), isOpen=open===b.id, my=st[b.id]||{};
          return (
            <div className="panel" key={b.id} style={{marginBottom:10,borderLeft:'4px solid '+s.c}}>
              <div className="panel-h" style={{cursor:'pointer'}} onClick={()=>setOpen(isOpen?null:b.id)}>

/* ================= ĐỘI NGŨ: phân công · tiến độ · thành viên ================= */
function memberStats(tasks,uid){
  const t=today(), mine=tasks.filter(x=>x.assignee===uid);
  const open=mine.filter(x=>x.status!=='done');
  return {
    all:mine.length,
    todo:open.filter(x=>x.status==='todo').length,
    doing:open.filter(x=>x.status==='doing').length,
    over:open.filter(x=>x.due&&x.due<t).length,
    dueToday:open.filter(x=>x.due===t).length,
    doneWeek:mine.filter(x=>x.status==='done'&&x.doneAt&&x.doneAt>=addDays(-7)).length,
    onTime:mine.filter(x=>x.status==='done'&&x.doneAt&&x.due&&x.doneAt<=x.due).length,
    doneAll:mine.filter(x=>x.status==='done').length,
    open:open.length,
  };
}

          {free.map(t=>{ const p=projOf(t.proj), sg=suggest(t); return (
            <div className="row" key={t.id} style={{padding:'11px 2px',flexWrap:'wrap'}}>
              <span className="tag" style={{background:p.bg,color:p.color}}>{p.icon} {p.name}</span>

              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

        <div className="panel-b" style={{padding:'14px 18px 18px'}}>

            <input placeholder="Tên thành viên" value={nm} onChange={e=>setNm(e.target.value)} onKeyDown={e=>e.key==='Enter'&&add()} style={{...inp,flex:'2 1 180px'}}/>
            <select value={rl} onChange={e=>setRl(e.target.value)} style={selSt}>{roles.map(r=>(<option key={r.id} value={r.id}>{r.ic} {r.n}</option>))}</select>
            <button className="btn" disabled={busy} onClick={add}><i className="ti ti-plus"></i>Tạo & cấp mã tạm</button>
          </div>
          <div style={{marginTop:12,padding:'11px 13px',background:'var(--o-lt)',color:'var(--o-dk)',borderRadius:11,fontSize:12.5,lineHeight:1.55}}>
            <i className="ti ti-info-circle"></i> App tạo <b>mã tạm 6 số</b>, người mới dùng mã đó đăng nhập lần đầu rồi <b>tự đặt mật khẩu của họ</b>. Bạn không biết và không cần biết mật khẩu của nhân viên.
          </div>
        </div>
      </div>

      <div className="panel" style={{marginBottom:14}}>
        <div className="panel-h"><i className="ti ti-users lead"></i><b>Thành viên ({users.length})</b></div>
        <div className="panel-b" style={{padding:'4px 18px 14px'}}>
          {users.map(u=>{ const r=roleOf(u,roles), s=memberStats(tasks,u.id), off=u.active===false; return (
            <div key={u.id} style={{padding:'12px 0',borderTop:'1px solid var(--border)',opacity:off?.55:1}}>
              <div style={{display:'flex',gap:10,alignItems:'center',flexWrap:'wrap'}}>
                <div style={{width:34,height:34,borderRadius:11,background:'var(--o-lt)',color:'var(--o-dk)',display:'flex',alignItems:'center',justifyContent:'center',fontWeight:700,fontFamily:'Baloo 2'}}>{initials(u.name)}</div>
                <div style={{flex:'1 1 150px',minWidth:0}}>
                  <div style={{display:'flex',alignItems:'center',gap:6}}>
                    {/* Đổi tên tại chỗ. Ô trống chỉ nằm trong bản nháp, KHÔNG ghi đè tên đã lưu —
                        xoá hết để gõ lại mà bỏ đi giữa chừng thì tên cũ vẫn còn nguyên. */}
                    <input value={draft[u.id]!==undefined?draft[u.id]:u.name} placeholder="Tên thành viên"
                      onChange={e=>{ const v=e.target.value; setDraft({...draft,[u.id]:v});
                        if(v.trim()) setUsers(users.map(x=>x.id===u.id?{...x,name:v}:x)); }}
                      onKeyDown={e=>e.key==='Enter'&&e.target.blur()}
                      className="nameedit" style={{...inp,fontWeight:700,fontSize:14,padding:'6px 9px'}}/>
                    {u.id===me.id&&<span style={{color:'var(--muted2)',fontWeight:500,fontSize:12,whiteSpace:'nowrap'}}>· bạn</span>}
                  </div>
                  <div style={{fontSize:11.5,color:'var(--muted)',paddingLeft:9}}>{s.open} việc đang mở{s.over?' · '+s.over+' quá hạn':''}{u.mustChange?' · chưa đặt mật khẩu':''}{off?' · đã khoá':''}</div>
                </div>
                <select value={u.role} disabled={u.id===me.id} onChange={e=>setUsers(users.map(x=>x.id===u.id?{...x,role:e.target.value}:x))} style={selSt}>
                  {roles.map(x=>(<option key={x.id} value={x.id}>{x.ic} {x.n}</option>))}
                </select>
                <button className="btn ghost sm" disabled={busy} onClick={()=>reset(u)} title="Cấp lại mật khẩu"><i className="ti ti-key"></i>Cấp lại</button>
                {u.id!==me.id && <button className="btn ghost sm" onClick={()=>toggleActive(u)}>{off?'Mở khoá':'Khoá'}</button>}
                {u.id!==me.id && <button onClick={()=>del(u)} style={{color:'var(--red)',padding:6,display:'flex'}}><i className="ti ti-trash" style={{fontSize:18}}></i></button>}
              </div>
            </div>
          ); })}
        </div>
      </div>

      <div className="panel">
        <div className="panel-h" style={{cursor:'pointer'}} onClick={()=>setShowRole(o=>!o)}>
          <i className="ti ti-id-badge-2 lead"></i><b>Vai trò ({roles.length})</b>
          <i className={'ti '+(showRole?'ti-chevron-up':'ti-chevron-down')} style={{marginLeft:'auto',color:'var(--muted2)',fontSize:20}}></i>
        </div>
        {showRole && <div className="panel-b" style={{padding:'4px 18px 16px'}}>
          {roles.map(r=>(
            <div className="row" key={r.id} style={{padding:'10px 0'}}>
              <span style={{fontSize:18}}>{r.ic}</span>
              <div className="rt"><b>{r.n}</b><small>{r.admin?'Thấy Số liệu & Đội ngũ':'Chỉ thấy việc được giao'}{(r.projs||[]).length?' · gợi ý mảng: '+r.projs.map(p=>projOf(p).name).join(', '):''}</small></div>
              {ROLE_SEED.some(x=>x.id===r.id)
                ? <span className="tag" style={{background:'var(--bg)',color:'var(--muted2)'}}>mặc định</span>
                : <button onClick={()=>{ if(users.some(u=>u.role===r.id)){alert('Còn thành viên đang giữ vai trò này.');return;} setRoles(roles.filter(x=>x.id!==r.id)); }} style={{color:'var(--red)',padding:6,display:'flex'}}><i className="ti ti-trash" style={{fontSize:17}}></i></button>}
            </div>
          ))}
          <div style={{marginTop:12,padding:14,background:'var(--bg)',borderRadius:12,display:'flex',gap:9,flexWrap:'wrap',alignItems:'center'}}>
            <input placeholder="Tên vai trò mới…" value={rn} onChange={e=>setRn(e.target.value)} onKeyDown={e=>e.key==='Enter'&&addRole()} style={{...inp,flex:'2 1 180px',background:'var(--card)'}}/>
            <label style={{display:'flex',alignItems:'center',gap:6,fontSize:12.5,fontWeight:600,color:'var(--muted)'}}>
              <input type="checkbox" checked={radmin} onChange={e=>setRadmin(e.target.checked)}/> Được xem Số liệu & Đội ngũ
            </label>
            <button className="btn sm" onClick={addRole}><i className="ti ti-plus"></i>Thêm vai trò</button>
          </div>
        </div>}
      </div>

      <div style={{padding:'12px 14px',background:'var(--bg)',borderRadius:12,fontSize:12,color:'var(--muted)',lineHeight:1.6,marginTop:14}}>
        <b>Về bảo mật:</b> mật khẩu lưu dạng băm SHA-256 kèm muối riêng, không lưu chữ thật, và không đọc lại được. Màn khoá chặn người lạ mở link cũng như người không phận sự cầm máy. Nhưng app chạy trên trình duyệt nên người rành kỹ thuật ngồi trước máy đã đăng nhập vẫn đọc được dữ liệu qua công cụ nhà phát triển — muốn chặn cả trường hợp đó phải chuyển sang tài khoản trên máy chủ. <b>Mã đồng bộ</b> chính là chìa khoá vào dữ liệu cửa hàng từ máy khác, chỉ đưa cho người trong đội.
      </div>
    </div>
  );
}

   box:{t:'Mẫu phiếu chuyển hàng giữa hai chi nhánh',lines:['Ngày ___ · Từ: ____ → Đến: ____',

     'Người giao ___  Người nhận ___  (chụp ảnh gửi nhóm Zalo quản lý)']},
   do:['Lần chuyển hàng gần nhất, viết lại phiếu cho đủ thông tin trên.'],
   err:['Chuyển hàng miệng, hết quý không khớp tồn.']},
  {id:'dq3',t:'Chốt ca và chốt sổ cuối ngày',min:6,
   body:['Đếm tiền mặt trong két, đối chiếu với tổng tiền mặt trên KiotViet của ca. Lệch là báo ngay trong ngày, để hôm sau thì không tìm ra nữa.',
     'Đối chiếu tiền chuyển khoản: mở sao kê tài khoản hộ, cộng lại xem có khớp với các đơn ghi "chuyển khoản" không.',
     'Rà đơn nào đã bán mà chưa xuất hoá đơn, ghi lại để quản lý xử lý.',
     'Kiểm nhanh kệ: có mã nào hết hàng cần báo nhập, có mã nào cận date cần đẩy.'],
   do:['Làm đủ 4 bước trên trong ca hôm nay, ghi kết quả vào ghi chú công việc trong app.'],
   err:['Để dồn 2–3 ngày mới đối chiếu tiền.']},
  {id:'dq4',t:'Tư vấn bán hàng — học chung với NV bán hàng NK',min:4,
   body:['Toàn bộ phần tư vấn theo tháng tuổi bé, chọn size bỉm, xử lý từ chối và ranh giới không được nói đều áp dụng y hệt cho ĐQ.',
     'Mở giáo trình vai "NV bán hàng NK" ở ô chọn phía trên và học hết 6 bài đó.',
     'Điểm khác duy nhất: mọi thao tác hoá đơn và thu tiền phải theo đúng hộ Đỗ Quang.'],
   do:['Đọc hết giáo trình NV bán hàng NK, tick lại từng bài.'],
   err:[]},
  {id:'dq5',t:'Giữ khách khu vực quanh chi nhánh',min:5,
   body:['Lợi thế của chi nhánh nhỏ là giao nhanh và nhớ khách — không phải giá rẻ.',
     'Khách trong bán kính đi xe 10–15 phút: nhận giao trong ngày, nói rõ khung giờ.',
     'Lập nhóm Zalo khách quen quanh khu vực để báo hàng mới và hàng cận date giảm giá.',
     'Nhớ mặt và nhớ bé: gọi đúng tên bé là khách quay lại.'],
   do:['Lên danh sách 20 khách hay mua nhất ở khu vực, gắn nhãn trên Zalo.'],
   err:['Hứa giao trong ngày rồi để sang hôm sau.']},
 ]},

 kho:{ic:'📦',intro:'Kho sai một con số thì cuối quý cả cửa hàng phải ngồi dò lại, và hồ sơ thuế lệch theo. Việc của bạn là giữ cho số trên phần mềm luôn bằng số trên kệ, và hàng đi tỉnh đến nơi nguyên vẹn.',lessons:[
  {id:'kho1',t:'Nhận hàng về: kiểm đủ 5 thứ trước khi ký',min:7,
   body:['Ký nhận rồi thì mọi thiếu hụt và hư hỏng thành trách nhiệm của mình. Kiểm xong mới ký.',
     'SỐ LƯỢNG: đếm thùng, mở kiểm xác suất ít nhất 1 thùng mỗi mã.',
     'HẠN DÙNG: ghi lại date của từng lô. Hàng còn dưới 6 tháng phải báo quản lý trước khi nhập kho.',
     'TÌNH TRẠNG: móp, ướt, rách seal, hộp phồng — chụp ảnh ngay khi còn mặt người giao.',
     'NHÃN PHỤ TIẾNG VIỆT: hàng nhập khẩu phải có. Thiếu là không được bày lên kệ.',
     'CHỨNG TỪ: hoá đơn điện tử, phiếu giao hàng. Hàng nhập khẩu phải có tờ khai hải quan; đồ chơi phải có tem hợp quy CR.'],
   box:{t:'Không nhận hàng nếu',lines:['Không có hoá đơn điện tử · Hàng nhập khẩu không có tờ khai hải quan',
     'Đồ chơi không có tem CR · Không có nhãn phụ tiếng Việt và bên giao không chịu bổ sung',
     'Hạn dùng ngắn hơn thoả thuận']},
   do:['Lô hàng gần nhất, đối chiếu xem có đủ 5 nhóm thông tin trên không.'],
   err:['Ký nhận rồi mới mở kiểm.','Nhận hàng cận date vì "bán nhanh thôi mà".']},
  {id:'kho2',t:'FEFO và quản lý hạn dùng',min:6,
   body:['FEFO = hàng nào HẾT HẠN TRƯỚC thì bán trước. Khác FIFO (nhập trước bán trước) — với sữa và đồ ăn dặm phải theo hạn dùng.',
     'Xếp kệ: lô hạn gần để phía ngoài, lô hạn xa đẩy vào trong. Mỗi lần bổ sung hàng phải xoay lại, không úp hàng mới lên trên.',
     'Dán nhãn tháng/năm hết hạn ở mặt ngoài thùng để nhìn là biết, khỏi lật từng hộp.',
     'Ngưỡng cảnh báo: còn 6 tháng → báo marketing để lên chương trình đẩy; còn 3 tháng → giảm giá có kiểm soát; còn 1 tháng → xả dứt điểm hoặc trả nhà cung cấp nếu có thoả thuận.'],
   do:['Rà một kệ sữa, xem có hộp nào hạn gần bị đẩy vào trong không.'],
   err:['Bổ sung hàng mới đặt đè lên hàng cũ.','Phát hiện cận date khi chỉ còn 2 tuần.']},
  {id:'kho7',t:'Sổ theo dõi date: ghi từ lúc nhập, rà mỗi tuần',min:8,
   body:['Cận date không "bỗng nhiên xuất hiện" — nó xuất hiện vì lúc nhập không ai ghi lại date. Quản lý date bắt đầu ở cửa kho, không phải ở kệ.',
     'KHI NHẬN HÀNG: ghi date của TỪNG LÔ vào sổ theo dõi ngay lúc kiểm nhận, cùng lúc với đếm số lượng. Một mã hàng có thể tồn 2–3 lô date khác nhau — phải ghi tách lô, không ghi gộp.',
     'SỔ THEO DÕI DATE (một bảng tính chung cả cửa hàng, ai cũng xem được): Mã hàng · Tên · Lô/Date · Số lượng theo lô · Vị trí (kho hay kệ, NK hay ĐQ) · Ngày nhập · Ghi chú xử lý. Cột Date để dạng tháng/năm cho dễ lọc, sắp xếp theo date gần nhất lên đầu.',
     'DÁN NHÃN VẬT LÝ: mặt ngoài mỗi thùng ghi to tháng/năm hết hạn bằng bút dạ. Hàng lên kệ thì lô date gần dán chấm màu (đỏ = dưới 3 tháng, vàng = 3–6 tháng) ở đáy hộp để người bán nhìn là biết bán hộp nào trước.',
     'RÀ MỖI TUẦN MỘT LẦN, cố định vào một ngày (khớp với việc lặp lại "Kiểm tem giá, nhãn phụ" sáng thứ 3 trong app): lọc sổ theo date tăng dần, cập nhật số lượng còn lại của các lô đã bán bớt, chuyển mã chạm ngưỡng sang danh sách xử lý.',
     'Khi một lô bán hết: gạch khỏi sổ ngay. Sổ chỉ đáng tin khi nó khớp thực tế — sổ sai còn nguy hiểm hơn không có sổ, vì mọi người tin vào số sai.',
     'Nhóm phải canh chặt nhất ở cửa hàng này: sữa bột (nhất là lon đã cận), ăn dặm, váng sữa - sữa chua, men vi sinh, vitamin dạng nước sau mở nắp. Nhóm date dài như bỉm, khăn ướt, đồ dùng chỉ cần rà mỗi tháng.'],
   box:{t:'Khung sổ theo dõi date — lập một lần dùng mãi',lines:['Cột: Mã | Tên hàng | Date (MM/YYYY) | SL lô | Vị trí | Ngày nhập | Trạng thái xử lý',
     'Lọc "date < hôm nay + 6 tháng" mỗi tuần → đó chính là danh sách cần hành động.',
     'Một mã 2 lô = 2 dòng. Không bao giờ gộp.']},
   do:['Lập sổ theo dõi date từ tồn kho hiện tại, bắt đầu với nhóm sữa + ăn dặm trước (nhóm nguy hiểm nhất).','Dán nhãn date mặt thùng cho toàn bộ hàng trong kho trong tuần này.'],
   err:['Ghi date vào trí nhớ thay vì vào sổ.','Một mã hai lô nhưng sổ chỉ ghi date của lô mới → lô cũ hết hạn trên kệ không ai hay.','Lập sổ xong không cập nhật — sau một tháng sổ thành đồ trang trí.']},
  {id:'kho8',t:'Hàng sắp hết date: ngưỡng nào, ai làm gì',min:9,
   body:['Nguyên tắc lớn: hàng cận date là VẤN ĐỀ TIỀN chứ không chỉ là vấn đề kho — mỗi hộp hết date là vốn mất trắng 100%, trong khi xả sớm ở tháng thứ 6 có khi vẫn giữ được 70–80% vốn. Xả sớm luôn rẻ hơn xả muộn.',
     'NGƯỠNG 6 THÁNG — CẢNH BÁO: chuyển danh sách cho marketing để lên kế hoạch đẩy tự nhiên: ưu tiên trưng bày phía ngoài, đưa vào combo, làm quà tặng kèm đơn lớn. Chưa cần giảm giá. Người bán được dặn ưu tiên gợi ý các mã này.',
     'NGƯỠNG 3 THÁNG — GIẢM GIÁ CÓ KIỂM SOÁT: giảm 15–30% tuỳ mã, đẩy qua kênh nhanh nhất: nhắn Zalo khách quen đang dùng đúng mã đó ("chị đang dùng loại này, đợt này em có lô giảm X% date [tháng/năm], chị lấy thêm không ạ"), nhóm khách khu vực, kệ giảm giá riêng có ghi rõ date.',
     'NGƯỠNG 1 THÁNG — XẢ DỨT ĐIỂM: giảm sâu 40–50%, bán theo lốc, hoặc trả nhà cung cấp nếu thoả thuận có điều khoản đổi hàng cận date (hỏi lại điều khoản này MỖI LẦN nhập lô mới — đây là một trong 9 câu ở kịch bản gọi NPP).',
     'BÁN HÀNG CẬN DATE PHẢI NÓI RÕ: ghi date ngay trên kệ/bài đăng, người bán nói miệng thêm một lần. Khách mua rẻ mà biết trước thì vui; khách về nhà mới thấy date gần thì mất luôn niềm tin — với shop mẹ&bé, niềm tin là thứ đắt nhất.',
     'HẾT DATE — HUỶ, KHÔNG CÓ NGOẠI LỆ: không bán rẻ, không tặng, không "để dùng nội bộ" với đồ ăn uống của trẻ. Lập biên bản huỷ đơn giản (mã, lô, số lượng, ngày huỷ, ảnh chụp) rồi trừ tồn trên KiotViet ngay — để hồ sơ thuế khớp và để bảng cân đối quý không lệch.',
     'MỖI LẦN HUỶ LÀ MỘT BÀI HỌC NHẬP: mã nào phải huỷ hoặc xả lỗ, ghi lại một dòng "vì sao tồn tới hết date" (nhập quá tay? bán chậm hơn dự kiến? bị lô date ngắn ngay từ đầu?) và báo người nhập hàng — vòng sau nhập ít lại hoặc ép NCC giao date dài hơn.',
     'Khi NHẬN lô mới cũng là lúc chặn từ gốc: hàng giao date ngắn hơn 2/3 tổng hạn dùng thì có quyền từ chối hoặc ép điều khoản đổi trả — đừng nhận bừa rồi ba tháng sau ngồi xả.'],
   box:{t:'Tóm tắt ngưỡng — dán ở kho',lines:['🟡 6 tháng: báo marketing · combo/quà kèm · trưng ngoài · CHƯA giảm giá',
     '🟠 3 tháng: giảm 15–30% · Zalo khách đang dùng đúng mã · kệ riêng ghi rõ date',
     '🔴 1 tháng: giảm 40–50% / trả NCC theo thoả thuận · bán phải nói rõ date',
     '⚫ Hết date: huỷ + biên bản + ảnh + trừ tồn KiotViet ngay. Không bán, không tặng.']},
   do:['Lọc sổ date lấy danh sách dưới 6 tháng, chia thành 3 nhóm ngưỡng, gửi quản lý + marketing hôm nay.','Kiểm điều khoản đổi hàng cận date với 3 nhà cung cấp lớn nhất — chưa có thì ghi vào việc cần đàm phán.'],
   err:['Giấu date khi bán hàng giảm giá — được một đơn, mất một khách và kéo theo cả nhóm Zalo của họ.','Chờ đến 2 tuần cuối mới xả → chỉ còn cách huỷ.','Huỷ hàng nhưng quên trừ tồn → kiểm kê lệch, cuối quý bảng cân đối sai.','Huỷ xong không báo người nhập → quý sau lại ôm đúng mã đó.']},
  {id:'kho3',t:'Kiểm kê: làm sao để số khớp',min:7,
   body:['Kiểm kê là đếm thật rồi so với số trên KiotViet, không phải chép lại số của phần mềm.',
     'Đếm theo khu vực, đánh dấu khu đã đếm để không đếm sót hoặc đếm hai lần.',
     'Không bán hàng trong lúc đang đếm khu đó. Nếu buộc phải bán thì ghi phiếu riêng, cộng bù sau.',
     'Lệch thì tìm nguyên nhân chứ đừng sửa số cho khớp: bán quên ghi, hàng vỡ chưa xoá, chuyển chi nhánh chưa hạch toán, nhập nhầm mã tương tự.',
     'Số tồn cuối kỳ chính là số tồn đầu kỳ của quý sau trong hồ sơ thuế — sửa bừa cho khớp là để lại rắc rối cho cả năm sau.'],
   do:['Kiểm kê thử một nhóm hàng, ghi lại mọi chênh lệch kèm nguyên nhân.'],
   err:['Sửa số trên phần mềm cho bằng số đếm mà không ghi lý do.']},
  {id:'kho4',t:'Đóng gói theo từng loại hàng',min:6,
   body:['Sữa bột hộp thiếc: chèn kín, không để hộp va vào nhau. Móp hộp là khách trả lại.',
     'Sữa nước, hộp giấy: bọc riêng, tránh để vật nặng đè lên.',
     'Thuỷ tinh (bình sữa, lọ vitamin): bọc xốp nổ từng cái, dán chữ DỄ VỠ ở hai mặt thùng.',
     'Bỉm: cồng kềnh nhưng nhẹ — hãng vận chuyển tính theo cân nặng quy đổi, gói chặt lại để giảm thể tích.',
     'Đơn nhiều món: kiểm lại phiếu trước khi dán băng dính, chụp ảnh thùng đã đóng trước khi giao cho shipper.'],
   do:['Đóng thử một đơn có cả sữa hộp và bình thuỷ tinh, chụp lại kết quả.'],
   err:['Nhét bỉm vào thùng to lồng bồng làm phí ship tăng gấp đôi.','Không chụp ảnh, khách báo thiếu hàng thì không có gì đối chứng.']},
  {id:'kho5',t:'Bắn đơn tỉnh: quy trình và cân nặng quy đổi',min:8,
   body:['Trước khi bắn đơn: xác nhận lại với khách địa chỉ, số điện thoại và hình thức thanh toán. Sai số điện thoại là đơn hoàn chắc chắn.',
     'Cân nặng tính cước là số LỚN HƠN giữa cân nặng thật và cân nặng quy đổi theo thể tích.',
     'Ghi chú vận đơn phải rõ: "hàng dễ vỡ", "cho khách kiểm hàng", "gọi trước khi giao".',
     'Đơn COD: ghi đúng số tiền thu hộ. Ghi sai là shipper thu sai, đối soát rất mệt.',
     'Lưu mã vận đơn vào đơn hàng trên KiotViet và nhắn ngay cho khách.',
     'Theo dõi đơn đang giao mỗi ngày. Đơn kẹt quá 2 ngày không đổi trạng thái thì gọi hãng vận chuyển hỏi.'],
   box:{t:'Công thức cân nặng quy đổi',lines:['Cân quy đổi (kg) = Dài × Rộng × Cao (cm) ÷ 6000',
     'Ví dụ thùng bỉm 60×40×30cm = 72.000 ÷ 6000 = 12kg tính cước, dù cân thật chỉ 4kg.',
     '→ Gói chặt, chọn thùng vừa khít là cách giảm cước nhanh nhất.']},
   do:['Đo một thùng bỉm đang đóng, tính cân quy đổi, so với cân thật.'],
   err:['Ghi sai tiền COD.','Không lưu mã vận đơn, khách hỏi thì không tra được.']},
  {id:'kho6',t:'Đơn hoàn, đơn thất lạc, hàng lỗi',min:6,
   body:['Đơn hoàn về: kiểm tình trạng hàng trước khi nhập lại kho. Hộp móp, seal rách thì không bày lên kệ nữa, tách riêng báo quản lý.',
     'Nhập lại kho ngay trong ngày — hàng hoàn nằm ngoài sổ là nguồn lệch tồn kho lớn nhất.',
     'Đơn thất lạc: khiếu nại hãng vận chuyển trong thời hạn quy định, kèm ảnh đóng gói và mã vận đơn. Quá hạn là mất quyền đòi bồi thường.',
     'Hàng lỗi từ nhà cung cấp: chụp ảnh, giữ nguyên bao bì, báo trong vòng 24 giờ.'],
   do:['Lập một chỗ riêng trong kho dán nhãn "Hàng hoàn - chờ xử lý".'],
   err:['Để hàng hoàn chất góc kho cả tuần.','Vứt bao bì hàng lỗi rồi mới báo nhà cung cấp.']},
 ]},

 mkt:{ic:'📣',intro:'Bạn giữ bốn mảng: nội dung Facebook, thiết kế ảnh, và chọn nguồn + chọn hàng để nhập. Nghe nhiều việc nhưng thực ra là một chuỗi: hàng nhập đúng → ảnh đẹp → bài chuẩn → khách vào → biết cái gì bán được để nhập tiếp. Nội dung sai luật thì cửa hàng bị phạt; nhập sai hàng thì vốn chôn trong kho — cả hai đều đắt.',lessons:[
  {id:'mkt1',t:'Luật quảng cáo ngành mẹ&bé — học trước khi viết bài',min:9,
   body:['Đây là bài quan trọng nhất của vai trò này. Rất nhiều shop mẹ&bé bị phạt vì không biết.',
     'CẤM TUYỆT ĐỐI quảng cáo: sản phẩm sữa thay thế sữa mẹ cho trẻ DƯỚI 24 THÁNG, bình bú và núm vú giả (Nghị định 100/2014). Cấm cả bài đăng cũ còn để trên trang.',
     'Danh mục cửa hàng đang có 26 mã Pigeon (bình bú, núm ti) và nhiều dòng sữa số 1, số 2 — toàn bộ nhóm này không được đăng bài, không chạy quảng cáo.',
     'Thực phẩm chức năng và thực phẩm bảo vệ sức khoẻ: nội dung quảng cáo phải được cơ quan y tế XÁC NHẬN TRƯỚC khi đăng. Cửa hàng đang có nhiều TPCN Úc như Healthy Care, Bio Island, Blackmores, Nordic Naturals.',
     'Không dùng từ "chữa", "điều trị", "khỏi hẳn" cho thực phẩm chức năng.',
     'Không dùng hình ảnh bác sĩ, nhân viên y tế để quảng cáo thực phẩm.'],
   box:{t:'Được và không được',lines:['ĐƯỢC: đăng sữa cho trẻ trên 24 tháng, sữa bầu, bỉm, khăn ướt, đồ dùng, ăn dặm.',
     'ĐƯỢC: trả lời riêng cho khách hỏi về sữa số 1, số 2 — tư vấn cá nhân không phải quảng cáo.',
     'KHÔNG: đăng bài, chạy ads, livestream, treo biển khuyến mãi cho sữa dưới 24 tháng, bình bú, núm ti.']},
   do:['Rà lại toàn bộ bài đăng cũ trên fanpage và TikTok, ẩn hết bài thuộc nhóm cấm.','Kiểm tra không còn chiến dịch quảng cáo nào đang chạy cho nhóm này.'],
   err:['Nghĩ rằng bài đăng từ năm ngoái thì không tính.','Đăng ảnh combo có lẫn bình sữa vào giữa.']},
  {id:'mkt2',t:'Nội dung nào đáng làm ở ngành này',min:7,
   body:['Mẹ bỉm mua vì TIN, không vì rẻ. Nội dung kiến thức xây niềm tin tốt hơn bài bán hàng.',
     'Tỉ lệ nên giữ: khoảng 6 phần kiến thức và mẹo nuôi con, 2 phần review sản phẩm, 1 phần khuyến mãi, 1 phần hậu trường cửa hàng.',
     'Nội dung theo tháng tuổi bé là mảng dễ làm và trúng nhất: mỗi nhóm tuổi một chuỗi bài.',
     'Video không lộ mặt vẫn bán được: quay tay cận cảnh, TikTok Photo Mode, video chữ chạy kèm giọng đọc.',
     'Bài hậu trường — đóng gói, nhập hàng, kiểm date — tạo cảm giác cửa hàng thật, làm ăn nghiêm túc.'],
   box:{t:'Chủ đề luôn có người đọc',lines:['Dấu hiệu bé cần đổi size bỉm · Pha sữa đúng cách, sai lầm hay gặp',
     'Lịch ăn dặm theo tháng tuổi · Bé táo bón mẹ nên làm gì',
     'Chọn đồ đi sinh cần những gì · Cách bảo quản sữa mẹ']},
   do:['Lên lịch nội dung 1 tuần theo tỉ lệ 6-2-1-1.'],
   err:['Tuần nào cũng chỉ đăng bài giảm giá.']},
  {id:'mkt3',t:'Dùng thư viện prompt AI cho nhanh',min:5,
   body:['Sổ tay → Thư viện prompt có sẵn hàng chục prompt viết caption, kịch bản TikTok, bài SEO, tin nhắn chăm khách.',
     'Cách dùng: bấm Copy, dán vào ChatGPT hoặc Claude, điền chỗ trong ngoặc vuông rồi chạy.',
     'AI viết xong PHẢI đọc lại và kiểm: tên sản phẩm, công dụng, giá, và nhất là có phạm luật quảng cáo ở bài trước không.',
     'Đừng để AI tự viết về công dụng y tế của thực phẩm chức năng.'],
   do:['Lấy prompt "3 caption bán hàng Facebook", chạy thử cho một sản phẩm đang cần đẩy.'],
   err:['Đăng thẳng bài AI viết mà không đọc lại.']},
  {id:'mkt7',t:'Viết bài Facebook: cấu trúc một bài bán được',min:8,
   body:['Facebook cắt bài sau khoảng 3 dòng đầu — người đọc chỉ thấy phần đó rồi mới quyết bấm "Xem thêm". Dòng đầu tiên quyết định tất cả.',
     'HOOK (1–2 dòng): một nỗi lo, một câu hỏi hoặc một con số. "Bé 8 tháng đêm nào cũng dậy 3 lần?" ăn đứt "Shop về hàng mới ạ".',
     'THÂN (3–6 dòng): mỗi dòng một ý, xuống dòng thoáng. Nói LỢI ÍCH cho bé và mẹ trước, thông số sau. Mẹ bỉm đọc trên điện thoại lúc bế con — đoạn dài là lướt qua.',
     'GIÁ + CTA (2 dòng): ghi giá công khai — minh bạch tạo tin, giấu giá "inbox nhé" làm mất số khách ngại nhắn. Kết bằng một hành động duy nhất: nhắn Zalo, comment tháng tuổi bé, hoặc ghé cửa hàng.',
     'HASHTAG: 3–5 cái, có tên shop + tên sản phẩm + khu vực. Đừng nhồi 20 hashtag.',
     'Bài kiến thức được phép dài hơn nhiều, nhưng vẫn cần hook và vẫn kết bằng một gợi ý nhẹ về sản phẩm — không hard-sell.',
     'Viết xong soi lại một lượt theo bài 1: sản phẩm trong bài có thuộc nhóm cấm quảng cáo không, có chữ "chữa/điều trị" nào lọt vào không.'],
   box:{t:'Khung bài bán — điền là xong',lines:['Dòng 1: [nỗi lo/câu hỏi trúng mẹ bỉm]',
     'Dòng 2–5: [3 lợi ích, mỗi dòng một ý, có emoji đầu dòng]',
     'Dòng 6: 💰 Giá ___ · tặng kèm/combo ___',
     'Dòng 7: 👉 [MỘT hành động: "Comment tháng tuổi bé, em tư vấn size" là CTA tốt nhất — vừa tương tác vừa ra tư vấn]',
     '#HuongDienBaby #[tênSP] #mevabe[khuvực]']},
   do:['Lấy một bài cũ của fanpage, viết lại theo khung trên, so hai bản.','Viết 5 hook cho 5 sản phẩm đang cần đẩy, chưa cần viết cả bài.'],
   err:['Dòng đầu là "Shop xin chào các mẹ" — mất hook.','Ba CTA trong một bài: vừa bảo inbox, vừa bảo comment, vừa bảo ghé shop.','Đăng bài bán sữa số 1–2 vì quên soi luật.']},
  {id:'mkt8',t:'Vận hành fanpage mỗi ngày: đăng, trả lời, giữ trang sạch',min:8,
   body:['NHỊP ĐĂNG: 1 bài/ngày là đủ, đều quan trọng hơn nhiều. Giờ mẹ bỉm online mạnh nhất: trưa 11h30–13h và tối 20h–22h — đặt lịch đăng trước cả tuần bằng công cụ hẹn giờ của Meta, đừng ngày nào cũng ngồi nghĩ.',
     'TRẢ LỜI COMMENT: nhanh nhất có thể trong giờ mở cửa, muộn nhất trong ngày. Mỗi comment hỏi han là một khách đang ở rất gần quyết định mua — trả lời xong luôn kèm một câu kéo về Zalo/inbox để lấy liên hệ.',
     'ẨN comment chứa SỐ ĐIỆN THOẠI của khách ngay khi thấy — đối thủ vợt khách từ comment công khai là chuyện xảy ra hằng ngày. Ẩn (chứ không xoá) thì khách vẫn thấy comment của mình, còn người ngoài không thấy.',
     'Comment chê/khiếu nại: KHÔNG xoá (xoá là họ đăng bài riêng nặng hơn). Trả lời công khai một câu nhận trách nhiệm + mời inbox xử lý. Người ngoài nhìn vào đánh giá cách shop xử lý chứ không đánh giá lời chê.',
     'Comment seeding bẩn của đối thủ, link lạ: ẩn và chặn.',
     'INBOX: Meta đo tốc độ phản hồi và hiện công khai trên trang. Cài câu trả lời tự động ngoài giờ ("Shop mở cửa 8h–21h, chị để lại tháng tuổi bé + điều cần tư vấn, sáng mai em trả lời ngay ạ") và cài câu hỏi thường gặp: giá ship, giờ mở cửa, địa chỉ.',
     'Mỗi tuần nhìn lại 3 số: bài nào reach cao nhất (làm thêm dạng đó), bao nhiêu tin nhắn mới, bao nhiêu Zalo lấy được từ page.'],
   box:{t:'Mẫu trả lời tình huống hay gặp',lines:['Khách hỏi giá dưới bài: "Dạ [giá] chị ạ. Bé nhà mình mấy tháng rồi chị, em tư vấn đúng loại cho bé nhé — chị nhắn em qua Zalo [số] cho tiện ạ 🥰"',
     'Comment chê hàng/dịch vụ: "Dạ em xin lỗi vì trải nghiệm của chị ạ. Chị inbox giúp em mã đơn, em kiểm tra và xử lý ngay hôm nay ạ." — rồi XỬ LÝ THẬT trong ngày.',
     'Khách cũ khen: trả lời + xin phép chụp lại comment làm ảnh feedback (xoá tên/ảnh đại diện nếu khách không đồng ý để nguyên).']},
   do:['Cài trả lời tự động ngoài giờ và 3 câu hỏi thường gặp cho page ngay hôm nay.','Hẹn giờ sẵn 7 bài cho tuần tới theo tỉ lệ 6-2-1-1 ở bài 2.'],
   err:['Để comment hỏi giá 2 ngày không ai trả lời — khách đó đã mua chỗ khác.','Xoá comment chê → khách chụp màn hình đăng nhóm kín mẹ bỉm.','Trả lời giá xong không kéo về Zalo — có tương tác nhưng không có khách.']},
  {id:'mkt9',t:'Chụp ảnh sản phẩm bằng điện thoại cho ra ảnh bán được',min:9,
   body:['TUYỆT ĐỐI KHÔNG lấy ảnh của shop khác. Web cửa hàng từng bị phát hiện dùng ảnh còn nguyên watermark của đối thủ — vừa rủi ro pháp lý vừa mất mặt với khách nhận ra. Ảnh tự chụp xấu hơn chút vẫn đáng tin hơn ảnh đẹp đi mượn.',
     'ÁNH SÁNG là 80% chất lượng ảnh: chụp ban ngày cạnh cửa sổ, sản phẩm cách cửa sổ 1–1,5m, KHÔNG bật đèn vàng trần (ảnh ám vàng). Trời nắng gắt thì che rèm mỏng cho dịu.',
     'NỀN: một tấm foam trắng hoặc bìa cứng màu pastel làm nền sau + một tấm lót dưới là đủ studio. Lau sạch hộp, xoay mặt nhãn chính diện, phẳng góc.',
     'Mỗi sản phẩm chụp đủ BỘ 5 ẢNH: chính diện · góc 45° · cận nhãn thành phần/date · cạnh vật quen thuộc để thấy kích cỡ (bàn tay, hộp sữa quen) · ảnh bối cảnh sử dụng (bình sữa cạnh khăn xô, gấu bông).',
     'Chỉnh trên điện thoại: kéo sáng nhẹ, tăng tương phản chút xíu là dừng — đừng lạm filter làm sai màu hộp, khách nhận hàng thấy khác màu là nghĩ hàng giả.',
     'KHO ẢNH: tạo một thư mục chung (Google Drive/Photos), mỗi sản phẩm một thư mục đặt theo MÃ HÀNG trên KiotViet. Ảnh gốc giữ riêng, ảnh đã chèn chữ giữ riêng. Ảnh chụp một lần, cả shop dùng cả năm.',
     'Ưu tiên chụp trước: nhóm biên cao đang cần đẩy (TPCN, sữa non) và các mã còn dùng ảnh placeholder hoặc ảnh mượn trên web.'],
   box:{t:'Checklist trước khi bấm chụp',lines:['✔ Lau hộp sạch, không móp méo · ✔ Nhãn chính diện, không loá',
     '✔ Sáng từ cửa sổ, tắt đèn vàng · ✔ Nền gọn, không lộ đồ linh tinh phía sau',
     '✔ Lùi ra chụp rồi crop, đừng zoom (zoom điện thoại làm vỡ ảnh)']},
   do:['Dựng góc chụp cạnh cửa sổ, chụp thử bộ 5 ảnh cho 3 mã biên cao.','Rà web, lập danh sách mã còn ảnh placeholder/ảnh mượn — đó là hàng đợi chụp của tuần này.'],
   err:['Chụp buổi tối dưới đèn vàng rồi ngồi chỉnh màu cả tiếng.','Ảnh đẹp nhưng nằm rải rác trong máy 3 người, cần lại không ai tìm ra.','Zoom sát rồi thắc mắc sao ảnh vỡ.']},
  {id:'mkt10',t:'Thiết kế ảnh trên Canva: nhanh, đều tay, đúng nhận diện',min:9,
   body:['Nguyên tắc số 1: MỘT ảnh = MỘT thông điệp. Ảnh nhồi 5 dòng chữ + 3 mũi tên + 2 khung giá là ảnh không ai đọc. Khách lướt 1 giây — ảnh phải nói xong ý chính trong 1 giây đó.',
     'KHỔ ẢNH: bài Facebook vuông 1:1 (1080×1080) · story/reel 9:16 (1080×1920) · ảnh bìa page 851×315. Làm bản vuông trước, cần thì nới ra 9:16 — đừng làm ngược.',
     'CHỮ TRÊN ẢNH: tối đa 2 font (một cho tiêu đề, một cho phần còn lại), chữ phải đọc được khi thu nhỏ bằng ngón cái — tự kiểm bằng cách nhìn ảnh trên điện thoại trước khi đăng. Chừa lề đều bốn phía.',
     'NHẬN DIỆN: chốt một bảng gồm 2 màu chính (cam chủ đạo + một màu pastel nền) + 1 kiểu đặt logo (góc dưới phải, nhỏ). Lưu thành Brand Kit trong Canva rồi mọi ảnh lấy từ đó — khách lướt feed nhận ra ảnh của Hương Diện trước khi kịp đọc tên.',
     'TEMPLATE: làm MỘT LẦN bốn mẫu — ảnh bán hàng, ảnh kiến thức, ảnh feedback khách, ảnh khuyến mãi — rồi mỗi ngày chỉ thay ảnh sản phẩm và chữ. Thiết kế mỗi ảnh từ đầu là cách nhanh nhất để "đến kỳ đăng mà chưa có ảnh".',
     'Ảnh để CHẠY QUẢNG CÁO: càng ít chữ càng được phân phối tốt — để chữ dưới khoảng 20% diện tích, phần lời chuyển xuống caption.',
     'Công cụ trong Canva đáng dùng: tách nền sản phẩm (Background Remover / Magic Studio), chỉnh sáng hàng loạt. Xuất PNG cho ảnh có chữ, JPG cho ảnh chụp thường.',
     'Và luôn nhớ bài 1: ảnh khuyến mãi có hình bình sữa, núm ti, sữa số 1–2 là KHÔNG đăng, kể cả chỉ nằm góc ảnh combo.'],
   box:{t:'Quy ước nhận diện — chốt một lần, dán vào Brand Kit',lines:['Màu: cam #f97316 (chính) + kem/pastel nền · Chữ tiêu đề đậm bo tròn, chữ thân gọn dễ đọc',
     'Logo: góc dưới phải, cỡ nhỏ, mọi ảnh đều có · Giá: một kiểu khung duy nhất, dùng lại mọi ảnh',
     'Tông ảnh: sáng, sạch, ấm — không lòe loẹt đỏ chói kiểu sale sập sàn']},
   do:['Tạo Brand Kit trong Canva với bảng màu + font đã chốt.','Làm 4 template (bán hàng, kiến thức, feedback, khuyến mãi) rồi dùng thử cho lịch đăng tuần này.'],
   err:['Mỗi ảnh một font một màu — feed nhìn như 5 shop khác nhau đăng chung.','Chữ nhỏ li ti, trên máy tính đẹp nhưng trên điện thoại không đọc nổi.','Dồn hết lời quảng cáo lên ảnh thay vì để xuống caption.']},
  {id:'mkt4',t:'Nhập hàng: gọi nhà phân phối chính thức',min:8,
   body:['Cửa hàng đang chuyển dần từ hàng nội địa nước ngoài sang nhà phân phối chính thức tại Việt Nam. Tab Cửa hàng → Nguồn hàng có sẵn 24 thương hiệu kèm số điện thoại đã tra.',
     'Mỗi cuộc gọi phải hỏi đủ 9 câu trong Kịch bản gọi — quan trọng nhất là ba câu xin giấy công bố sản phẩm, tờ khai hải quan và phiếu công bố mỹ phẩm.',
     'Không nhận lời "hàng chính hãng" bằng miệng. Chỉ ba loại giấy có giá trị khi bị kiểm tra: hoá đơn điện tử hợp lệ, giấy công bố sản phẩm, tờ khai hải quan.',
     'Luôn đối chiếu mã số thuế trên masothue.com trước khi đặt cọc. Đã gặp trường hợp website mang tên thương hiệu lớn nhưng thực chất là một hộ bán lẻ.',
     'Nhà cung cấp đòi cộng thêm 5–10% "để xuất hoá đơn" nghĩa là họ đang giấu doanh thu — đàm phán lại giá gốc hoặc đổi nguồn.'],
   box:{t:'Gọi trước sáu số này, đều ở Hà Nội',lines:['Magicwave 1900 638097 — Meiji + Merries',
     'Bắc Nam 0911 021 717 — Blédina + Healthy Care + Aptamil',
     'Diana Unicharm 1900 585896 — Moony · Phương Linh 0888 962 929 — HiKid',
     'Bristar 0903 45 11 45 — Chicco · VN Thịnh Vượng 092 428 6868 — Bio Island']},
   do:['Gọi một nhà phân phối, hỏi đủ 9 câu, ghi kết quả vào tab Nguồn hàng.'],
   err:['Gọi xong không ghi lại, lần sau phải tra lại từ đầu.']},
  {id:'mkt5',t:'Chọn hàng để nhập bằng số, không bằng cảm giác',min:8,
   body:['Trước khi nhập bất cứ mã mới nào, phải trả lời được ba câu: có ai mua không, biên bao nhiêu, bao lâu bán hết một lô.',
     'Biên lợi nhuận mới là thứ đáng nhìn, không phải doanh thu. Từng có nhóm hàng bán rất chạy mà biên âm 16% — càng bán càng lỗ.',
     'Nhóm biên cao đáng đẩy ở cửa hàng: thực phẩm chức năng và vitamin, sữa non, sữa đặc trị. Nhóm biên mỏng: sữa bột phổ thông.',

 owner:{ic:'👑',intro:'Vai trò của bạn không phải làm nhiều việc nhất mà là quyết đúng vài việc lớn: tiền có đủ không, hàng nào đáng bán, ai làm gì, và cửa hàng có đang đứng đúng phía của pháp luật không.',lessons:[

function Training({me,roles,isAdmin,done,setDone}){
  const myRoleId=me.role;
  const [view,setView]=useState(TRAINING[myRoleId]?myRoleId:(isAdmin?'owner':myRoleId));
  const [open,setOpen]=useState(null);
  const cur=TRAINING[view];
  const roleInfo=roles.find(r=>r.id===view)||{n:'Vai trò',ic:'👤'};
  const mark=(id)=>setDone({...done,[id]:!done[id]});
  const lessons=cur?cur.lessons:[];
  const doneN=lessons.filter(l=>done[l.id]).length;
  const next=lessons.find(l=>!done[l.id]);
  /* Vai trò tự thêm chưa có giáo trình → chỉ đường sang giáo trình gần nhất */
  const coGiaoTrinh=Object.keys(TRAINING);

  return (
    <div>
      <div className="chips" style={{marginBottom:14}}>
        {coGiaoTrinh.map(rid=>{ const r=roles.find(x=>x.id===rid)||{n:rid,ic:'👤'};
          const dn=TRAINING[rid].lessons.filter(l=>done[l.id]).length, tt=TRAINING[rid].lessons.length;
          return (
            <button key={rid} className={'chip'+(view===rid?' on':'')} onClick={()=>{setView(rid);setOpen(null);}}>
              {TRAINING[rid].ic} {r.n}{rid===myRoleId?' · của tôi':''} <b style={{opacity:.6}}>{dn}/{tt}</b>
            </button>
          );
        })}
      </div>

      {!cur
        ? <div className="empty"><i className="ti ti-school"></i><p>Vai trò này chưa có giáo trình riêng.<br/>Chọn một vai trò gần nhất ở trên để học tạm.</p></div>
        : <React.Fragment>
          <div className="panel" style={{marginBottom:14}}>
            <div className="panel-b" style={{padding:'16px 18px',display:'flex',gap:15,alignItems:'center',flexWrap:'wrap'}}>
              <Ring pct={lessons.length?Math.round(doneN/lessons.length*100):0} size={52} color="#4f46e5"/>
              <div style={{flex:1,minWidth:210}}>
                <b style={{fontFamily:'Baloo 2',fontSize:16}}>{roleInfo.ic} {roleInfo.n} — {doneN}/{lessons.length} bài</b>
                <div style={{fontSize:13,color:'var(--muted)',lineHeight:1.6,marginTop:3}}>{cur.intro}</div>
              </div>
            </div>
          </div>

          {next &&
            <div onClick={()=>setOpen(next.id)} style={{display:'flex',alignItems:'center',gap:13,background:'linear-gradient(135deg,#312e81,#4f46e5)',borderRadius:16,padding:'15px 18px',marginBottom:16,color:'#fff',cursor:'pointer',boxShadow:'var(--sh)'}}>
              <div style={{fontSize:26}}>{cur.ic}</div>
              <div style={{flex:1,minWidth:0}}>
                <div style={{fontSize:11.5,opacity:.85,fontWeight:600}}>HỌC TIẾP</div>
                <b style={{fontFamily:'Baloo 2',fontSize:15.5}}>{next.t}</b>
                <div style={{fontSize:12,opacity:.8}}>{next.min} phút</div>
              </div>
              <span className="btn sm" style={{background:'rgba(255,255,255,.2)',pointerEvents:'none'}}>Mở bài</span>
            </div>}

          {lessons.map((l,i)=>{ const isOpen=open===l.id, ok=!!done[l.id]; return (
            <div className="panel" key={l.id} style={{marginBottom:10}}>
              <div className="row" style={{padding:'13px 16px',cursor:'pointer'}} onClick={()=>setOpen(isOpen?null:l.id)}>
                <span className={'chk'+(ok?' done':'')} onClick={e=>{e.stopPropagation();mark(l.id);}}>{ok&&<i className="ti ti-check"></i>}</span>
                <div className="rt">
                  <b style={{fontWeight:600,fontSize:13.5,textDecoration:ok?'line-through':'none',color:ok?'var(--muted)':'var(--ink)'}}>Bài {i+1}. {l.t}</b>
                  <small>{l.min} phút</small>
                </div>
                <i className={'ti '+(isOpen?'ti-chevron-up':'ti-chevron-down')} style={{color:'var(--muted2)',fontSize:20}}></i>
              </div>
              {isOpen &&
                <div className="panel-b" style={{padding:'2px 18px 18px',animation:'fade .2s'}}>
                  <ul style={{margin:0,paddingLeft:18,fontSize:13.5,lineHeight:1.75,color:'var(--ink)'}}>
                    {l.body.map((b,j)=><li key={j} style={{marginBottom:6}}>{b}</li>)}
                  </ul>
                  {l.box &&
                    <div style={{marginTop:13,padding:'12px 14px',background:'var(--bg)',borderLeft:'3px solid var(--o)',borderRadius:10}}>
                      <b style={{fontSize:12.5,color:'var(--o-dk)'}}>📌 {l.box.t}</b>
                      {l.box.lines.map((x,j)=><div key={j} style={{fontSize:13,lineHeight:1.65,marginTop:5,color:'var(--ink)'}}>{x}</div>)}
                    </div>}
                  {l.do&&l.do.length>0 &&
                    <div style={{marginTop:12,padding:'12px 14px',background:'var(--grn-lt)',borderRadius:11}}>
                      <b style={{fontSize:12.5,color:'var(--grn)'}}>✅ Làm ngay</b>
                      <ul style={{margin:'6px 0 0',paddingLeft:18,fontSize:13,lineHeight:1.65,color:'var(--grn)'}}>
                        {l.do.map((x,j)=><li key={j} style={{marginBottom:3}}>{x}</li>)}
                      </ul>
                    </div>}
                  {l.err&&l.err.length>0 &&
                    <div style={{marginTop:10,padding:'12px 14px',background:'var(--red-lt)',borderRadius:11}}>
                      <b style={{fontSize:12.5,color:'var(--red)'}}>⚠️ Sai hay gặp</b>
                      <ul style={{margin:'6px 0 0',paddingLeft:18,fontSize:13,lineHeight:1.65,color:'var(--red)'}}>
                        {l.err.map((x,j)=><li key={j} style={{marginBottom:3}}>{x}</li>)}
                      </ul>
                    </div>}
                  <button className={'btn'+(ok?' ghost':'')+' sm'} style={{marginTop:13}} onClick={()=>mark(l.id)}>
                    <i className={'ti '+(ok?'ti-rotate':'ti-check')}></i>{ok?'Bỏ đánh dấu':'Đã học xong bài này'}
                  </button>
                </div>}
            </div>
          ); })}
        </React.Fragment>}
    </div>
  );
}

/* ---------- Task Modal ---------- */
function TaskModal({task,onSave,onDel,onClose,users,roles,me,canAssign}){
  const [f,setF]=useState({...task,checklist:task.checklist?[...task.checklist]:[]});
  const set=(k,v)=>setF(p=>({...p,[k]:v}));
  const addCk=()=>set('checklist',[...f.checklist,{t:'',done:false}]);
  const setCk=(i,v)=>set('checklist',f.checklist.map((c,j)=>j===i?{...c,t:v}:c));
  const delCk=(i)=>set('checklist',f.checklist.filter((_,j)=>j!==i));
  const submit=()=>{
    if(!f.title.trim())return;
    const cl=f.checklist.filter(c=>c.t.trim());
    let prog=f.progress, status=f.status;
    if(status==='done')prog=100;
    delete f._new;
    onSave({...f,title:f.title.trim(),checklist:cl,progress:prog,status,doneAt:status==='done'?(task.doneAt||today()):undefined});
  };
  return (
    <div className="ov" onClick={onClose}>
      <div className="modal" onClick={e=>e.stopPropagation()}>
        <div className="modal-h">
          <b>{task._new?'Thêm công việc':'Sửa công việc'}</b>
          <button className="x" onClick={onClose}><i className="ti ti-x"></i></button>
        </div>
        <div className="modal-b">
          <div className="fld">
            <label>Tên công việc</label>
            <input autoFocus placeholder="VD: Nhập 5 thùng bỉm Bobby…" value={f.title} onChange={e=>set('title',e.target.value)}/>
          </div>
          <button onClick={()=>set('frog',!f.frog)} style={{display:'flex',alignItems:'center',gap:9,width:'100%',padding:'11px 13px',borderRadius:11,marginBottom:15,border:'1.5px solid '+(f.frog?'var(--grn)':'var(--border)'),background:f.frog?'var(--grn-lt)':'var(--bg)',color:f.frog?'var(--grn)':'var(--muted)',fontWeight:600,fontSize:13,cursor:'pointer',textAlign:'left'}}>
            <span style={{fontSize:20}}>🐸</span><span style={{flex:1}}>Việc xương nhất hôm nay {f.frog?'— đã chọn':''}</span>
            <i className={'ti '+(f.frog?'ti-checkbox':'ti-square')} style={{fontSize:20}}></i>
          </button>
          <div className="fld">
            <label>Thuộc mảng</label>
            <div className="chips">
              {PROJECTS.map(p=>(
                <button key={p.id} className={'chip'+(f.proj===p.id?' on':'')} onClick={()=>set('proj',p.id)}>{p.icon} {p.name}</button>
              ))}
            </div>
          </div>
          <div className="fld">
            <label>Giao cho</label>
            {canAssign
              ? <div className="chips">
                  <button className={'chip'+(!f.assignee?' on':'')} onClick={()=>set('assignee','')}>◻️ Chưa giao</button>
                  {(users||[]).filter(u=>u.active!==false).map(u=>{ const r=roleOf(u,roles||[]); return (
                    <button key={u.id} className={'chip'+(f.assignee===u.id?' on':'')} onClick={()=>set('assignee',u.id)} title={r.n}>{r.ic} {u.name}{u.id===(me&&me.id)?' (tôi)':''}</button>
                  ); })}
                </div>
              : <div style={{fontSize:13,color:'var(--muted)',padding:'8px 0'}}>
                  {f.assignee===(me&&me.id)?'Việc của bạn':'Chỉ chủ và quản lý mới đổi được người nhận việc.'}
                </div>}
          </div>
          <div className="frow">
            <div className="fld">
              <label>Mức ưu tiên</label>
              <div className="chips">
                {Object.keys(PRI).map(k=>(
                  <button key={k} className={'chip prichip '+k+(f.pri===k?' on':'')} onClick={()=>set('pri',k)}>{PRI[k]}</button>
                ))}
              </div>
            </div>
            <div className="fld">
              <label>Hạn chót</label>
              <input type="date" value={f.due||''} onChange={e=>set('due',e.target.value)}/>
            </div>
          </div>
          <div className="fld">
            <label>Trạng thái</label>
            <div className="chips">
              {Object.keys(STATUS).map(k=>(
                <button key={k} className={'chip'+(f.status===k?' on':'')} onClick={()=>set('status',k)}>{STATUS[k].name}</button>
              ))}
            </div>
          </div>
          <div className="fld">
            <label>Thời lượng ước tính (giờ) — để trống sẽ tự tính</label>
            <input type="number" min="0.5" step="0.5" placeholder={'Tự tính ~'+estOf(f)+'h'} value={f.est||''} onChange={e=>set('est',e.target.value?+e.target.value:undefined)}/>
          </div>
          {f.status!=='done' &&
          <div className="fld">
            <label>Tiến độ</label>
            <div className="rng">
              <input type="range" min="0" max="100" step="5" value={f.progress} onChange={e=>set('progress',+e.target.value)}/>
              <b>{f.progress}%</b>
            </div>
          </div>}
          <div className="fld">
            <label>Ghi chú</label>
            <textarea placeholder="Chi tiết, ghi chú thêm…" value={f.note||''} onChange={e=>set('note',e.target.value)}></textarea>
          </div>
          <div className="fld">
            <label>Việc nhỏ (checklist)</label>
            {f.checklist.map((c,i)=>(
              <div className="ckedit" key={i}>
                <input placeholder={'Bước '+(i+1)} value={c.t} onChange={e=>setCk(i,e.target.value)}/>
                <button onClick={()=>delCk(i)}><i className="ti ti-trash"></i></button>
              </div>
            ))}
            <button className="btn ghost sm" onClick={addCk}><i className="ti ti-plus"></i>Thêm bước</button>
          </div>
          {!task._new &&
            <button className="del" onClick={()=>onDel(f.id)}><i className="ti ti-trash"></i>Xoá công việc này</button>}
        </div>
        <div className="modal-f">
          <button className="btn ghost" style={{flex:'0 0 auto',padding:'12px 18px'}} onClick={onClose}>Huỷ</button>
          <button className="btn" onClick={submit}><i className="ti ti-check"></i>Lưu công việc</button>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<Root/>);
</script>

<!-- pwa-update-banner: tự phát hiện bản mới (so ETag/Last-Modified index.html) -->
<script>
(function(){
  if('serviceWorker' in navigator){
    window.addEventListener('load',function(){
      navigator.serviceWorker.register('sw.js').then(function(reg){
        setInterval(function(){ try{ reg.update(); }catch(e){} }, 300000);
      }).catch(function(){});
    });
  }
  if(location.protocol==='file:') return;
  var pageUrl=location.href.split('#')[0].split('?')[0], baseTag=null, shown=false;
  function getTag(cb){ fetch(pageUrl,{method:'HEAD',cache:'no-store'}).then(function(r){ cb(r.headers.get('etag')||r.headers.get('last-modified')||null); }).catch(function(){ cb(null); }); }
  function showBanner(){
    if(shown||!document.body) return; shown=true;
    var b=document.createElement('div');
    b.textContent='🔄 Có bản Quản lý CV mới — chạm để cập nhật';
    b.style.cssText='position:fixed;left:10px;right:10px;top:calc(10px + env(safe-area-inset-top));z-index:2147483647;background:#111827;color:#fff;padding:11px 16px;border-radius:13px;text-align:center;font-family:system-ui,-apple-system,sans-serif;font-size:14px;font-weight:700;box-shadow:0 8px 24px rgba(0,0,0,.3);cursor:pointer;line-height:1.35';
    b.setAttribute('role','button');
    b.onclick=function(){ b.textContent='Đang cập nhật…'; try{ if(navigator.serviceWorker&&navigator.serviceWorker.getRegistration){ navigator.serviceWorker.getRegistration().then(function(reg){ try{ if(reg) reg.update(); }catch(e){} setTimeout(function(){ location.reload(); },500); }); return; } }catch(e){} location.reload(); };
    document.body.appendChild(b);
  }
  getTag(function(t){ baseTag=t; });
  function check(){ if(baseTag==null){ getTag(function(t){ baseTag=t; }); return; } getTag(function(t){ if(t&&t!==baseTag) showBanner(); }); }
  setInterval(check, 180000);
  document.addEventListener('visibilitychange',function(){ if(document.visibilityState==='visible') check(); });
})();
</script>
